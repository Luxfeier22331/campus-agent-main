[project]
name = "campus-evals"
version = "0.1.0"
description = "Evaluation helpers for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "campus-shared",
    "campus-contracts",
    "campus-ingestion-core",
    "campus-regulation-semantics",
    "httpx>=0.28.1",
    "ragas>=0.4.3",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-contracts = { workspace = true }
campus-ingestion-core = { workspace = true }
campus-regulation-semantics = { workspace = true }
campus-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_evals"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_evals", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
