[project]
name = "campus-rag-agent"
version = "0.1.0"
description = "Knowledge-domain agent for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-contracts",
  "campus-ingestion-core",
  "campus-regulation-semantics",
  "campus-retrieval-core",
  "campus-shared",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-contracts = { workspace = true }
campus-ingestion-core = { workspace = true }
campus-regulation-semantics = { workspace = true }
campus-retrieval-core = { workspace = true }
campus-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_rag_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_rag_agent", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
