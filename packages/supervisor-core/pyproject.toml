[project]
name = "campus-supervisor-core"
version = "0.1.0"
description = "Supervisor core for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-availability-specialist",
  "campus-services-agent",
  "campus-contracts",
  "campus-notice-agent",
  "campus-navigation-specialist",
  "campus-rag-specialist",
  "campus-shared",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-availability-specialist = { workspace = true }
campus-services-agent = { workspace = true }
campus-contracts = { workspace = true }
campus-notice-agent = { workspace = true }
campus-navigation-specialist = { workspace = true }
campus-rag-specialist = { workspace = true }
campus-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_supervisor_core"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_supervisor_core", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
