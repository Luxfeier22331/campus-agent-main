[project]
name = "campus-notice-agent"
version = "0.1.0"
description = "Notice agent for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35.0",
  "campus-contracts",
  "psycopg[binary]>=3.2.0",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_notice_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_notice_agent", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
