[project]
name = "campus-ingestion-core"
version = "0.1.0"
description = "Ingestion and object storage core for campus-agent v2."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-contracts",
  "campus-regulation-semantics",
  "campus-shared",
  "boto3>=1.35.0",
  "httpx[socks]>=0.28.1",
  "pillow>=12.0.0",
  "pypdf>=6.14.0",
  "python-docx>=1.2.0",
  "qdrant-client>=1.17.1",
  "tokenizers>=0.22.0",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-contracts = { workspace = true }
campus-regulation-semantics = { workspace = true }
campus-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_ingestion_core"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_ingestion_core", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
