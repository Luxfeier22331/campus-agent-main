[project]
name = "campus-ingestion-core"
version = "0.1.0"
description = "Ingestion and object storage core for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-contracts",
  "boto3>=1.35.0",
  "httpx[socks]>=0.28.1",
  "llama-index-core>=0.14.18",
  "llama-index-embeddings-openai>=0.6.0",
  "llama-index-vector-stores-qdrant>=0.10.0",
  "pillow>=12.0.0",
  "python-docx>=1.2.0",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  "qdrant-client>=1.17.1",
  "requests>=2.31.0",
  "transformers>=4.51.0",
  "xlrd>=2.0.1",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_ingestion_core"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_ingestion_core", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
