[project]
name = "campus-rag-specialist"
version = "0.1.0"
description = "Knowledge-domain specialist for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-contracts",
  "campus-retrieval-core",
  "campus-shared",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-contracts = { workspace = true }
campus-retrieval-core = { workspace = true }
campus-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_rag_specialist"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_rag_specialist", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
