[project]
name = "campus-retrieval-core"
version = "0.1.0"
description = "Minimal retrieval bootstrap for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-contracts",
  "campus-ingestion-core",
  "httpx[socks]>=0.28.1",
  "llama-index-core>=0.14.18",
  "llama-index-vector-stores-qdrant>=0.10.0",
  "qdrant-client>=1.17.1",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-contracts = { workspace = true }
campus-ingestion-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_retrieval_core"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_retrieval_core", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
