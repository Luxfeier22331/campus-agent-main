[package]
name = "ingestion-kernels-rs"
version = "0.1.0"
edition = "2024"
description = "Deterministic ingestion data-plane kernels for campus-agent."
license = "Apache-2.0"

[dependencies]
jsonschema = { version = "0.46.10", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
text-splitter = { version = "0.32.0", features = ["tokenizers"] }
tokenizers = "0.23.1"
