[project]
name = "campus-contracts"
version = "0.1.0"
description = "Shared contracts for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/campus_contracts"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_contracts", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
