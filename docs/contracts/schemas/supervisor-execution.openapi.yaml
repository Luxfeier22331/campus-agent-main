openapi: 3.1.1
info:
  title: campus-agent supervisor execution contract
  version: supervisor-execution-v1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-campus-contract:
  bridge_version: supervisor_bridge_v6
  response_contract: agent_response
  runtime_decisions_schema_version: supervisor-runtime-decisions-v1
  runtime_decision_summary_schema_version: runtime-decision-summary-v1
  workflow_trace_summary_version: workflow-trace-summary-v3
  versioning_policy:
    bridge_version: incompatible bridge envelope changes must bump bridge_version
    response_contract: AgentResponse wire contract changes must bump response_contract
    runtime_decisions_schema_version: runtime_decisions shape changes must bump runtime_decisions_schema_version
    runtime_decision_summary_schema_version: runtime decision summary shape changes must bump runtime_decision_summary_schema_version
    workflow_trace_summary_version: operator-visible workflow trace summary changes must bump workflow_trace_summary_version
paths:
  /api/v1/answer:
    post:
      summary: Internal supervisor answer execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupervisorExecutionRequest"
      responses:
        "200":
          description: Accepted execution outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupervisorResponse"
  /internal/bridge/supervisor/answer:
    post:
      summary: Private supervisor bridge v6 delegate handoff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeV6Request"
      responses:
        "200":
          description: Agent response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
components:
  schemas:
    AgentTarget:
      type: string
      enum:
        - rag-agent
        - navigation-agent
        - campus-services-agent
        - notice-agent
    RequestedCapability:
      type: string
      enum:
        - knowledge
        - place_lookup
        - campus_services
        - notice
    ConfidenceLevel:
      type: string
      enum:
        - high
        - medium
        - low
    DelegateStatus:
      type: string
      enum:
        - completed
        - needs_clarification
        - no_answer
        - error
    SupervisorStatus:
      type: string
      enum:
        - completed
        - needs_clarification
        - no_answer
        - error
        - rejected
        - approval_required
        - cancelled
    WorkflowMode:
      type: string
      enum:
        - terminal
        - direct_runtime
        - single_handoff
        - multi_step
    StepOutputProjectionKind:
      type: string
      enum:
        - notice_context
        - schedule_baseline
        - service_guide_facts
        - place_context
        - evidence_bundle
        - grounding_verdict
    ProjectionSafetySummary:
      type: object
      additionalProperties: false
      required:
        - truncated
        - redacted
        - max_chars
        - fields_present
      properties:
        truncated:
          type: boolean
        redacted:
          type: boolean
        max_chars:
          type: integer
          minimum: 0
        fields_present:
          type: array
          items:
            type: string
    NoticeContextProjection:
      type: object
      additionalProperties: false
      required:
        - title
        - body_excerpt
        - source_url
      properties:
        title:
          type: string
        body_excerpt:
          type: string
        source_url:
          type: string
    StepOutputProjection:
      type: object
      additionalProperties: false
      required:
        - projection_id
        - source_step_id
        - projection_kind
        - content_hash
        - payload
        - safety
      properties:
        projection_id:
          type: string
        source_step_id:
          type: string
        projection_kind:
          $ref: "#/components/schemas/StepOutputProjectionKind"
        content_hash:
          type: string
        payload:
          oneOf:
            - $ref: "#/components/schemas/NoticeContextProjection"
            - $ref: "#/components/schemas/SafeObject"
        safety:
          $ref: "#/components/schemas/ProjectionSafetySummary"
    WorkflowContextProjection:
      type: object
      additionalProperties: false
      required:
        - projection_id
        - source_step_id
        - projection_kind
        - content_hash
        - safety
      properties:
        projection_id:
          type: string
        source_step_id:
          type: string
        projection_kind:
          $ref: "#/components/schemas/StepOutputProjectionKind"
        content_hash:
          type: string
        safety:
          $ref: "#/components/schemas/ProjectionSafetySummary"
    WorkflowAgentContext:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - visibility
        - workflow_run_ref
        - step_id
        - agent_id
        - projection_refs
      properties:
        schema_version:
          const: workflow-agent-context-v1
        visibility:
          const: agent_private
        workflow_run_ref:
          type: string
        step_id:
          type: string
        agent_id:
          $ref: "#/components/schemas/AgentTarget"
        target:
          $ref: "#/components/schemas/AgentTarget"
        required_projection_kind:
          $ref: "#/components/schemas/StepOutputProjectionKind"
        projection_refs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowContextProjection"
    AgentInvocation:
      type: object
      additionalProperties: false
      required:
        - invocation_id
        - workflow_run_ref
        - step_id
        - agent_id
        - status
        - allowed_tools
        - used_tools
        - projection_ids
      properties:
        invocation_id:
          type: string
        parent_invocation_id:
          type: string
        workflow_run_ref:
          type: string
        step_id:
          type: string
        agent_id:
          $ref: "#/components/schemas/AgentTarget"
        status:
          type: string
        allowed_tools:
          type: array
          items:
            type: string
        used_tools:
          type: array
          items:
            type: string
        projection_ids:
          type: array
          items:
            type: string
        fail_close_reason:
          type: string
    WorkflowPlanStep:
      type: object
      additionalProperties: false
      required:
        - step_id
        - step_kind
      properties:
        step_id:
          type: string
        step_kind:
          type: string
        target:
          type: string
        payload_kind:
          type: string
        allowed_tools:
          type: array
          items:
            type: string
        selected_tool:
          type: string
    WorkflowPlanEdge:
      type: object
      additionalProperties: false
      required:
        - from_step_id
        - to_step_id
        - condition
      properties:
        from_step_id:
          type: string
        to_step_id:
          type: string
        condition:
          type: string
        required_projection_kind:
          $ref: "#/components/schemas/StepOutputProjectionKind"
    WorkflowPlan:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - plan_id
        - workflow_mode
        - allowed_agents
        - steps
        - edges
        - terminal_policy
        - resume_policy
        - semantic_retry_policy
      properties:
        schema_version:
          const: workflow-plan-v1
        plan_id:
          type: string
        workflow_mode:
          $ref: "#/components/schemas/WorkflowMode"
        allowed_agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentTarget"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowPlanStep"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowPlanEdge"
        terminal_policy:
          $ref: "#/components/schemas/SafeObject"
        resume_policy:
          $ref: "#/components/schemas/SafeObject"
        semantic_retry_policy:
          $ref: "#/components/schemas/SafeObject"
    SafeObject:
      type: object
      additionalProperties: true
    ErrorInfo:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    TraceContext:
      type: object
      additionalProperties: false
      required:
        - trace_id
      properties:
        trace_id:
          type: string
    ActorContext:
      type: object
      additionalProperties: true
      properties:
        user_id:
          type: string
        principal_id:
          type: string
        principal_type:
          type: string
        roles:
          type: array
          items:
            type: string
        departments:
          type: array
          items:
            type: string
    RequestedScope:
      type:
        - object
        - "null"
      additionalProperties: false
      required:
        - corpus
        - collection
      properties:
        corpus:
          type: string
        collection:
          type: string
    VersionQuery:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
        as_of:
          type: string
        version_id:
          type: string
        compare_to_version_id:
          type: string
    SupervisorExecutionRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - user_goal
        - context
      properties:
        request_id:
          type: string
        conversation_id:
          type: string
        user_goal:
          type: string
        safety_identifier:
          oneOf:
            - type: string
            - type: "null"
        trace:
          $ref: "#/components/schemas/TraceContext"
        actor:
          $ref: "#/components/schemas/ActorContext"
        context:
          $ref: "#/components/schemas/SafeObject"
        requested_capability:
          oneOf:
            - $ref: "#/components/schemas/RequestedCapability"
            - type: "null"
        requested_scope:
          $ref: "#/components/schemas/RequestedScope"
        version_query:
          $ref: "#/components/schemas/VersionQuery"
    RuntimeDecisionSummary:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - planning_outcome
      properties:
        schema_version:
          const: runtime-decision-summary-v1
        scope_gate_decision:
          type: string
        policy_gate_decision:
          type: string
        context_preflight_state:
          type: string
        routing_next_action:
          type: string
        planning_outcome:
          type: string
        selected_target:
          type: string
        selected_tool:
          type: string
        terminal_outcome:
          type: string
        fail_close_reason:
          type: string
        runtime_versions:
          $ref: "#/components/schemas/SafeObject"
        policy_artifact_versions:
          $ref: "#/components/schemas/SafeObject"
    RuntimeDecisions:
      type: object
      additionalProperties: true
      required:
        - schema_version
        - effective_capability
        - lane
        - routing_frame
        - runtime_decision_summary
      properties:
        schema_version:
          const: supervisor-runtime-decisions-v1
        effective_capability:
          $ref: "#/components/schemas/RequestedCapability"
        lane:
          type: string
        scope_gate:
          $ref: "#/components/schemas/SafeObject"
        policy_gate:
          $ref: "#/components/schemas/SafeObject"
        context_preflight:
          $ref: "#/components/schemas/SafeObject"
        tool_policy:
          $ref: "#/components/schemas/SafeObject"
        routing_frame:
          $ref: "#/components/schemas/SafeObject"
        handoff:
          $ref: "#/components/schemas/SafeObject"
        workflow_plan:
          $ref: "#/components/schemas/WorkflowPlan"
        terminal_envelope:
          $ref: "#/components/schemas/SafeObject"
        runtime_decision_summary:
          $ref: "#/components/schemas/RuntimeDecisionSummary"
    AgentRequest:
      type: object
      additionalProperties: false
      required:
        - target
        - user_goal
        - payload
        - allowed_tools
      properties:
        target:
          $ref: "#/components/schemas/AgentTarget"
        user_goal:
          type: string
        conversation_id:
          type: string
        request_id:
          type: string
        safety_identifier:
          oneOf:
            - type: string
            - type: "null"
        trace:
          $ref: "#/components/schemas/TraceContext"
        actor:
          $ref: "#/components/schemas/ActorContext"
        context:
          $ref: "#/components/schemas/SafeObject"
        workflow_context:
          $ref: "#/components/schemas/WorkflowAgentContext"
        payload:
          type: object
          additionalProperties: false
          required:
            - kind
            - payload
          properties:
            kind:
              type: string
            payload:
              $ref: "#/components/schemas/SafeObject"
        allowed_tools:
          type: array
          items:
            type: string
    AgentResponse:
      type: object
      additionalProperties: false
      required:
        - target
        - status
      properties:
        target:
          $ref: "#/components/schemas/AgentTarget"
        status:
          $ref: "#/components/schemas/DelegateStatus"
        answer_text:
          type: string
        follow_up_question:
          type: string
        confidence:
          $ref: "#/components/schemas/ConfidenceLevel"
        result:
          oneOf:
            - $ref: "#/components/schemas/SafeObject"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorInfo"
            - type: "null"
        agent_observability:
          oneOf:
            - $ref: "#/components/schemas/SafeObject"
            - type: "null"
    BridgeV6Request:
      type: object
      additionalProperties: false
      required:
        - bridge_version
        - response_contract
        - user_goal
        - request_id
        - effective_capability
        - lane
        - requested_capability
        - trace
        - actor
        - context
        - version_query
        - runtime_decisions
      properties:
        bridge_version:
          const: supervisor_bridge_v6
        response_contract:
          const: agent_response
        user_goal:
          type: string
        conversation_id:
          type: string
        request_id:
          type: string
        safety_identifier:
          oneOf:
            - type: string
            - type: "null"
        effective_capability:
          $ref: "#/components/schemas/RequestedCapability"
        lane:
          type: string
        requested_capability:
          $ref: "#/components/schemas/RequestedCapability"
        requested_scope:
          $ref: "#/components/schemas/RequestedScope"
        trace:
          $ref: "#/components/schemas/TraceContext"
        actor:
          $ref: "#/components/schemas/ActorContext"
        context:
          $ref: "#/components/schemas/SafeObject"
        version_query:
          $ref: "#/components/schemas/VersionQuery"
        runtime_decisions:
          $ref: "#/components/schemas/RuntimeDecisions"
    WorkflowTraceSummary:
      type: object
      additionalProperties: false
      required:
        - routing_frame
        - context_resolution
        - planning_outcome
        - direct_vs_delegate_branch
        - workflow_mode
        - handoff
        - handoff_chain
        - agent_invocations
        - selected_target
        - selected_tools
        - context_projections
        - tool_argument_summary
        - guardrail_outcomes
        - fail_close_reason
        - runtime_versions
        - policy_artifact_versions
      properties:
        routing_frame:
          $ref: "#/components/schemas/SafeObject"
        context_resolution:
          $ref: "#/components/schemas/SafeObject"
        planning_outcome:
          type: string
        direct_vs_delegate_branch:
          type: string
        workflow_mode:
          $ref: "#/components/schemas/WorkflowMode"
        handoff:
          $ref: "#/components/schemas/SafeObject"
        handoff_chain:
          type: array
          items:
            $ref: "#/components/schemas/SafeObject"
        agent_invocations:
          type: array
          items:
            $ref: "#/components/schemas/AgentInvocation"
        selected_target:
          oneOf:
            - $ref: "#/components/schemas/AgentTarget"
            - type: string
            - type: "null"
        selected_tools:
          type: array
          items:
            type: string
        context_projections:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowContextProjection"
        tool_argument_summary:
          $ref: "#/components/schemas/SafeObject"
        trace_steps:
          type: array
          items:
            $ref: "#/components/schemas/SafeObject"
        tool_call_summaries:
          type: array
          items:
            $ref: "#/components/schemas/SafeObject"
        guardrail_outcomes:
          $ref: "#/components/schemas/SafeObject"
        fail_close_reason:
          type: string
        runtime_versions:
          $ref: "#/components/schemas/SafeObject"
        policy_artifact_versions:
          $ref: "#/components/schemas/SafeObject"
    SupervisorResponse:
      type: object
      additionalProperties: false
      required:
        - selected_target
        - status
        - answer_text
        - follow_up_question
        - confidence
        - result
        - error
        - trace_id
      properties:
        selected_target:
          oneOf:
            - $ref: "#/components/schemas/AgentTarget"
            - type: "null"
        status:
          $ref: "#/components/schemas/SupervisorStatus"
        answer_text:
          type: string
        follow_up_question:
          type: string
        confidence:
          $ref: "#/components/schemas/ConfidenceLevel"
        result:
          oneOf:
            - $ref: "#/components/schemas/SafeObject"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorInfo"
            - type: "null"
        observability:
          oneOf:
            - $ref: "#/components/schemas/SafeObject"
            - type: "null"
        workflow_trace_summary:
          oneOf:
            - $ref: "#/components/schemas/WorkflowTraceSummary"
            - type: "null"
        trace_id:
          type: string
