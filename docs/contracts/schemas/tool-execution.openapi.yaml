openapi: 3.1.1
info:
  title: campus-agent tool execution contract
  version: tool-execution-v2
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-campus-contract:
  execution_contract_version: tool_execution_v2
  response_contract: execution_finalization_response_v3
  workflow_trace_summary_version: workflow-trace-summary-v6
  versioning_policy:
    execution_contract_version: incompatible execution envelope changes must bump execution_contract_version
    response_contract: ExecutionFinalizationResponse wire contract changes must bump response_contract
    workflow_trace_summary_version: operator-visible workflow trace summary changes must bump workflow_trace_summary_version
paths:
  /internal/execution/runs:
    post:
      summary: Start a Temporal-backed execution run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionRunCreateRequest"
      responses:
        "202":
          description: Temporal workflow accepted and run projection queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRunResponse"
  /internal/execution/runs/{runId}:
    get:
      summary: Read sanitized execution run projection.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Execution run projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRunResponse"
  /internal/execution/runs/{runId}/events:
    get:
      summary: Read sanitized execution run events after an optional sequence.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: wait_ms
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Execution run events.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - events
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExecutionRunEvent"
  /internal/execution/runs/{runId}/steps:
    get:
      summary: Read sanitized execution run step trajectory projection.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Execution run step trajectory projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRunStepTrajectory"
  /internal/execution/runs/{runId}/cancel:
    post:
      summary: Cancel a Temporal-backed execution run.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
      responses:
        "202":
          description: Temporal cancel accepted and projection marked canceled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRunResponse"
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ExecutionRunStatus:
      type: string
      enum:
        - created
        - queued
        - admitted
        - running
        - streaming
        - completed
        - failed
        - canceled
        - expired
    ExecutionRunCreateRequest:
      type: object
      additionalProperties: false
      required:
        - run_id
        - conversation_id
        - turn_id
        - request_id
        - owner_user_id
        - surface
        - metadata
      properties:
        run_id:
          type: string
        conversation_id:
          type: string
        turn_id:
          type: string
        request_id:
          type: string
        trace_id:
          type: string
        owner_user_id:
          type: string
        surface:
          type: string
        runtime_versions:
          $ref: "#/components/schemas/SafeObject"
        metadata:
          $ref: "#/components/schemas/ExecutionRunMetadata"
    ExecutionRunMetadata:
      type: object
      additionalProperties: false
      required:
        - execution_payload
      properties:
        execution_payload:
          $ref: "#/components/schemas/ExecutionPayload"
    ExecutionRunResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - conversation_id
        - turn_id
        - request_id
        - owner_user_id
        - surface
        - task_queue
        - status
      properties:
        run_id:
          type: string
        conversation_id:
          type: string
        turn_id:
          type: string
        request_id:
          type: string
        trace_id:
          type: string
        owner_user_id:
          type: string
        surface:
          type: string
        requested_tool:
          type: string
        selected_tool:
          type: string
        task_queue:
          type: string
        status:
          $ref: "#/components/schemas/ExecutionRunStatus"
        terminal_reason:
          type: string
        fail_close_reason:
          type: string
        created_at:
          type: string
        queued_at:
          type: string
        admitted_at:
          type: string
        started_at:
          type: string
        streaming_started_at:
          type: string
        completed_at:
          type: string
        updated_at:
          type: string
        final_response_ref:
          type: string
    ExecutionRunEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - run_id
        - conversation_id
        - event_type
        - sequence
        - occurred_at
        - visibility
        - payload_schema_version
        - payload
      properties:
        event_id:
          type: string
        run_id:
          type: string
        conversation_id:
          type: string
        event_type:
          type: string
        sequence:
          type: integer
        occurred_at:
          type: string
        visibility:
          type: string
        payload_schema_version:
          type: string
        payload:
          $ref: "#/components/schemas/SafeObject"
    ExecutionRunStepTrajectory:
      type: object
      additionalProperties: false
      required:
        - steps
        - attempts
        - results
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionRunStep"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionRunStepAttempt"
        results:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionRunStepResult"
    ExecutionRunStep:
      type: object
      additionalProperties: false
      required:
        - tool
        - completed_at
        - conversation_id
        - parent_step_id
        - payload_schema_version
        - run_id
        - sanitized_payload
        - started_at
        - status
        - step_id
        - step_kind
        - task_queue
        - updated_at
        - worker_id
      properties:
        tool:
          type: string
        completed_at:
          type: string
        conversation_id:
          type: string
        parent_step_id:
          type: string
        payload_schema_version:
          type: string
        run_id:
          type: string
        sanitized_payload:
          $ref: "#/components/schemas/SafeObject"
        started_at:
          type: string
        status:
          type: string
        step_id:
          type: string
        step_kind:
          type: string
        task_queue:
          type: string
        updated_at:
          type: string
        worker_id:
          type: string
    ExecutionRunStepAttempt:
      type: object
      additionalProperties: false
      required:
        - activity_attempt
        - activity_id
        - activity_type
        - attempt
        - attempt_id
        - cached_input_tokens
        - cancel_outcome
        - completed_at
        - duration_ms
        - fail_close_reason
        - input_tokens
        - late_completion_outcome
        - model_name
        - model_provider
        - output_tokens
        - payload_schema_version
        - provider_request_ref
        - provider_response_id
        - run_id
        - sanitized_payload
        - schedule_to_start_ms
        - scheduled_at
        - started_at
        - status
        - step_id
        - task_queue
        - temporal_run_id
        - terminal_reason
        - timeout_outcome
        - updated_at
        - worker_id
        - workflow_id
      properties:
        activity_attempt:
          type: integer
          minimum: 0
        activity_id:
          type: string
        activity_type:
          type: string
        attempt:
          type: integer
          minimum: 0
        attempt_id:
          type: string
        cached_input_tokens:
          type: integer
          minimum: 0
        cancel_outcome:
          type: string
        completed_at:
          type: string
        duration_ms:
          type: integer
          minimum: 0
        fail_close_reason:
          type: string
        input_tokens:
          type: integer
          minimum: 0
        late_completion_outcome:
          type: string
        model_name:
          type: string
        model_provider:
          type: string
        output_tokens:
          type: integer
          minimum: 0
        payload_schema_version:
          type: string
        provider_request_ref:
          type: string
        provider_response_id:
          type: string
        run_id:
          type: string
        sanitized_payload:
          $ref: "#/components/schemas/SafeObject"
        schedule_to_start_ms:
          type: integer
          minimum: 0
        scheduled_at:
          type: string
        started_at:
          type: string
        status:
          type: string
        step_id:
          type: string
        task_queue:
          type: string
        temporal_run_id:
          type: string
        terminal_reason:
          type: string
        timeout_outcome:
          type: string
        updated_at:
          type: string
        worker_id:
          type: string
        workflow_id:
          type: string
    ExecutionRunStepResult:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - created_at
        - payload_schema_version
        - projection_ref
        - result_id
        - result_kind
        - run_id
        - sanitized_payload
        - status
        - step_id
      properties:
        attempt_id:
          type: string
        created_at:
          type: string
        payload_schema_version:
          type: string
        projection_ref:
          type: string
        result_id:
          type: string
        result_kind:
          type: string
        run_id:
          type: string
        sanitized_payload:
          $ref: "#/components/schemas/SafeObject"
        status:
          type: string
        step_id:
          type: string
    ToolID:
      type: string
      enum:
        - knowledge_query
        - knowledge_search
        - transport_schedule_lookup
    ModelVisibleToolName:
      type: string
      enum:
        - knowledge_query
        - transport_schedule_lookup
    RequestedTool:
      type: string
      enum:
        - knowledge_query
        - transport_schedule_lookup
    ConfidenceLevel:
      type: string
      enum:
        - high
        - medium
        - low
    ExecutionStatus:
      type: string
      enum:
        - completed
        - needs_clarification
        - no_answer
        - error
        - rejected
        - approval_required
        - cancelled
    WorkflowMode:
      type: string
      enum:
        - terminal
        - single_step
        - multi_step
    AnswerArtifactKind:
      type: string
      enum:
        - agent_final_output
    SafeObject:
      type: object
      additionalProperties: true
    ErrorInfo:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    StageTiming:
      type: object
      additionalProperties: false
      properties:
        request.total_ms:
          type: number
          minimum: 0
        stream.browser_ttft_ms:
          type: number
          minimum: 0
        execution.admission_ms:
          type: number
          minimum: 0
        memory.recall_ms:
          type: number
          minimum: 0
        agent.primary_ms:
          type: number
          minimum: 0
        agent.runtime_ms:
          type: number
          minimum: 0
        agent.first_delta_ms:
          type: number
          minimum: 0
        tool.total_ms:
          type: number
          minimum: 0
        tool.transport_schedule_lookup_ms:
          type: number
          minimum: 0
        knowledge.search_ms:
          type: number
          minimum: 0
        finalization.write_ms:
          type: number
          minimum: 0
        projection.closeout_ms:
          type: number
          minimum: 0
    TraceContext:
      type: object
      additionalProperties: false
      required:
        - trace_id
      properties:
        trace_id:
          type: string
    ActorContext:
      type: object
      additionalProperties: true
      properties:
        user_id:
          type: string
        principal_id:
          type: string
        principal_type:
          type: string
        roles:
          type: array
          items:
            type: string
        departments:
          type: array
          items:
            type: string
    ConversationContextMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - message_id
        - content
        - created_at
      properties:
        role:
          enum:
            - user
            - assistant
        message_id:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
    ConversationPreviousEvidenceRef:
      type: object
      additionalProperties: false
      required:
        - evidence_id
        - source_id
        - content_hash
        - access_scope
      anyOf:
        - required:
            - version_id
        - required:
            - snapshot_id
      properties:
        evidence_id:
          type: string
        source_id:
          type: string
        document_id:
          type: string
        version_id:
          type: string
        snapshot_id:
          type: string
        content_hash:
          type: string
        source_kind:
          type: string
        collection:
          type: string
        evidence_role:
          type: string
        access_scope:
          type: string
        title:
          type: string
        section_title:
          type: string
        snippet:
          type: string
    ConversationPreviousToolResultRef:
      type: object
      additionalProperties: false
      required:
        - request_id
        - run_id
        - tool
        - result_kind
        - projection_ref
        - content_hash
        - status
      properties:
        request_id:
          type: string
        run_id:
          type: string
        tool:
          type: string
        result_kind:
          type: string
        projection_ref:
          type: string
        content_hash:
          type: string
        status:
          type: string
        summary:
          type: string
    ConversationContext:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - conversation_id
        - user_message_id
        - current_user_message
        - recent_turns
        - previous_evidence_refs
        - previous_tool_results
        - session_state
      properties:
        schema_version:
          const: conversation_context.v1
        conversation_id:
          type: string
        user_message_id:
          type: string
        parent_message_id:
          oneOf:
            - type: string
            - type: "null"
        current_user_message:
          type: object
          additionalProperties: false
          required:
            - role
            - content
            - created_at
          properties:
            role:
              const: user
            content:
              type: string
            created_at:
              type: string
              format: date-time
        recent_turns:
          type: array
          items:
            $ref: "#/components/schemas/ConversationContextMessage"
        previous_evidence_refs:
          type: array
          items:
            $ref: "#/components/schemas/ConversationPreviousEvidenceRef"
        previous_tool_results:
          type: array
          items:
            $ref: "#/components/schemas/ConversationPreviousToolResultRef"
        session_state:
          $ref: "#/components/schemas/SafeObject"
    SessionUpdateSlot:
      type: object
      additionalProperties: false
      required:
        - confirmed
        - name
        - value
      properties:
        confirmed:
          const: true
        name:
          enum:
            - curriculum_program
            - curriculum_program_family
            - curriculum_semester
        value:
          type: string
          minLength: 1
    SessionUpdate:
      type: object
      additionalProperties: false
      required:
        - upsert_slots
      properties:
        upsert_slots:
          type: array
          items:
            $ref: "#/components/schemas/SessionUpdateSlot"
    ExecutionPayload:
      type: object
      additionalProperties: false
      required:
        - execution_contract_version
        - response_contract
        - user_goal
        - conversation_id
        - request_id
        - trace
        - context
      properties:
        execution_contract_version:
          const: tool_execution_v2
        response_contract:
          const: execution_finalization_response_v3
        user_goal:
          type: string
        conversation_id:
          type: string
        request_id:
          type: string
        safety_identifier:
          oneOf:
            - type: string
            - type: "null"
        requested_tool:
          $ref: "#/components/schemas/RequestedTool"
        trace:
          $ref: "#/components/schemas/TraceContext"
        context:
          $ref: "#/components/schemas/ExecutionRequestContext"
    ExecutionRequestContext:
      type: object
      additionalProperties: true
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationContext"
      not:
        required:
          - profile_memory
    WorkflowTraceSummary:
      type: object
      additionalProperties: false
      required:
        - workflow_mode
        - selected_tool
        - selected_tools
        - first_decision_actor
        - planning_outcome
        - direct_vs_delegate_branch
        - terminal_reason
        - answer_artifact_kinds
        - answer_artifact_refs
        - trace_steps
        - tool_call_summaries
        - runtime_versions
      properties:
        workflow_mode:
          $ref: "#/components/schemas/WorkflowMode"
        selected_tool:
          oneOf:
            - $ref: "#/components/schemas/ToolID"
            - type: "null"
        selected_tools:
          type: array
          items:
            type: string
        first_decision_actor:
          type: string
        planning_outcome:
          type: string
        direct_vs_delegate_branch:
          type: string
        terminal_reason:
          type: string
        answer_artifact_kinds:
          type: array
          items:
            $ref: "#/components/schemas/AnswerArtifactKind"
        answer_artifact_refs:
          type: array
          items:
            type: string
        trace_steps:
          type: array
          items:
            $ref: "#/components/schemas/SafeObject"
        tool_call_summaries:
          type: array
          items:
            $ref: "#/components/schemas/SafeObject"
        runtime_versions:
          $ref: "#/components/schemas/SafeObject"
    ExecutionFinalizationResponse:
      type: object
      additionalProperties: false
      required:
        - selected_tool
        - status
        - answer_text
        - follow_up_question
        - confidence
        - result
        - error
        - resolved_targets
        - session_update
        - trace_id
      properties:
        selected_tool:
          oneOf:
            - $ref: "#/components/schemas/ToolID"
            - type: "null"
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        answer_text:
          type: string
        follow_up_question:
          type: string
        confidence:
          $ref: "#/components/schemas/ConfidenceLevel"
        result:
          oneOf:
            - $ref: "#/components/schemas/SafeObject"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorInfo"
            - type: "null"
        observability:
          oneOf:
            - $ref: "#/components/schemas/SafeObject"
            - type: "null"
        resolved_targets:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        session_update:
          oneOf:
            - $ref: "#/components/schemas/SessionUpdate"
            - type: "null"
        workflow_trace_summary:
          oneOf:
            - $ref: "#/components/schemas/WorkflowTraceSummary"
            - type: "null"
        stage_timing:
          oneOf:
            - $ref: "#/components/schemas/StageTiming"
            - type: "null"
        trace_id:
          type: string
