packages:
  - "apps/*"
  - "jobs/*"
  - "packages/*"
  - "packages/domains/*"

overrides:
  # 本节是 override 的唯一当前清单。上游依赖图不再请求对应范围后才能删除条目，
  # 并使用 pnpm why、frozen install 和依赖漏洞扫描确认解析结果。
  # rolldown 1.2.4 起多 HTML 入口构建内存回归（docs 构建 374 入口峰值 1.11GB→3.47GB），
  # 自托管 runner 2G 上限下 OOM；上游修复后（rolldown#9330 后续版本）删除。
  rolldown: 1.2.3
  "@xmldom/xmldom@<0.9.12": "0.9.12"
  # minimatch 通过 Testcontainers 和 React Email 仍请求 brace-expansion；
  # 这些链路不再落入受影响范围后删除。
  "brace-expansion@>=5.0.0 <5.0.9": "5.0.9"
  # AJV 及 schema-utils 仍由 contracts、Campus Web、ingestion 和 webpack 链路消费；
  # 它们不再请求旧 fast-uri 后删除。
  "fast-uri@<3.1.6": "3.1.6"
  # Testcontainers、React Email 和 archiver/glob 链仍请求旧 minimatch；
  # 其依赖范围收敛后删除。
  "minimatch@>=5.0.0 <10.2.5": "10.2.5"
  # Temporal 与 Testcontainers 的 gRPC/proto 链仍消费 protobufjs；两条链路均不再请求旧版本后删除。
  "protobufjs@<7.6.5": "7.6.5"
  # Cloudflare 本地开发与 Worker 测试使用的 Miniflare 固定旧 sharp；
  # 上游依赖不再请求受影响版本后删除。
  "sharp@<0.35.4": "0.35.4"
  # markdownlint-cli2 固定 smol-toml 1.7.0；上游升级到修复版本后删除。
  "smol-toml@<1.7.1": "1.8.0"

minimumReleaseAge: 0

allowBuilds:
  "@google/genai": false
  "@swc/core": false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  workerd: false
