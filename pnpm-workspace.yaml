packages:
  - "apps/*"
  - "jobs/*"
  - "packages/*"
  - "packages/domains/*"

overrides:
  adm-zip: "0.6.0"
  "body-parser@<2.3.0": "2.3.0"
  "brace-expansion@>=5.0.0 <5.0.9": "5.0.9"
  "esbuild@<0.25.0": "0.25.12"
  "fast-uri@<3.1.5": "3.1.5"
  "hono@<4.13.1": "4.13.1"
  "ip-address@<10.3.1": "10.3.1"
  "js-yaml@>=5.0.0 <5.2.2": "5.2.2"
  "minimatch@>=5.0.0 <10.2.5": "10.2.5"
  "postcss@<8.5.23": "8.5.23"
  "protobufjs@<7.6.5": "7.6.5"
  "undici@>=7.0.0 <7.29.0": "7.29.0"

packageExtensions:
  "@hookform/resolvers@*":
    peerDependencies:
      zod: "^3.25 || ^4.0"
    peerDependenciesMeta:
      zod:
        optional: true

minimumReleaseAge: 0

allowBuilds:
  "@sentry/cli": false
  "@swc/core": false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  workerd: false
