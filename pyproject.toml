[project]
name = "campus-agent-workspace"
version = "0.1.0"
description = "Monorepo for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pre-commit>=4.2.0",
  "pytest>=8.0.0",
  "ruff>=0.15.11",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
extend-exclude = [
  ".planning",
  ".tmp",
  ".worktrees",
  "apps/public-chat-web/vendor",
  "apps/app-api/drizzle/meta",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/app-api",
  "apps/authenticated-notice-collector",
  "apps/ingestion-worker",
  "apps/legacy-office-conversion-service",
  "apps/official-web-collector",
  "apps/protected-panel-web",
  "apps/public-chat-web",
  "apps/supervisor-api",
  "packages/*",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
