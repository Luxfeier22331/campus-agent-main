[project]
name = "campus-agent-workspace"
version = "0.1.0"
description = "Monorepo for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
