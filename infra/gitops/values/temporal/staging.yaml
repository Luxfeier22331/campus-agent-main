fullnameOverride: temporal

server:
  replicaCount: 1
  config:
    logLevel: info
    persistence:
      numHistoryShards: 4
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: campus-agent-postgres-rw:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-db-secret
            secretKey: password
            maxConns: 20
            maxIdleConns: 20
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: campus-agent-postgres-rw:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-db-secret
            secretKey: password
            maxConns: 20
            maxIdleConns: 20
    namespaces:
      create: true
      namespace:
        - name: campus-agent-staging
          retention: 7d
  frontend:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
  history:
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1Gi
  matching:
    resources:
      requests:
        cpu: 75m
        memory: 256Mi
      limits:
        memory: 768Mi
  worker:
    resources:
      requests:
        cpu: 75m
        memory: 256Mi
      limits:
        memory: 768Mi

admintools:
  enabled: false

web:
  enabled: false

schema:
  useHelmHooks: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

shims:
  dockerize: false
  elasticsearchTool: false
