nameOverride: otel-collector
fullnameOverride: otel-collector

mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib

replicaCount: 1

presets:
  logsCollection:
    enabled: false
  hostMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: false
  kubeletMetrics:
    enabled: false
  kubernetesEvents:
    enabled: false
  kubernetesObjects:
    enabled: false
  clusterMetrics:
    enabled: false

extraEnvsFrom:
  - secretRef:
      name: otel-collector-secrets

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false

resources:
  requests:
    cpu: 75m
    memory: 192Mi
  limits:
    memory: 512Mi

alternateConfig:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
          auth:
            authenticator: bearertokenauth
  extensions:
    bearertokenauth:
      token: "${env:APP_API_OTEL_INGEST_SHARED_SECRET}"
    health_check:
      endpoint: 0.0.0.0:13133
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 512
      spike_limit_mib: 128
    resource/campus:
      attributes:
        - key: service.namespace
          value: campus-agent
          action: upsert
        - key: deployment.environment
          value: staging
          action: upsert
        - key: telemetry.allowed_attributes_version
          value: runtime-otel-attrs-v1
          action: upsert
    attributes/drop_forbidden:
      actions:
        - key: raw.prompt
          action: delete
        - key: raw.query
          action: delete
        - key: raw.answer
          action: delete
        - key: raw.chat_transcript
          action: delete
        - key: raw.retrieved_snippet
          action: delete
        - key: chunk.body
          action: delete
        - key: canonical.body
          action: delete
        - key: ocr.raw_text
          action: delete
        - key: authorization
          action: delete
        - key: cookie
          action: delete
        - key: jwt
          action: delete
        - key: api.key
          action: delete
        - key: database.url
          action: delete
        - key: object_store.secret
          action: delete
        - key: provider.secret
          action: delete
    filter/drop_marked:
      error_mode: ignore
      traces:
        span:
          - 'attributes["telemetry.drop"] == true'
          - 'attributes["telemetry.drop"] == "true"'
      metrics:
        datapoint:
          - 'attributes["telemetry.drop"] == true'
          - 'attributes["telemetry.drop"] == "true"'
      logs:
        log_record:
          - 'attributes["telemetry.drop"] == true'
          - 'attributes["telemetry.drop"] == "true"'
    batch:
      timeout: 5s
      send_batch_size: 512
  exporters:
    otlphttp/sentry:
      endpoint: "${env:OTEL_COLLECTOR_SENTRY_OTLP_ENDPOINT}"
      headers:
        x-sentry-auth: "${env:OTEL_COLLECTOR_SENTRY_AUTH_VALUE}"
      compression: gzip
      encoding: proto
      sending_queue:
        enabled: true
        num_consumers: 2
        queue_size: 1024
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 30s
        max_elapsed_time: 300s
    otlphttp/axiom:
      endpoint: "${env:OTEL_COLLECTOR_AXIOM_OTLP_ENDPOINT}"
      headers:
        authorization: "${env:OTEL_COLLECTOR_AXIOM_AUTH_HEADER}"
        x-axiom-dataset: "${env:OTEL_COLLECTOR_AXIOM_EVENTS_DATASET}"
      compression: zstd
      sending_queue:
        enabled: true
        num_consumers: 2
        queue_size: 4096
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 30s
        max_elapsed_time: 300s
    otlphttp/langfuse:
      endpoint: "${env:OTEL_COLLECTOR_LANGFUSE_OTLP_ENDPOINT}"
      headers:
        authorization: "${env:OTEL_COLLECTOR_LANGFUSE_AUTH_HEADER}"
        x-langfuse-ingestion-version: "${env:OTEL_COLLECTOR_LANGFUSE_INGESTION_VERSION}"
      compression: gzip
      encoding: proto
      sending_queue:
        enabled: true
        num_consumers: 2
        queue_size: 1024
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 30s
        max_elapsed_time: 300s
    otlphttp/axiommetrics:
      endpoint: "${env:OTEL_COLLECTOR_AXIOM_OTLP_ENDPOINT}"
      headers:
        authorization: "${env:OTEL_COLLECTOR_AXIOM_AUTH_HEADER}"
        x-axiom-dataset: "${env:OTEL_COLLECTOR_AXIOM_METRICS_DATASET}"
      compression: zstd
      sending_queue:
        enabled: true
        num_consumers: 2
        queue_size: 4096
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 30s
        max_elapsed_time: 300s
    debug:
      verbosity: basic
  service:
    extensions:
      - bearertokenauth
      - health_check
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - resource/campus
          - attributes/drop_forbidden
          - filter/drop_marked
          - batch
        exporters:
          - otlphttp/sentry
          - otlphttp/axiom
          - otlphttp/langfuse
          - debug
      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - resource/campus
          - attributes/drop_forbidden
          - filter/drop_marked
          - batch
        exporters:
          - otlphttp/axiommetrics
          - debug
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - resource/campus
          - attributes/drop_forbidden
          - filter/drop_marked
          - batch
        exporters:
          - otlphttp/axiom
          - debug
