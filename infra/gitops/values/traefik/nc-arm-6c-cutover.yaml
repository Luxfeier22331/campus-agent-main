deployment:
  replicas: 1

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-staging

providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-staging
    namespaces:
      - campus-agent-staging
  kubernetesGateway:
    enabled: false

gateway:
  enabled: false

gatewayClass:
  enabled: false

ports:
  web:
    port: 8000
    hostPort: 80
    expose:
      default: false
    exposedPort: 80
  websecure:
    port: 8443
    hostPort: 443
    expose:
      default: false
    exposedPort: 443

hostNetwork: false

service:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

log:
  level: INFO

accessLog:
  enabled: true
