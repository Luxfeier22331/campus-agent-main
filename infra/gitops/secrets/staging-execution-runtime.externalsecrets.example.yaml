apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: campus-agent-staging
spec:
  provider:
    webhook:
      url: https://secrets-backend.example.invalid/campus-agent/staging
      result:
        jsonPath: "$.value"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: execution-runtime-role-secrets
  namespace: campus-agent-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: campus-agent-staging
  target:
    name: execution-control-secrets
    creationPolicy: Owner
  data:
    - secretKey: API_WORKER_SHARED_SECRET
      remoteRef:
        key: execution-control-secrets/API_WORKER_SHARED_SECRET
    - secretKey: EXECUTION_CONTROL_EXECUTION_AUDIT_SHARED_SECRET
      remoteRef:
        key: execution-control-secrets/EXECUTION_CONTROL_EXECUTION_AUDIT_SHARED_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: execution-runtime-rag-secrets
  namespace: campus-agent-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: campus-agent-staging
  target:
    name: execution-rag-secrets
    creationPolicy: Owner
  data:
    - secretKey: QDRANT_QUERY_API_KEY
      remoteRef:
        key: execution-rag-secrets/QDRANT_QUERY_API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: execution-runtime-projection-secrets
  namespace: campus-agent-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: campus-agent-staging
  target:
    name: execution-runtime-provider-config-projection
    creationPolicy: Owner
  data:
    - secretKey: provider-config-projection.json
      remoteRef:
        key: execution-runtime-provider-config-projection/provider-config-projection.json
