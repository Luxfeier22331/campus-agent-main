spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: campus-agent-staging
  target:
    name: qdrant-server-tls
    creationPolicy: Owner
  data:
    - secretKey: tls.crt
      remoteRef:
        key: qdrant-server-tls/tls.crt
    - secretKey: tls.key
      remoteRef:
        key: qdrant-server-tls/tls.key
    - secretKey: ca.crt
      remoteRef:
        key: qdrant-server-tls/ca.crt
---
