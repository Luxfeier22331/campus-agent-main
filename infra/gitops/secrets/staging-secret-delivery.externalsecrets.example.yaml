apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: campus-agent-staging
  annotations:
    campus-agent.muc.wiki/example-only: "true"
spec:
  provider:
    webhook:
      url: https://secrets-backend.example.invalid/campus-agent/staging
      result:
        jsonPath: "$.value"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: execution-runtime-role-secrets
  namespace: campus-agent-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: campus-agent-staging
  target:
    name: execution-control-secrets
    creationPolicy: Owner
  data:
    - secretKey: API_WORKER_SHARED_SECRET
      remoteRef:
        key: execution-control-secrets/API_WORKER_SHARED_SECRET
    - secretKey: EXECUTION_CONTROL_EXECUTION_AUDIT_SHARED_SECRET
      remoteRef:
        key: execution-control-secrets/EXECUTION_CONTROL_EXECUTION_AUDIT_SHARED_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: execution-runtime-rag-secrets
  namespace: campus-agent-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: campus-agent-staging
  target:
    name: execution-rag-secrets
    creationPolicy: Owner
  data:
    - secretKey: QDRANT_QUERY_API_KEY
      remoteRef:
        key: execution-rag-secrets/QDRANT_QUERY_API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: data-qdrant-server-secrets
  namespace: campus-agent-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: campus-agent-staging
  target:
    name: qdrant-server-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        QDRANT_API_KEY: "{{ .qdrantApiKey }}"
        QDRANT_READ_ONLY_API_KEY: "{{ .qdrantReadOnlyApiKey }}"
        local.yaml: |
          service:
            api_key: "{{ .qdrantApiKey }}"
            read_only_api_key: "{{ .qdrantReadOnlyApiKey }}"
  data:
    - secretKey: qdrantApiKey
      remoteRef:
        key: qdrant-server-secrets/QDRANT_API_KEY
    - secretKey: qdrantReadOnlyApiKey
      remoteRef:
        key: qdrant-server-secrets/QDRANT_READ_ONLY_API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
