apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-temporal-alias-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MUC-WIKI/campus-agent.git
    targetRevision: develop
    path: infra/k8s/platform-temporal/overlays/nc-arm-6c-staging
  destination:
    server: https://kubernetes.default.svc
    namespace: campus-agent-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
