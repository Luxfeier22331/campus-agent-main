apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memory-hindsight-staging
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/vectorize-io/charts
      chart: hindsight
      targetRevision: 0.8.4
      helm:
        releaseName: hindsight
        valueFiles:
          - $values/infra/gitops/values/hindsight/staging.yaml
    - repoURL: https://github.com/MUC-WIKI/campus-agent.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: campus-agent-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
