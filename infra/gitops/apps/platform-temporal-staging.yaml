apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-temporal-staging
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://go.temporal.io/helm-charts
      chart: temporal
      targetRevision: 1.5.0
      helm:
        releaseName: temporal
        skipTests: true
        valueFiles:
          - $values/infra/gitops/values/temporal/staging.yaml
    - repoURL: https://github.com/MUC-WIKI/campus-agent.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: campus-agent-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
