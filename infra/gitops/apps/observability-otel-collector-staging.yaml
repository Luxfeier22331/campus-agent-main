apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-otel-collector-staging
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.162.0
      helm:
        releaseName: otel-collector
        valueFiles:
          - $values/infra/gitops/values/opentelemetry-collector/staging.yaml
    - repoURL: https://github.com/MUC-WIKI/campus-agent.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: campus-agent-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
