apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-qdrant-staging
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://qdrant.github.io/qdrant-helm
      chart: qdrant
      targetRevision: 1.18.2
      helm:
        releaseName: qdrant
        skipTests: true
        valueFiles:
          - $values/infra/gitops/values/qdrant/staging.yaml
    - repoURL: https://github.com/MUC-WIKI/campus-agent.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: campus-agent-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
