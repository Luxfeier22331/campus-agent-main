apiVersion: v1
kind: ConfigMap
metadata:
  name: object-store-bootstrap
  labels:
    app.kubernetes.io/name: object-store
    app.kubernetes.io/part-of: campus-agent
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    until mc alias set object-store http://object-store:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
      sleep 2
    done

    mc mb --ignore-existing object-store/campus-agent-source
    mc mb --ignore-existing object-store/campus-agent-derived
    mc mb --ignore-existing object-store/campus-dining-media

    mc version enable object-store/campus-agent-source
    mc version enable object-store/campus-agent-derived

    mc ilm import object-store/campus-agent-source < /bootstrap/source-lifecycle.json
    mc ilm import object-store/campus-agent-derived < /bootstrap/derived-lifecycle.json
    mc ilm import object-store/campus-dining-media < /bootstrap/dining-lifecycle.json
    mc anonymous set-json /bootstrap/dining-public-policy.json object-store/campus-dining-media

    mc admin policy create object-store campus-agent-source-rw /bootstrap/source-policy.json
    mc admin policy create object-store campus-agent-derived-rw /bootstrap/derived-policy.json

    mc admin user add object-store "$OBJECT_STORE_SOURCE_ACCESS_KEY" "$OBJECT_STORE_SOURCE_SECRET_KEY"
    mc admin user add object-store "$OBJECT_STORE_DERIVED_ACCESS_KEY" "$OBJECT_STORE_DERIVED_SECRET_KEY"
    mc admin policy attach object-store campus-agent-source-rw --user "$OBJECT_STORE_SOURCE_ACCESS_KEY"
    mc admin policy attach object-store campus-agent-derived-rw --user "$OBJECT_STORE_DERIVED_ACCESS_KEY"
  source-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
          "Resource": ["arn:aws:s3:::campus-agent-source"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:AbortMultipartUpload", "s3:GetObject", "s3:ListMultipartUploadParts", "s3:PutObject"],
          "Resource": ["arn:aws:s3:::campus-agent-source/*"]
        }
      ]
    }
  derived-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
          "Resource": [
            "arn:aws:s3:::campus-agent-derived",
            "arn:aws:s3:::campus-dining-media"
          ]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:AbortMultipartUpload", "s3:GetObject", "s3:ListMultipartUploadParts", "s3:PutObject"],
          "Resource": [
            "arn:aws:s3:::campus-agent-derived/*",
            "arn:aws:s3:::campus-dining-media/*"
          ]
        }
      ]
    }
  source-lifecycle.json: |
    {
      "Rules": [
        {
          "ID": "temporary-attempts-30d",
          "Status": "Enabled",
          "Filter": {"Prefix": "attempts/"},
          "Expiration": {"Days": 30},
          "NoncurrentVersionExpiration": {"NoncurrentDays": 1},
          "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 7}
        },
        {
          "ID": "temporary-ingestion-results-30d",
          "Status": "Enabled",
          "Filter": {"Prefix": "ingestion-results/"},
          "Expiration": {"Days": 30},
          "NoncurrentVersionExpiration": {"NoncurrentDays": 1},
          "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 7}
        },
        {
          "ID": "temporary-ingestion-requests-30d",
          "Status": "Enabled",
          "Filter": {"Prefix": "ingestion-requests/"},
          "Expiration": {"Days": 30},
          "NoncurrentVersionExpiration": {"NoncurrentDays": 1},
          "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 7}
        }
      ]
    }
  derived-lifecycle.json: |
    {
      "Rules": [
        {
          "ID": "temporary-ingestion-results-30d",
          "Status": "Enabled",
          "Filter": {"Prefix": "ingestion-results/"},
          "Expiration": {"Days": 30},
          "NoncurrentVersionExpiration": {"NoncurrentDays": 1},
          "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 7}
        }
      ]
    }
  dining-lifecycle.json: |
    {
      "Rules": [
        {
          "ID": "dining-quarantine-1d",
          "Status": "Enabled",
          "Filter": {"Prefix": "quarantine/"},
          "Expiration": {"Days": 1},
          "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 1}
        }
      ]
    }
  dining-public-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {"AWS": ["*"]},
          "Action": ["s3:GetObject"],
          "Resource": ["arn:aws:s3:::campus-dining-media/public/*"]
        }
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: object-store-bootstrap
  labels:
    app.kubernetes.io/name: object-store-bootstrap
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-store-bootstrap
        app.kubernetes.io/part-of: campus-agent
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: OBJECT_STORE_SOURCE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_SOURCE_ACCESS_KEY
            - name: OBJECT_STORE_SOURCE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_SOURCE_SECRET_KEY
            - name: OBJECT_STORE_DERIVED_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_DERIVED_ACCESS_KEY
            - name: OBJECT_STORE_DERIVED_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_DERIVED_SECRET_KEY
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: object-store-bootstrap
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
