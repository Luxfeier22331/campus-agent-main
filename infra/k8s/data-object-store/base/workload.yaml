apiVersion: v1
kind: Service
metadata:
  name: object-store
  labels:
    app.kubernetes.io/name: object-store
    app.kubernetes.io/part-of: campus-agent
spec:
  selector:
    app.kubernetes.io/name: object-store
    app.kubernetes.io/instance: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: object-store-rustfs
  labels:
    app.kubernetes.io/name: object-store
    app.kubernetes.io/instance: rustfs
    app.kubernetes.io/part-of: campus-agent
spec:
  serviceName: object-store
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: object-store
      app.kubernetes.io/instance: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-store
        app.kubernetes.io/instance: rustfs
        app.kubernetes.io/part-of: campus-agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: object-store
          image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_ADMIN_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_ADMIN_SECRET_KEY
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: /tmp/logs
            - name: RUSTFS_OBS_LOG_STDOUT_ENABLED
              value: "true"
          ports:
            - name: s3
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/live
              port: s3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: s3
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: object-store
          app.kubernetes.io/instance: rustfs
          app.kubernetes.io/part-of: campus-agent
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
