apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: object-store-rustfs-migration-ingress
  labels:
    app.kubernetes.io/name: object-store
    app.kubernetes.io/part-of: campus-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: object-store
      app.kubernetes.io/instance: rustfs
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: object-store
              app.kubernetes.io/instance: minio
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: object-store-rustfs-migration-bootstrap
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: object-store-migration-operator
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: object-store-minio-replication-egress
  labels:
    app.kubernetes.io/name: object-store
    app.kubernetes.io/part-of: campus-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: object-store
      app.kubernetes.io/instance: minio
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: object-store
              app.kubernetes.io/instance: rustfs
      ports:
        - protocol: TCP
          port: 9000
---
