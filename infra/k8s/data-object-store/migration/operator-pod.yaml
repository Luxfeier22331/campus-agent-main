apiVersion: v1
kind: Pod
metadata:
  name: object-store-migration-operator
  labels:
    app.kubernetes.io/name: object-store-migration-operator
    app.kubernetes.io/part-of: campus-agent
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 14400
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: mc
      image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args:
        - |
          mc alias set source http://object-store:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          mc alias set target http://object-store-rustfs-migration:9000 "$OBJECT_STORE_ADMIN_ACCESS_KEY" "$OBJECT_STORE_ADMIN_SECRET_KEY"
          sleep 14400
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: object-store-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: object-store-secrets
              key: MINIO_ROOT_PASSWORD
        - name: OBJECT_STORE_ADMIN_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-store-secrets
              key: OBJECT_STORE_ADMIN_ACCESS_KEY
        - name: OBJECT_STORE_ADMIN_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: object-store-secrets
              key: OBJECT_STORE_ADMIN_SECRET_KEY
        - name: MC_CONFIG_DIR
          value: /tmp/.mc
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 32Mi
