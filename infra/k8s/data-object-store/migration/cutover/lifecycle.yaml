apiVersion: batch/v1
kind: Job
metadata:
  name: object-store-rustfs-cutover-lifecycle
  labels:
    app.kubernetes.io/name: object-store-rustfs-migration-bootstrap
    app.kubernetes.io/part-of: campus-agent
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-store-rustfs-migration-bootstrap
        app.kubernetes.io/part-of: campus-agent
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lifecycle
          image: rustfs/rc:v0.1.30@sha256:1296510ec27800668d26a8bdca6251e587086187a9368c7b80134a169e8a3bb8
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until rc alias set object-store http://object-store-rustfs-migration:9000 "$OBJECT_STORE_ADMIN_ACCESS_KEY" "$OBJECT_STORE_ADMIN_SECRET_KEY"; do
                sleep 2
              done
              rc ilm rule import object-store/campus-agent-source /bootstrap/source-lifecycle.json
              rc ilm rule import object-store/campus-agent-derived /bootstrap/derived-lifecycle.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: OBJECT_STORE_ADMIN_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_ADMIN_ACCESS_KEY
            - name: OBJECT_STORE_ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_ADMIN_SECRET_KEY
            - name: RC_CONFIG_DIR
              value: /tmp/.rc
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: object-store-rustfs-migration-bootstrap
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
