apiVersion: batch/v1
kind: Job
metadata:
  name: ops-web-bootstrap
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "0"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-web-bootstrap
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: ops-web
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ghcr.io/muc-wiki/campus-agent/ops-web:replace-me
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              node dist-ops/db/bootstrap-transport.js
              exec node dist-ops/db/bootstrap-dining.js
          env:
            - name: DEPLOYMENT_ENVIRONMENT
              value: production
            - name: OPS_WEB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ops-web-database-secrets
                  key: OPS_WEB_DATABASE_URL
            - name: OBJECT_STORE_ENDPOINT
              value: http://object-store:9000
            - name: OBJECT_STORE_DERIVED_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_DERIVED_ACCESS_KEY
            - name: OBJECT_STORE_DERIVED_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_DERIVED_SECRET_KEY
            - name: OPS_WEB_DATABASE_CA_CERT_PATH
              value: /etc/campus-agent/postgres/ca.crt
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
