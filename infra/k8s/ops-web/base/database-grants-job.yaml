apiVersion: batch/v1
kind: Job
metadata:
  name: ops-web-database-grants
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-web-database-grants
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: ops-web
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grants
          image: ghcr.io/muc-wiki/campus-agent/ops-web:replace-me
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              export OPS_WEB_SCHEMA_DATABASE_URL="$(node -e '
                const url = new URL(`postgresql://${process.env.PGHOST}:${process.env.PGPORT}/${process.env.PGDATABASE}`);
                url.username = process.env.PGUSER;
                url.password = process.env.PGPASSWORD;
                process.stdout.write(url.toString());
              ')"
              node --experimental-strip-types ops/db/ops-web-database.ts apply
              exec node dist-ops/bootstrap-dining.js
          envFrom:
            - configMapRef:
                name: ops-web-schema-database-config
          env:
            - name: DEPLOYMENT_ENVIRONMENT
              value: production
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: password
            - name: OPS_WEB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ops-web-database-secrets
                  key: OPS_WEB_DATABASE_URL
            - name: OPS_WEB_SCHEMA_DATABASE_CA_CERT_PATH
              value: /etc/campus-agent/postgres/ca.crt
            - name: OPS_WEB_DATABASE_CA_CERT_PATH
              value: /etc/campus-agent/postgres/ca.crt
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
