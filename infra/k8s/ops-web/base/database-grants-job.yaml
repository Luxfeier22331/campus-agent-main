apiVersion: batch/v1
kind: Job
metadata:
  name: ops-web-database-grants
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-web-database-grants
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: ops-web
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: grants
          image: ghcr.io/muc-wiki/campus-agent/ops-web:replace-me
          imagePullPolicy: IfNotPresent
          command:
            - node
            - --experimental-strip-types
            - ops/db/ops-web-database.ts
            - apply
          env:
            - name: DEPLOYMENT_ENVIRONMENT
              value: production
            - name: OPS_WEB_SCHEMA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ops-web-schema-database-secrets
                  key: OPS_WEB_SCHEMA_DATABASE_URL
            - name: OPS_WEB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ops-web-database-secrets
                  key: OPS_WEB_DATABASE_URL
            - name: OPS_AUDIT_MAINTENANCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ops-audit-maintenance-database-secrets
                  key: OPS_AUDIT_MAINTENANCE_DATABASE_URL
            - name: OPS_WEB_SCHEMA_DATABASE_CA_CERT_PATH
              value: /etc/campus-agent/postgres/ca.crt
            - name: OPS_WEB_DATABASE_CA_CERT_PATH
              value: /etc/campus-agent/postgres/ca.crt
            - name: OPS_AUDIT_MAINTENANCE_DATABASE_CA_CERT_PATH
              value: /etc/campus-agent/postgres/ca.crt
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-ca
            items:
              - key: ca.crt
                path: ca.crt
