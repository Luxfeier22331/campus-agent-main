apiVersion: v1
kind: Service
metadata:
  name: ops-web
  labels:
    app.kubernetes.io/name: ops-web
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: http
      port: 5178
      targetPort: http
  selector:
    app.kubernetes.io/name: ops-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-web
  labels:
    app.kubernetes.io/name: ops-web
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-web
        app.kubernetes.io/part-of: campus-agent
        campus-agent.muc.wiki/network-policy-profile: ops-web
    spec:
      serviceAccountName: ops-web
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: ops-web
          image: ghcr.io/muc-wiki/campus-agent/ops-web:replace-me
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 5178
          envFrom:
            - configMapRef:
                name: ops-web-config
          env:
            - name: PORT
              value: "5178"
            - name: OPS_WEB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ops-web-database-secrets
                  key: OPS_WEB_DATABASE_URL
            - name: OBJECT_STORE_ENDPOINT
              value: http://object-store:9000
            - name: OBJECT_STORE_DERIVED_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_DERIVED_ACCESS_KEY
            - name: OBJECT_STORE_DERIVED_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_DERIVED_SECRET_KEY
            - name: OPS_WEB_EXECUTION_CONTROL_URL
              value: http://execution-control:8000
            - name: OPS_WEB_EXECUTION_CONTROL_ADMIN_URL
              value: http://execution-control-admin:8000
            - name: OPS_WEB_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-web-internal-secrets
                  key: OPS_WEB_INTERNAL_TOKEN
            - name: ACCESS_TEAM_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: ops-web-config
                  key: ACCESS_TEAM_DOMAIN
            - name: ACCESS_POLICY_AUD
              valueFrom:
                configMapKeyRef:
                  name: ops-web-config
                  key: ACCESS_POLICY_AUD
            - name: AXIOM_QUERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: observability-runtime-secrets
                  key: AXIOM_RUNTIME_TOKEN
                  optional: true
            - name: SENTRY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: observability-runtime-secrets
                  key: SENTRY_AUTH_TOKEN
                  optional: true
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
