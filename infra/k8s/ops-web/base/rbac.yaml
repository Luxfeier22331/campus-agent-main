apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-web-fixed-secrets
  labels:
    app.kubernetes.io/name: ops-web
    app.kubernetes.io/part-of: campus-agent
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["source-collector-internal-portal-auth", "execution-runtime-provider-config"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-web-fixed-secrets
  labels:
    app.kubernetes.io/name: ops-web
    app.kubernetes.io/part-of: campus-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-web-fixed-secrets
subjects:
  - kind: ServiceAccount
    name: ops-web
