apiVersion: batch/v1
kind: CronJob
metadata:
  name: ops-web-internal-portal-check
  labels:
    app.kubernetes.io/name: ops-web-internal-portal-check
    app.kubernetes.io/part-of: campus-agent
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ops-web-internal-portal-check
            app.kubernetes.io/part-of: campus-agent
        spec:
          serviceAccountName: ops-web
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: ghcr.io/muc-wiki/campus-agent/ops-web:replace-me
              imagePullPolicy: IfNotPresent
              command:
                - node
                - dist-ops/internal-portal/check.js
              env:
                - name: DEPLOYMENT_ENVIRONMENT
                  valueFrom:
                    configMapKeyRef:
                      name: ops-web-config
                      key: DEPLOYMENT_ENVIRONMENT
                - name: OPS_WEB_DATABASE_CA_CERT_PATH
                  valueFrom:
                    configMapKeyRef:
                      name: ops-web-config
                      key: OPS_WEB_DATABASE_CA_CERT_PATH
                - name: OPS_WEB_DATABASE_SSLMODE
                  valueFrom:
                    configMapKeyRef:
                      name: ops-web-config
                      key: OPS_WEB_DATABASE_SSLMODE
                - name: OPS_WEB_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ops-web-database-secrets
                      key: OPS_WEB_DATABASE_URL
              volumeMounts:
                - name: postgres-ca
                  mountPath: /etc/campus-agent/postgres
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: postgres-ca
              secret:
                secretName: campus-agent-postgres-origin-server
                items:
                  - key: ca.crt
                    path: ca.crt
