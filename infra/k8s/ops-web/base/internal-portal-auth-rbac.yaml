apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-web-internal-portal-auth
  labels:
    app.kubernetes.io/name: ops-web
    app.kubernetes.io/part-of: campus-agent
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["source-collector-internal-portal-auth"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["source-collector-auth-check"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-web-internal-portal-auth
  labels:
    app.kubernetes.io/name: ops-web
    app.kubernetes.io/part-of: campus-agent
subjects:
  - kind: ServiceAccount
    name: ops-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-web-internal-portal-auth
