apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: campus-search-service-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: campus-search-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-control
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: private-service-connector
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: campus-search-service-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: campus-search-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: model-config
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
      ports:
        - protocol: TCP
          port: 6333
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: campus-agent-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
