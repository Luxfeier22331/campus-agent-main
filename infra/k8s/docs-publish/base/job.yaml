apiVersion: batch/v1
kind: Job
metadata:
  name: docs-publish
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 1
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      serviceAccountName: docs-publish
      containers:
        - name: docs-publish
          image: ghcr.io/muc-wiki/campus-agent/docs-publish:replace-me
          imagePullPolicy: IfNotPresent
          args:
            - publish-materialize
            - --input-ref
            - /input/projection-ref.json
          envFrom:
            - configMapRef:
                name: docs-publish-runtime
          env:
            - name: DOCS_PUBLISH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: docs-publish-secrets
                  key: DOCS_PUBLISH_DATABASE_URL
            - name: OBJECT_STORE_DERIVED_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_DERIVED_ACCESS_KEY
            - name: OBJECT_STORE_DERIVED_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_DERIVED_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: input
              mountPath: /input
              readOnly: true
            - name: database-ca
              mountPath: /etc/docs-publish/database-ca
              readOnly: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: input
          configMap:
            name: docs-publish-input
        - name: database-ca
          secret:
            secretName: docs-publish-database-ca
