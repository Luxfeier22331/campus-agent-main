apiVersion: v1
kind: Service
metadata:
  name: agent-control
  labels:
    app.kubernetes.io/name: agent-control
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: agent-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-control
  labels:
    app.kubernetes.io/name: agent-control
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-control
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent-control
        app.kubernetes.io/name: agent-control
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: agent-control
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 10001
      containers:
        - name: agent-control
          image: ghcr.io/muc-wiki/campus-agent/agent-control:replace-me
          command:
            - /usr/local/bin/agent-control
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: EXECUTION_CONTROL_INGRESS_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: execution-control-ingress-secrets
                  key: EXECUTION_CONTROL_INGRESS_SHARED_SECRET
            - name: MEMORY_SERVICE_BASE_URL
              value: http://memory-service:8000
            - name: MEMORY_INTERNAL_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: memory-service-secrets
                  key: MEMORY_INTERNAL_SHARED_SECRET
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: agent-control-config
                  key: DEPLOYMENT_ENVIRONMENT
            - name: DEPLOYMENT_RELEASE
              valueFrom:
                configMapKeyRef:
                  name: agent-control-config
                  key: DEPLOYMENT_RELEASE
            - name: EXECUTION_CONTROL_TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: agent-control-config
                  key: EXECUTION_CONTROL_TEMPORAL_ADDRESS
            - name: EXECUTION_CONTROL_TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: agent-control-config
                  key: EXECUTION_CONTROL_TEMPORAL_NAMESPACE
            - name: EXECUTION_CONTROL_PRODUCT_CALLBACK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-control-config
                  key: EXECUTION_CONTROL_PRODUCT_CALLBACK_BASE_URL
            - name: EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPS_WEB_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-web-internal-secrets
                  key: OPS_WEB_INTERNAL_TOKEN
            - name: MODEL_CONFIG_URL
              value: http://model-config:8000
            - name: EXECUTION_CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: execution-tool-read-model-secrets
                  key: EXECUTION_CONTROL_DATABASE_URL
            - name: AGENT_CONTROL_RUNTIME_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: execution-agent-runtime-secrets
                  key: EXECUTION_AGENT_RUNTIME_SHARED_SECRET
            - name: APP_API_EXECUTION_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: execution-app-api-internal-secrets
                  key: APP_API_EXECUTION_SHARED_SECRET
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - "curl -fsS \\

                  \  -H \"x-worker-origin-auth: ${EXECUTION_CONTROL_INGRESS_SHARED_SECRET}\" \\

                  \  http://127.0.0.1:8000/readyz/process >/dev/null\n"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
