apiVersion: v1
kind: Service
metadata:
  name: memory-service
spec:
  selector:
    app.kubernetes.io/name: memory-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-service
  labels:
    app.kubernetes.io/name: memory-service
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-service
      app.kubernetes.io/part-of: campus-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-service
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: memory
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 10001
      containers:
        - name: memory-service
          image: ghcr.io/muc-wiki/campus-agent/memory-service:replace-me
          command:
            - /usr/local/bin/memory-api
          env:
            - name: MEMORY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: memory-service-secrets
                  key: MEMORY_DATABASE_URL
            - name: MEMORY_INTERNAL_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: memory-service-secrets
                  key: MEMORY_INTERNAL_SHARED_SECRET
            - name: HINDSIGHT_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: memory-config
                  key: HINDSIGHT_API_BASE_URL
            - name: HINDSIGHT_API_TENANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-api-secrets
                  key: HINDSIGHT_API_TENANT_API_KEY
            - name: HINDSIGHT_OWNER_SALT
              valueFrom:
                secretKeyRef:
                  name: memory-service-secrets
                  key: HINDSIGHT_OWNER_SALT
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-worker
  labels:
    app.kubernetes.io/name: memory-worker
    app.kubernetes.io/part-of: campus-agent
