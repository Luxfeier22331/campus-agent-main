    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-worker
      app.kubernetes.io/part-of: campus-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-worker
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: memory
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 10001
      containers:
        - name: memory-worker
          image: ghcr.io/muc-wiki/campus-agent/memory-service:replace-me
          command:
            - /usr/local/bin/memory-worker
          env:
            - name: MEMORY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: memory-service-secrets
                  key: MEMORY_DATABASE_URL
            - name: MEMORY_INTERNAL_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: memory-service-secrets
                  key: MEMORY_INTERNAL_SHARED_SECRET
            - name: HINDSIGHT_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: memory-config
                  key: HINDSIGHT_API_BASE_URL
            - name: HINDSIGHT_API_TENANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-api-secrets
                  key: HINDSIGHT_API_TENANT_API_KEY
            - name: HINDSIGHT_OWNER_SALT
              valueFrom:
                secretKeyRef:
                  name: memory-service-secrets
                  key: HINDSIGHT_OWNER_SALT
            - name: MEMORY_TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: memory-config
                  key: AGENT_CONTROL_TEMPORAL_ADDRESS
            - name: MEMORY_TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: memory-config
                  key: AGENT_CONTROL_TEMPORAL_NAMESPACE
            - name: APP_PRODUCT_CALLBACK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: memory-config
                  key: AGENT_CONTROL_PRODUCT_CALLBACK_BASE_URL
            - name: APP_PRODUCT_CALLBACK_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-api-internal-secrets
                  key: APP_API_INTERNAL_SHARED_SECRET
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
