apiVersion: batch/v1
kind: Job
metadata:
  name: memory-config-upgrade
  labels:
    app.kubernetes.io/name: memory-config-upgrade
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-config-upgrade
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: memory
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: upgrade
          image: ghcr.io/muc-wiki/campus-agent/memory-service:replace-me
          command: [/usr/local/bin/memory-config-upgrade]
          env:
            - name: HINDSIGHT_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: memory-config
                  key: HINDSIGHT_API_BASE_URL
            - name: HINDSIGHT_API_TENANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-api-secrets
                  key: HINDSIGHT_API_TENANT_API_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
