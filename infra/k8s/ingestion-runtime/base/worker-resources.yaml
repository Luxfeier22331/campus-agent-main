apiVersion: temporal.io/v1alpha1
kind: WorkerResourceTemplate
metadata:
  name: ingestion-control-worker-pdb
spec:
  workerDeploymentRef:
    name: ingestion-control-worker
  template:
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    spec:
      minAvailable: 1
      selector:
        matchLabels: {}
