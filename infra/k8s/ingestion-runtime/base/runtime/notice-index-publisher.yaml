apiVersion: batch/v1
kind: CronJob
metadata:
  name: notice-chunk-builder
  labels:
    app.kubernetes.io/name: notice-chunk-builder
    app.kubernetes.io/part-of: campus-agent
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: notice-chunk-builder
            app.kubernetes.io/part-of: campus-agent
        spec:
          serviceAccountName: ingestion-runtime
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: chunk-builder
              image: ghcr.io/muc-wiki/campus-agent/notice-index-publisher:replace-me
              imagePullPolicy: IfNotPresent
              args: ["build-chunks"]
              envFrom:
                - configMapRef:
                    name: campus-agent-database-config
              env:
                - name: DEPLOYMENT_ENVIRONMENT
                  value: production
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: campus-agent-postgres-campus-agent-owner
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: campus-agent-postgres-campus-agent-owner
                      key: password
                - name: OBJECT_STORE_ENDPOINT
                  value: http://object-store:9000
                - name: OBJECT_STORE_DERIVED_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: object-store-secrets
                      key: OBJECT_STORE_DERIVED_ACCESS_KEY
                - name: OBJECT_STORE_DERIVED_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: object-store-secrets
                      key: OBJECT_STORE_DERIVED_SECRET_KEY
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: postgres-ca
                  mountPath: /etc/campus-agent/postgres
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: postgres-ca
              secret:
                secretName: campus-agent-postgres-origin-server
                items:
                  - key: ca.crt
                    path: ca.crt
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
---
