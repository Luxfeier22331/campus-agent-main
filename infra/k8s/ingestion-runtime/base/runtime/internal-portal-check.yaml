apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion-control-internal-portal-check
  labels:
    app.kubernetes.io/name: ingestion-control-internal-portal-check
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ingestion-control-internal-portal-check
            app.kubernetes.io/part-of: campus-agent
        spec:
          serviceAccountName: ingestion-runtime
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: ghcr.io/muc-wiki/campus-agent/ingestion-control:replace-me
              imagePullPolicy: IfNotPresent
              command:
                - node
                - /app/apps/ingestion-control/dist/internal-portal-check.js
              env:
                - name: DEPLOYMENT_ENVIRONMENT
                  value: production
                - name: INGESTION_CONTROL_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ingestion-control-secrets
                      key: INGESTION_CONTROL_DATABASE_URL
                - name: INGESTION_CONTROL_DATABASE_CA_CERT_PATH
                  value: /etc/campus-agent/postgres/ca.crt
                - name: INGESTION_CONTROL_DATABASE_SSLMODE
                  value: verify-full
              volumeMounts:
                - name: postgres-ca
                  mountPath: /etc/campus-agent/postgres
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: postgres-ca
              secret:
                secretName: campus-agent-postgres-origin-server
                items:
                  - key: ca.crt
                    path: ca.crt
