apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-control-worker
  labels:
    app.kubernetes.io/name: ingestion-control-worker
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-control-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-control-worker
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: ingestion-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/muc-wiki/campus-agent/ingestion-control-worker:replace-me
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          env:
            - name: INGESTION_TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: ingestion-runtime-rendered-config
                  key: INGESTION_TEMPORAL_ADDRESS
            - name: INGESTION_TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: ingestion-runtime-rendered-config
                  key: INGESTION_TEMPORAL_NAMESPACE
            - name: OBJECT_STORE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ingestion-runtime-rendered-config
                  key: OBJECT_STORE_ENDPOINT
            - name: INGESTION_CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ingestion-control-secrets
                  key: INGESTION_CONTROL_DATABASE_URL
            - name: INGESTION_CONTROL_DATABASE_CA_CERT_PATH
              value: /etc/campus-agent/postgres/ca.crt
            - name: INGESTION_CONTROL_DATABASE_SSLMODE
              value: verify-full
            - name: OBJECT_STORE_SOURCE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_SOURCE_ACCESS_KEY
            - name: OBJECT_STORE_SOURCE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_SOURCE_SECRET_KEY
            - name: OBJECT_STORE_DERIVED_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_DERIVED_ACCESS_KEY
            - name: OBJECT_STORE_DERIVED_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_DERIVED_SECRET_KEY
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
            - name: runtime-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
        - name: runtime-tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-collector-worker
  labels:
    app.kubernetes.io/name: source-collector-worker
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: source-collector-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: source-collector-worker
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: ingestion-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 90
      containers:
        - name: worker
          image: ghcr.io/muc-wiki/campus-agent/source-collector:replace-me
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          env:
            - name: INGESTION_TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: ingestion-runtime-rendered-config
                  key: INGESTION_TEMPORAL_ADDRESS
            - name: INGESTION_TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: ingestion-runtime-rendered-config
                  key: INGESTION_TEMPORAL_NAMESPACE
            - name: OBJECT_STORE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ingestion-runtime-rendered-config
                  key: OBJECT_STORE_ENDPOINT
            - name: OBJECT_STORE_SOURCE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_SOURCE_ACCESS_KEY
            - name: OBJECT_STORE_SOURCE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_SOURCE_SECRET_KEY
            - name: INTERNAL_PORTAL_SSO_TGC_FILE
              value: /var/run/secrets/campus-agent/internal-portal/sso_tgc
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
            - name: internal-portal-auth
              mountPath: /var/run/secrets/campus-agent/internal-portal
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: runtime-tmp
          emptyDir: {}
        - name: internal-portal-auth
          secret:
            defaultMode: 400
            secretName: source-collector-internal-portal-auth
