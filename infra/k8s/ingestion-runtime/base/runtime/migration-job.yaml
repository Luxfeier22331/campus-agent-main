apiVersion: batch/v1
kind: Job
metadata:
  name: ingestion-control-schema
  labels:
    app.kubernetes.io/name: ingestion-control-schema
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "0"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-control-schema
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: ingestion-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: schema-owner
          image: ghcr.io/muc-wiki/campus-agent/ingestion-control:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export INGESTION_CONTROL_SCHEMA_DATABASE_URL="$(node -e '
                const url = new URL(`postgresql://${process.env.PGHOST}:${process.env.PGPORT}/${process.env.PGDATABASE}`);
                url.username = process.env.PGUSER;
                url.password = process.env.PGPASSWORD;
                process.stdout.write(url.toString());
              ')"
              exec node /app/apps/ingestion-control/dist/schema-bootstrap.js
          envFrom:
            - configMapRef:
                name: ingestion-schema-database-config
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
            - name: runtime-tmp
              mountPath: /tmp
      containers:
        - name: migrate
          image: ghcr.io/muc-wiki/campus-agent/ingestion-control:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export INGESTION_CONTROL_SCHEMA_DATABASE_URL="$(node -e '
                const url = new URL(`postgresql://${process.env.PGHOST}:${process.env.PGPORT}/${process.env.PGDATABASE}`);
                url.username = process.env.PGUSER;
                url.password = process.env.PGPASSWORD;
                process.stdout.write(url.toString());
              ')"
              exec node /app/apps/ingestion-control/dist/migrate.js
          envFrom:
            - configMapRef:
                name: ingestion-schema-database-config
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 64Mi
