apiVersion: v1
kind: Service
metadata:
  name: ingestion-control
  labels:
    app.kubernetes.io/name: ingestion-control
    app.kubernetes.io/part-of: campus-agent
spec:
  selector:
    app.kubernetes.io/name: ingestion-control
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-control
  labels:
    app.kubernetes.io/name: ingestion-control
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-control
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: ingestion-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: ingestion-control
          image: ghcr.io/muc-wiki/campus-agent/ingestion-control:replace-me
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          env:
            - name: INGESTION_TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: ingestion-runtime-rendered-config
                  key: INGESTION_TEMPORAL_ADDRESS
            - name: INGESTION_TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: ingestion-runtime-rendered-config
                  key: INGESTION_TEMPORAL_NAMESPACE
            - name: INGESTION_TEMPORAL_WORKFLOW_TASK_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: ingestion-runtime-rendered-config
                  key: INGESTION_TEMPORAL_WORKFLOW_TASK_QUEUE
            - name: INGESTION_TEMPORAL_CONTROL_ACTIVITY_TASK_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: ingestion-runtime-rendered-config
                  key: INGESTION_TEMPORAL_CONTROL_ACTIVITY_TASK_QUEUE
            - name: INGESTION_TEMPORAL_RUST_KERNEL_ACTIVITY_TASK_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: ingestion-runtime-rendered-config
                  key: INGESTION_TEMPORAL_RUST_KERNEL_ACTIVITY_TASK_QUEUE
            - name: INGESTION_TEMPORAL_SOURCE_COLLECTOR_ACTIVITY_TASK_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: ingestion-runtime-rendered-config
                  key: INGESTION_TEMPORAL_SOURCE_COLLECTOR_ACTIVITY_TASK_QUEUE
            - name: INGESTION_CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ingestion-control-secrets
                  key: INGESTION_CONTROL_DATABASE_URL
            - name: INGESTION_CONTROL_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ingestion-control-secrets
                  key: INGESTION_CONTROL_ADMIN_TOKEN
                  optional: true
            - name: OPS_WEB_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-web-internal-secrets
                  key: OPS_WEB_INTERNAL_TOKEN
                  optional: true
            - name: INGESTION_CONTROL_HOST
              value: 0.0.0.0
            - name: INGESTION_CONTROL_PORT
              value: "8000"
            - name: INGESTION_TASK_REGISTRY_ROOT
              value: /app/configs/ingestion
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
            - name: runtime-tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
        - name: runtime-tmp
          emptyDir: {}
