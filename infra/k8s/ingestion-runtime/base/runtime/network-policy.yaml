apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-portal-collection-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: internal-portal-collection
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ops-web
      ports:
        - protocol: TCP
          port: 5178
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: object-store
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: campus-agent-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notice-classifier-egress
spec:
