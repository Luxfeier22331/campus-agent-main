apiVersion: batch/v1
kind: CronJob
metadata:
  name: source-collector-auth-check
  labels:
    app.kubernetes.io/name: source-collector-auth-check
    app.kubernetes.io/part-of: campus-agent
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: source-collector-auth-check
            app.kubernetes.io/part-of: campus-agent
        spec:
          serviceAccountName: ingestion-runtime
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: auth-check
              image: ghcr.io/muc-wiki/campus-agent/source-collector:replace-me
              imagePullPolicy: IfNotPresent
              command:
                - /workspace/apps/source-collector/node_modules/.bin/tsx
                - /workspace/apps/source-collector/adapters/internal-portal/src/auth-check.ts
              env:
                - name: INTERNAL_PORTAL_SSO_TGC_FILE
                  value: /var/run/secrets/campus-agent/internal-portal/sso_tgc
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
              resources:
                requests:
                  cpu: 25m
                  memory: 96Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: runtime-tmp
                  mountPath: /tmp
                - name: internal-portal-auth
                  mountPath: /var/run/secrets/campus-agent/internal-portal
                  readOnly: true
          volumes:
            - name: runtime-tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: internal-portal-auth
              secret:
                defaultMode: 0400
                secretName: source-collector-internal-portal-auth
