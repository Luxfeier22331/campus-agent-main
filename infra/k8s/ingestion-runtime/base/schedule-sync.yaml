apiVersion: batch/v1
kind: Job
metadata:
  name: ingestion-schedule-sync
  labels:
    app.kubernetes.io/name: ingestion-schedule-sync
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-schedule-sync
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: ingestion-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: ghcr.io/muc-wiki/campus-agent/ingestion-control:replace-me
          imagePullPolicy: IfNotPresent
          command:
            - /app/apps/ingestion-control/node_modules/.bin/tsx
            - /app/apps/ingestion-control/src/schedule-sync.ts
          envFrom:
            - configMapRef:
                name: ingestion-runtime-rendered-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
