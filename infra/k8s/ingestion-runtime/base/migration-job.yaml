apiVersion: batch/v1
kind: Job
metadata:
  name: ingestion-control-schema
  labels:
    app.kubernetes.io/name: ingestion-control-schema
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-control-schema
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: ingestion-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: schema-owner
          image: ghcr.io/muc-wiki/campus-agent/ingestion-control:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export INGESTION_CONTROL_SCHEMA_DATABASE_URL="$(node -e '
                const url = new URL(`postgresql://${process.env.PGHOST}:${process.env.PGPORT}/${process.env.PGDATABASE}`);
                url.username = process.env.PGUSER;
                url.password = process.env.PGPASSWORD;
                process.stdout.write(url.toString());
              ')"
              exec /app/apps/ingestion-control/node_modules/.bin/tsx \
                /app/apps/ingestion-control/src/schema-bootstrap.ts
          envFrom:
            - configMapRef:
                name: ingestion-schema-database-config
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
            - name: runtime-tmp
              mountPath: /tmp
      containers:
        - name: migrate
          image: ghcr.io/muc-wiki/campus-agent/ingestion-control:replace-me
          imagePullPolicy: IfNotPresent
          command:
            - /app/apps/ingestion-control/node_modules/.bin/tsx
            - /app/apps/ingestion-control/src/migrate.ts
          env:
            - name: INGESTION_CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ingestion-control-secrets
                  key: INGESTION_CONTROL_DATABASE_URL
            - name: DEPLOYMENT_ENVIRONMENT
              value: production
            - name: INGESTION_CONTROL_DATABASE_CA_CERT_PATH
              value: /etc/campus-agent/postgres/ca.crt
            - name: INGESTION_CONTROL_DATABASE_SSLMODE
              value: verify-full
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 64Mi
