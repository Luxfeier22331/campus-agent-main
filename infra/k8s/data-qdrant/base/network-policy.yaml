apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-qdrant-ingress
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: qdrant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
      app.kubernetes.io/instance: qdrant
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: campus-agent
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
