apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-runtime-platform-egress
  namespace: campus-agent-staging
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 10.42.0.1/32
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 7233
        - protocol: TCP
          port: 8888
