apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: campus-agent-staging
resources:
  - ../../base
  - external-docker-services.yaml
  - host-traefik-ingress.yaml
images:
  - name: ghcr.io/muc-wiki/campus-agent/execution-control
    newTag: staging
  - name: ghcr.io/muc-wiki/campus-agent/agent-runtime
    newTag: staging
patches:
  - path: patch-delete-stateful.yaml
  - path: patch-external-services.yaml
  - path: patch-runtime-resources.yaml
  - path: patch-execution-control-hostport.yaml
  - path: patch-worker-identities.yaml
  - path: patch-network-policy.yaml
