apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-control
  namespace: campus-agent-staging
spec:
  template:
    spec:
      containers:
        - name: execution-control
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY
              value: staging:execution-control:$(POD_NAME)
              valueFrom: null
---
