apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-control-host-traefik-ingress
  namespace: campus-agent-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: execution-control
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 172.20.0.0/16
        - ipBlock:
            cidr: 10.42.0.1/32
      ports:
        - protocol: TCP
          port: 8000
