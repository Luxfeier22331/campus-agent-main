apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-control
  namespace: campus-agent-staging
spec:
  template:
    spec:
      containers:
        - name: execution-control
          env:
            - name: EXECUTION_CONTROL_TEMPORAL_ADDRESS
              value: temporal:7233
            - name: EXECUTION_CONTROL_AGENT_RUNTIME_BASE_URL
              value: http://agent-runtime:27062
            - name: EXECUTION_CONTROL_PROVIDER_CONFIG_SNAPSHOT_PATH
              value: /run/campus-agent/provider-config-projection.json
            - name: PERSONAL_MEMORY_BASE_URL
              value: http://hindsight-api:8888
            - name: QDRANT_URL
              value: https://qdrant:6333
            - name: QDRANT_TLS_CA_CERT_PATH
              value: /etc/campus-agent/qdrant/tls/ca.crt
---
