apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-control
  namespace: campus-agent-staging
spec:
  template:
    spec:
      containers:
        - name: execution-control
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
