apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: execution-control-staging
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: execution-control
    app.kubernetes.io/part-of: campus-agent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik-staging
  rules:
    - host: execution-control-staging.mucwiki-edge.link
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: execution-control
                port:
                  name: http
  tls:
    - hosts:
        - execution-control-staging.mucwiki-edge.link
      secretName: mucwiki-edge-origin-tls
