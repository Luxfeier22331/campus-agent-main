apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-runtime-private-service-path
  namespace: campus-agent-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: execution-control
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared-execution-control
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-execution-control-egress
  namespace: campus-agent-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-execution-control
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: execution-control
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 7844
        - protocol: UDP
          port: 7844
