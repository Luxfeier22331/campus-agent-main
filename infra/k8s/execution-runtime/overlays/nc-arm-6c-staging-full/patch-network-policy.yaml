apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-runtime-ingress-from-traefik
  namespace: campus-agent-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: campus-agent
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
      ports:
        - protocol: TCP
          port: 8000
