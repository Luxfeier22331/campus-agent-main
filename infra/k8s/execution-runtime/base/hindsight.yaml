apiVersion: v1
kind: Service
metadata:
  name: hindsight-postgres
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: hindsight-postgres
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: hindsight-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hindsight-postgres
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: hindsight-postgres
    app.kubernetes.io/part-of: campus-agent
spec:
  serviceName: hindsight-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight-postgres
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: hindsight
            - name: POSTGRES_USER
              value: hindsight
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execution-stateful-runtime-secrets
                  key: HINDSIGHT_POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -q
                - -d
                - hindsight
                - -U
                - hindsight
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: hindsight-postgres-data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: hindsight-postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hindsight-api
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: hindsight-api
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: http
      port: 8888
      targetPort: 8888
  selector:
    app.kubernetes.io/name: hindsight-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight-api
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: hindsight-api
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight-api
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      containers:
        - name: hindsight-api
          image: campus-agent/hindsight-api:0.8.2-openai-default-headers
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          envFrom:
            - configMapRef:
                name: execution-runtime-config
            - configMapRef:
                name: execution-runtime-rendered-config
            - secretRef:
                name: execution-stateful-runtime-secrets
          env:
            - name: HINDSIGHT_API_TENANT_EXTENSION
              value: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
