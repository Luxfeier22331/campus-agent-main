apiVersion: v1
kind: Service
metadata:
  name: execution-control
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: execution-control
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: execution-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-control
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: execution-control
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-control
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      containers:
        - name: execution-control
          image: ghcr.io/muc-wiki/campus-agent/execution-control:staging
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: execution-runtime-config
            - configMapRef:
                name: execution-runtime-rendered-config
            - secretRef:
                name: execution-runtime-secrets
          env:
            - name: CAMPUS_AGENT_HTTP_HOST
              value: 0.0.0.0
            - name: CAMPUS_AGENT_HTTP_PORT
              value: "8000"
            - name: EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: API_AUTH_MODE
              value: trusted-worker
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  curl -fsS \
                    -H "x-worker-origin-auth: ${EXECUTION_CONTROL_SHARED_SECRET}" \
                    http://127.0.0.1:8000/readyz >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
