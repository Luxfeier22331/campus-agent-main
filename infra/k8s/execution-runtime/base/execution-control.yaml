apiVersion: v1
kind: Service
metadata:
  name: execution-control
  labels:
    app.kubernetes.io/name: execution-control
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: execution-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-control
  labels:
    app.kubernetes.io/name: execution-control
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-control
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      securityContext:
        fsGroup: 10001
      containers:
        - name: execution-control
          image: ghcr.io/muc-wiki/campus-agent/execution-control:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: execution-runtime-rendered-config
            - secretRef:
                name: execution-control-secrets
            - secretRef:
                name: execution-control-metrics-secrets
            - secretRef:
                name: execution-temporal-workflow-secrets
            - secretRef:
                name: execution-telemetry-client-secrets
            - secretRef:
                name: execution-run-projection-secrets
            - secretRef:
                name: execution-memory-client-secrets
            - secretRef:
                name: execution-control-internal-query-secrets
            - secretRef:
                name: execution-app-api-internal-secrets
            - secretRef:
                name: execution-rag-secrets
            - secretRef:
                name: execution-tool-read-model-secrets
          env:
            - name: CAMPUS_AGENT_HTTP_HOST
              value: 0.0.0.0
            - name: CAMPUS_AGENT_HTTP_PORT
              value: "8000"
            - name: EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: API_AUTH_MODE
              value: trusted-worker
          volumeMounts:
            - name: provider-config-projection
              mountPath: /run/campus-agent/provider-config
              readOnly: true
            - name: qdrant-tls-ca
              mountPath: /etc/campus-agent/qdrant/tls
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  curl -fsS \
                    -H "x-worker-origin-auth: ${API_WORKER_SHARED_SECRET}" \
                    http://127.0.0.1:8000/readyz >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: provider-config-projection
          secret:
            secretName: execution-runtime-provider-config-projection
            defaultMode: 0440
            items:
              - key: provider-config-projection.json
                path: provider-config-projection.json
        - name: qdrant-tls-ca
          configMap:
            name: execution-runtime-qdrant-tls-ca
