apiVersion: v1
kind: Service
metadata:
  name: execution-control
  labels:
    app.kubernetes.io/name: execution-control
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: execution-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-control
  labels:
    app.kubernetes.io/name: execution-control
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-control
  template:
    metadata:
      labels:
        app.kubernetes.io/component: execution-control
        app.kubernetes.io/name: execution-control
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      securityContext:
        fsGroup: 10001
      containers:
        - name: execution-control
          image: ghcr.io/muc-wiki/campus-agent/execution-control:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: execution-runtime-rendered-config
          env:
            - name: CAMPUS_AGENT_HTTP_HOST
              value: 0.0.0.0
            - name: CAMPUS_AGENT_HTTP_PORT
              value: "8000"
            - name: EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: API_AUTH_MODE
              value: trusted-worker
            - name: OPS_WEB_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-web-internal-secrets
                  key: OPS_WEB_INTERNAL_TOKEN
            - name: EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT
              valueFrom:
                secretKeyRef:
                  name: execution-temporal-workflow-secrets
                  key: EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT
            - name: EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: execution-run-projection-secrets
                  key: EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL
            - name: PERSONAL_MEMORY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: hindsight-api-secrets
                  key: HINDSIGHT_API_TENANT_API_KEY
            - name: PERSONAL_MEMORY_OWNER_SALT
              valueFrom:
                secretKeyRef:
                  name: execution-memory-client-secrets
                  key: PERSONAL_MEMORY_OWNER_SALT
            - name: QDRANT_QUERY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-server-secrets
                  key: QDRANT_READ_ONLY_API_KEY
            - name: CAMPUS_SHARED_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: execution-tool-read-model-secrets
                  key: CAMPUS_SHARED_POSTGRES_URL
            - name: EXECUTION_CONTROL_PROVIDER_CONFIG_READER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: execution-provider-config-runtime-secrets
                  key: EXECUTION_CONTROL_PROVIDER_CONFIG_READER_DATABASE_URL
            - name: APP_API_EXECUTION_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: execution-app-api-internal-secrets
                  key: APP_API_EXECUTION_SHARED_SECRET
          volumeMounts:
            - name: provider-config-keyring
              mountPath: /run/campus-agent/provider-config
              readOnly: true
            - name: qdrant-tls-ca
              mountPath: /etc/campus-agent/qdrant/tls
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  curl -fsS \
                    -H "x-worker-origin-auth: ${APP_API_EXECUTION_SHARED_SECRET}" \
                    http://127.0.0.1:8000/readyz >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: provider-config-keyring
          secret:
            secretName: execution-provider-config-keyring
            defaultMode: 0440
            items:
              - key: keyring.json
                path: keyring.json
        - name: qdrant-tls-ca
          configMap:
            name: execution-runtime-qdrant-tls-ca
