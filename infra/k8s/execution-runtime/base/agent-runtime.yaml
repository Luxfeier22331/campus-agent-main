apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: http
      port: 27062
      targetPort: 27062
  selector:
    app.kubernetes.io/name: agent-runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      containers:
        - name: agent-runtime
          image: ghcr.io/muc-wiki/campus-agent/agent-runtime:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 27062
          envFrom:
            - configMapRef:
                name: execution-runtime-rendered-config
            - secretRef:
                name: agent-runtime-secrets
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4320
            - name: OTEL_SERVICE_NAME
              value: campus-agent-runtime
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
