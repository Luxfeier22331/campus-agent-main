apiVersion: batch/v1
kind: Job
metadata:
  name: execution-run-projection-schema
  labels:
    app.kubernetes.io/name: execution-run-projection-schema
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-run-projection-schema
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: run-projection-schema
          image: ghcr.io/muc-wiki/campus-agent/execution-control:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/run-projection-schema"]
          args:
            - --mode
            - install
            - --database-url
            - $(EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL)
            - --evidence-path
            - /tmp/run-projection-schema.json
          env:
            - name: EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: execution-run-projection-secrets
                  key: EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: evidence
              mountPath: /tmp
      volumes:
        - name: evidence
          emptyDir:
            sizeLimit: 16Mi
