apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-namespace-setup
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: temporal-namespace-setup
    app.kubernetes.io/part-of: campus-agent
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-namespace-setup
        app.kubernetes.io/part-of: campus-agent
    spec:
      restartPolicy: OnFailure
      serviceAccountName: execution-runtime
      containers:
        - name: temporal-namespace-setup
          image: temporalio/admin-tools:1.29.6.1-tctl-1.18.4-cli-1.7.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: TEMPORAL_CLI_ADDRESS
              value: temporal:7233
          command:
            - /bin/sh
            - -ec
            - |
              until temporal operator cluster health --address "$TEMPORAL_ADDRESS" | grep -q SERVING; do
                sleep 5
              done
              temporal operator namespace describe --namespace campus-agent-staging >/dev/null 2>&1 ||
                temporal operator namespace create --namespace campus-agent-staging --retention 30d
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
