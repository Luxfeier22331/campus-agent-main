apiVersion: temporal.io/v1alpha1
kind: WorkerResourceTemplate
metadata:
  name: execution-workflow-scaler
spec:
  workerDeploymentRef:
    name: execution-workflow
  template:
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    spec:
      scaleTargetRef: {}
      pollingInterval: 15
      cooldownPeriod: 180
      minReplicaCount: 1
      maxReplicaCount: 3
      advanced:
        horizontalPodAutoscalerConfig:
          behavior:
            scaleDown:
              stabilizationWindowSeconds: 300
      triggers:
        - type: temporal
          metadata:
            endpoint: temporal.default.svc.cluster.local:7233
            namespace: default
            taskQueue: campus-agent.workflow
            queueTypes: workflow
            targetQueueSize: "8"
            activationTargetQueueSize: "0"
            workerDeploymentNameFromEnv: TEMPORAL_DEPLOYMENT_NAME
            workerDeploymentBuildIdFromEnv: TEMPORAL_WORKER_BUILD_ID
---
