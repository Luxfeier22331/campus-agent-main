apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-runtime-default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-runtime-namespace-traffic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: campus-agent
    matchExpressions:
      - key: campus-agent.muc.wiki/network-policy-profile
        operator: DoesNotExist
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: campus-agent
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: campus-agent
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-runtime-general-observability-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: campus-agent
    matchExpressions:
      - key: campus-agent.muc.wiki/network-policy-profile
        operator: DoesNotExist
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-runtime-orchestration-observability-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: execution-control
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4319
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-runtime-agent-observability-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4320
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-runtime-platform-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: campus-agent
    matchExpressions:
      - key: campus-agent.muc.wiki/network-policy-profile
        operator: DoesNotExist
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 7233
        - protocol: TCP
          port: 8888
