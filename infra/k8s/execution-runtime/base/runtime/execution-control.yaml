apiVersion: v1
kind: Service
metadata:
  name: execution-control
  labels:
    app.kubernetes.io/name: execution-control
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: execution-control
---
apiVersion: v1
kind: Service
metadata:
  name: execution-control-admin
  labels:
    app.kubernetes.io/name: execution-control
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: http
      port: 8000
      targetPort: admin
  selector:
    app.kubernetes.io/name: execution-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-control
  labels:
    app.kubernetes.io/name: execution-control
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-control
  template:
    metadata:
      labels:
        app.kubernetes.io/component: execution-control
        app.kubernetes.io/name: execution-control
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      terminationGracePeriodSeconds: 160
      securityContext:
        fsGroup: 10001
      containers:
        - name: execution-control
          image: ghcr.io/muc-wiki/campus-agent/execution-control:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: admin
              containerPort: 8001
          env:
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: DEPLOYMENT_ENVIRONMENT
            - name: DEPLOYMENT_RELEASE
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: DEPLOYMENT_RELEASE
            - name: EXECUTION_CONTROL_TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_TEMPORAL_ADDRESS
            - name: EXECUTION_CONTROL_TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_TEMPORAL_NAMESPACE
            - name: EXECUTION_CONTROL_AGENT_RUNTIME_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_AGENT_RUNTIME_BASE_URL
            - name: EXECUTION_CONTROL_PRODUCT_CALLBACK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_PRODUCT_CALLBACK_BASE_URL
            - name: HINDSIGHT_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: HINDSIGHT_API_BASE_URL
            - name: LANGFUSE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: LANGFUSE_BASE_URL
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: LANGFUSE_PUBLIC_KEY
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: QDRANT_URL
            - name: QDRANT_TLS_CA_CERT_PATH
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: QDRANT_TLS_CA_CERT_PATH
            - name: EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: execution-control
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4319
            - name: OPS_WEB_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-web-internal-secrets
                  key: OPS_WEB_INTERNAL_TOKEN
            - name: EXECUTION_CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: execution-tool-read-model-secrets
                  key: EXECUTION_CONTROL_DATABASE_URL
            - name: EXECUTION_AGENT_RUNTIME_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: execution-agent-runtime-secrets
                  key: EXECUTION_AGENT_RUNTIME_SHARED_SECRET
            - name: HINDSIGHT_API_TENANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-api-secrets
                  key: HINDSIGHT_API_TENANT_API_KEY
            - name: HINDSIGHT_OWNER_SALT
              valueFrom:
                secretKeyRef:
                  name: execution-memory-client-secrets
                  key: HINDSIGHT_OWNER_SALT
            - name: QDRANT_READ_ONLY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-server-secrets
                  key: QDRANT_READ_ONLY_API_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_SECRET_KEY
            - name: APP_API_EXECUTION_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: execution-app-api-internal-secrets
                  key: APP_API_EXECUTION_SHARED_SECRET
          volumeMounts:
            - name: provider-config-keyring
              mountPath: /run/campus-agent/provider-config
              readOnly: true
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
            - name: qdrant-tls-ca
              mountPath: /etc/campus-agent/qdrant/tls
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  curl -fsS \
                    -H "x-worker-origin-auth: ${APP_API_EXECUTION_SHARED_SECRET}" \
                    http://127.0.0.1:8000/readyz >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: provider-config-keyring
          secret:
            secretName: execution-provider-config-keyring
            defaultMode: 0440
            items:
              - key: keyring.json
                path: keyring.json
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
        - name: qdrant-tls-ca
          configMap:
            name: execution-runtime-qdrant-tls-ca
