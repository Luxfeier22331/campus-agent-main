apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-runtime-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - agent-runtime
          - app-api-schema
          - campus-services-schema
          - execution-agent
          - execution-control
          - execution-control-admin
          - execution-core
          - execution-run-projection-schema
          - execution-workflow
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - agent-runtime
                  - cloudflared-execution-control
                  - execution-agent
                  - execution-control
                  - execution-control-admin
                  - execution-core
                  - execution-workflow
                  - ops-web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-runtime-platform-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - agent-runtime
          - app-api-schema
          - campus-services-schema
          - execution-agent
          - execution-control
          - execution-control-admin
          - execution-core
          - execution-run-projection-schema
          - execution-workflow
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - agent-runtime
                  - execution-control
                  - execution-control-admin
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 27062
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: temporal
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hindsight
              app.kubernetes.io/instance: hindsight
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8888
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
      ports:
        - protocol: TCP
          port: 6333
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: campus-agent-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-runtime-general-observability-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - execution-agent
          - execution-control-admin
          - execution-core
          - execution-workflow
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4318
---
