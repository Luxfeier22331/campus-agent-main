apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: http
      port: 27062
      targetPort: 27062
  selector:
    app.kubernetes.io/name: agent-runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      terminationGracePeriodSeconds: 390
      containers:
        - name: agent-runtime
          image: ghcr.io/muc-wiki/campus-agent/agent-runtime:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
            - name: http
              containerPort: 27062
          env:
            - name: METRICS_PORT
              value: "9090"
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: DEPLOYMENT_ENVIRONMENT
            - name: DEPLOYMENT_RELEASE
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: DEPLOYMENT_RELEASE
            - name: AGENT_RUNTIME_EXECUTION_CONTROL_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: AGENT_RUNTIME_EXECUTION_CONTROL_BASE_URL
            - name: EXECUTION_AGENT_RUNTIME_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: execution-agent-runtime-secrets
                  key: EXECUTION_AGENT_RUNTIME_SHARED_SECRET
            - name: MODEL_CONFIG_URL
              value: http://model-config:8000
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "10"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
