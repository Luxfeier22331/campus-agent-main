apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-pipeline-worker
  labels:
    app.kubernetes.io/name: notice-pipeline-worker
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notice-pipeline-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notice-pipeline-worker
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/muc-wiki/campus-agent/notice-pipeline-worker:replace-me
          imagePullPolicy: IfNotPresent
          args:
            - dist/worker.js
          env:
            - name: OBJECT_STORE_ENDPOINT
              value: http://object-store:9000
            - name: OBJECT_STORE_BUCKET_SOURCE
              value: campus-agent-source
            - name: HOME
              value: /tmp
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: AGENT_CONTROL_TEMPORAL_ADDRESS
            - name: TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: AGENT_CONTROL_TEMPORAL_NAMESPACE
            - name: MODEL_CONFIG_URL
              value: http://model-config:8000
            - name: OPS_WEB_INTERNAL_URL
              value: http://ops-web:5178
            - name: OPS_WEB_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-web-internal-secrets
                  key: OPS_WEB_INTERNAL_TOKEN
            - name: OBJECT_STORE_SOURCE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_SOURCE_ACCESS_KEY
            - name: OBJECT_STORE_SOURCE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_SOURCE_SECRET_KEY
            - name: DEPLOYMENT_ENVIRONMENT
              value: production
            - name: OBJECT_STORE_BUCKET_DERIVED
              value: campus-agent-derived
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: password
            - name: OBJECT_STORE_DERIVED_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_DERIVED_ACCESS_KEY
            - name: OBJECT_STORE_DERIVED_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-secrets
                  key: OBJECT_STORE_DERIVED_SECRET_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: campus-agent-database-config
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      initContainers:
        - name: schedule-init
          image: ghcr.io/muc-wiki/campus-agent/notice-pipeline-worker:replace-me
          imagePullPolicy: IfNotPresent
          args:
            - dist/schedule-cli.js
          env:
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: AGENT_CONTROL_TEMPORAL_ADDRESS
            - name: TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: AGENT_CONTROL_TEMPORAL_NAMESPACE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
