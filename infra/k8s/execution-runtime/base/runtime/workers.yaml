apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: execution-workflow
  labels:
    app.kubernetes.io/name: execution-workflow
    app.kubernetes.io/part-of: campus-agent
spec:
  workerOptions:
    connectionRef:
      name: campus-agent-temporal
    temporalNamespace: default
  rollout:
    strategy: AllAtOnce
  sunset:
    scaledownDelay: 1h
    deleteDelay: 24h
  template:
    metadata:
      labels:
        app.kubernetes.io/component: execution-control
        app.kubernetes.io/name: execution-workflow
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/muc-wiki/campus-agent/execution-control:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/workflow-worker"]
          env:
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: DEPLOYMENT_ENVIRONMENT
            - name: DEPLOYMENT_RELEASE
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: DEPLOYMENT_RELEASE
            - name: EXECUTION_CONTROL_TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_TEMPORAL_ADDRESS
            - name: EXECUTION_CONTROL_TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_TEMPORAL_NAMESPACE
            - name: EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: execution-workflow-worker
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: execution-core
  labels:
    app.kubernetes.io/name: execution-core
    app.kubernetes.io/part-of: campus-agent
spec:
  workerOptions:
    connectionRef:
      name: campus-agent-temporal
    temporalNamespace: default
  rollout:
    strategy: AllAtOnce
  sunset:
    scaledownDelay: 1h
    deleteDelay: 24h
  template:
    metadata:
      labels:
        app.kubernetes.io/component: execution-control
        app.kubernetes.io/name: execution-core
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      securityContext:
        fsGroup: 10001
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/muc-wiki/campus-agent/execution-control:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/activity-worker-core"]
          env:
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: DEPLOYMENT_ENVIRONMENT
            - name: DEPLOYMENT_RELEASE
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: DEPLOYMENT_RELEASE
            - name: EXECUTION_CONTROL_TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_TEMPORAL_ADDRESS
            - name: EXECUTION_CONTROL_TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_TEMPORAL_NAMESPACE
            - name: EXECUTION_CONTROL_PRODUCT_CALLBACK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_PRODUCT_CALLBACK_BASE_URL
            - name: PERSONAL_MEMORY_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: PERSONAL_MEMORY_BASE_URL
            - name: LANGFUSE_MAINTENANCE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: LANGFUSE_MAINTENANCE_BASE_URL
            - name: LANGFUSE_MAINTENANCE_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: LANGFUSE_MAINTENANCE_PUBLIC_KEY
            - name: EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: execution-core-activity-worker
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: APP_API_EXECUTION_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: execution-app-api-internal-secrets
                  key: APP_API_EXECUTION_SHARED_SECRET
            - name: EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: execution-run-projection-secrets
                  key: EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL
            - name: PERSONAL_MEMORY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: hindsight-api-secrets
                  key: HINDSIGHT_API_TENANT_API_KEY
            - name: PERSONAL_MEMORY_OWNER_SALT
              valueFrom:
                secretKeyRef:
                  name: execution-memory-client-secrets
                  key: PERSONAL_MEMORY_OWNER_SALT
            - name: LANGFUSE_MAINTENANCE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_SECRET_KEY
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: execution-agent
  labels:
    app.kubernetes.io/name: execution-agent
    app.kubernetes.io/part-of: campus-agent
spec:
  workerOptions:
    connectionRef:
      name: campus-agent-temporal
    temporalNamespace: default
  rollout:
    strategy: AllAtOnce
  sunset:
    scaledownDelay: 1h
    deleteDelay: 24h
  template:
    metadata:
      labels:
        app.kubernetes.io/component: execution-control
        app.kubernetes.io/name: execution-agent
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      securityContext:
        fsGroup: 10001
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/muc-wiki/campus-agent/execution-control:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/activity-worker-agent"]
          env:
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: DEPLOYMENT_ENVIRONMENT
            - name: DEPLOYMENT_RELEASE
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: DEPLOYMENT_RELEASE
            - name: EXECUTION_CONTROL_TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_TEMPORAL_ADDRESS
            - name: EXECUTION_CONTROL_TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_TEMPORAL_NAMESPACE
            - name: EXECUTION_CONTROL_AGENT_RUNTIME_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_AGENT_RUNTIME_BASE_URL
            - name: EXECUTION_CONTROL_PROVIDER_CONFIG_KEYRING_PATH
              valueFrom:
                configMapKeyRef:
                  name: execution-runtime-rendered-config
                  key: EXECUTION_CONTROL_PROVIDER_CONFIG_KEYRING_PATH
            - name: EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: execution-agent-activity-worker
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: execution-run-projection-secrets
                  key: EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL
            - name: EXECUTION_AGENT_RUNTIME_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: execution-agent-runtime-secrets
                  key: EXECUTION_AGENT_RUNTIME_SHARED_SECRET
            - name: EXECUTION_CONTROL_PROVIDER_CONFIG_READER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: execution-provider-config-runtime-secrets
                  key: EXECUTION_CONTROL_PROVIDER_CONFIG_READER_DATABASE_URL
          volumeMounts:
            - name: provider-config-keyring
              mountPath: /run/campus-agent/provider-config
              readOnly: true
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: provider-config-keyring
          secret:
            secretName: execution-provider-config-keyring
            defaultMode: 0440
            items:
              - key: keyring.json
                path: keyring.json
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
