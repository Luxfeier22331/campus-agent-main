apiVersion: batch/v1
kind: Job
metadata:
  name: execution-run-projection-schema
  labels:
    app.kubernetes.io/name: execution-run-projection-schema
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-run-projection-schema
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: run-projection-schema
          image: ghcr.io/muc-wiki/campus-agent/execution-control:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/run-projection-schema"]
          args:
            - --mode
            - install
            - --evidence-path
            - /tmp/run-projection-schema.json
            - --provider-config-encryption-key-path
            - /run/campus-agent/provider-config/encryption.key
          envFrom:
            - configMapRef:
                name: execution-schema-database-config
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: evidence
              mountPath: /tmp
            - name: provider-config-encryption
              mountPath: /run/campus-agent/provider-config
              readOnly: true
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
      volumes:
        - name: evidence
          emptyDir:
            sizeLimit: 16Mi
        - name: provider-config-encryption
          secret:
            secretName: execution-provider-config-encryption
            defaultMode: 0440
            items:
              - key: encryption.key
                path: encryption.key
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
