apiVersion: batch/v1
kind: CronJob
metadata:
  name: campus-docs-chunk-builder
  labels:
    app.kubernetes.io/name: campus-docs-chunk-builder
    app.kubernetes.io/part-of: campus-agent
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: campus-docs-chunk-builder
            app.kubernetes.io/part-of: campus-agent
        spec:
          serviceAccountName: execution-runtime
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: chunk-builder
              image: ghcr.io/muc-wiki/campus-agent/campus-docs-index-publisher:replace-me
              imagePullPolicy: IfNotPresent
              args: ["build-chunks"]
              env:
                - name: OBJECT_STORE_ENDPOINT
                  value: http://object-store:9000
                - name: OBJECT_STORE_DERIVED_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: object-store-secrets
                      key: OBJECT_STORE_DERIVED_ACCESS_KEY
                - name: OBJECT_STORE_DERIVED_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: object-store-secrets
                      key: OBJECT_STORE_DERIVED_SECRET_KEY
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
---
