apiVersion: batch/v1
kind: CronJob
metadata:
  name: campus-docs-index-publisher
  labels:
    app.kubernetes.io/name: campus-docs-index-publisher
    app.kubernetes.io/part-of: campus-agent
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: campus-docs-index-publisher
            app.kubernetes.io/part-of: campus-agent
        spec:
          serviceAccountName: execution-runtime
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: index-publisher
              image: ghcr.io/muc-wiki/campus-agent/campus-docs-index-publisher:replace-me
              imagePullPolicy: IfNotPresent
              args: ["publish-index"]
              env:
                - name: EXECUTION_CONTROL_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: execution-tool-read-model-secrets
                      key: EXECUTION_CONTROL_DATABASE_URL
                - name: QDRANT_URL
                  valueFrom:
                    configMapKeyRef:
                      name: execution-runtime-rendered-config
                      key: QDRANT_URL
                - name: QDRANT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: qdrant-server-secrets
                      key: QDRANT_API_KEY
                - name: OBJECT_STORE_ENDPOINT
                  value: http://object-store:9000
                - name: OBJECT_STORE_DERIVED_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: object-store-secrets
                      key: OBJECT_STORE_DERIVED_ACCESS_KEY
                - name: OBJECT_STORE_DERIVED_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: object-store-secrets
                      key: OBJECT_STORE_DERIVED_SECRET_KEY
                - name: NODE_EXTRA_CA_CERTS
                  valueFrom:
                    configMapKeyRef:
                      name: execution-runtime-rendered-config
                      key: QDRANT_TLS_CA_CERT_PATH
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              volumeMounts:
                - name: postgres-ca
                  mountPath: /etc/campus-agent/postgres
                  readOnly: true
                - name: qdrant-tls-ca
                  mountPath: /etc/campus-agent/qdrant/tls
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: postgres-ca
              secret:
                secretName: campus-agent-postgres-origin-server
                items:
                  - key: ca.crt
                    path: ca.crt
            - name: qdrant-tls-ca
              configMap:
                name: execution-runtime-qdrant-tls-ca
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
