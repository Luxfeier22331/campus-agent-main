apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-execution-control
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: cloudflared-execution-control
    app.kubernetes.io/component: private-service-connector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-execution-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-execution-control
        app.kubernetes.io/component: private-service-connector
    spec:
      serviceAccountName: execution-runtime
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.0
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /var/run/cloudflared/token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tunnel-token
              mountPath: /var/run/cloudflared
              readOnly: true
      volumes:
        - name: tunnel-token
          secret:
            secretName: cloudflared-execution-control-tunnel-token
            defaultMode: 0444
            items:
              - key: token
                path: token
