apiVersion: v1
kind: Service
metadata:
  name: temporal-postgres
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: temporal-postgres
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: temporal-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-postgres
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: temporal-postgres
    app.kubernetes.io/part-of: campus-agent
spec:
  serviceName: temporal-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-postgres
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: temporal
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execution-runtime-secrets
                  key: TEMPORAL_POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: temporal-postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: temporal-postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
  selector:
    app.kubernetes.io/name: temporal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.29.6.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 7233
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: temporal-postgres
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: execution-runtime-secrets
                  key: TEMPORAL_POSTGRES_PASSWORD
            - name: VISIBILITY_STORE
              value: visibility
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - temporal operator cluster health --address temporal:7233 | grep -q SERVING
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - temporal operator cluster health --address temporal:7233 | grep -q SERVING
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: temporal-ui
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: temporal-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: temporal-ui
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ui
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.43.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: TEMPORAL_CORS_ORIGINS
              value: http://localhost:8233
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
