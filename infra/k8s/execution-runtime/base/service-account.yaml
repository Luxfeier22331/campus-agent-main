apiVersion: v1
kind: ServiceAccount
metadata:
  name: execution-runtime
  labels:
    app.kubernetes.io/part-of: campus-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-hpa-posture-reader
  labels:
    app.kubernetes.io/part-of: campus-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keda-hpa-posture-reader
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keda-hpa-posture-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keda-hpa-posture-reader
subjects:
  - kind: ServiceAccount
    name: keda-hpa-posture-reader
    namespace: default
