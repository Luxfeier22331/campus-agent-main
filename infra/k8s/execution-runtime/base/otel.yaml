apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: campus-agent
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: health
      port: 13133
      targetPort: 13133
  selector:
    app.kubernetes.io/name: otel-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: campus-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.127.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          envFrom:
            - configMapRef:
                name: execution-runtime-config
            - configMapRef:
                name: execution-runtime-rendered-config
            - secretRef:
                name: execution-telemetry-collector-secrets
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: otel-config
          configMap:
            name: execution-runtime-config
            items:
              - key: otel-collector.yaml
                path: config.yaml
