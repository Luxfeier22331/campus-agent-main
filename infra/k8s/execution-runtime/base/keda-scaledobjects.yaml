apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: temporal-worker-scaler-auth
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: temporal-worker-scaler-auth
    app.kubernetes.io/part-of: campus-agent
spec: {}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: workflow-worker
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: workflow-worker
    app.kubernetes.io/part-of: campus-agent
spec:
  scaleTargetRef:
    name: workflow-worker
  pollingInterval: 15
  cooldownPeriod: 180
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: temporal
      metadata:
        endpoint: temporal:7233
        namespace: campus-agent-staging
        taskQueue: campus-agent.workflow
        queueTypes: workflow
        targetQueueSize: "8"
        activationTargetQueueSize: "0"
      authenticationRef:
        name: temporal-worker-scaler-auth
---
