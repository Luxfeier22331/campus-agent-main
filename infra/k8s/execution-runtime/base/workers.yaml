apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: execution-workflow
  labels:
    app.kubernetes.io/name: execution-workflow
    app.kubernetes.io/part-of: campus-agent
spec:
  workerOptions:
    connectionRef:
      name: campus-agent-temporal
    temporalNamespace: default
  rollout:
    strategy: AllAtOnce
  sunset:
    scaledownDelay: 1h
    deleteDelay: 24h
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-workflow
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/muc-wiki/campus-agent/execution-control:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/workflow-worker"]
          envFrom:
            - configMapRef:
                name: execution-runtime-rendered-config
            - secretRef:
                name: execution-temporal-workflow-secrets
            - secretRef:
                name: execution-telemetry-client-secrets
          env:
            - name: EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: execution-core
  labels:
    app.kubernetes.io/name: execution-core
    app.kubernetes.io/part-of: campus-agent
spec:
  workerOptions:
    connectionRef:
      name: campus-agent-temporal
    temporalNamespace: default
  rollout:
    strategy: AllAtOnce
  sunset:
    scaledownDelay: 1h
    deleteDelay: 24h
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-core
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      securityContext:
        fsGroup: 10001
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/muc-wiki/campus-agent/execution-control:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/activity-worker-core"]
          envFrom:
            - configMapRef:
                name: execution-runtime-rendered-config
            - secretRef:
                name: execution-temporal-workflow-secrets
            - secretRef:
                name: execution-telemetry-client-secrets
            - secretRef:
                name: execution-run-projection-secrets
            - secretRef:
                name: execution-memory-client-secrets
            - secretRef:
                name: execution-control-internal-query-secrets
            - secretRef:
                name: execution-tool-read-model-secrets
          env:
            - name: EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: provider-config-projection
              mountPath: /run/campus-agent/provider-config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: provider-config-projection
          secret:
            secretName: execution-runtime-provider-config-projection
            defaultMode: 0440
            items:
              - key: provider-config-projection.json
                path: provider-config-projection.json
---
