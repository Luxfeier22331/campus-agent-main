apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
  namespace: campus-agent-staging
  labels:
    app.kubernetes.io/name: workflow-worker
    app.kubernetes.io/part-of: campus-agent
    campus-agent.muc.wiki/temporal-task-queue: workflow
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow-worker
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: execution-runtime
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/muc-wiki/campus-agent/execution-control:staging
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/workflow-worker"]
          envFrom:
            - configMapRef:
                name: execution-runtime-config
            - secretRef:
                name: execution-runtime-secrets
          env:
            - name: EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            exec:
              command: ["/usr/local/bin/workflow-worker", "--check-runtime"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["/usr/local/bin/workflow-worker", "--check-runtime"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
