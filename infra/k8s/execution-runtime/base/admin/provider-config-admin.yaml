apiVersion: v1
kind: Service
metadata:
  name: execution-control-admin
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app.kubernetes.io/name: execution-control-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-control-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-control-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-control-admin
        app.kubernetes.io/part-of: execution-provider-config-admin
    spec:
      serviceAccountName: execution-runtime
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: admin
          image: ghcr.io/muc-wiki/campus-agent/execution-control:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/provider-config-admin"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: execution-runtime-rendered-config
          env:
            - name: CAMPUS_AGENT_HTTP_HOST
              value: 0.0.0.0
            - name: CAMPUS_AGENT_HTTP_PORT
              value: "8000"
            - name: OTEL_SERVICE_NAME
              value: execution-provider-config-admin
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: EXECUTION_CONTROL_PROVIDER_CONFIG_ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: execution-provider-config-admin-secrets
                  key: EXECUTION_CONTROL_PROVIDER_CONFIG_ADMIN_DATABASE_URL
            - name: OPS_WEB_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-web-internal-secrets
                  key: OPS_WEB_INTERNAL_TOKEN
          volumeMounts:
            - name: provider-config-keyring
              mountPath: /run/campus-agent/provider-config
              readOnly: true
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: provider-config-keyring
          secret:
            secretName: execution-provider-config-keyring
            defaultMode: 0440
            items:
              - key: keyring.json
                path: keyring.json
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-provider-config-admin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: execution-control-admin
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ops-web
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: campus-agent-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
