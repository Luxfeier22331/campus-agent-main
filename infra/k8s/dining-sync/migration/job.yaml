apiVersion: batch/v1
kind: Job
metadata:
  name: dining-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: dining-sync
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: dining-migrate
          image: ghcr.io/muc-wiki/campus-agent/dining-sync:replace-me
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: DINING_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dining-migration-secrets
                  key: DINING_MIGRATION_DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
