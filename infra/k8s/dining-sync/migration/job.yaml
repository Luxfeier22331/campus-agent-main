apiVersion: batch/v1
kind: Job
metadata:
  name: dining-migrate
  labels:
    app.kubernetes.io/name: dining-sync
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dining-sync
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: dining-sync
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dining-migrate
          image: ghcr.io/muc-wiki/campus-agent/dining-sync:replace-me
          imagePullPolicy: IfNotPresent
          args: ["db-install"]
          envFrom:
            - configMapRef:
                name: dining-postgres-config
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
