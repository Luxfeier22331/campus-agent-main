apiVersion: batch/v1
kind: CronJob
metadata:
  name: dining-sync
  labels:
    app.kubernetes.io/name: dining-sync
    app.kubernetes.io/component: source-sync
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 * * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dining-sync
            app.kubernetes.io/component: source-sync
            app.kubernetes.io/part-of: campus-agent
        spec:
          serviceAccountName: dining-sync
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dining-sync
              image: ghcr.io/muc-wiki/campus-agent/dining-sync:replace-me
              imagePullPolicy: IfNotPresent
              args: ["sync-all"]
              envFrom:
                - configMapRef:
                    name: dining-sync-config
                - configMapRef:
                    name: dining-postgres-config
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: dining-sync-secrets
                      key: PGUSER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dining-sync-secrets
                      key: PGPASSWORD
                - name: DINING_LARK_APP_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: dining-sync-secrets
                      key: DINING_LARK_APP_SECRET
                - name: DINING_MODERATION_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: dining-sync-secrets
                      key: DINING_MODERATION_API_KEY
                - name: OBJECT_STORE_DERIVED_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: object-store-secrets
                      key: OBJECT_STORE_DERIVED_ACCESS_KEY
                - name: OBJECT_STORE_DERIVED_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: object-store-secrets
                      key: OBJECT_STORE_DERIVED_SECRET_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: postgres-ca
                  mountPath: /etc/campus-agent/postgres
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: postgres-ca
              secret:
                secretName: campus-agent-postgres-origin-server
                items:
                  - key: ca.crt
                    path: ca.crt
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
