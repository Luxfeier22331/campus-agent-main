apiVersion: batch/v1
kind: CronJob
metadata:
  name: dining-catalog-sync
  labels:
    app.kubernetes.io/name: dining-sync
    app.kubernetes.io/component: source-sync
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 * * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dining-sync
            app.kubernetes.io/component: source-sync
            app.kubernetes.io/instance: catalog
            app.kubernetes.io/part-of: campus-agent
        spec:
          serviceAccountName: dining-sync
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: catalog-sync
              image: ghcr.io/muc-wiki/campus-agent/dining-sync:replace-me
              imagePullPolicy: IfNotPresent
              args: ["catalog-sync"]
              envFrom:
                - configMapRef:
                    name: dining-postgres-config
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: dining-sync-secrets
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dining-sync-secrets
                      key: password
                - name: DINING_LARK_APP_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: dining-sync-secrets
                      key: DINING_LARK_APP_SECRET
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: postgres-ca
                  mountPath: /etc/campus-agent/postgres
                  readOnly: true
                - name: source-config
                  mountPath: /etc/campus-agent/dining
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: postgres-ca
              secret:
                secretName: campus-agent-postgres-origin-server
                items:
                  - key: ca.crt
                    path: ca.crt
            - name: source-config
              configMap:
                name: dining-sync-config
                items:
                  - key: source.json
                    path: source.json
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
---
