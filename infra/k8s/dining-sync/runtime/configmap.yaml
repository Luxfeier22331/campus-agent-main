    app.kubernetes.io/name: dining-sync
    app.kubernetes.io/component: source-sync
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
data:
  source.json: |
    {
      "version": 1,
      "provider": "lark",
      "appId": "replace-me",
      "baseToken": "replace-me",
      "catalog": {
        "campusTableId": "replace-me",
        "dishTableId": "replace-me",
        "hallTableId": "replace-me",
        "stallTableId": "replace-me"
      },
      "review": {
        "tableId": "replace-me",
        "viewId": "replace-me"
      }
    }
  OBJECT_STORE_ENDPOINT: http://object-store:9000
  OBJECT_STORE_PUBLIC_ENDPOINT: https://assets.example.invalid
