apiVersion: batch/v1
kind: CronJob
metadata:
  name: dining-sync
spec:
  schedule: "0 * * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: dining-sync
          restartPolicy: Never
          containers:
            - name: dining-sync
              image: ghcr.io/muc-wiki/campus-agent/dining-sync:replace-me
              imagePullPolicy: IfNotPresent
              command:
                - pnpm
                - --dir
                - jobs/dining-sync
                - exec
                - tsx
                - src/cli.ts
                - sync-all
              envFrom:
                - configMapRef:
                    name: dining-sync-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: dining-sync-secrets
                      key: DATABASE_URL
                - name: DINING_LARK_APP_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: dining-sync-secrets
                      key: DINING_LARK_APP_SECRET
                - name: DINING_MODERATION_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: dining-sync-secrets
                      key: DINING_MODERATION_API_KEY
                - name: OBJECT_STORE_DERIVED_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: object-store-secrets
                      key: OBJECT_STORE_DERIVED_ACCESS_KEY
                - name: OBJECT_STORE_DERIVED_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: object-store-secrets
                      key: OBJECT_STORE_DERIVED_SECRET_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
