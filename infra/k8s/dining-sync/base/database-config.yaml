apiVersion: v1
kind: ConfigMap
metadata:
  name: dining-postgres-config
  labels:
    app.kubernetes.io/name: dining-sync
    app.kubernetes.io/component: database-client
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
data:
  PGHOST: postgres.example.invalid
  PGPORT: "5432"
  PGDATABASE: campus_agent
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /etc/campus-agent/postgres/ca.crt
