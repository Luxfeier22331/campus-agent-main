apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/muc-wiki/campus-agent/dining-sync
    # Release shells should override this to a commit SHA tag with:
    # kubectl kustomize infra/k8s/dining-sync/overlays/staging \
    #   --enable-helm is not required; use kustomize edit set image in a temp copy.
    newTag: staging
patches:
  - path: patch-staging-env.yaml
