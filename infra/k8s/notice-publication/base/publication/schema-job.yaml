apiVersion: batch/v1
kind: Job
metadata:
  name: notices-schema
  labels:
    app.kubernetes.io/name: notices-schema
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notices-schema
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: notice-publication
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/muc-wiki/campus-agent/notice-publisher:replace-me
          args: ["migrate"]
          env:
            - name: NOTICES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notice-publisher-secrets
                  key: NOTICES_DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
