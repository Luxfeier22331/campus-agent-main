apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-postgres-instance-ingress
  labels:
    app.kubernetes.io/name: campus-agent-postgres
    app.kubernetes.io/part-of: campus-agent
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: campus-agent-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: campus-agent
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: temporal
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hindsight
              app.kubernetes.io/instance: hindsight
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
