apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memory-hindsight-ingress
  labels:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/part-of: hindsight
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      app.kubernetes.io/instance: hindsight
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: campus-agent
      ports:
        - protocol: TCP
          port: 8888
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memory-hindsight-egress
  labels:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/part-of: hindsight
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      app.kubernetes.io/instance: hindsight
      app.kubernetes.io/component: api
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: campus-agent-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
