apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-temporal-egress
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: temporal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: temporal
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: campus-agent-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: temporal
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-temporal-ingress
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: temporal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: temporal
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: temporal
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: campus-agent
      ports:
        - protocol: TCP
          port: 7233
