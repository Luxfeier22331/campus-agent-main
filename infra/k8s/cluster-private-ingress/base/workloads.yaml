apiVersion: v1
kind: Service
metadata:
  name: cluster-private-ingress
spec:
  selector:
    app.kubernetes.io/name: cluster-private-ingress
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-private-ingress
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-private-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-private-ingress
        app.kubernetes.io/part-of: campus-agent
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cluster-private-ingress
          image: ghcr.io/muc-wiki/campus-agent/cluster-private-ingress:replace-me
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AGENT_CONTROL_BASE_URL
              value: http://agent-control:8000
            - name: MEMORY_SERVICE_BASE_URL
              value: http://memory-service:8000
            - name: EDGE_INGRESS_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: cluster-private-ingress-secrets
                  key: EDGE_INGRESS_SHARED_SECRET
            - name: AGENT_CONTROL_INGRESS_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-control-ingress-secrets
                  key: AGENT_CONTROL_INGRESS_SHARED_SECRET
            - name: MEMORY_INTERNAL_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: memory-service-secrets
                  key: MEMORY_INTERNAL_SHARED_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
      serviceAccountName: cluster-private-ingress
