apiVersion: batch/v1
kind: Job
metadata:
  name: model-config-schema
  labels:
    app.kubernetes.io/name: model-config-schema
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "0"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-config-schema
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: model-config
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema
          image: ghcr.io/muc-wiki/campus-agent/model-config:replace-me
          command: ["/usr/local/bin/model-config-schema"]
          args:
            - --encryption-key-path
            - /run/campus-agent/model-config/encryption.key
            - --legacy-encryption-key-path
            - /run/campus-agent/model-config-legacy/encryption.key
          envFrom:
            - configMapRef:
                name: model-config-schema-database-config
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-agent-postgres-campus-agent-owner
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: model-config-encryption
              mountPath: /run/campus-agent/model-config
              readOnly: true
            - name: model-config-legacy-encryption
              mountPath: /run/campus-agent/model-config-legacy
              readOnly: true
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
      volumes:
        - name: model-config-encryption
          secret:
            secretName: model-config-encryption
            defaultMode: 0440
        - name: model-config-legacy-encryption
          secret:
            secretName: execution-provider-config-encryption
            defaultMode: 0440
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
