apiVersion: v1
kind: Service
metadata:
  name: model-config
  labels:
    app.kubernetes.io/name: model-config
    app.kubernetes.io/part-of: campus-agent
spec:
  selector:
    app.kubernetes.io/name: model-config
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-config
  labels:
    app.kubernetes.io/name: model-config
    app.kubernetes.io/part-of: campus-agent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-config
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-config
        app.kubernetes.io/part-of: campus-agent
    spec:
      serviceAccountName: model-config
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-config
          image: ghcr.io/muc-wiki/campus-agent/model-config:replace-me
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_CONFIG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: model-config-database-secrets
                  key: MODEL_CONFIG_DATABASE_URL
            - name: MODEL_CONFIG_ENCRYPTION_KEY_FILE
              value: /run/campus-agent/model-config/encryption.key
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: model-config-encryption
              mountPath: /run/campus-agent/model-config
              readOnly: true
            - name: postgres-ca
              mountPath: /etc/campus-agent/postgres
              readOnly: true
      volumes:
        - name: model-config-encryption
          secret:
            secretName: model-config-encryption
            defaultMode: 0440
        - name: postgres-ca
          secret:
            secretName: campus-agent-postgres-origin-server
