x-host-gateway: &host-gateway
  - host.docker.internal:host-gateway

services:
  temporal-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
    networks:
      - execution-runtime

  temporal:
    image: temporalio/auto-setup:1.29.6.1
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD}
      VISIBILITY_STORE: visibility
      TEMPORAL_ADDRESS: temporal:7233
    healthcheck:
      test:
        - CMD-SHELL
        - temporal operator cluster health --address temporal:7233 | grep -q SERVING
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
    networks:
      - execution-runtime

  temporal-namespace-setup:
    image: temporalio/admin-tools:1.29.6.1-tctl-1.18.4-cli-1.7.0
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        for namespace in campus-agent-staging campus-agent-production; do
          temporal operator namespace describe --namespace "$${namespace}" >/dev/null 2>&1 ||
            temporal operator namespace create --namespace "$${namespace}" --retention 30d
        done
    networks:
      - execution-runtime

  temporal-ui:
    profiles: ["ui"]
    image: temporalio/ui:2.43.3
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_UI_CORS_ORIGINS:-http://localhost:8233}
    ports:
      - "${TEMPORAL_UI_HOST_PORT:-127.0.0.1:8233}:8080"
    networks:
      - execution-runtime

  hindsight-postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    shm_size: "128mb"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: hindsight
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${HINDSIGHT_POSTGRES_PASSWORD:?set HINDSIGHT_POSTGRES_PASSWORD}
    volumes:
      - hindsight-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -q
        - -d
        - hindsight
        - -U
        - hindsight
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s
    networks:
      - execution-runtime

  hindsight-api:
    image: ${HINDSIGHT_API_IMAGE:-ghcr.io/vectorize-io/hindsight-api:0.8.4-slim}
    command:
      - opentelemetry-instrument
      - hindsight-api
    restart: unless-stopped
    extra_hosts: *host-gateway
    depends_on:
      hindsight-postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_POSTGRES_PASSWORD:?set HINDSIGHT_POSTGRES_PASSWORD}@hindsight-postgres:5432/hindsight
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY:?set HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL:-}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL:-text-embedding-3-small}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: ${HINDSIGHT_API_EMBEDDINGS_PROVIDER:-openai}
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:?set HINDSIGHT_API_LLM_API_KEY}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:-}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-gpt-4o-mini}
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openai}
      HINDSIGHT_API_PORT: 8888
      HINDSIGHT_API_RERANKER_PROVIDER: ${HINDSIGHT_API_RERANKER_PROVIDER:-rrf}
      HINDSIGHT_API_RETAIN_EXTRACTION_MODE: ${HINDSIGHT_API_RETAIN_EXTRACTION_MODE:-chunks}
      HINDSIGHT_API_ENABLE_OBSERVATIONS: ${HINDSIGHT_API_ENABLE_OBSERVATIONS:-true}
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: ${HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION:-true}
      HINDSIGHT_API_ENABLE_OBSERVATION_HISTORY: ${HINDSIGHT_API_ENABLE_OBSERVATION_HISTORY:-true}
      HINDSIGHT_API_OBSERVATION_HISTORY_MAX_ENTRIES: ${HINDSIGHT_API_OBSERVATION_HISTORY_MAX_ENTRIES:-50}
      HINDSIGHT_API_CONSOLIDATION_RECONCILE_INTERVAL_SECONDS: ${HINDSIGHT_API_CONSOLIDATION_RECONCILE_INTERVAL_SECONDS:-300}
      HINDSIGHT_API_TENANT_API_KEY: ${PERSONAL_MEMORY_API_SECRET:?set PERSONAL_MEMORY_API_SECRET}
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_OTEL_TRACES_ENABLED: ${HINDSIGHT_API_OTEL_TRACES_ENABLED:-false}
      HINDSIGHT_API_OTEL_EXPORTER_OTLP_ENDPOINT: ${HINDSIGHT_API_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4321}
      HINDSIGHT_API_OTEL_SERVICE_NAME: ${HINDSIGHT_API_OTEL_SERVICE_NAME:-hindsight-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${HINDSIGHT_API_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4321}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: ${OTEL_PYTHON_FASTAPI_EXCLUDED_URLS:-health,readyz,metrics}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=campus-agent,service.version=hindsight@0.8.4,deployment.environment.name=local}
      OTEL_SDK_DISABLED: ${HINDSIGHT_OTEL_SDK_DISABLED:-true}
      OTEL_SERVICE_NAME: ${HINDSIGHT_API_OTEL_SERVICE_NAME:-hindsight-api}
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health')"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
    networks:
      - execution-runtime

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT: ${OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT:-0.0.0.0:4318}
      OTEL_COLLECTOR_HEALTH_CHECK_ENDPOINT: ${OTEL_COLLECTOR_HEALTH_CHECK_ENDPOINT:-0.0.0.0:13133}
      OTEL_COLLECTOR_MEMORY_LIMIT_MIB: ${OTEL_COLLECTOR_MEMORY_LIMIT_MIB:-512}
      OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB: ${OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB:-128}
      OTEL_COLLECTOR_TRACE_SAMPLING_PERCENTAGE: ${OTEL_COLLECTOR_TRACE_SAMPLING_PERCENTAGE:-100}
      OTEL_COLLECTOR_LOG_SAMPLING_PERCENTAGE: ${OTEL_COLLECTOR_LOG_SAMPLING_PERCENTAGE:-100}
    volumes:
      - ../otel/collector-local-debug.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_OTLP_HTTP_HOST_PORT:-127.0.0.1:4318}:4318"
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - validate
        - --config=/etc/otelcol-contrib/config.yaml
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - execution-runtime

  execution-control:
    init: true
    restart: unless-stopped
    extra_hosts: *host-gateway
    build:
      context: ../..
      dockerfile: apps/execution-control/Dockerfile
      args:
        GOPROXY: "${EXECUTION_CONTROL_DOCKER_GOPROXY:-https://goproxy.cn,direct}"
        GOSUMDB: "${EXECUTION_CONTROL_DOCKER_GOSUMDB:-sum.golang.org}"
    depends_on:
      agent-runtime:
        condition: service_healthy
      temporal:
        condition: service_healthy
      temporal-namespace-setup:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      CAMPUS_AGENT_HTTP_HOST: 0.0.0.0
      CAMPUS_AGENT_HTTP_PORT: 8000
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      DEPLOYMENT_RELEASE: ${DEPLOYMENT_RELEASE:-local}
      OPS_WEB_INTERNAL_TOKEN: ${OPS_WEB_INTERNAL_TOKEN:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_QUERY_API_KEY: ${QDRANT_QUERY_API_KEY:-}
      QDRANT_TLS_CA_CERT_PATH: ${QDRANT_TLS_CA_CERT_PATH:-}
      APP_API_EXECUTION_SHARED_SECRET: ${APP_API_EXECUTION_SHARED_SECRET:?set APP_API_EXECUTION_SHARED_SECRET}
      EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL: ${EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL:?set EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL}
      EXECUTION_CONTROL_AGENT_RUNTIME_BASE_URL: ${EXECUTION_CONTROL_AGENT_RUNTIME_BASE_URL:-http://agent-runtime:27062}
      EXECUTION_CONTROL_TEMPORAL_ADDRESS: ${EXECUTION_CONTROL_TEMPORAL_ADDRESS:?set EXECUTION_CONTROL_TEMPORAL_ADDRESS}
      EXECUTION_CONTROL_TEMPORAL_NAMESPACE: ${EXECUTION_CONTROL_TEMPORAL_NAMESPACE:?set EXECUTION_CONTROL_TEMPORAL_NAMESPACE}
      EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY: ${EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY:?set EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY}
      EXECUTION_AGENT_RUNTIME_SHARED_SECRET: ${EXECUTION_AGENT_RUNTIME_SHARED_SECRET:?set EXECUTION_AGENT_RUNTIME_SHARED_SECRET}
      EXECUTION_CONTROL_TOOL_READ_MODEL_TRUSTED_TIME_RFC3339: ${EXECUTION_CONTROL_TOOL_READ_MODEL_TRUSTED_TIME_RFC3339:-}
      CAMPUS_SHARED_POSTGRES_URL: ${CAMPUS_SHARED_POSTGRES_URL:-}
      PERSONAL_MEMORY_BASE_URL: ${PERSONAL_MEMORY_BASE_URL:-http://hindsight-api:8888}
      PERSONAL_MEMORY_API_SECRET: ${PERSONAL_MEMORY_API_SECRET:-}
      PERSONAL_MEMORY_OWNER_SALT: ${PERSONAL_MEMORY_OWNER_SALT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: execution-control
    volumes:
      - ${QDRANT_TLS_DIR:-./infra/local/qdrant-tls}:${QDRANT_TLS_DIR:-/etc/campus-agent/qdrant/tls}:ro
    ports:
      - "${EXECUTION_CONTROL_HOST_PORT:-27051}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/healthz >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - execution-runtime
      - data-plane

  agent-runtime:
    init: true
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/agent-runtime/Dockerfile
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      EXECUTION_AGENT_RUNTIME_SHARED_SECRET: ${EXECUTION_AGENT_RUNTIME_SHARED_SECRET:?set EXECUTION_AGENT_RUNTIME_SHARED_SECRET}
      AGENT_RUNTIME_EXECUTION_CONTROL_BASE_URL: ${AGENT_RUNTIME_EXECUTION_CONTROL_BASE_URL:-http://execution-control:8000}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      DEPLOYMENT_RELEASE: ${DEPLOYMENT_RELEASE:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: agent-runtime
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:27062/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - execution-runtime

  workflow-worker:
    init: true
    restart: unless-stopped
    extra_hosts: *host-gateway
    build:
      context: ../..
      dockerfile: apps/execution-control/Dockerfile
      args:
        GOPROXY: "${EXECUTION_CONTROL_DOCKER_GOPROXY:-https://goproxy.cn,direct}"
        GOSUMDB: "${EXECUTION_CONTROL_DOCKER_GOSUMDB:-sum.golang.org}"
    entrypoint:
      - /usr/local/bin/workflow-worker
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      DEPLOYMENT_RELEASE: ${DEPLOYMENT_RELEASE:-local}
      EXECUTION_CONTROL_TEMPORAL_ADDRESS: ${EXECUTION_CONTROL_TEMPORAL_ADDRESS:?set EXECUTION_CONTROL_TEMPORAL_ADDRESS}
      EXECUTION_CONTROL_TEMPORAL_NAMESPACE: ${EXECUTION_CONTROL_TEMPORAL_NAMESPACE:?set EXECUTION_CONTROL_TEMPORAL_NAMESPACE}
      EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY: ${EXECUTION_CONTROL_TEMPORAL_WORKFLOW_WORKER_IDENTITY:?set EXECUTION_CONTROL_TEMPORAL_WORKFLOW_WORKER_IDENTITY}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: execution-workflow-worker
    networks:
      - execution-runtime
      - data-plane


  activity-worker-core:
    init: true
    restart: unless-stopped
    extra_hosts: *host-gateway
    build:
      context: ../..
      dockerfile: apps/execution-control/Dockerfile
      args:
        GOPROXY: "${EXECUTION_CONTROL_DOCKER_GOPROXY:-https://goproxy.cn,direct}"
        GOSUMDB: "${EXECUTION_CONTROL_DOCKER_GOSUMDB:-sum.golang.org}"
    entrypoint:
      - /usr/local/bin/activity-worker-core
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      DEPLOYMENT_RELEASE: ${DEPLOYMENT_RELEASE:-local}
      EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL: ${EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL:?set EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL}
      EXECUTION_CONTROL_TEMPORAL_ADDRESS: ${EXECUTION_CONTROL_TEMPORAL_ADDRESS:?set EXECUTION_CONTROL_TEMPORAL_ADDRESS}
      EXECUTION_CONTROL_TEMPORAL_NAMESPACE: ${EXECUTION_CONTROL_TEMPORAL_NAMESPACE:?set EXECUTION_CONTROL_TEMPORAL_NAMESPACE}
      EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY: ${EXECUTION_CONTROL_TEMPORAL_CORE_WORKER_IDENTITY:?set EXECUTION_CONTROL_TEMPORAL_CORE_WORKER_IDENTITY}
      EXECUTION_CONTROL_PRODUCT_CALLBACK_BASE_URL: ${EXECUTION_CONTROL_PRODUCT_CALLBACK_BASE_URL:?set EXECUTION_CONTROL_PRODUCT_CALLBACK_BASE_URL}
      APP_API_EXECUTION_SHARED_SECRET: ${APP_API_EXECUTION_SHARED_SECRET:?set APP_API_EXECUTION_SHARED_SECRET}
      PERSONAL_MEMORY_BASE_URL: ${PERSONAL_MEMORY_BASE_URL:-http://hindsight-api:8888}
      PERSONAL_MEMORY_API_SECRET: ${PERSONAL_MEMORY_API_SECRET:-}
      PERSONAL_MEMORY_OWNER_SALT: ${PERSONAL_MEMORY_OWNER_SALT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: execution-core-activity-worker
    networks:
      - execution-runtime
      - data-plane

  activity-worker-agent:
    init: true
    restart: unless-stopped
    extra_hosts: *host-gateway
    build:
      context: ../..
      dockerfile: apps/execution-control/Dockerfile
      args:
        GOPROXY: "${EXECUTION_CONTROL_DOCKER_GOPROXY:-https://goproxy.cn,direct}"
        GOSUMDB: "${EXECUTION_CONTROL_DOCKER_GOSUMDB:-sum.golang.org}"
    entrypoint:
      - /usr/local/bin/activity-worker-agent
    depends_on:
      agent-runtime:
        condition: service_healthy
      temporal-namespace-setup:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      DEPLOYMENT_RELEASE: ${DEPLOYMENT_RELEASE:-local}
      EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL: ${EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL:?set EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL}
      EXECUTION_CONTROL_AGENT_RUNTIME_BASE_URL: ${EXECUTION_CONTROL_AGENT_RUNTIME_BASE_URL:-http://agent-runtime:27062}
      EXECUTION_AGENT_RUNTIME_SHARED_SECRET: ${EXECUTION_AGENT_RUNTIME_SHARED_SECRET:?set EXECUTION_AGENT_RUNTIME_SHARED_SECRET}
      EXECUTION_CONTROL_TEMPORAL_ADDRESS: ${EXECUTION_CONTROL_TEMPORAL_ADDRESS:?set EXECUTION_CONTROL_TEMPORAL_ADDRESS}
      EXECUTION_CONTROL_TEMPORAL_NAMESPACE: ${EXECUTION_CONTROL_TEMPORAL_NAMESPACE:?set EXECUTION_CONTROL_TEMPORAL_NAMESPACE}
      EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY: ${EXECUTION_CONTROL_TEMPORAL_AGENT_WORKER_IDENTITY:?set EXECUTION_CONTROL_TEMPORAL_AGENT_WORKER_IDENTITY}
      EXECUTION_CONTROL_PROVIDER_CONFIG_READER_DATABASE_URL: ${EXECUTION_CONTROL_PROVIDER_CONFIG_READER_DATABASE_URL:?set EXECUTION_CONTROL_PROVIDER_CONFIG_READER_DATABASE_URL}
      EXECUTION_CONTROL_PROVIDER_CONFIG_KEYRING_PATH: ${EXECUTION_CONTROL_PROVIDER_CONFIG_KEYRING_PATH:?set EXECUTION_CONTROL_PROVIDER_CONFIG_KEYRING_PATH}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: execution-agent-activity-worker
    networks:
      - execution-runtime
      - data-plane

networks:
  execution-runtime:
    name: ${EXECUTION_CONTROL_RUNTIME_INTERNAL_NETWORK:-campus-execution-control-runtime}
  data-plane:
    external: true
    name: ${CAMPUS_AGENT_DATA_PLANE_NETWORK:-campus-agent-data-plane}

volumes:
  temporal-postgres-data:
  hindsight-postgres-data:
