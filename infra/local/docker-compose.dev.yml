name: campus-agent-local

services:
  postgres:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      data-plane:
        aliases:
          - campus-agent-postgres
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  object-store:
    image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
      RUSTFS_SECRET_KEY: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      data-plane:
        aliases:
          - object-store
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped
    volumes:
      - object-store-data:/data

networks:
  data-plane:
    external: true
    name: campus-agent-data-plane

volumes:
  object-store-data:
    external: true
    name: local_object-store-data
  postgres-data:
    external: true
    name: local_postgres-data
