log:
  level: info
  format: json
http:
  host: 0.0.0.0
  port: 8000
  max_request_size: 5242880
postgres:
  user: postgres
  password: '{{ Env "ZEP_CE_POSTGRES_PASSWORD" }}'
  host: zep-ce-postgres
  port: 5432
  database: postgres
  schema_name: public
  read_timeout: 30
  write_timeout: 30
  max_open_connections: 10
carbon:
  locale: en
graphiti:
  service_url: http://zep-ce-graphiti:8003
api_secret: '{{ Env "PERSONAL_MEMORY_API_SECRET" }}'
telemetry:
  disabled: true
  organization_name:
