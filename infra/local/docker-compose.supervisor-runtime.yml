services:
  supervisor-orchestrator:
    build:
      context: ../..
      dockerfile: apps/supervisor-api/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SUPERVISOR_PY_BRIDGE_HOST: 0.0.0.0
      SUPERVISOR_PY_BRIDGE_PORT: 18081
      SUPERVISOR_PY_BRIDGE_SHARED_SECRET: ${SUPERVISOR_PY_BRIDGE_SHARED_SECRET:?set SUPERVISOR_PY_BRIDGE_SHARED_SECRET}
      AGENT_RUNTIME_PROVIDER: ${AGENT_RUNTIME_PROVIDER:-mock-runtime}
      PROMPT_RUNTIME_PROVIDER: ${PROMPT_RUNTIME_PROVIDER:-}
      PROMPT_RUNTIME_TRANSPORT: ${PROMPT_RUNTIME_TRANSPORT:-responses}
      PROMPT_RUNTIME_MODEL: ${PROMPT_RUNTIME_MODEL:-}
      SUPERVISOR_PROMPT_MODEL: ${SUPERVISOR_PROMPT_MODEL:-}
      SPECIALIST_PROMPT_MODEL: ${SPECIALIST_PROMPT_MODEL:-}
      PROMPT_RUNTIME_API_KEY: ${PROMPT_RUNTIME_API_KEY:-}
      PROMPT_RUNTIME_BASE_URL: ${PROMPT_RUNTIME_BASE_URL:-}
      PROMPT_RUNTIME_REASONING_EFFORT: ${PROMPT_RUNTIME_REASONING_EFFORT:-}
      PROMPT_RUNTIME_MAX_OUTPUT_TOKENS: ${PROMPT_RUNTIME_MAX_OUTPUT_TOKENS:-}
      PROMPT_RUNTIME_CONNECT_TIMEOUT_SECONDS: ${PROMPT_RUNTIME_CONNECT_TIMEOUT_SECONDS:-}
      PROMPT_RUNTIME_READ_TIMEOUT_SECONDS: ${PROMPT_RUNTIME_READ_TIMEOUT_SECONDS:-}
      PROMPT_RUNTIME_WRITE_TIMEOUT_SECONDS: ${PROMPT_RUNTIME_WRITE_TIMEOUT_SECONDS:-}
      PROMPT_RUNTIME_POOL_TIMEOUT_SECONDS: ${PROMPT_RUNTIME_POOL_TIMEOUT_SECONDS:-}
      PROMPT_RUNTIME_MAX_CONNECTIONS: ${PROMPT_RUNTIME_MAX_CONNECTIONS:-}
      PROMPT_RUNTIME_MAX_KEEPALIVE_CONNECTIONS: ${PROMPT_RUNTIME_MAX_KEEPALIVE_CONNECTIONS:-}
      PROMPT_RUNTIME_KEEPALIVE_EXPIRY_SECONDS: ${PROMPT_RUNTIME_KEEPALIVE_EXPIRY_SECONDS:-}
      PROMPT_STRICT_STRUCTURED_OUTPUTS: ${PROMPT_STRICT_STRUCTURED_OUTPUTS:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-/tmp/campus-supervisor-audit.jsonl}
      AUDIT_QUEUE_CAPACITY: ${AUDIT_QUEUE_CAPACITY:-1024}
      SUPERVISOR_PY_BRIDGE_WORKER_THREADS: ${SUPERVISOR_PY_BRIDGE_WORKER_THREADS:-8}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-}
      DOCUMENT_REGISTRY_DATABASE_URL: ${DOCUMENT_REGISTRY_DATABASE_URL:-}
      CAMPUS_SHARED_POSTGRES_URL: ${CAMPUS_SHARED_POSTGRES_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      SPARSE_PROVIDER: ${SPARSE_PROVIDER:-}
      SPARSE_MODEL: ${SPARSE_MODEL:-}
      SPARSE_TOKENIZER: ${SPARSE_TOKENIZER:-}
      SPARSE_LANGUAGE: ${SPARSE_LANGUAGE:-}

  supervisor-shell:
    build:
      context: ../..
      dockerfile: apps/go-shell/Dockerfile
    depends_on:
      - supervisor-orchestrator
    environment:
      CAMPUS_AGENT_HTTP_HOST: 0.0.0.0
      CAMPUS_AGENT_HTTP_PORT: 8000
      API_AUTH_MODE: ${API_AUTH_MODE:-trusted-worker}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      API_WORKER_SHARED_SECRET: ${API_WORKER_SHARED_SECRET:-}
      API_DEFAULT_ACTOR_ID: ${API_DEFAULT_ACTOR_ID:-}
      API_DEFAULT_ACTOR_ROLES: ${API_DEFAULT_ACTOR_ROLES:-}
      SUPERVISOR_API_MAX_CONCURRENT_ANSWERS: ${SUPERVISOR_API_MAX_CONCURRENT_ANSWERS:-8}
      SUPERVISOR_API_QUEUE_CAPACITY: ${SUPERVISOR_API_QUEUE_CAPACITY:-24}
      SUPERVISOR_API_QUEUE_TIMEOUT_MS: ${SUPERVISOR_API_QUEUE_TIMEOUT_MS:-3000}
      SUPERVISOR_API_LANE_RAG_MAX_CONCURRENT: ${SUPERVISOR_API_LANE_RAG_MAX_CONCURRENT:-6}
      SUPERVISOR_API_LANE_RAG_QUEUE_CAPACITY: ${SUPERVISOR_API_LANE_RAG_QUEUE_CAPACITY:-12}
      SUPERVISOR_API_LANE_RAG_QUEUE_TIMEOUT_MS: ${SUPERVISOR_API_LANE_RAG_QUEUE_TIMEOUT_MS:-3000}
      SUPERVISOR_API_LANE_NAVIGATION_MAX_CONCURRENT: ${SUPERVISOR_API_LANE_NAVIGATION_MAX_CONCURRENT:-2}
      SUPERVISOR_API_LANE_NAVIGATION_QUEUE_CAPACITY: ${SUPERVISOR_API_LANE_NAVIGATION_QUEUE_CAPACITY:-4}
      SUPERVISOR_API_LANE_NAVIGATION_QUEUE_TIMEOUT_MS: ${SUPERVISOR_API_LANE_NAVIGATION_QUEUE_TIMEOUT_MS:-1500}
      SUPERVISOR_API_LANE_CAMPUS_SERVICES_MAX_CONCURRENT: ${SUPERVISOR_API_LANE_CAMPUS_SERVICES_MAX_CONCURRENT:-2}
      SUPERVISOR_API_LANE_CAMPUS_SERVICES_QUEUE_CAPACITY: ${SUPERVISOR_API_LANE_CAMPUS_SERVICES_QUEUE_CAPACITY:-4}
      SUPERVISOR_API_LANE_CAMPUS_SERVICES_QUEUE_TIMEOUT_MS: ${SUPERVISOR_API_LANE_CAMPUS_SERVICES_QUEUE_TIMEOUT_MS:-1500}
      SUPERVISOR_API_LANE_NOTICE_MAX_CONCURRENT: ${SUPERVISOR_API_LANE_NOTICE_MAX_CONCURRENT:-2}
      SUPERVISOR_API_LANE_NOTICE_QUEUE_CAPACITY: ${SUPERVISOR_API_LANE_NOTICE_QUEUE_CAPACITY:-4}
      SUPERVISOR_API_LANE_NOTICE_QUEUE_TIMEOUT_MS: ${SUPERVISOR_API_LANE_NOTICE_QUEUE_TIMEOUT_MS:-1500}
      SUPERVISOR_API_LANE_DEFAULT_MAX_CONCURRENT: ${SUPERVISOR_API_LANE_DEFAULT_MAX_CONCURRENT:-1}
      SUPERVISOR_API_LANE_DEFAULT_QUEUE_CAPACITY: ${SUPERVISOR_API_LANE_DEFAULT_QUEUE_CAPACITY:-2}
      SUPERVISOR_API_LANE_DEFAULT_QUEUE_TIMEOUT_MS: ${SUPERVISOR_API_LANE_DEFAULT_QUEUE_TIMEOUT_MS:-1500}
      SUPERVISOR_API_REQUEST_TIMEOUT_MS: ${SUPERVISOR_API_REQUEST_TIMEOUT_MS:-45000}
      SUPERVISOR_API_REQUEST_BODY_LIMIT_BYTES: ${SUPERVISOR_API_REQUEST_BODY_LIMIT_BYTES:-1048576}
      SUPERVISOR_PY_BRIDGE_TIMEOUT_MS: ${SUPERVISOR_PY_BRIDGE_TIMEOUT_MS:-35000}
      SUPERVISOR_API_SHUTDOWN_GRACE_MS: ${SUPERVISOR_API_SHUTDOWN_GRACE_MS:-45000}
      SUPERVISOR_API_METRICS_BEARER_TOKEN: ${SUPERVISOR_API_METRICS_BEARER_TOKEN:-}
      SUPERVISOR_API_OTEL_ENABLED: ${SUPERVISOR_API_OTEL_ENABLED:-false}
      SUPERVISOR_API_OTEL_EXPORTER_OTLP_ENDPOINT: ${SUPERVISOR_API_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SUPERVISOR_API_OTEL_EXPORTER_OTLP_HEADERS: ${SUPERVISOR_API_OTEL_EXPORTER_OTLP_HEADERS:-}
      SUPERVISOR_API_OTEL_SERVICE_NAME: ${SUPERVISOR_API_OTEL_SERVICE_NAME:-campus-go-shell}
      SUPERVISOR_API_OTEL_EXPORT_TIMEOUT_MS: ${SUPERVISOR_API_OTEL_EXPORT_TIMEOUT_MS:-1000}
      SUPERVISOR_API_EXECUTION_AUDIT_ENABLED: ${SUPERVISOR_API_EXECUTION_AUDIT_ENABLED:-false}
      SUPERVISOR_API_EXECUTION_AUDIT_URL: ${SUPERVISOR_API_EXECUTION_AUDIT_URL:-}
      SUPERVISOR_API_EXECUTION_AUDIT_SHARED_SECRET: ${SUPERVISOR_API_EXECUTION_AUDIT_SHARED_SECRET:-}
      SUPERVISOR_API_EXECUTION_AUDIT_TIMEOUT_MS: ${SUPERVISOR_API_EXECUTION_AUDIT_TIMEOUT_MS:-500}
      SUPERVISOR_API_EXECUTION_AUDIT_QUEUE_CAPACITY: ${SUPERVISOR_API_EXECUTION_AUDIT_QUEUE_CAPACITY:-128}
      SUPERVISOR_PY_BRIDGE_BASE_URL: http://supervisor-orchestrator:18081
      SUPERVISOR_PY_BRIDGE_SHARED_SECRET: ${SUPERVISOR_PY_BRIDGE_SHARED_SECRET:?set SUPERVISOR_PY_BRIDGE_SHARED_SECRET}
    ports:
      - "${SUPERVISOR_SHELL_HOST_PORT:-18080}:8000"
