services:
  otel-collector:
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-staging}
      OTEL_COLLECTOR_LANGFUSE_OTLP_ENDPOINT: ${OTEL_COLLECTOR_LANGFUSE_OTLP_ENDPOINT:-}
      OTEL_COLLECTOR_LANGFUSE_AUTH_HEADER: ${OTEL_COLLECTOR_LANGFUSE_AUTH_HEADER:-}
      OTEL_COLLECTOR_LANGFUSE_INGESTION_VERSION: ${OTEL_COLLECTOR_LANGFUSE_INGESTION_VERSION:-}
    volumes:
      - ${EXECUTION_CONTROL_STAGING_OTEL_COLLECTOR_CONFIG_FILE:-../otel/collector-local-debug.yaml}:/etc/otelcol-contrib/config.yaml:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${EXECUTION_CONTROL_PROXY_NETWORK:-proxy}
      traefik.http.routers.otel-collector-staging.rule: Host(`otel-collector-staging.mucwiki-edge.link`)
      traefik.http.routers.otel-collector-staging.entrypoints: websecure
      traefik.http.routers.otel-collector-staging.tls: "true"
      traefik.http.services.otel-collector-staging.loadbalancer.server.port: "4318"
    networks:
      - supervisor-runtime
      - proxy

  execution-control:
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-staging}
      QDRANT_TLS_CA_CERT_PATH: ${QDRANT_TLS_CA_CERT_PATH:?set QDRANT_TLS_CA_CERT_PATH}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${EXECUTION_CONTROL_PROXY_NETWORK:-proxy}
      traefik.http.routers.execution-control-staging.rule: Host(`execution-control-staging.mucwiki-edge.link`)
      traefik.http.routers.execution-control-staging.entrypoints: websecure
      traefik.http.routers.execution-control-staging.tls: "true"
      traefik.http.services.execution-control-staging.loadbalancer.server.port: "8000"
    networks:
      - supervisor-runtime
      - data-plane
      - proxy

  langfuse-web:
    environment:
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-https://langfuse-staging.mucwiki-edge.link}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${EXECUTION_CONTROL_PROXY_NETWORK:-proxy}
      traefik.http.routers.langfuse-staging.rule: Host(`langfuse-staging.mucwiki-edge.link`)
      traefik.http.routers.langfuse-staging.entrypoints: websecure
      traefik.http.routers.langfuse-staging.tls: "true"
      traefik.http.services.langfuse-staging.loadbalancer.server.port: "3000"
    networks:
      - supervisor-runtime
      - proxy

  activity-worker-knowledge-retrieval:
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-staging}
      QDRANT_TLS_CA_CERT_PATH: ${QDRANT_TLS_CA_CERT_PATH:?set QDRANT_TLS_CA_CERT_PATH}

networks:
  proxy:
    external: true
    name: ${EXECUTION_CONTROL_PROXY_NETWORK:-proxy}
