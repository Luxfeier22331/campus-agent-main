services:
  otel-collector:
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-staging}
      OTEL_COLLECTOR_LANGFUSE_OTLP_ENDPOINT: ${OTEL_COLLECTOR_LANGFUSE_OTLP_ENDPOINT:?set OTEL_COLLECTOR_LANGFUSE_OTLP_ENDPOINT}
      OTEL_COLLECTOR_LANGFUSE_AUTH_HEADER: ${OTEL_COLLECTOR_LANGFUSE_AUTH_HEADER:?set OTEL_COLLECTOR_LANGFUSE_AUTH_HEADER}
      OTEL_COLLECTOR_LANGFUSE_INGESTION_VERSION: ${OTEL_COLLECTOR_LANGFUSE_INGESTION_VERSION:?set OTEL_COLLECTOR_LANGFUSE_INGESTION_VERSION}
    volumes:
      - ../otel/collector-staging-template.yaml:/etc/otelcol-contrib/config.yaml:ro

  otel-ingest-gateway:
    environment:
      OTEL_INGEST_SHARED_SECRET: ${OTEL_INGEST_SHARED_SECRET:?set OTEL_INGEST_SHARED_SECRET}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${EXECUTION_CONTROL_PROXY_NETWORK:-proxy}
      traefik.http.routers.otel-ingest-gateway-staging.rule: Host(`otel-ingest-staging.mucwiki-edge.link`)
      traefik.http.routers.otel-ingest-gateway-staging.entrypoints: websecure
      traefik.http.routers.otel-ingest-gateway-staging.tls: "true"
      traefik.http.services.otel-ingest-gateway-staging.loadbalancer.server.port: "8000"
    networks:
      - supervisor-runtime
      - proxy

  execution-control:
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-staging}
      QDRANT_TLS_CA_CERT_PATH: ${QDRANT_TLS_CA_CERT_PATH:?set QDRANT_TLS_CA_CERT_PATH}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${EXECUTION_CONTROL_PROXY_NETWORK:-proxy}
      traefik.http.routers.execution-control-staging.rule: Host(`execution-control-staging.mucwiki-edge.link`)
      traefik.http.routers.execution-control-staging.entrypoints: websecure
      traefik.http.routers.execution-control-staging.tls: "true"
      traefik.http.services.execution-control-staging.loadbalancer.server.port: "8000"
    networks:
      - supervisor-runtime
      - data-plane
      - proxy

  activity-worker-knowledge-retrieval:
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-staging}
      QDRANT_TLS_CA_CERT_PATH: ${QDRANT_TLS_CA_CERT_PATH:?set QDRANT_TLS_CA_CERT_PATH}

networks:
  proxy:
    external: true
    name: ${EXECUTION_CONTROL_PROXY_NETWORK:-proxy}
