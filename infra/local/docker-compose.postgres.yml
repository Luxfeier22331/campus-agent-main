name: campus-agent-local-postgres

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-campus_agent}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_POSTGRES_USER:-postgres} -d ${LOCAL_POSTGRES_DB:-campus_agent}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      data-plane:
        aliases:
          - campus-agent-postgres

networks:
  data-plane:
    external: true
    name: ${CAMPUS_AGENT_DATA_PLANE_NETWORK:-campus-agent-data-plane}

volumes:
  postgres-data:
    name: ${LOCAL_POSTGRES_VOLUME:-local_postgres-data}
