name: campus-agent-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-campus_agent}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      data-plane:
        aliases:
          - campus-agent-postgres

  ingestion-control:
    build:
      context: ../..
      dockerfile: apps/ingestion-control/Dockerfile
    depends_on:
      - postgres
    environment:
      INGESTION_CONTROL_DATABASE_URL: postgresql://${LOCAL_POSTGRES_USER:-postgres}:${LOCAL_POSTGRES_PASSWORD:-postgres}@postgres:5432/${LOCAL_POSTGRES_DB:-campus_agent}
      INGESTION_CONTROL_HOST: 0.0.0.0
      INGESTION_CONTROL_PORT: 8000
    ports:
      - "127.0.0.1:${LOCAL_INGESTION_CONTROL_PORT:-27061}:8000"
    restart: unless-stopped
    networks:
      data-plane:
        aliases:
          - campus-agent-ingestion-control

networks:
  data-plane:
    external: true
    name: ${CAMPUS_AGENT_DATA_PLANE_NETWORK:-campus-agent-data-plane}

volumes:
  postgres-data:
    name: local_postgres-data
