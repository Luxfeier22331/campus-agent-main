name: campus-agent-local

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped
    volumes:
      - minio-data:/data
    networks:
      data-plane:
        aliases:
          - minio

networks:
  data-plane:
    external: true
    name: ${CAMPUS_AGENT_DATA_PLANE_NETWORK:-campus-agent-data-plane}

volumes:
  minio-data:
    external: true
    name: local_minio-data
