services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${QDRANT_HOST:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_HOST:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:?set QDRANT_READ_ONLY_API_KEY}
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
    volumes:
      - ${QDRANT_STORAGE_DIR:-/srv/lib/campus-agent/qdrant/storage}:/qdrant/storage
      - ${QDRANT_SNAPSHOTS_DIR:-/srv/backups/campus-agent/qdrant-snapshots/native}:/qdrant/snapshots
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -lc ''exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.1\r\nHost: 127.0.0.1\r\napi-key: %s\r\nConnection: close\r\n\r\n" "$${QDRANT__SERVICE__API_KEY}" >&3; timeout 2 cat <&3 | grep -q "all shards are ready"'''
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      data-plane:
        aliases:
          - qdrant

networks:
  data-plane:
    external: true
    name: ${CAMPUS_AGENT_DATA_PLANE_NETWORK:-campus-agent-data-plane}
