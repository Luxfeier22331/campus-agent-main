services:
  otel-collector:
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      OTEL_COLLECTOR_LANGFUSE_RUNTIME_OTLP_ENDPOINT: ${OTEL_COLLECTOR_LANGFUSE_RUNTIME_OTLP_ENDPOINT:?set OTEL_COLLECTOR_LANGFUSE_RUNTIME_OTLP_ENDPOINT}
      OTEL_COLLECTOR_LANGFUSE_RUNTIME_AUTH_HEADER: ${OTEL_COLLECTOR_LANGFUSE_RUNTIME_AUTH_HEADER:?set OTEL_COLLECTOR_LANGFUSE_RUNTIME_AUTH_HEADER}
    volumes:
      - ../otel/collector-local-prodlike.yaml:/etc/otelcol-contrib/config.yaml:ro

  execution-control:
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      QDRANT_TLS_CA_CERT_PATH: ${QDRANT_TLS_CA_CERT_PATH:-}
    labels:
      traefik.enable: "false"
