        max-file: "3"
    environment:
      EXECUTION_CONTROL_APP_API_BASE_URL: ${EXECUTION_CONTROL_APP_API_BASE_URL:?set EXECUTION_CONTROL_APP_API_BASE_URL}
      EXECUTION_CONTROL_APP_API_INTERNAL_SHARED_SECRET: ${EXECUTION_CONTROL_APP_API_INTERNAL_SHARED_SECRET:?set EXECUTION_CONTROL_APP_API_INTERNAL_SHARED_SECRET}
      EXECUTION_CONTROL_TEMPORAL_ADDRESS: ${EXECUTION_CONTROL_TEMPORAL_ADDRESS:?set EXECUTION_CONTROL_TEMPORAL_ADDRESS}
      EXECUTION_CONTROL_TEMPORAL_NAMESPACE: ${EXECUTION_CONTROL_TEMPORAL_NAMESPACE:?set EXECUTION_CONTROL_TEMPORAL_NAMESPACE}
      EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE: ${EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE:-campus-agent.workflow}
      EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY: ${EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE_SAMPLER_IDENTITY:?set EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE_SAMPLER_IDENTITY}
      EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE_SAMPLER_INTERVAL_SECONDS: ${EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE_SAMPLER_INTERVAL_SECONDS:-30}
    networks:
      - supervisor-runtime

  worker-autoscaler:
    init: true
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/execution-control/Dockerfile
      args:
        GOPROXY: "${EXECUTION_CONTROL_DOCKER_GOPROXY:-https://goproxy.cn,direct}"
        GOSUMDB: "${EXECUTION_CONTROL_DOCKER_GOSUMDB:-sum.golang.org}"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        while true; do
          /usr/local/bin/worker-autoscaler
          sleep "$${EXECUTION_CONTROL_WORKER_AUTOSCALER_INTERVAL_SECONDS:-60}"
        done
    depends_on:
      temporal-task-queue-sampler:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      EXECUTION_CONTROL_APP_API_BASE_URL: ${EXECUTION_CONTROL_APP_API_BASE_URL:?set EXECUTION_CONTROL_APP_API_BASE_URL}
      EXECUTION_CONTROL_APP_API_INTERNAL_SHARED_SECRET: ${EXECUTION_CONTROL_APP_API_INTERNAL_SHARED_SECRET:?set EXECUTION_CONTROL_APP_API_INTERNAL_SHARED_SECRET}
      EXECUTION_CONTROL_COMPOSE_PROJECT_DIRECTORY: ${EXECUTION_CONTROL_COMPOSE_PROJECT_DIRECTORY:?set EXECUTION_CONTROL_COMPOSE_PROJECT_DIRECTORY}
      EXECUTION_CONTROL_COMPOSE_PROJECT_NAME: ${EXECUTION_CONTROL_COMPOSE_PROJECT_NAME:?set EXECUTION_CONTROL_COMPOSE_PROJECT_NAME}
      EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE: ${EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE:-campus-agent.workflow}
      EXECUTION_CONTROL_WORKER_AUTOSCALER_INTERVAL_SECONDS: ${EXECUTION_CONTROL_WORKER_AUTOSCALER_INTERVAL_SECONDS:-60}
      EXECUTION_CONTROL_WORKER_AUTOSCALER_MODE: ${EXECUTION_CONTROL_WORKER_AUTOSCALER_MODE:-dry-run}
      EXECUTION_CONTROL_WORKER_AUTOSCALER_COOLDOWN_SECONDS: ${EXECUTION_CONTROL_WORKER_AUTOSCALER_COOLDOWN_SECONDS:-180}
      EXECUTION_CONTROL_WORKER_AUTOSCALER_SCALE_DOWN_WINDOWS: ${EXECUTION_CONTROL_WORKER_AUTOSCALER_SCALE_DOWN_WINDOWS:-6}
      EXECUTION_CONTROL_WORKER_AUTOSCALER_SCALE_UP_BACKLOG_THRESHOLD: ${EXECUTION_CONTROL_WORKER_AUTOSCALER_SCALE_UP_BACKLOG_THRESHOLD:-8}
      EXECUTION_CONTROL_WORKER_AUTOSCALER_SCALE_UP_OLDEST_AGE_MS: ${EXECUTION_CONTROL_WORKER_AUTOSCALER_SCALE_UP_OLDEST_AGE_MS:-30000}
      EXECUTION_CONTROL_WORKER_AUTOSCALER_SCALE_UP_WINDOWS: ${EXECUTION_CONTROL_WORKER_AUTOSCALER_SCALE_UP_WINDOWS:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - supervisor-runtime

networks:
  supervisor-runtime:
    name: ${EXECUTION_CONTROL_RUNTIME_INTERNAL_NETWORK:-campus-execution-control-runtime}
  data-plane:
    external: true
    name: ${CAMPUS_AGENT_DATA_PLANE_NETWORK:-campus-agent-data-plane}
  proxy:
    external: true
    name: ${EXECUTION_CONTROL_PROXY_NETWORK:-proxy}

volumes:
  temporal-postgres-data:
  zep-ce-postgres-data:
  zep-ce-neo4j-data:
