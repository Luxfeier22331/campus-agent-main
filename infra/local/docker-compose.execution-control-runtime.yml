services:
  temporal-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - supervisor-runtime

  temporal:
    image: temporalio/auto-setup:1.29.6.1
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD}
      VISIBILITY_STORE: visibility
      TEMPORAL_ADDRESS: temporal:7233
    healthcheck:
      test:
        - CMD-SHELL
        - temporal operator cluster health --address temporal:7233 | grep -q SERVING
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks:
      - supervisor-runtime

  temporal-namespace-setup:
    image: temporalio/admin-tools:1.29.6.1-tctl-1.18.4-cli-1.7.0
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        for namespace in campus-agent-staging campus-agent-prod; do
          temporal operator namespace describe --namespace "$${namespace}" >/dev/null 2>&1 ||
            temporal operator namespace create --namespace "$${namespace}" --retention 30d
        done
    networks:
      - supervisor-runtime

  temporal-ui:
    image: temporalio/ui:2.43.3
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_UI_CORS_ORIGINS:-http://localhost:8233}
    ports:
      - "${TEMPORAL_UI_HOST_PORT:-127.0.0.1:8233}:8080"
    networks:
      - supervisor-runtime

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-staging}
      OTEL_COLLECTOR_OTLP_GRPC_ENDPOINT: ${OTEL_COLLECTOR_OTLP_GRPC_ENDPOINT:-0.0.0.0:4317}
      OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT: ${OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT:-0.0.0.0:4318}
      OTEL_COLLECTOR_HEALTH_CHECK_ENDPOINT: ${OTEL_COLLECTOR_HEALTH_CHECK_ENDPOINT:-0.0.0.0:13133}
      OTEL_COLLECTOR_MEMORY_LIMIT_MIB: ${OTEL_COLLECTOR_MEMORY_LIMIT_MIB:-512}
      OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB: ${OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB:-128}
      OTEL_COLLECTOR_TRACE_SAMPLING_PERCENTAGE: ${OTEL_COLLECTOR_TRACE_SAMPLING_PERCENTAGE:-100}
      OTEL_COLLECTOR_LOG_SAMPLING_PERCENTAGE: ${OTEL_COLLECTOR_LOG_SAMPLING_PERCENTAGE:-100}
      OTEL_COLLECTOR_SENTRY_OTLP_ENDPOINT: ${OTEL_COLLECTOR_SENTRY_OTLP_ENDPOINT:-}
      OTEL_COLLECTOR_SENTRY_AUTH_VALUE: ${OTEL_COLLECTOR_SENTRY_AUTH_VALUE:-}
      OTEL_COLLECTOR_AXIOM_OTLP_ENDPOINT: ${OTEL_COLLECTOR_AXIOM_OTLP_ENDPOINT:-}
      OTEL_COLLECTOR_AXIOM_AUTH_HEADER: ${OTEL_COLLECTOR_AXIOM_AUTH_HEADER:-}
      OTEL_COLLECTOR_AXIOM_EVENTS_DATASET: ${OTEL_COLLECTOR_AXIOM_EVENTS_DATASET:-}
    volumes:
      - ../otel/collector-staging-template.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - validate
        - --config=/etc/otelcol-contrib/config.yaml
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - supervisor-runtime

  execution-control:
    init: true
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/execution-control/Dockerfile
      args:
        GOPROXY: "${EXECUTION_CONTROL_DOCKER_GOPROXY:-https://goproxy.cn,direct}"
        GOSUMDB: "${EXECUTION_CONTROL_DOCKER_GOSUMDB:-sum.golang.org}"
    depends_on:
      otel-collector:
        condition: service_healthy
      temporal-namespace-setup:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      CAMPUS_AGENT_HTTP_HOST: 0.0.0.0
      CAMPUS_AGENT_HTTP_PORT: 8000
      EXECUTION_CONTROL_RUNTIME_PROFILE: ${EXECUTION_CONTROL_RUNTIME_PROFILE:-local}
      API_AUTH_MODE: ${API_AUTH_MODE:-trusted-worker}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      API_WORKER_SHARED_SECRET: ${API_WORKER_SHARED_SECRET:-}
      API_DEFAULT_ACTOR_ID: ${API_DEFAULT_ACTOR_ID:-}
      API_DEFAULT_ACTOR_ROLES: ${API_DEFAULT_ACTOR_ROLES:-}
      EXECUTION_CONTROL_MAX_CONCURRENT_ANSWERS: ${EXECUTION_CONTROL_MAX_CONCURRENT_ANSWERS:-8}
      EXECUTION_CONTROL_QUEUE_CAPACITY: ${EXECUTION_CONTROL_QUEUE_CAPACITY:-24}
      EXECUTION_CONTROL_QUEUE_TIMEOUT_MS: ${EXECUTION_CONTROL_QUEUE_TIMEOUT_MS:-3000}
      EXECUTION_CONTROL_LANE_RAG_MAX_CONCURRENT: ${EXECUTION_CONTROL_LANE_RAG_MAX_CONCURRENT:-6}
      EXECUTION_CONTROL_LANE_RAG_QUEUE_CAPACITY: ${EXECUTION_CONTROL_LANE_RAG_QUEUE_CAPACITY:-12}
      EXECUTION_CONTROL_LANE_RAG_QUEUE_TIMEOUT_MS: ${EXECUTION_CONTROL_LANE_RAG_QUEUE_TIMEOUT_MS:-3000}
      EXECUTION_CONTROL_LANE_NAVIGATION_MAX_CONCURRENT: ${EXECUTION_CONTROL_LANE_NAVIGATION_MAX_CONCURRENT:-2}
      EXECUTION_CONTROL_LANE_NAVIGATION_QUEUE_CAPACITY: ${EXECUTION_CONTROL_LANE_NAVIGATION_QUEUE_CAPACITY:-4}
      EXECUTION_CONTROL_LANE_NAVIGATION_QUEUE_TIMEOUT_MS: ${EXECUTION_CONTROL_LANE_NAVIGATION_QUEUE_TIMEOUT_MS:-1500}
      EXECUTION_CONTROL_LANE_CAMPUS_SERVICES_MAX_CONCURRENT: ${EXECUTION_CONTROL_LANE_CAMPUS_SERVICES_MAX_CONCURRENT:-2}
      EXECUTION_CONTROL_LANE_CAMPUS_SERVICES_QUEUE_CAPACITY: ${EXECUTION_CONTROL_LANE_CAMPUS_SERVICES_QUEUE_CAPACITY:-4}
      EXECUTION_CONTROL_LANE_CAMPUS_SERVICES_QUEUE_TIMEOUT_MS: ${EXECUTION_CONTROL_LANE_CAMPUS_SERVICES_QUEUE_TIMEOUT_MS:-1500}
      EXECUTION_CONTROL_LANE_NOTICE_MAX_CONCURRENT: ${EXECUTION_CONTROL_LANE_NOTICE_MAX_CONCURRENT:-2}
      EXECUTION_CONTROL_LANE_NOTICE_QUEUE_CAPACITY: ${EXECUTION_CONTROL_LANE_NOTICE_QUEUE_CAPACITY:-4}
      EXECUTION_CONTROL_LANE_NOTICE_QUEUE_TIMEOUT_MS: ${EXECUTION_CONTROL_LANE_NOTICE_QUEUE_TIMEOUT_MS:-1500}
      EXECUTION_CONTROL_LANE_DEFAULT_MAX_CONCURRENT: ${EXECUTION_CONTROL_LANE_DEFAULT_MAX_CONCURRENT:-1}
      EXECUTION_CONTROL_LANE_DEFAULT_QUEUE_CAPACITY: ${EXECUTION_CONTROL_LANE_DEFAULT_QUEUE_CAPACITY:-2}
      EXECUTION_CONTROL_LANE_DEFAULT_QUEUE_TIMEOUT_MS: ${EXECUTION_CONTROL_LANE_DEFAULT_QUEUE_TIMEOUT_MS:-1500}
      EXECUTION_CONTROL_OPEN_CAPABILITIES: ${EXECUTION_CONTROL_OPEN_CAPABILITIES:-}
      EXECUTION_CONTROL_REQUEST_TIMEOUT_MS: ${EXECUTION_CONTROL_REQUEST_TIMEOUT_MS:-95000}
      EXECUTION_CONTROL_REQUEST_BODY_LIMIT_BYTES: ${EXECUTION_CONTROL_REQUEST_BODY_LIMIT_BYTES:-1048576}
      EXECUTION_CONTROL_SHUTDOWN_GRACE_MS: ${EXECUTION_CONTROL_SHUTDOWN_GRACE_MS:-95000}
      EXECUTION_CONTROL_METRICS_BEARER_TOKEN: ${EXECUTION_CONTROL_METRICS_BEARER_TOKEN:-}
      PROMPT_RUNTIME_PROVIDER: ${PROMPT_RUNTIME_PROVIDER:-}
      PROMPT_RUNTIME_TRANSPORT: ${PROMPT_RUNTIME_TRANSPORT:-responses}
      PROMPT_RUNTIME_MODEL: ${PROMPT_RUNTIME_MODEL:-}
      SUPERVISOR_PROMPT_MODEL: ${SUPERVISOR_PROMPT_MODEL:-}
      AGENT_PROMPT_MODEL: ${AGENT_PROMPT_MODEL:-}
      PROMPT_RUNTIME_API_KEY: ${PROMPT_RUNTIME_API_KEY:-}
      PROMPT_RUNTIME_BASE_URL: ${PROMPT_RUNTIME_BASE_URL:-}
      PROMPT_STRICT_STRUCTURED_OUTPUTS: ${PROMPT_STRICT_STRUCTURED_OUTPUTS:-true}
      EXECUTION_CONTROL_PROVIDER_PRICING_PATH: ${EXECUTION_CONTROL_PROVIDER_PRICING_PATH:-/etc/campus-agent/provider-pricing.v1.json}
      QDRANT_URL: ${QDRANT_URL:?set QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?set EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:?set EMBEDDING_DIMENSIONS}
      EXECUTION_CONTROL_OTEL_ENABLED: ${EXECUTION_CONTROL_OTEL_ENABLED:-false}
      EXECUTION_CONTROL_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      EXECUTION_CONTROL_OTEL_METRICS_ENABLED: ${EXECUTION_CONTROL_OTEL_METRICS_ENABLED:-false}
      EXECUTION_CONTROL_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      EXECUTION_CONTROL_OTEL_EXPORTER_OTLP_HEADERS: ${EXECUTION_CONTROL_OTEL_EXPORTER_OTLP_HEADERS:-}
      EXECUTION_CONTROL_OTEL_SERVICE_NAME: ${EXECUTION_CONTROL_OTEL_SERVICE_NAME:-campus-execution-control}
      EXECUTION_CONTROL_OTEL_EXPORT_TIMEOUT_MS: ${EXECUTION_CONTROL_OTEL_EXPORT_TIMEOUT_MS:-1000}
      EXECUTION_CONTROL_OTEL_EXPORT_INTERVAL_MS: ${EXECUTION_CONTROL_OTEL_EXPORT_INTERVAL_MS:-15000}
      EXECUTION_CONTROL_EXECUTION_AUDIT_ENABLED: ${EXECUTION_CONTROL_EXECUTION_AUDIT_ENABLED:-false}
      EXECUTION_CONTROL_EXECUTION_AUDIT_URL: ${EXECUTION_CONTROL_EXECUTION_AUDIT_URL:-}
      EXECUTION_CONTROL_EXECUTION_AUDIT_SHARED_SECRET: ${EXECUTION_CONTROL_EXECUTION_AUDIT_SHARED_SECRET:-}
      EXECUTION_CONTROL_EXECUTION_AUDIT_TIMEOUT_MS: ${EXECUTION_CONTROL_EXECUTION_AUDIT_TIMEOUT_MS:-500}
      EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL: ${EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL:?set EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL}
      EXECUTION_CONTROL_TEMPORAL_ADDRESS: ${EXECUTION_CONTROL_TEMPORAL_ADDRESS:?set EXECUTION_CONTROL_TEMPORAL_ADDRESS}
      EXECUTION_CONTROL_TEMPORAL_NAMESPACE: ${EXECUTION_CONTROL_TEMPORAL_NAMESPACE:?set EXECUTION_CONTROL_TEMPORAL_NAMESPACE}
      EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE: ${EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE:-campus-agent.workflow}
      EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY: ${EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY:?set EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY}
      EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT: ${EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT:?set EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT}
      EXECUTION_CONTROL_TEMPORAL_START_TIMEOUT_MS: ${EXECUTION_CONTROL_TEMPORAL_START_TIMEOUT_MS:-5000}
      EXECUTION_CONTROL_INTERNAL_QUERY_SHARED_SECRET: ${EXECUTION_CONTROL_INTERNAL_QUERY_SHARED_SECRET:-}
      EXECUTION_CONTROL_STRUCTURED_QUERY_TRUSTED_TIME_RFC3339: ${EXECUTION_CONTROL_STRUCTURED_QUERY_TRUSTED_TIME_RFC3339:-}
      EXECUTION_CONTROL_STRUCTURED_QUERY_TIMEOUT_MS: ${EXECUTION_CONTROL_STRUCTURED_QUERY_TIMEOUT_MS:-1000}
      CAMPUS_SHARED_POSTGRES_URL: ${CAMPUS_SHARED_POSTGRES_URL:-}
      INTERNAL_NOTICE_READ_MODEL_DATABASE_URL: ${INTERNAL_NOTICE_READ_MODEL_DATABASE_URL:-}
      INTERNAL_NOTICE_READ_MODEL_TABLE: ${INTERNAL_NOTICE_READ_MODEL_TABLE:-ingestion_projection.internal_notice_read_model}
      EXECUTION_CONTROL_NOTICE_BODY_OBJECT_STORE_ENDPOINT: ${EXECUTION_CONTROL_NOTICE_BODY_OBJECT_STORE_ENDPOINT:-}
      EXECUTION_CONTROL_NOTICE_BODY_OBJECT_STORE_ACCESS_KEY: ${EXECUTION_CONTROL_NOTICE_BODY_OBJECT_STORE_ACCESS_KEY:-}
      EXECUTION_CONTROL_NOTICE_BODY_OBJECT_STORE_SECRET_KEY: ${EXECUTION_CONTROL_NOTICE_BODY_OBJECT_STORE_SECRET_KEY:-}
      EXECUTION_CONTROL_NOTICE_BODY_OBJECT_STORE_REGION: ${EXECUTION_CONTROL_NOTICE_BODY_OBJECT_STORE_REGION:-us-east-1}
      EXECUTION_CONTROL_NOTICE_BODY_OBJECT_STORE_BUCKET: ${EXECUTION_CONTROL_NOTICE_BODY_OBJECT_STORE_BUCKET:-}
    ports:
      - "${EXECUTION_CONTROL_HOST_PORT:-27051}:8000"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${EXECUTION_CONTROL_PROXY_NETWORK:-proxy}
      traefik.http.routers.execution-control-staging.rule: Host(`execution-control-staging.mucwiki-edge.link`)
      traefik.http.routers.execution-control-staging.entrypoints: websecure
      traefik.http.routers.execution-control-staging.tls: "true"
      traefik.http.services.execution-control-staging.loadbalancer.server.port: "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/healthz >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - supervisor-runtime
      - data-plane
      - proxy

  workflow-worker:
    init: true
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/execution-control/Dockerfile
      args:
        GOPROXY: "${EXECUTION_CONTROL_DOCKER_GOPROXY:-https://goproxy.cn,direct}"
        GOSUMDB: "${EXECUTION_CONTROL_DOCKER_GOSUMDB:-sum.golang.org}"
    entrypoint:
      - /usr/local/bin/workflow-worker
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      EXECUTION_CONTROL_RUNTIME_PROFILE: ${EXECUTION_CONTROL_RUNTIME_PROFILE:-local}
      EXECUTION_CONTROL_METRICS_BEARER_TOKEN: ${EXECUTION_CONTROL_METRICS_BEARER_TOKEN:-}
      EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL: ${EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL:?set EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL}
      EXECUTION_CONTROL_TEMPORAL_ADDRESS: ${EXECUTION_CONTROL_TEMPORAL_ADDRESS:?set EXECUTION_CONTROL_TEMPORAL_ADDRESS}
      EXECUTION_CONTROL_TEMPORAL_NAMESPACE: ${EXECUTION_CONTROL_TEMPORAL_NAMESPACE:?set EXECUTION_CONTROL_TEMPORAL_NAMESPACE}
      EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE: ${EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE:-campus-agent.workflow}
      EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY: ${EXECUTION_CONTROL_TEMPORAL_WORKFLOW_WORKER_IDENTITY:?set EXECUTION_CONTROL_TEMPORAL_WORKFLOW_WORKER_IDENTITY}
      EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT: ${EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT:?set EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT}
      EXECUTION_CONTROL_TEMPORAL_START_TIMEOUT_MS: ${EXECUTION_CONTROL_TEMPORAL_START_TIMEOUT_MS:-5000}
    networks:
      - supervisor-runtime

  activity-worker-rag:
    init: true
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/execution-control/Dockerfile
      args:
        GOPROXY: "${EXECUTION_CONTROL_DOCKER_GOPROXY:-https://goproxy.cn,direct}"
        GOSUMDB: "${EXECUTION_CONTROL_DOCKER_GOSUMDB:-sum.golang.org}"
    entrypoint:
      - /usr/local/bin/activity-worker-rag
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      EXECUTION_CONTROL_RUNTIME_PROFILE: ${EXECUTION_CONTROL_RUNTIME_PROFILE:-local}
      EXECUTION_CONTROL_METRICS_BEARER_TOKEN: ${EXECUTION_CONTROL_METRICS_BEARER_TOKEN:-}
      EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL: ${EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL:?set EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL}
      EXECUTION_CONTROL_TEMPORAL_ADDRESS: ${EXECUTION_CONTROL_TEMPORAL_ADDRESS:?set EXECUTION_CONTROL_TEMPORAL_ADDRESS}
      EXECUTION_CONTROL_TEMPORAL_NAMESPACE: ${EXECUTION_CONTROL_TEMPORAL_NAMESPACE:?set EXECUTION_CONTROL_TEMPORAL_NAMESPACE}
      EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE: ${EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE:-campus-agent.workflow}
      EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY: ${EXECUTION_CONTROL_TEMPORAL_RAG_WORKER_IDENTITY:?set EXECUTION_CONTROL_TEMPORAL_RAG_WORKER_IDENTITY}
      EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT: ${EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT:?set EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT}
      EXECUTION_CONTROL_TEMPORAL_START_TIMEOUT_MS: ${EXECUTION_CONTROL_TEMPORAL_START_TIMEOUT_MS:-5000}
      PROMPT_RUNTIME_PROVIDER: ${PROMPT_RUNTIME_PROVIDER:-}
      PROMPT_RUNTIME_TRANSPORT: ${PROMPT_RUNTIME_TRANSPORT:-responses}
      PROMPT_RUNTIME_MODEL: ${PROMPT_RUNTIME_MODEL:-}
      AGENT_PROMPT_MODEL: ${AGENT_PROMPT_MODEL:?set AGENT_PROMPT_MODEL}
      PROMPT_RUNTIME_API_KEY: ${PROMPT_RUNTIME_API_KEY:?set PROMPT_RUNTIME_API_KEY}
      PROMPT_RUNTIME_BASE_URL: ${PROMPT_RUNTIME_BASE_URL:-}
      PROMPT_STRICT_STRUCTURED_OUTPUTS: ${PROMPT_STRICT_STRUCTURED_OUTPUTS:-true}
      EXECUTION_CONTROL_PROVIDER_PRICING_PATH: ${EXECUTION_CONTROL_PROVIDER_PRICING_PATH:-/etc/campus-agent/provider-pricing.v1.json}
      QDRANT_URL: ${QDRANT_URL:?set QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?set EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:?set EMBEDDING_DIMENSIONS}
      CAMPUS_SHARED_POSTGRES_URL: ${CAMPUS_SHARED_POSTGRES_URL:-}
      INTERNAL_NOTICE_READ_MODEL_DATABASE_URL: ${INTERNAL_NOTICE_READ_MODEL_DATABASE_URL:-}
      INTERNAL_NOTICE_READ_MODEL_TABLE: ${INTERNAL_NOTICE_READ_MODEL_TABLE:-ingestion_projection.internal_notice_read_model}
    networks:
      - supervisor-runtime
      - data-plane

  activity-worker-finalization:
    init: true
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/execution-control/Dockerfile
      args:
        GOPROXY: "${EXECUTION_CONTROL_DOCKER_GOPROXY:-https://goproxy.cn,direct}"
        GOSUMDB: "${EXECUTION_CONTROL_DOCKER_GOSUMDB:-sum.golang.org}"
    entrypoint:
      - /usr/local/bin/activity-worker-finalization
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      EXECUTION_CONTROL_RUNTIME_PROFILE: ${EXECUTION_CONTROL_RUNTIME_PROFILE:-local}
      EXECUTION_CONTROL_METRICS_BEARER_TOKEN: ${EXECUTION_CONTROL_METRICS_BEARER_TOKEN:-}
      EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL: ${EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL:?set EXECUTION_CONTROL_RUN_PROJECTION_DATABASE_URL}
      EXECUTION_CONTROL_TEMPORAL_ADDRESS: ${EXECUTION_CONTROL_TEMPORAL_ADDRESS:?set EXECUTION_CONTROL_TEMPORAL_ADDRESS}
      EXECUTION_CONTROL_TEMPORAL_NAMESPACE: ${EXECUTION_CONTROL_TEMPORAL_NAMESPACE:?set EXECUTION_CONTROL_TEMPORAL_NAMESPACE}
      EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE: ${EXECUTION_CONTROL_TEMPORAL_TASK_QUEUE:-campus-agent.workflow}
      EXECUTION_CONTROL_TEMPORAL_WORKER_IDENTITY: ${EXECUTION_CONTROL_TEMPORAL_FINALIZATION_WORKER_IDENTITY:?set EXECUTION_CONTROL_TEMPORAL_FINALIZATION_WORKER_IDENTITY}
      EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT: ${EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT:?set EXECUTION_CONTROL_TEMPORAL_WORKFLOW_ID_SALT}
      EXECUTION_CONTROL_TEMPORAL_START_TIMEOUT_MS: ${EXECUTION_CONTROL_TEMPORAL_START_TIMEOUT_MS:-5000}
      CAMPUS_SHARED_POSTGRES_URL: ${CAMPUS_SHARED_POSTGRES_URL:-}
      INTERNAL_NOTICE_READ_MODEL_DATABASE_URL: ${INTERNAL_NOTICE_READ_MODEL_DATABASE_URL:-}
      INTERNAL_NOTICE_READ_MODEL_TABLE: ${INTERNAL_NOTICE_READ_MODEL_TABLE:-ingestion_projection.internal_notice_read_model}
    networks:
      - supervisor-runtime
      - data-plane

networks:
  supervisor-runtime:
    name: ${EXECUTION_CONTROL_RUNTIME_INTERNAL_NETWORK:-campus-execution-control-runtime}
  data-plane:
    external: true
    name: ${CAMPUS_AGENT_DATA_PLANE_NETWORK:-campus-agent-data-plane}
  proxy:
    external: true
    name: ${EXECUTION_CONTROL_PROXY_NETWORK:-proxy}

volumes:
  temporal-postgres-data:
