receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "${env:OTEL_COLLECTOR_OTLP_GRPC_ENDPOINT}"
      http:
        endpoint: "${env:OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT}"

extensions:
  health_check:
    endpoint: "${env:OTEL_COLLECTOR_HEALTH_CHECK_ENDPOINT}"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_COLLECTOR_MEMORY_LIMIT_MIB}
    spike_limit_mib: ${env:OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB}
  resource/campus:
    attributes:
      - key: service.namespace
        value: campus-agent
        action: upsert
      - key: deployment.environment
        value: "${env:DEPLOYMENT_ENVIRONMENT}"
        action: upsert
      - key: telemetry.allowed_attributes_version
        value: runtime-otel-attrs-v1
        action: upsert
  attributes/drop_forbidden:
    actions:
      - key: raw.prompt
        action: delete
      - key: raw.query
        action: delete
      - key: raw.answer
        action: delete
      - key: raw.chat_transcript
        action: delete
      - key: raw.retrieved_snippet
        action: delete
      - key: chunk.body
        action: delete
      - key: canonical.body
        action: delete
      - key: ocr.raw_text
        action: delete
      - key: authorization
        action: delete
      - key: cookie
        action: delete
      - key: jwt
        action: delete
      - key: api.key
        action: delete
      - key: database.url
        action: delete
      - key: object_store.secret
        action: delete
      - key: provider.secret
        action: delete
  filter/drop_marked:
    error_mode: ignore
    traces:
      span:
        - 'attributes["telemetry.drop"] == true'
        - 'attributes["telemetry.drop"] == "true"'
    metrics:
      datapoint:
        - 'attributes["telemetry.drop"] == true'
        - 'attributes["telemetry.drop"] == "true"'
    logs:
      log_record:
        - 'attributes["telemetry.drop"] == true'
        - 'attributes["telemetry.drop"] == "true"'
  probabilistic_sampler/traces:
    hash_seed: 20260501
    sampling_percentage: ${env:OTEL_COLLECTOR_TRACE_SAMPLING_PERCENTAGE}
  probabilistic_sampler/logs:
    hash_seed: 20260501
    sampling_percentage: ${env:OTEL_COLLECTOR_LOG_SAMPLING_PERCENTAGE}
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlphttp/sentry:
    endpoint: "${env:OTEL_COLLECTOR_SENTRY_OTLP_ENDPOINT}"
    headers:
      x-sentry-auth: "${env:OTEL_COLLECTOR_SENTRY_AUTH_VALUE}"
    compression: gzip
    encoding: proto
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1024
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  otlphttp/axiom:
    endpoint: "${env:OTEL_COLLECTOR_AXIOM_OTLP_ENDPOINT}"
    compression: zstd
    headers:
      authorization: "${env:OTEL_COLLECTOR_AXIOM_AUTH_HEADER}"
      x-axiom-dataset: "${env:OTEL_COLLECTOR_AXIOM_EVENTS_DATASET}"
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  otlphttp/axiom_metrics:
    endpoint: "${env:OTEL_COLLECTOR_AXIOM_OTLP_ENDPOINT}"
    compression: zstd
    headers:
      authorization: "${env:OTEL_COLLECTOR_AXIOM_AUTH_HEADER}"
      x-axiom-metrics-dataset: "${env:OTEL_COLLECTOR_AXIOM_METRICS_DATASET}"
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  debug:
    verbosity: basic

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/campus
        - attributes/drop_forbidden
        - filter/drop_marked
        - probabilistic_sampler/traces
        - batch
      exporters:
        - otlphttp/sentry
        - otlphttp/axiom
        - debug
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/campus
        - attributes/drop_forbidden
        - filter/drop_marked
        - batch
      exporters:
        - otlphttp/axiom_metrics
        - debug
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/campus
        - attributes/drop_forbidden
        - filter/drop_marked
        - probabilistic_sampler/logs
        - batch
      exporters:
        - otlphttp/axiom
        - debug
