receivers:
  otlp/agent:
    protocols:
      http:
        endpoint: "${env:OTEL_COLLECTOR_AGENT_HTTP_ENDPOINT}"
  otlp/orchestration:
    protocols:
      http:
        endpoint: "${env:OTEL_COLLECTOR_ORCHESTRATION_HTTP_ENDPOINT}"
  otlp/agent_trusted:
    protocols:
      http:
        endpoint: "${env:OTEL_COLLECTOR_AGENT_TRUSTED_HTTP_ENDPOINT}"
  otlp/hindsight_trusted:
    protocols:
      http:
        endpoint: "${env:OTEL_COLLECTOR_HINDSIGHT_TRUSTED_HTTP_ENDPOINT}"
  prometheus/platform:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ["127.0.0.1:8888"]
        - job_name: hindsight
          scrape_interval: 30s
          metrics_path: /metrics
          static_configs:
            - targets: ["${env:OTEL_COLLECTOR_HINDSIGHT_METRICS_TARGET}"]

extensions:
  health_check:
    endpoint: "${env:OTEL_COLLECTOR_HEALTH_CHECK_ENDPOINT}"
  basicauth/langfuse:
    client_auth:
      username: "${env:LANGFUSE_PUBLIC_KEY}"
      password: "${env:LANGFUSE_SECRET_KEY}"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_COLLECTOR_MEMORY_LIMIT_MIB}
    spike_limit_mib: ${env:OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB}
  resource/campus:
    attributes:
      - key: service.namespace
        value: campus-agent
        action: upsert
      - key: deployment.environment
        value: "${env:DEPLOYMENT_ENVIRONMENT}"
        action: upsert
      - key: telemetry.allowed_attributes_version
        value: runtime-otel-attrs-v2
        action: upsert
  filter/drop_marked:
    error_mode: ignore
    traces:
      span:
        - 'attributes["telemetry.drop"] == true'
        - 'attributes["telemetry.drop"] == "true"'
    metrics:
      datapoint:
        - 'attributes["telemetry.drop"] == true'
        - 'attributes["telemetry.drop"] == "true"'
    logs:
      log_record:
        - 'attributes["telemetry.drop"] == true'
        - 'attributes["telemetry.drop"] == "true"'
  filter/orchestration_langfuse:
    error_mode: propagate
    traces:
      span:
        - 'not IsMatch(name, "^execution_control\\.")'
  filter/memory_parent:
    error_mode: propagate
    traces:
      span:
        - 'name != "memory.call"'
  transform/axiom_safe:
    error_mode: propagate
    trace_statements:
      - 'set(span.name, "application.operation")'
      - 'set(span.name, span.attributes["http.route"]) where span.attributes["http.route"] != nil'
      - 'set(span.name, span.attributes["rpc.method"]) where span.attributes["rpc.method"] != nil'
      - 'set(span.status.message, "")'
      - 'set(span.events, [])'
      - 'set(span.links, [])'
      - 'set(span.attributes["request_id"], span.attributes["request.id"]) where span.attributes["request_id"] == nil and span.attributes["request.id"] != nil'
      - 'keep_keys(span.attributes, ["request_id", "request.id", "trace_id", "run_id", "workflow_id", "step_id", "status", "failure_kind", "http.request.method", "http.response.status_code", "http.method", "http.status_code", "http.route", "rpc.system", "rpc.service", "rpc.method", "rpc.grpc.status_code", "error.type", "error.code", "exception.type", "telemetry.operation", "campus.surface", "gen_ai.operation.name", "gen_ai.provider.name", "gen_ai.request.model", "gen_ai.response.model"])'
      - 'keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "deployment.environment", "deployment.environment.name", "cloud.provider", "cloud.region"])'
      - 'keep_keys(instrumentation_scope.attributes, [])'
    log_statements:
      - 'delete_key(log.attributes, "event.name") where log.attributes["event.name"] != nil and not IsString(log.attributes["event.name"])'
      - 'delete_key(log.attributes, "event_type") where log.attributes["event_type"] != nil and not IsString(log.attributes["event_type"])'
      - 'delete_key(log.attributes, "request_id") where log.attributes["request_id"] != nil and not IsString(log.attributes["request_id"])'
      - 'delete_key(log.attributes, "request.id") where log.attributes["request.id"] != nil and not IsString(log.attributes["request.id"])'
      - 'delete_key(log.attributes, "trace_id") where log.attributes["trace_id"] != nil and not IsString(log.attributes["trace_id"])'
      - 'delete_key(log.attributes, "span_id") where log.attributes["span_id"] != nil and not IsString(log.attributes["span_id"])'
      - 'delete_key(log.attributes, "run_id") where log.attributes["run_id"] != nil and not IsString(log.attributes["run_id"])'
      - 'delete_key(log.attributes, "workflow_id") where log.attributes["workflow_id"] != nil and not IsString(log.attributes["workflow_id"])'
      - 'delete_key(log.attributes, "step_id") where log.attributes["step_id"] != nil and not IsString(log.attributes["step_id"])'
      - 'delete_key(log.attributes, "status") where log.attributes["status"] != nil and not IsString(log.attributes["status"])'
      - 'delete_key(log.attributes, "failure_kind") where log.attributes["failure_kind"] != nil and not IsString(log.attributes["failure_kind"])'
      - 'delete_key(log.attributes, "http.request.method") where log.attributes["http.request.method"] != nil and not IsString(log.attributes["http.request.method"])'
      - 'delete_key(log.attributes, "http.response.status_code") where log.attributes["http.response.status_code"] != nil and not IsString(log.attributes["http.response.status_code"]) and not IsInt(log.attributes["http.response.status_code"])'
      - 'delete_key(log.attributes, "http.method") where log.attributes["http.method"] != nil and not IsString(log.attributes["http.method"])'
      - 'delete_key(log.attributes, "http.status_code") where log.attributes["http.status_code"] != nil and not IsString(log.attributes["http.status_code"]) and not IsInt(log.attributes["http.status_code"])'
      - 'delete_key(log.attributes, "http.route") where log.attributes["http.route"] != nil and not IsString(log.attributes["http.route"])'
      - 'delete_key(log.attributes, "rpc.system") where log.attributes["rpc.system"] != nil and not IsString(log.attributes["rpc.system"])'
      - 'delete_key(log.attributes, "rpc.service") where log.attributes["rpc.service"] != nil and not IsString(log.attributes["rpc.service"])'
      - 'delete_key(log.attributes, "rpc.method") where log.attributes["rpc.method"] != nil and not IsString(log.attributes["rpc.method"])'
      - 'delete_key(log.attributes, "rpc.grpc.status_code") where log.attributes["rpc.grpc.status_code"] != nil and not IsString(log.attributes["rpc.grpc.status_code"]) and not IsInt(log.attributes["rpc.grpc.status_code"])'
      - 'delete_key(log.attributes, "error.type") where log.attributes["error.type"] != nil and not IsString(log.attributes["error.type"])'
      - 'delete_key(log.attributes, "error.code") where log.attributes["error.code"] != nil and not IsString(log.attributes["error.code"])'
      - 'delete_key(log.attributes, "error_code") where log.attributes["error_code"] != nil and not IsString(log.attributes["error_code"])'
      - 'delete_key(log.attributes, "exception.type") where log.attributes["exception.type"] != nil and not IsString(log.attributes["exception.type"])'
      - 'delete_key(log.attributes, "source") where log.attributes["source"] != nil and not IsString(log.attributes["source"])'
      - 'delete_key(log.attributes, "telemetry.operation") where log.attributes["telemetry.operation"] != nil and not IsString(log.attributes["telemetry.operation"])'
      - 'delete_key(log.attributes, "campus.surface") where log.attributes["campus.surface"] != nil and not IsString(log.attributes["campus.surface"])'
      - 'delete_key(log.attributes, "duration_ms") where log.attributes["duration_ms"] != nil and not IsInt(log.attributes["duration_ms"]) and not IsDouble(log.attributes["duration_ms"])'
      - 'delete_key(resource.attributes, "service.name") where resource.attributes["service.name"] != nil and not IsString(resource.attributes["service.name"])'
      - 'delete_key(resource.attributes, "service.namespace") where resource.attributes["service.namespace"] != nil and not IsString(resource.attributes["service.namespace"])'
      - 'delete_key(resource.attributes, "service.version") where resource.attributes["service.version"] != nil and not IsString(resource.attributes["service.version"])'
      - 'delete_key(resource.attributes, "deployment.environment") where resource.attributes["deployment.environment"] != nil and not IsString(resource.attributes["deployment.environment"])'
      - 'delete_key(resource.attributes, "deployment.environment.name") where resource.attributes["deployment.environment.name"] != nil and not IsString(resource.attributes["deployment.environment.name"])'
      - 'delete_key(resource.attributes, "cloud.provider") where resource.attributes["cloud.provider"] != nil and not IsString(resource.attributes["cloud.provider"])'
      - 'delete_key(resource.attributes, "cloud.region") where resource.attributes["cloud.region"] != nil and not IsString(resource.attributes["cloud.region"])'
      - 'delete_key(resource.attributes, "k8s.namespace.name") where resource.attributes["k8s.namespace.name"] != nil and not IsString(resource.attributes["k8s.namespace.name"])'
      - 'delete_key(resource.attributes, "k8s.pod.name") where resource.attributes["k8s.pod.name"] != nil and not IsString(resource.attributes["k8s.pod.name"])'
      - 'delete_key(resource.attributes, "k8s.pod.uid") where resource.attributes["k8s.pod.uid"] != nil and not IsString(resource.attributes["k8s.pod.uid"])'
      - 'delete_key(resource.attributes, "k8s.container.name") where resource.attributes["k8s.container.name"] != nil and not IsString(resource.attributes["k8s.container.name"])'
      - 'delete_key(resource.attributes, "k8s.node.name") where resource.attributes["k8s.node.name"] != nil and not IsString(resource.attributes["k8s.node.name"])'
      - 'set(log.attributes["event.name"], log.attributes["event_type"]) where log.attributes["event.name"] == nil and log.attributes["event_type"] != nil'
      - 'set(log.body, "application.event")'
      - 'set(log.attributes["request_id"], log.attributes["request.id"]) where log.attributes["request_id"] == nil and log.attributes["request.id"] != nil'
      - 'set(log.attributes["error.code"], log.attributes["error_code"]) where log.attributes["error.code"] == nil and log.attributes["error_code"] != nil'
      - 'keep_keys(log.attributes, ["event.name", "event_type", "request_id", "request.id", "trace_id", "span_id", "run_id", "workflow_id", "step_id", "status", "failure_kind", "http.request.method", "http.response.status_code", "http.method", "http.status_code", "http.route", "rpc.system", "rpc.service", "rpc.method", "rpc.grpc.status_code", "error.type", "error.code", "error_code", "exception.type", "source", "duration_ms", "telemetry.operation", "campus.surface"])'
      - 'truncate_all(log.attributes, 256)'
      - 'keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "deployment.environment", "deployment.environment.name", "cloud.provider", "cloud.region", "k8s.namespace.name", "k8s.pod.name", "k8s.pod.uid", "k8s.container.name", "k8s.node.name"])'
      - 'truncate_all(resource.attributes, 256)'
      - 'keep_keys(instrumentation_scope.attributes, [])'
    metric_statements:
      - 'keep_keys(datapoint.attributes, ["operation", "source", "budget", "max_tokens", "success", "outcome", "failure_kind", "provider", "model", "scope", "token_bucket", "method", "endpoint", "status_code", "status_class", "type", "task_queue", "step_kind", "activity_type", "selected_tool", "otelcol.component.id", "otelcol.component.kind", "otelcol.signal", "interface", "device", "direction", "state"])'
      - 'keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "deployment.environment", "deployment.environment.name", "cloud.provider", "cloud.region", "job", "service.instance.id", "container.id", "k8s.namespace.name", "k8s.pod.name", "k8s.pod.uid", "k8s.container.name", "k8s.node.name", "k8s.node.system_container.name", "k8s.volume.name", "k8s.volume.type", "k8s.persistentvolumeclaim.name"])'
      - 'keep_keys(instrumentation_scope.attributes, [])'
  transform/orchestration_langfuse:
    error_mode: propagate
    trace_statements:
      - 'set(span.status.message, "")'
      - 'set(span.events, [])'
      - 'set(span.links, [])'
      - 'keep_keys(span.attributes, ["telemetry.allowed_attributes_version", "langfuse.trace.name", "langfuse.session.id", "langfuse.user.id", "langfuse.release", "langfuse.trace.tags", "langfuse.observation.type", "langfuse.observation.usage_details", "langfuse.observation.model.name", "langfuse.observation.metadata.step_id", "deployment.environment", "request_id", "trace_id", "run_id", "failure_kind", "activity_type", "task_queue", "activity_attempt", "workflow_id", "step_kind", "schedule_to_start_ms", "selected_tool", "step_id", "fail_close_reason", "status", "projection_ref", "duration_ms"])'
      - 'keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "deployment.environment"] )'
      - 'keep_keys(instrumentation_scope.attributes, [])'
  transform/trusted_credentials:
    error_mode: propagate
    trace_statements:
      - 'delete_matching_keys(span.attributes, "(?i)(authorization|cookie|credential|jwt|password|secret|api[._-]?key|access[._-]?token|refresh[._-]?token|observability[._-]?canary|(^|[._-])headers?([._-]|$))")'
      - 'delete_matching_keys(resource.attributes, "(?i)(authorization|cookie|credential|jwt|password|secret|api[._-]?key|access[._-]?token|refresh[._-]?token|observability[._-]?canary|(^|[._-])headers?([._-]|$))")'
      - 'delete_matching_keys(instrumentation_scope.attributes, "(?i)(authorization|cookie|credential|jwt|password|secret|api[._-]?key|access[._-]?token|refresh[._-]?token|observability[._-]?canary|(^|[._-])headers?([._-]|$))")'
  transform/hindsight_langfuse:
    error_mode: propagate
    trace_statements:
      - 'set(span.attributes["langfuse.user.id"], span.attributes["hindsight.bank_id"]) where span.attributes["hindsight.bank_id"] != nil'
      - 'set(span.attributes["langfuse.user.id"], span.attributes["bank_id"]) where span.attributes["langfuse.user.id"] == nil and span.attributes["bank_id"] != nil'
      - 'set(span.attributes["langfuse.user.id"], resource.attributes["hindsight.bank_id"]) where span.attributes["langfuse.user.id"] == nil and resource.attributes["hindsight.bank_id"] != nil'
      - 'set(span.attributes["langfuse.trace.tags"], ["plane:hindsight"])'
      - 'set(span.attributes["langfuse.environment"], "${env:DEPLOYMENT_ENVIRONMENT}")'
      - 'delete_key(span.attributes, "hindsight.bank_id")'
      - 'delete_key(span.attributes, "bank_id")'
      - 'delete_key(resource.attributes, "hindsight.bank_id")'
  transform/memory_parent:
    error_mode: propagate
    trace_statements:
      - 'set(span.status.message, "")'
      - 'set(span.events, [])'
      - 'set(span.links, [])'
      - 'set(span.attributes["langfuse.trace.tags"], ["plane:hindsight", "source:execution-control"])'
      - 'set(span.attributes["langfuse.environment"], "${env:DEPLOYMENT_ENVIRONMENT}")'
      - 'keep_keys(span.attributes, ["memory.provider", "http.request.method", "langfuse.trace.tags", "langfuse.environment"])'
      - 'keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "deployment.environment"])'
      - 'keep_keys(instrumentation_scope.attributes, [])'
  probabilistic_sampler/axiom_traces:
    hash_seed: 20260501
    sampling_percentage: ${env:OTEL_COLLECTOR_TRACE_SAMPLING_PERCENTAGE}
  probabilistic_sampler/axiom_logs:
    hash_seed: 20260501
    sampling_percentage: ${env:OTEL_COLLECTOR_LOG_SAMPLING_PERCENTAGE}
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlphttp/axiom_logs:
    endpoint: "${env:OTEL_COLLECTOR_AXIOM_OTLP_ENDPOINT}"
    headers:
      authorization: "Bearer ${env:OTEL_COLLECTOR_AXIOM_INGEST_TOKEN}"
      x-axiom-dataset: "${env:OTEL_COLLECTOR_AXIOM_LOGS_DATASET}"
    compression: zstd
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  otlphttp/axiom_traces:
    endpoint: "${env:OTEL_COLLECTOR_AXIOM_OTLP_ENDPOINT}"
    headers:
      authorization: "Bearer ${env:OTEL_COLLECTOR_AXIOM_INGEST_TOKEN}"
      x-axiom-dataset: "${env:OTEL_COLLECTOR_AXIOM_TRACES_DATASET}"
    compression: zstd
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  otlphttp/axiom_metrics:
    endpoint: "${env:OTEL_COLLECTOR_AXIOM_OTLP_ENDPOINT}"
    headers:
      authorization: "Bearer ${env:OTEL_COLLECTOR_AXIOM_INGEST_TOKEN}"
      x-axiom-metrics-dataset: "${env:OTEL_COLLECTOR_AXIOM_METRICS_DATASET}"
    compression: zstd
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  otlphttp/langfuse:
    endpoint: "${env:OTEL_COLLECTOR_LANGFUSE_OTLP_ENDPOINT}"
    auth:
      authenticator: basicauth/langfuse
    headers:
      x-langfuse-ingestion-version: "4"
    compression: gzip
    encoding: proto
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
service:
  extensions:
    - health_check
    - basicauth/langfuse
  telemetry:
    logs:
      encoding: json
      level: info
    metrics:
      level: detailed
  pipelines:
    traces/agent:
      receivers: [otlp/agent]
      processors: [memory_limiter, resource/campus, filter/drop_marked, transform/axiom_safe, probabilistic_sampler/axiom_traces, batch]
      exporters: [otlphttp/axiom_traces]
    logs/agent:
      receivers: [otlp/agent]
      processors: [memory_limiter, resource/campus, filter/drop_marked, transform/axiom_safe, probabilistic_sampler/axiom_logs, batch]
      exporters: [otlphttp/axiom_logs]
    metrics/agent:
      receivers: [otlp/agent]
      processors: [memory_limiter, resource/campus, filter/drop_marked, transform/axiom_safe, batch]
      exporters: [otlphttp/axiom_metrics]
    traces/orchestration_axiom:
      receivers: [otlp/orchestration]
      processors: [memory_limiter, resource/campus, filter/drop_marked, transform/axiom_safe, probabilistic_sampler/axiom_traces, batch]
      exporters: [otlphttp/axiom_traces]
    traces/orchestration_langfuse:
      receivers: [otlp/orchestration]
      processors: [memory_limiter, resource/campus, filter/drop_marked, filter/orchestration_langfuse, transform/orchestration_langfuse, batch]
      exporters: [otlphttp/langfuse]
    traces/orchestration_memory_parent:
      receivers: [otlp/orchestration]
      processors: [memory_limiter, resource/campus, filter/drop_marked, filter/memory_parent, transform/memory_parent, batch]
      exporters: [otlphttp/langfuse]
    metrics/orchestration:
      receivers: [otlp/orchestration]
      processors: [memory_limiter, resource/campus, filter/drop_marked, transform/axiom_safe, batch]
      exporters: [otlphttp/axiom_metrics]
    traces/agent_runtime:
      receivers: [otlp/agent_trusted]
      processors: [memory_limiter, resource/campus, filter/drop_marked, transform/trusted_credentials, batch]
      exporters: [otlphttp/langfuse]
    traces/hindsight:
      receivers: [otlp/hindsight_trusted]
      processors: [memory_limiter, resource/campus, filter/drop_marked, transform/trusted_credentials, transform/hindsight_langfuse, batch]
      exporters: [otlphttp/langfuse]
    metrics/platform:
      receivers: [prometheus/platform]
      processors: [memory_limiter, resource/campus, transform/axiom_safe, batch]
      exporters: [otlphttp/axiom_metrics]
