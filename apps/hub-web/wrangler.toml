name = "hub-web"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[services]]
binding = "APP_API"
service = "app-api"

[env.local.vars]
APP_API_BASE_URL = "http://127.0.0.1:27031"
HUB_PUBLIC_CHAT_ORIGIN = "http://127.0.0.1:27011"
HUB_WEB_HOSTNAME = "127.0.0.1:27012"

[[env.local.services]]
binding = "APP_API"
service = "app-api-local"

[env.staging.vars]
APP_API_BASE_URL = "https://app-api.internal"
HUB_PUBLIC_CHAT_ORIGIN = "https://campus-chat-staging.ayafeed.com"
HUB_WEB_HOSTNAME = "hub-muc-wiki.ayafeed.com"
SENTRY_ENVIRONMENT = "staging"

[[env.staging.routes]]
pattern = "hub-muc-wiki.ayafeed.com"
custom_domain = true

[[env.staging.services]]
binding = "APP_API"
service = "app-api-staging"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/*", "!/assets/*" ]
