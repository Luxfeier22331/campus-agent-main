name = "hub-web"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[services]]
binding = "APP_API"
service = "app-api"

[env.staging.vars]
APP_API_BASE_URL = "https://app-api.internal"
HUB_PUBLIC_CHAT_ORIGIN = "https://chat-staging.mucwiki-edge.link"
HUB_WEB_HOSTNAME = "hub-staging.mucwiki-edge.link"
SENTRY_ENVIRONMENT = "staging"

[[env.staging.routes]]
pattern = "hub-staging.mucwiki-edge.link"
custom_domain = true

[[env.staging.services]]
binding = "APP_API"
service = "app-api-staging"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/*", "!/assets/*" ]
