name = "hub-web"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[secrets]
required = []

[[services]]
binding = "APP_API"
service = "app-api"

[vars]
APP_API_BASE_URL = "https://app-api.internal"
HUB_PUBLIC_CHAT_ORIGIN = "http://127.0.0.1:27011"
HUB_WEB_HOSTNAME = "127.0.0.1:27012"
AUTH_TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/*", "!/assets/*" ]
