name = "hub-web-test"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_API_BASE_URL = "https://app-api.internal"
HUB_WEB_HOSTNAME = "hub.muc.wiki"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/*", "!/assets/*" ]
