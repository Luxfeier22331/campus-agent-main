[project]
name = "campus-supervisor-api"
version = "0.1.0"
description = "API bootstrap for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-contracts",
  "campus-shared",
  "campus-supervisor-core",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-contracts = { workspace = true }
campus-shared = { workspace = true }
campus-supervisor-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_supervisor_api"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_supervisor_api", "pyproject.toml", "README.md"]

[project.scripts]
campus-supervisor-api-dev = "campus_supervisor_api.dev_server:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
