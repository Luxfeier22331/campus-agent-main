name = "public-docs"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[services]]
binding = "APP_API"
service = "app-api"

[env.staging.vars]
APP_API_BASE_URL = "https://app-api.internal"
PUBLIC_DOCS_HOSTNAME = "docs-staging.mucwiki-edge.link"

[[env.staging.routes]]
pattern = "docs-staging.mucwiki-edge.link"
custom_domain = true

[[env.staging.services]]
binding = "APP_API"
service = "app-api-staging"

[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./doc_build"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = [ "/*", "!/assets/*" ]
