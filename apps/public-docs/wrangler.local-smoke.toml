name = "public-docs"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[secrets]
required = []

[[services]]
binding = "APP_API"
service = "app-api"

[vars]
APP_API_BASE_URL = "https://app-api.internal"
PUBLIC_DOCS_HOSTNAME = "127.0.0.1:27114"

[assets]
directory = "./doc_build"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = [ "/*", "!/assets/*" ]
