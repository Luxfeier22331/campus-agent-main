name = "campus-web"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[services]]
binding = "APP_API"
service = "app-api"

[env.local.vars]
APP_API_BASE_URL = "http://127.0.0.1:27031"
AUTH_TURNSTILE_APPEARANCE = "interaction-only"
AUTH_TURNSTILE_EXECUTION = "render"
CAMPUS_WEB_HOSTNAME = "127.0.0.1:27014"

[[env.local.services]]
binding = "APP_API"
service = "app-api-local"

[env.staging.vars]
APP_API_BASE_URL = "https://app-api.internal"
AUTH_TURNSTILE_APPEARANCE = "interaction-only"
AUTH_TURNSTILE_EXECUTION = "render"
CAMPUS_WEB_HOSTNAME = "campus-staging.mucwiki-edge.link"
SENTRY_ENVIRONMENT = "staging"

[[env.staging.routes]]
pattern = "campus-staging.mucwiki-edge.link"
custom_domain = true

[[env.staging.services]]
binding = "APP_API"
service = "app-api-staging"

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/*", "!/assets/*" ]
