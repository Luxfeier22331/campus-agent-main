name = "campus-web"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
upload_source_maps = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = false

[observability.traces]
enabled = false
head_sampling_rate = 0
persist = false

[env.staging.observability]
enabled = true

[env.staging.observability.logs]
destinations = ["axiom-staging-logs"]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = false

[env.staging.observability.traces]
enabled = false
head_sampling_rate = 0
persist = false

[[services]]
binding = "APP_API"
service = "app-api"

[env.local.vars]
APP_API_BASE_URL = "http://127.0.0.1:27031"
DEPLOYMENT_ENVIRONMENT = "development"

[[env.local.services]]
binding = "APP_API"
service = "app-api-local"

[env.staging.vars]
APP_API_BASE_URL = "https://app-api.internal"
DEPLOYMENT_ENVIRONMENT = "staging"

[[env.staging.services]]
binding = "APP_API"
service = "app-api-staging"

[[env.staging.r2_buckets]]
binding = "MAP_DATA"
bucket_name = "campus-agent-derived-unconfigured"

[assets]
directory = "./dist/client"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
run_worker_first = [ "/*", "!/assets/*", "!/vendor/*", "!/docs", "!/docs/*", "!/_docs/*", "!/@fs/*", "!/@id/*", "!/@react-refresh*", "!/@vite/*", "!/node_modules/*", "!/src/*" ]
