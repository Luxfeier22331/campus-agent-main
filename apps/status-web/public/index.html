<!doctype html>
<html class="no-js" lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="description" content="MUC Campus 产品服务可用性状态" />
		<link rel="icon" href="/favicon.ico" type="image/x-icon" />
		<title>产品服务状态 | MUC Campus</title>
		<script>
			(() => {
				document.documentElement.classList.remove("no-js");
				const storageKey = "campus-agent.theme";
				let mode = null;
				// The shared cookie is the cross-subdomain channel; every writer updates both
				// stores, so a valid cookie is at least as fresh as this origin's localStorage.
				try {
					const match = document.cookie.match(new RegExp(`(?:^|; )${storageKey}=([^;]*)`));
					const value = match?.[1] ? decodeURIComponent(match[1]) : null;
					if (value === "system" || value === "light" || value === "dark") {
						mode = value;
					}
				} catch {
					// Cookie read is best-effort.
				}
				if (mode === null) {
					try {
						const stored = window.localStorage.getItem(storageKey);
						if (stored === "system" || stored === "light" || stored === "dark") {
							mode = stored;
						}
					} catch {
						// Storage is optional. The system preference remains the fallback.
					}
				}
				if (mode === null) {
					mode = "system";
				}
				const theme =
					mode === "system"
						? window.matchMedia?.("(prefers-color-scheme: dark)").matches
							? "dark"
							: "light"
						: mode;
				document.documentElement.dataset.theme = theme;
				document.documentElement.dataset.themeMode = mode;
			})();
		</script>
		<style>
			/*
			 * status-web is a static Worker surface, so these values mirror the
			 * repository semantic UI tokens without importing the React bundle.
			 */
			:root {
				color-scheme: light;
				font-family:
					ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
					"Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
				font-synthesis: none;
				letter-spacing: 0;
				text-rendering: optimizeLegibility;
				--canvas: #f5f5f7;
				--surface: #ffffff;
				--surface-subtle: #fafafb;
				--surface-muted: #efeff2;
				--surface-selected: #ebeef6;
				--line: #e5e5ea;
				--line-strong: #d1d1d6;
				--text-strong: #1c1c1e;
				--text: #2c2c2e;
				--text-selected: #0b308f;
				--muted: #545458;
				--subtle: #6e6e73;
				--brand: #0b308f;
				--brand-hover: #173d99;
				--operational: #00703e;
				--degraded: #73510a;
				--outage: #b42318;
				--unknown: #6e6e73;
				--no-data: #d1d1d6;
				--focus: #3158b5;
				--shadow-xs: 0 1px 2px rgb(28 28 30 / 6%);
				--shadow-sm: 0 8px 20px rgb(28 28 30 / 10%);
				--page-max: 1040px;
				--page-gutter: 24px;
				--nav-max: 1280px;
			}

			:root[data-theme="dark"] {
				color-scheme: dark;
				--canvas: #0b0b0c;
				--surface: #151517;
				--surface-subtle: #111113;
				--surface-muted: #1c1c1e;
				--surface-selected: #2a2e3a;
				--line: #2c2c2e;
				--line-strong: #48484a;
				--text-strong: #f5f5f7;
				--text: #e5e5ea;
				--text-selected: #aec2ff;
				--muted: #b8b8bd;
				--subtle: #8e8e93;
				--brand: #9ab2f2;
				--brand-hover: #aec1f5;
				--operational: #72d89a;
				--degraded: #f5cf72;
				--outage: #ff776d;
				--unknown: #b8b8bd;
				--no-data: #6e6e73;
				--focus: #afc3ff;
				--shadow-xs: 0 1px 2px rgb(0 0 0 / 32%);
				--shadow-sm: 0 8px 20px rgb(0 0 0 / 38%);
			}

			* {
				box-sizing: border-box;
			}

			html {
				min-width: 320px;
				background: var(--canvas);
			}

			body {
				min-width: 320px;
				min-height: 100dvh;
				margin: 0;
				background: var(--canvas);
				color: var(--text);
				font-size: 16px;
				font-variant-numeric: tabular-nums;
				letter-spacing: 0;
				line-height: 1.5;
			}

			@supports (view-transition-name: root) {
				:root {
					view-transition-name: status-root;
				}

				::view-transition-old(status-root),
				::view-transition-new(status-root) {
					animation-duration: 160ms;
					animation-timing-function: ease;
					mix-blend-mode: normal;
				}

				::view-transition-old(status-root) {
					animation-name: status-theme-fade-out;
				}

				::view-transition-new(status-root) {
					animation-name: status-theme-fade-in;
				}
			}

			a {
				color: inherit;
				text-decoration: none;
			}

			button {
				border: 0;
				font: inherit;
				-webkit-tap-highlight-color: transparent;
			}

			button:focus-visible,
			a:focus-visible {
				outline: 2px solid var(--focus);
				outline-offset: 3px;
			}

			.page {
				display: flex;
				min-height: 100dvh;
				flex-direction: column;
			}

			.shell {
				width: min(calc(100% - (var(--page-gutter) * 2)), var(--page-max));
				margin: 0 auto;
			}

			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border: 0;
			}

			.site-header {
				border-bottom: 1px solid var(--line);
				background: var(--surface);
			}

			.site-header .shell {
				width: min(calc(100% - (var(--page-gutter) * 2)), var(--nav-max));
			}

			.header-inner {
				display: flex;
				min-height: 64px;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
			}

			.brand {
				display: inline-flex;
				min-width: 0;
				align-items: center;
				gap: 10px;
			}

			.brand-mark {
				display: block;
				width: 32px;
				height: 32px;
				flex: 0 0 auto;
				border-radius: 8px;
				object-fit: contain;
			}

			.brand-copy {
				display: grid;
				min-width: 0;
				gap: 1px;
			}

			.brand-name {
				overflow: hidden;
				color: var(--text-strong);
				font-size: 15px;
				font-weight: 650;
				line-height: 1.2;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.brand-caption {
				overflow: hidden;
				color: var(--subtle);
				font-size: 12px;
				line-height: 1.2;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.header-actions {
				display: flex;
				flex: 0 0 auto;
				align-items: center;
				gap: 8px;
			}

			.product-nav {
				display: flex;
				min-width: 0;
				align-items: center;
				gap: 2px;
				margin-left: auto;
			}

			.product-nav-link {
				display: inline-flex;
				min-height: 36px;
				align-items: center;
				justify-content: center;
				padding: 0 10px;
				border-radius: 6px;
				color: var(--muted);
				font-size: 13px;
				font-weight: 500;
				white-space: nowrap;
				transition:
					background-color 150ms ease,
					color 150ms ease;
			}

			.product-nav-link:hover {
				background: var(--surface-muted);
				color: var(--text-strong);
			}

			.product-nav-link[aria-current="page"] {
				background: var(--surface-muted);
				color: var(--text-strong);
				font-weight: 650;
			}

			.icon-button.mobile-menu-trigger {
				display: none;
			}

			.theme-menu {
				position: relative;
			}

			.theme-menu-content {
				position: absolute;
				top: calc(100% + 6px);
				right: 0;
				z-index: 20;
				min-width: 176px;
				overflow: hidden;
				padding: 4px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--surface);
				box-shadow: var(--shadow-sm);
			}

			.theme-menu-content[hidden] {
				display: none;
			}

			.theme-menu-label {
				padding: 6px 8px 5px;
				color: var(--subtle);
				font-size: 12px;
				font-weight: 600;
			}

			.theme-option {
				display: flex;
				position: relative;
				width: 100%;
				min-height: 44px;
				align-items: center;
				gap: 10px;
				padding: 0 32px 0 10px;
				border-radius: 4px;
				background: transparent;
				color: var(--text);
				font-size: 14px;
				font-weight: 500;
				text-align: left;
				cursor: pointer;
			}

			.theme-option:hover,
			.theme-option:focus-visible {
				background: var(--surface-muted);
				color: var(--text-strong);
			}

			.theme-option[aria-checked="true"] {
				background: var(--surface-selected);
				color: var(--text-selected);
				font-weight: 650;
			}

			.theme-option-check {
				position: absolute;
				right: 10px;
				width: 16px;
				height: 16px;
				visibility: hidden;
			}

			.theme-option[aria-checked="true"] .theme-option-check {
				visibility: visible;
			}

			.mobile-menu {
				width: min(22rem, 88vw);
				max-width: none;
				height: 100dvh;
				max-height: none;
				margin: 0 0 0 auto;
				padding: 0;
				border: 0;
				border-left: 1px solid var(--line);
				background: var(--surface);
				color: var(--text);
				box-shadow: var(--shadow-sm);
			}

			.mobile-menu:not([open]) {
				display: none;
			}

			.mobile-menu::backdrop {
				background: rgb(0 0 0 / 38%);
			}

			.mobile-menu-panel {
				display: flex;
				height: 100%;
				flex-direction: column;
			}

			.mobile-menu-header {
				display: flex;
				min-height: 64px;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				padding: 10px 16px 10px 20px;
				border-bottom: 1px solid var(--line);
			}

			.mobile-menu-header h2 {
				margin: 0;
				color: var(--text-strong);
				font-size: 16px;
				font-weight: 650;
			}

			.mobile-menu-close {
				flex: 0 0 auto;
			}

			.mobile-menu-body {
				min-height: 0;
				flex: 1;
				overflow-y: auto;
				padding: 18px 16px 28px;
			}

			.mobile-menu-section + .mobile-menu-section {
				margin-top: 22px;
				padding-top: 20px;
				border-top: 1px solid var(--line);
			}

			.mobile-menu-section h3 {
				margin: 0 8px 8px;
				color: var(--subtle);
				font-size: 12px;
				font-weight: 600;
			}

			.mobile-product-nav {
				display: grid;
				gap: 2px;
			}

			.icon {
				display: block;
				width: 18px;
				height: 18px;
				fill: none;
				stroke: currentColor;
				stroke-linecap: round;
				stroke-linejoin: round;
				stroke-width: 1.9;
			}

			.theme-option .icon {
				width: 17px;
				height: 17px;
				flex: 0 0 auto;
			}

			.mobile-product-nav .product-nav-link {
				display: flex;
				width: 100%;
				min-height: 44px;
				align-items: center;
				justify-content: flex-start;
				gap: 11px;
				padding: 0 12px;
				border: 1px solid transparent;
				border-radius: 6px;
				background: transparent;
				color: var(--text);
				font-size: 14px;
				font-weight: 500;
				text-align: left;
				cursor: pointer;
			}

			.mobile-product-nav .product-nav-link:hover,
			.mobile-product-nav .product-nav-link[aria-current="page"] {
				background: var(--surface-muted);
				color: var(--text-strong);
				font-weight: 650;
			}

			.mobile-product-nav .icon {
				width: 17px;
				height: 17px;
				flex: 0 0 auto;
			}

			.mobile-theme-control {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				min-height: 44px;
				gap: 2px;
				padding: 0 2px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--surface-muted);
			}

			.mobile-theme-option {
				position: relative;
				min-width: 0;
			}

			.mobile-theme-option input {
				position: absolute;
				width: 1px;
				height: 1px;
				top: 50%;
				left: 50%;
				opacity: 0;
			}

			.mobile-theme-option span {
				display: flex;
				min-height: 44px;
				min-width: 0;
				align-items: center;
				justify-content: center;
				gap: 6px;
				padding: 0 6px;
				border-radius: 4px;
				color: var(--muted);
				font-size: 12px;
				font-weight: 500;
				text-align: center;
				white-space: nowrap;
				transition:
					background-color 150ms ease,
					color 150ms ease,
					box-shadow 150ms ease;
			}

			.mobile-theme-option span:hover {
				background: var(--surface-muted);
				color: var(--text-strong);
			}

			.timeline-heading span {
				color: var(--subtle);
				font-size: 12px;
				text-align: right;
			}

			.mobile-theme-option input:checked + span {
				background: var(--surface);
				box-shadow: var(--shadow-xs);
				color: var(--text-strong);
				font-weight: 650;
			}

			.mobile-theme-option input:focus-visible + span {
				outline: 2px solid var(--focus);
				outline-offset: -2px;
			}

			.mobile-theme-option .icon {
				width: 16px;
				height: 16px;
				flex: 0 0 auto;
			}

			.icon-button {
				display: inline-grid;
				width: 44px;
				height: 44px;
				place-items: center;
				border: 0;
				border-radius: 6px;
				background: transparent;
				color: var(--muted);
				cursor: pointer;
				transition:
					background-color 160ms ease,
					color 160ms ease,
					transform 160ms ease;
			}

			.icon-button:hover {
				background: var(--surface-muted);
				color: var(--text-strong);
			}

			.icon-button:active {
				transform: scale(0.97);
			}

			main {
				flex: 1;
				padding-bottom: 48px;
			}

			.page-intro {
				padding: 40px 0 24px;
				border-bottom: 1px solid var(--line);
			}

			h1 {
				margin: 0;
				color: var(--text-strong);
				font-size: 32px;
				font-weight: 650;
				letter-spacing: 0;
				line-height: 1.25;
			}

			.status-dot {
				display: inline-block;
				width: 9px;
				height: 9px;
				flex: 0 0 auto;
				border-radius: 50%;
				background: var(--unknown);
			}

			.monitoring-notice {
				margin: 20px 0 0;
				color: var(--degraded);
				font-size: 13px;
				line-height: 1.5;
			}

			.monitoring-notice[data-kind="expired"] {
				font-weight: 600;
			}

			.service-list {
				overflow: hidden;
				margin-top: 28px;
				border: 1px solid var(--line-strong);
				border-radius: 8px;
				background: var(--surface);
				box-shadow: var(--shadow-xs);
			}

			.monitoring-notice:not([hidden]) + .service-list {
				margin-top: 14px;
			}

			.service-row {
				display: grid;
				gap: 14px;
				padding: 18px 20px 19px;
				border-bottom: 1px solid var(--line);
			}

			.service-row:last-child {
				border-bottom: 0;
			}

			.service-row:focus-within {
				background: var(--surface-subtle);
			}

			.service-row-header {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				align-items: start;
				gap: 18px;
			}

			.service-identity {
				min-width: 0;
			}

			.service-name {
				margin: 0;
				overflow-wrap: anywhere;
				color: var(--text-strong);
				font-size: 16px;
				font-weight: 600;
				line-height: 1.35;
			}

			.service-meta {
				display: block;
				margin-top: 4px;
				color: var(--subtle);
				font-size: 12px;
				line-height: 1.35;
			}

			.service-summary-side {
				display: flex;
				min-width: 0;
				align-items: center;
				justify-content: flex-end;
			}

			.service-status {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				color: var(--text);
				font-size: 13px;
				font-weight: 600;
				white-space: nowrap;
			}

			.status-dot.operational {
				background: var(--operational);
			}

			.status-dot.degraded {
				background: var(--degraded);
			}

			.status-dot.outage {
				background: var(--outage);
			}

			.status-dot.unknown {
				background: var(--unknown);
			}

			.detail-meta {
				display: flex;
				flex-wrap: wrap;
				gap: 5px 12px;
				color: var(--subtle);
				font-size: 12px;
			}

			.detail-meta time {
				color: var(--muted);
				font-weight: 600;
			}

			.timeline {
				width: min(100%, 448px);
				min-width: 0;
			}

			.timeline-heading {
				display: flex;
				align-items: baseline;
				justify-content: space-between;
				gap: 16px;
				margin-bottom: 9px;
			}

			.timeline-heading strong {
				color: var(--text);
				font-size: 13px;
				font-weight: 600;
			}

			.timeline-viewport {
				position: relative;
				min-width: 0;
				overflow: visible;
			}


			.timeline-track {
				width: 100%;
				min-width: 0;
			}

			.timeline-slider {
				display: grid;
				width: 100%;
				min-width: 0;
				grid-template-columns: repeat(30, minmax(0, 1fr));
				gap: 2px;
				padding: 0 2px;
				border-radius: 4px;
				cursor: pointer;
				touch-action: manipulation;
			}

			.timeline-bar {
				position: relative;
				width: 100%;
				min-width: 0;
				height: 36px;
				display: block;
			}

			.timeline-bar::before {
				position: absolute;
				box-sizing: border-box;
				top: 2px;
				bottom: 2px;
				left: 0;
				width: 100%;
				border: 1px solid transparent;
				border-radius: 1px;
				background: var(--unknown);
				content: "";
				transition: filter 150ms ease, box-shadow 150ms ease;
			}

			.timeline-bar.operational::before {
				background: var(--operational);
			}

			.timeline-bar.degraded::before {
				background: linear-gradient(
					to bottom,
					var(--degraded) 0 calc(50% - 1px),
					transparent calc(50% - 1px) calc(50% + 1px),
					var(--degraded) calc(50% + 1px) 100%
				);
			}

			.timeline-bar.outage::before {
				background: linear-gradient(
					to bottom,
					var(--outage) 0 calc(33.333% - 1px),
					transparent calc(33.333% - 1px) calc(33.333% + 1px),
					var(--outage) calc(33.333% + 1px) calc(66.667% - 1px),
					transparent calc(66.667% - 1px) calc(66.667% + 1px),
					var(--outage) calc(66.667% + 1px) 100%
				);
			}

			.timeline-bar.unknown::before {
				border-color: var(--unknown);
				border-style: dotted;
				background: transparent;
				opacity: 1;
			}

			.timeline-bar.no-data::before {
				border: 1px dashed var(--no-data);
				background: transparent;
				opacity: 1;
			}

			.timeline-bar[data-active="true"]::before {
				box-shadow: inset 0 0 0 1px var(--text-strong);
			}

			.timeline-slider:hover .timeline-bar[data-active="true"]::before {
				filter: brightness(0.94);
			}

			.timeline-slider:focus-visible {
				outline: 2px solid var(--focus);
				outline-offset: 3px;
			}

			.timeline-slider:focus-visible .timeline-bar[data-active="true"]::before {
				box-shadow: inset 0 0 0 1px var(--surface);
			}

			.timeline-labels {
				display: flex;
				width: 100%;
				min-width: 0;
				justify-content: space-between;
				gap: 16px;
				margin-top: 7px;
				color: var(--subtle);
				font-size: 11px;
			}

			.timeline-tooltip {
				position: fixed;
				z-index: 20;
				width: min(280px, calc(100vw - 24px));
				padding: 11px 13px;
				border: 1px solid var(--line-strong);
				border-left: 3px solid var(--unknown);
				border-radius: 8px;
				background: var(--surface);
				box-shadow: var(--shadow-sm);
				color: var(--text);
				font-size: 13px;
				line-height: 1.45;
				max-height: 96px;

				overflow-wrap: anywhere;
				overscroll-behavior: contain;
				pointer-events: none;

			.timeline-tooltip[data-status="operational"] {

			}

			.timeline-tooltip[data-status="degraded"] {

			}

			.timeline-tooltip[data-status="outage"] {
				border-left-color: var(--outage);
			}

			.timeline-tooltip[data-status="no-data"] {
				border-style: dashed;
				border-left-color: var(--no-data);
			}

			.timeline-tooltip[hidden],
			.page-legend[hidden] {
				display: none;
			}

			.timeline-tooltip-title,
			.timeline-tooltip-status,
			.timeline-tooltip-note {
				display: block;
			}

			.timeline-tooltip-title {
				color: var(--text-strong);
				font-weight: 650;
			}

			.timeline-tooltip-status {
				margin-top: 3px;
				font-weight: 600;
			}

			.timeline-tooltip-note {
				margin-top: 4px;
				color: var(--muted);
			}

			.page-legend {
				display: flex;
				flex-wrap: wrap;
				gap: 8px 14px;
				margin-top: 20px;
				color: var(--subtle);
				font-size: 12px;
			}

			.legend-item {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				white-space: nowrap;
			}

			.legend-swatch {
				width: 7px;
				height: 14px;
				border-radius: 2px;
				background: var(--unknown);
			}

			.legend-swatch.operational {
				background: var(--operational);
			}

			.legend-swatch.degraded {
				background: linear-gradient(
					to bottom,
					var(--degraded) 0 calc(50% - 1px),
					transparent calc(50% - 1px) calc(50% + 1px),
					var(--degraded) calc(50% + 1px) 100%
				);
			}

			.legend-swatch.outage {
				background: linear-gradient(
					to bottom,
					var(--outage) 0 calc(33.333% - 1px),
					transparent calc(33.333% - 1px) calc(33.333% + 1px),
					var(--outage) calc(33.333% + 1px) calc(66.667% - 1px),
					transparent calc(66.667% - 1px) calc(66.667% + 1px),
					var(--outage) calc(66.667% + 1px) 100%
				);
			}

			.legend-swatch.unknown {
				border: 1px dotted var(--unknown);
				background: transparent;
				opacity: 1;
			}

			.legend-swatch.no-data {
				border: 1px dashed var(--no-data);
				background: transparent;
			}

			.skeleton {
				display: block;
				border-radius: 4px;
				background: var(--surface-muted);
			}

			.skeleton-service-name {
				width: min(112px, 45%);
				height: 22px;
			}

			.skeleton-service-status {
				width: 88px;
				height: 20px;
			}

			.skeleton-service-meta {
				width: 168px;
				height: 18px;
			}

			.skeleton-timeline-title {
				width: 72px;
				height: 18px;
			}

			.skeleton-timeline-summary {
				width: 132px;
				height: 16px;
			}

			.skeleton-timeline-track {
				width: 100%;
				height: 36px;
			}

			.skeleton-timeline-label {
				width: 62px;
				height: 14px;
			}

			.no-js-message {
				display: none;
				margin: 0;
				padding: 24px 20px;
				color: var(--muted);
			}

			.no-js .service-row-skeleton,

				display: none;
			}

			.no-js .no-js-message {
				display: block;
			}

					opacity: 0;
				}
			}

				from {
					opacity: 0;
				}
			}

			@media (max-width: 1023px) {

				.product-nav,

					display: none;
				}

					display: inline-grid;

			}

				}

				.header-inner {
					min-height: 60px;
				}

				.brand-caption {

				}

				.service-summary-side {

				}

				.timeline-heading {

					gap: 3px;
					margin-bottom: 8px;
				}

				.timeline-heading span {
					text-align: left;
				}

				.timeline-tooltip {
					width: min(280px, calc(100vw - 24px));

			}

			@media (prefers-reduced-motion: reduce) {

				body *::before,

					--degraded: CanvasText;
					--outage: CanvasText;
					--unknown: CanvasText;
					--no-data: GrayText;
				}

				.service-status .status-dot,
				.page-legend .legend-swatch {
					border: 2px solid CanvasText;
					background: Canvas;
				}

				.status-dot.operational,
				.legend-swatch.operational {
					border-radius: 50%;
					background: CanvasText;
				}

				.status-dot.degraded,
				.legend-swatch.degraded {
					border-style: dashed;
					border-radius: 0;
					transform: rotate(45deg);
				}

				.status-dot.outage,
				.legend-swatch.outage {
					border-style: double;
					border-radius: 0;
				}

				.status-dot.unknown,
				.legend-swatch.unknown {
					border-radius: 50%;
					background: Canvas;
					opacity: 1;
				}

				.timeline-bar::before {
					border: 2px solid CanvasText;
					background: Canvas;
				}

				.timeline-bar.operational::before {
					background: CanvasText;
				}

				.timeline-bar.degraded::before {

					background: Canvas;

					<p class="no-js-message">需要启用 JavaScript 才能读取服务状态。</p>
					<span class="sr-only loading-status">正在读取状态数据</span>
				</div>
				<section id="timeline-legend" class="page-legend" hidden aria-label="时间线图例">
					<span class="legend-item"><span class="legend-swatch operational" aria-hidden="true"></span>正常</span>
					<span class="legend-item"><span class="legend-swatch degraded" aria-hidden="true"></span>受影响</span>
					<span class="legend-item"><span class="legend-swatch outage" aria-hidden="true"></span>中断</span>
					<span class="legend-item"><span class="legend-swatch unknown" aria-hidden="true"></span>未知</span>
					<span class="legend-item"><span class="legend-swatch no-data" aria-hidden="true"></span>无历史数据</span>
				</section>
			</main>
		</div>
		<div id="timeline-tooltip" class="timeline-tooltip" role="tooltip" hidden>
			<span class="timeline-tooltip-title"></span>
			<span class="timeline-tooltip-status"></span>
			<span class="timeline-tooltip-note" hidden></span>
		</div>
		<p id="status-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
		<script type="module" src="/status-page.js"></script>
	</body>
</html>
