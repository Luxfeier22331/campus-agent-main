openapi: 3.1.0
info:
  title: campus-agent ingestion-control
  version: 2.0.0
  description: 内部门户采集凭据控制接口。
servers:
  - url: http://ingestion-control:8000
paths:
  /healthz:
    get:
      operationId: getIngestionHealth
      security: []
      responses:
        "200":
          description: 进程正常
  /readyz:
    get:
      operationId: getIngestionReadiness
      security: []
      responses:
        "200":
          description: PostgreSQL 可用
        "503":
          description: PostgreSQL 不可用
  /internal/ingestion/internal-portal/credentials:
    get:
      operationId: listInternalPortalCredentials
      security:
        - internalBearer: []
      responses:
        "200":
          description: 不含明文的凭据列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createInternalPortalCredential
      security:
        - internalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, ssoTgc]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                ssoTgc:
                  type: string
                  minLength: 1
                  maxLength: 16384
      responses:
        "201":
          $ref: "#/components/responses/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: 候选凭据被门户拒绝
        "503":
          $ref: "#/components/responses/Unavailable"
  /internal/ingestion/internal-portal/credentials/resolve:
    post:
      operationId: resolveInternalPortalCredential
      security:
        - internalBearer: []
      responses:
        "200":
          description: 当前第一条真实可用凭据
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schemaVersion, ssoTgc]
                properties:
                  schemaVersion:
                    const: internal-portal-credential-resolution.v1
                  ssoTgc:
                    type: string
                    minLength: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /internal/ingestion/internal-portal/credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
    put:
      operationId: updateInternalPortalCredential
      security:
        - internalBearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 80
                - type: object
                  additionalProperties: false
                  required: [ssoTgc]
                  properties:
                    ssoTgc:
                      type: string
                      minLength: 1
                      maxLength: 16384
      responses:
        "200":
          $ref: "#/components/responses/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: 凭据已被门户拒绝
        "428":
          description: 缺少有效 If-Match
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteInternalPortalCredential
      security:
        - internalBearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: 已删除
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          description: 缺少有效 If-Match
        "503":
          $ref: "#/components/responses/Unavailable"
  /internal/ingestion/internal-portal/credentials/{credentialId}/validate:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
    post:
      operationId: validateInternalPortalCredential
      security:
        - internalBearer: []
      responses:
        "200":
          $ref: "#/components/responses/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: 凭据已被门户拒绝
        "503":
          $ref: "#/components/responses/Unavailable"
  /internal/ingestion/internal-portal/credentials/{credentialId}/reveal:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
    post:
      operationId: revealInternalPortalCredential
      security:
        - internalBearer: []
      responses:
        "200":
          description: 当前明文和版本
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [credentialId, ssoTgc, version]
                properties:
                  credentialId:
                    type: string
                    format: uuid
                  ssoTgc:
                    type: string
                    minLength: 1
                  version:
                    type: integer
                    minimum: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    internalBearer:
      type: http
      scheme: bearer
  parameters:
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  schemas:
    Credential:
      type: object
      additionalProperties: false
      required:
        - credentialId
        - name
        - version
        - createdAt
        - updatedAt
        - lastAttemptAt
        - lastSuccessfulAt
        - lastOutcome
      properties:
        credentialId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastAttemptAt:
          type: [string, "null"]
          format: date-time
        lastSuccessfulAt:
          type: [string, "null"]
          format: date-time
        lastOutcome:
          type: [string, "null"]
          enum: [valid, credential_rejected, check_failed, null]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: 请求参数或请求体无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Credential:
      description: 凭据 metadata
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [credential]
            properties:
              credential:
                $ref: "#/components/schemas/Credential"
    Unauthorized:
      description: 内部 Bearer token 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 凭据不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 版本或名称冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: PostgreSQL、门户验证或凭据池不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
