name = "operator-console-web"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[secrets]
required = ["OPERATOR_CONSOLE_APP_API_SHARED_SECRET"]

[[services]]
binding = "APP_API"
service = "app-api"

[env.local.vars]
OPERATOR_CONSOLE_PROTECTION_ENVELOPE = "cloudflare-access"
OPERATOR_CONSOLE_APP_API_BASE_URL = "https://app-api.internal"
ACCESS_TEAM_DOMAIN = "http://127.0.0.1:27062"
ACCESS_POLICY_AUD = "operator-console-local-smoke"

[env.local.secrets]
required = ["OPERATOR_CONSOLE_APP_API_SHARED_SECRET", "SENTRY_DSN"]

[[env.local.services]]
binding = "APP_API"
service = "app-api"
environment = "local"

[env.staging.vars]
OPERATOR_CONSOLE_PROTECTION_ENVELOPE = "cloudflare-access"
OPERATOR_CONSOLE_APP_API_BASE_URL = "https://app-api.internal"
OPERATOR_CONSOLE_ACCESS_SERVICE_TOKEN_OPERATOR_ALLOWLIST = "0574fdaa4ead6412aba1c56ef9aec9af"
SENTRY_ENVIRONMENT = "staging"

[env.staging.secrets]
required = ["OPERATOR_CONSOLE_APP_API_SHARED_SECRET", "SENTRY_DSN"]

[[env.staging.routes]]
pattern = "panel-staging.mucwiki-edge.link"
custom_domain = true

[[env.staging.services]]
binding = "APP_API"
service = "app-api-staging"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/*", "!/assets/*" ]
