name = "app-api"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/1 * * * *"]

[env.local]
workers_dev = false
preview_urls = false

[env.local.vars]
APP_API_ENVIRONMENT = "development"
PUBLIC_CHAT_WEB_ORIGIN = "http://127.0.0.1:5173"
APP_API_END_USER_EMAIL_DOMAIN_ALLOWLIST = "muc.edu.cn"
APP_API_END_USER_EMAIL_ALLOWLIST = "eval-benchmark@example.edu,help_bot@outlook.com"
APP_API_OPERATOR_EMAIL_ALLOWLIST = "ops@example.com"
SUPERVISOR_API_BASE_URL = "http://127.0.0.1:8081"
SUPERVISOR_API_TIMEOUT_MS = "8000"

[env.local.secrets]
required = [
  "BETTER_AUTH_SECRET",
  "AUTH_TURNSTILE_SECRET_KEY",
  "RESEND_API_KEY",
  "AUTH_RESET_EMAIL_FROM",
  "SUPERVISOR_API_SHARED_SECRET",
  "APP_API_INTERNAL_SHARED_SECRET",
]

[[env.staging.routes]]
pattern = "campus-api-staging.ayafeed.com"
custom_domain = true

[env.staging.vars]
APP_API_ENVIRONMENT = "staging"
PUBLIC_CHAT_WEB_ORIGIN = "https://campus-chat-staging.ayafeed.com"
APP_API_END_USER_EMAIL_DOMAIN_ALLOWLIST = "muc.edu.cn"
APP_API_END_USER_EMAIL_ALLOWLIST = "help_bot@outlook.com"
APP_API_OPERATOR_EMAIL_ALLOWLIST = "ops@example.com,help_bot@outlook.com"
SUPERVISOR_API_TIMEOUT_MS = "15000"
SENTRY_ENVIRONMENT = "staging"
AXIOM_ENDPOINT = "https://us-east-1.aws.edge.axiom.co"
AXIOM_DATASET = "campus-agent-runtime-dev"

[env.staging.secrets]
required = [
  "BETTER_AUTH_SECRET",
  "AUTH_TURNSTILE_SECRET_KEY",
  "RESEND_API_KEY",
  "AUTH_RESET_EMAIL_FROM",
  "SUPERVISOR_API_SHARED_SECRET",
  "APP_API_INTERNAL_SHARED_SECRET",
  "APP_API_STAGING_SMOKE_AUTH_SECRET",
  "SENTRY_DSN",
  "AXIOM_TOKEN",
]

[[env.staging.hyperdrive]]
binding = "APP_API_DB"
id = "c697741c51ca42eb912cdb3e013728f3"

[[env.staging.hyperdrive]]
binding = "APP_API_DB_FRESH"
id = "bcb527f5de2d4de49b2be59fac991838"

[[env.staging.r2_buckets]]
binding = "DOCS_READER_ASSETS"
bucket_name = "campus-agent-reader-assets-staging"

[[env.local.hyperdrive]]
binding = "APP_API_DB"
# Local development loads the actual connection string from
# `CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_APP_API_DB`.
# This placeholder keeps the local-only binding explicit without freezing
# a deployed Hyperdrive resource id in repo truth.
id = "00000000-0000-0000-0000-000000000000"

[[env.local.hyperdrive]]
binding = "APP_API_DB_FRESH"
# Local development can optionally load a dedicated fresh-read connection
# from `CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_APP_API_DB_FRESH`.
# If it is absent, runtime resolution falls back to `APP_API_DB`.
id = "00000000-0000-0000-0000-000000000000"

[[env.local.r2_buckets]]
binding = "DOCS_READER_ASSETS"
bucket_name = "campus-agent-reader-assets-local"
