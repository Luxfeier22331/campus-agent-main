name = "app-api"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/1 * * * *"]

[env.local]
workers_dev = false
preview_urls = false

[env.local.vars]
APP_API_ENVIRONMENT = "development"
AUTH_SHELL_ORIGIN = "http://127.0.0.1:27014"
APP_API_END_USER_EMAIL_DOMAIN_ALLOWLIST = "muc.edu.cn"
APP_API_END_USER_EMAIL_ALLOWLIST = "eval-benchmark@example.edu,help_bot@outlook.com"
APP_API_OPERATOR_EMAIL_ALLOWLIST = "ops@example.com"
EXECUTION_CONTROL_BASE_URL = "http://127.0.0.1:27051"
EXECUTION_CONTROL_TIMEOUT_MS = "180000"
APP_API_OTEL_INGEST_ENDPOINT = "http://127.0.0.1:4318"

[env.local.secrets]
required = [
  "BETTER_AUTH_SECRET",
  "AUTH_TURNSTILE_SECRET_KEY",
  "RESEND_API_KEY",
  "AUTH_RESET_EMAIL_FROM",
  "EXECUTION_CONTROL_SHARED_SECRET",
  "APP_API_INTERNAL_SHARED_SECRET",
  "APP_API_PROVIDER_CONFIG_ENCRYPTION_KEY",
  "APP_API_OFFICIAL_WEB_COLLECTOR_TOKEN",
  "APP_API_OTEL_INGEST_SHARED_SECRET",
]

[[env.staging.routes]]
pattern = "api-staging.mucwiki-edge.link"
custom_domain = true

[env.staging.vars]
APP_API_ENVIRONMENT = "staging"
AUTH_SHELL_ORIGIN = "https://campus-staging.mucwiki-edge.link"
APP_API_END_USER_EMAIL_DOMAIN_ALLOWLIST = "muc.edu.cn"
APP_API_END_USER_EMAIL_ALLOWLIST = "help_bot@outlook.com"
APP_API_OPERATOR_EMAIL_ALLOWLIST = "ops@example.com,help_bot@outlook.com"
EXECUTION_CONTROL_TIMEOUT_MS = "95000"
SENTRY_ENVIRONMENT = "staging"
APP_API_OTEL_INGEST_ENDPOINT = "https://otel-collector-staging.mucwiki-edge.link"

[env.staging.secrets]
required = [
  "BETTER_AUTH_SECRET",
  "AUTH_TURNSTILE_SECRET_KEY",
  "RESEND_API_KEY",
  "AUTH_RESET_EMAIL_FROM",
  "EXECUTION_CONTROL_SHARED_SECRET",
  "EXECUTION_CONTROL_ACCESS_CLIENT_ID",
  "EXECUTION_CONTROL_ACCESS_CLIENT_SECRET",
  "APP_API_INTERNAL_SHARED_SECRET",
  "APP_API_PROVIDER_CONFIG_ENCRYPTION_KEY",
  "APP_API_STAGING_SMOKE_AUTH_SECRET",
  "SENTRY_DSN",
  "APP_API_OTEL_INGEST_SHARED_SECRET",
]

[[env.staging.hyperdrive]]
binding = "APP_API_DB"
id = "c697741c51ca42eb912cdb3e013728f3"

[[env.staging.hyperdrive]]
binding = "APP_API_DB_FRESH"
id = "bcb527f5de2d4de49b2be59fac991838"

[[env.local.hyperdrive]]
binding = "APP_API_DB"
# Local development loads the actual connection string from
# `CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_APP_API_DB`.
# This placeholder keeps the local-only binding explicit without freezing
# a deployed Hyperdrive resource id in repo truth.
id = "00000000-0000-0000-0000-000000000000"

[[env.local.hyperdrive]]
binding = "APP_API_DB_FRESH"
# Fresh-read runtime access must be configured explicitly through
# `CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_APP_API_DB_FRESH`.
id = "00000000-0000-0000-0000-000000000000"
