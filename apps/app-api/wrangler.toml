name = "app-api"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
upload_source_maps = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = false

[observability.traces]
enabled = false
head_sampling_rate = 0
persist = false

[env.staging.observability]
enabled = true

[env.staging.observability.logs]
destinations = ["axiom-staging-logs"]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = false

[env.staging.observability.traces]
enabled = false
head_sampling_rate = 0
persist = false

[env.local]
workers_dev = false
preview_urls = false

[env.local.vars]
APP_API_ENVIRONMENT = "development"
AUTH_SHELL_ORIGIN = "http://127.0.0.1:27014"
EXECUTION_CONTROL_BASE_URL = "http://127.0.0.1:27051"
OBJECT_STORE_LOCAL_BASE_URL = "http://127.0.0.1:9000/campus-agent-derived/"
AUTH_RESET_EMAIL_FROM = "Campus Agent <auth@example.com>"

[env.local.secrets]
required = [
  "BETTER_AUTH_SECRET",
  "AUTH_TURNSTILE_SECRET_KEY",
  "RESEND_API_KEY",
  "OPS_WEB_INTERNAL_TOKEN",
  "APP_API_EXECUTION_SHARED_SECRET",
  "APP_API_SAFETY_IDENTIFIER_HMAC_SECRET",
]

[env.staging.vars]
APP_API_ENVIRONMENT = "staging"
AUTH_SHELL_ORIGIN = "https://campus-staging.mucwiki-edge.link"
EXECUTION_CONTROL_PRIVATE_ORIGIN = "http://execution-control.campus-agent-staging.svc.cluster.local:8000"
SENTRY_ENVIRONMENT = "staging"

[env.staging.secrets]
required = [
  "BETTER_AUTH_SECRET",
  "AUTH_TURNSTILE_SECRET_KEY",
  "RESEND_API_KEY",
  "OPS_WEB_INTERNAL_TOKEN",
  "APP_API_EXECUTION_SHARED_SECRET",
  "APP_API_SAFETY_IDENTIFIER_HMAC_SECRET",
  "APP_API_STAGING_SMOKE_AUTH_SECRET",
]

[[env.staging.vpc_services]]
binding = "EXECUTION_CONTROL_PRIVATE"
service_id = "00000000-0000-0000-0000-000000000000"
remote = true

[[env.staging.vpc_services]]
binding = "OBJECT_STORE_PRIVATE"
service_id = "00000000-0000-0000-0000-000000000000"
remote = true

[[env.staging.hyperdrive]]
binding = "APP_API_DB"
id = "00000000-0000-0000-0000-000000000000"

[[env.staging.hyperdrive]]
binding = "APP_API_DB_FRESH"
id = "00000000-0000-0000-0000-000000000000"

[[env.local.hyperdrive]]
binding = "APP_API_DB"
# Local development loads the actual connection string from
# `CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_APP_API_DB`.
# This placeholder keeps the local-only binding explicit without freezing
# a deployed Hyperdrive resource id in repo truth.
id = "00000000-0000-0000-0000-000000000000"

[[env.local.hyperdrive]]
binding = "APP_API_DB_FRESH"
# Fresh-read runtime access must be configured explicitly through
# `CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_APP_API_DB_FRESH`.
id = "00000000-0000-0000-0000-000000000000"
