name = "app-api"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/1 * * * *"]

[secrets]
required = [
  "BETTER_AUTH_SECRET",
  "AUTH_TURNSTILE_SECRET_KEY",
  "RESEND_API_KEY",
  "APP_API_EXECUTION_SHARED_SECRET",
]

[vars]
APP_API_ENVIRONMENT = "development"
EXECUTION_CONTROL_BASE_URL = "http://127.0.0.1:27051"
AUTH_RESET_EMAIL_FROM = "Campus Agent <auth@example.com>"

[[hyperdrive]]
binding = "APP_API_DB"
id = "00000000-0000-0000-0000-000000000000"

[[hyperdrive]]
binding = "APP_API_DB_FRESH"
# Local smoke uses the dedicated fresh-read binding explicitly.
id = "00000000-0000-0000-0000-000000000000"
