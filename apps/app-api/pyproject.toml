[project]
name = "campus-app-api"
version = "0.1.0"
description = "Python projection helpers bundled with the shared app-api boundary."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-contracts",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_app_api"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_app_api", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
