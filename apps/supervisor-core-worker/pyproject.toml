[project]
name = "campus-supervisor-core-worker"
version = "0.1.0"
description = "Private supervisor-core worker for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-contracts",
  "campus-shared",
  "campus-supervisor-core",
  "httpx>=0.28.1",
  "pydantic>=2.0",
  "uvicorn>=0.30.0",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-contracts = { workspace = true }
campus-shared = { workspace = true }
campus-supervisor-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_supervisor_core_worker"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_supervisor_core_worker", "pyproject.toml", "README.md"]

[project.scripts]
campus-supervisor-core-worker-dev = "campus_supervisor_core_worker.bridge_server:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
