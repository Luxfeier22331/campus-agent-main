[project]
name = "campus-protected-internal-panel"
version = "0.1.0"
description = "Protected internal panel runtime shell for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-shared",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_protected_internal_panel"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_protected_internal_panel", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
