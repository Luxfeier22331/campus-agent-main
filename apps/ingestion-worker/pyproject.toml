[project]
name = "campus-ingestion-worker"
version = "0.1.0"
description = "Ingestion runtime shell for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-shared",
  "campus-ingestion-core",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-shared = { workspace = true }
campus-ingestion-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_ingestion_worker"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_ingestion_worker", "pyproject.toml", "README.md"]

[project.scripts]
campus-ingestion-preflight = "campus_ingestion_worker.deployment_preflight:main"
