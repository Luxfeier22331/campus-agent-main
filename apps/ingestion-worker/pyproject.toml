[project]
name = "campus-ingestion-worker"
version = "0.1.0"
description = "Ingestion runtime shell for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-shared",
  "campus-ingestion-core",
  "campus-ingestion-contracts",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-shared = { workspace = true }
campus-ingestion-core = { workspace = true }
campus-ingestion-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_ingestion_worker"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_ingestion_worker", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
