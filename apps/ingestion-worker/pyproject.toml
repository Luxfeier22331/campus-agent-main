[project]
name = "campus-ingestion-worker"
version = "0.1.0"
description = "Ingestion runtime shell for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-shared",
  "campus-ingestion-core",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-shared = { workspace = true }
campus-ingestion-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_ingestion_worker"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_ingestion_worker", "pyproject.toml", "README.md"]

[project.scripts]
campus-ingestion-audit-official-web-projection-chunking = "campus_ingestion_worker.audit_official_web_projection_chunking:main"
campus-ingestion-consume-official-web-handoffs = "campus_ingestion_worker.official_web_handoff_consumer:main"
campus-ingestion-backfill-official-web-history = "campus_ingestion_worker.official_web_historical_backfill:main"
campus-ingestion-official-web-handoff-dev = "campus_ingestion_worker.official_web_handoff_receiver:main"
campus-ingestion-import-official-web-projection = "campus_ingestion_worker.official_web_projection_import:main"
campus-ingestion-materialize-curriculum-program-semester-facts = "campus_ingestion_worker.materialize_curriculum_program_semester_facts:main"
campus-ingestion-release-registry-scope = "campus_ingestion_worker.release_registry_scope:main"
campus-ingestion-validate-internal-notice-chunking = "campus_ingestion_worker.validate_internal_notice_chunking:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
