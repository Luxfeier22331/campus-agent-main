name = "public-chat-web"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[secrets]
required = []

[[services]]
binding = "APP_API"
service = "app-api"

[vars]
APP_API_BASE_URL = "https://app-api.internal"
AUTH_TURNSTILE_APPEARANCE = "interaction-only"
AUTH_TURNSTILE_EXECUTION = "render"
AUTH_TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
PUBLIC_CHAT_HOSTNAME = "127.0.0.1:5173"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/*", "!/assets/*" ]
