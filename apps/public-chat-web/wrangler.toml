name = "public-chat-web"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[services]]
binding = "APP_API"
service = "app-api"

[env.staging.vars]
APP_API_BASE_URL = "https://api-staging.ayafeed.com"
PUBLIC_CHAT_HOSTNAME = "chat-staging.ayafeed.com"
SENTRY_ENVIRONMENT = "staging"
SENTRY_RELEASE = "public-chat-web@staging-20260405-05c3d45"

[[env.staging.routes]]
pattern = "chat-staging.ayafeed.com"
custom_domain = true

[[env.staging.services]]
binding = "APP_API"
service = "app-api-staging"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/*", "!/assets/*" ]
