  <rect width="1600" height="1050" fill="#f6f8f7" />
  <rect x="48" y="44" width="1504" height="960" rx="28" fill="#ffffff" stroke="#d9e0e6" stroke-width="2" />

  <text x="96" y="104" class="label">丰台露天餐饮区</text>
  <text x="96" y="140" class="meta">商铺、临时摊位、就餐区与出入口示意</text>
  <text x="1452" y="116" fill="#64748b" font-size="20" font-weight="650" text-anchor="middle">北</text>
  <path d="M1452 138 L1435 180 L1452 169 L1469 180 Z" fill="#64748b" />

  <rect x="92" y="176" width="1416" height="760" rx="26" fill="#fbfcfb" stroke="#cbd5df" stroke-width="3" />
  <path d="M 138 224 L 1348 224 L 1348 868 L 138 868 Z" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linejoin="round" />
