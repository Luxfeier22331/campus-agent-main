<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-label="丰台露天餐饮区平面图">
  <title>丰台露天餐饮区平面图</title>
  <desc>丰台校区露天餐饮区的商铺、临时摊位、就餐区、通道和出入口示意图。</desc>
  <defs>
    <style>
      text {
        font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif;
      }
      .label {
        fill: #334155;
        font-size: 24px;
        font-weight: 700;
      }
      .meta {
        fill: #64748b;
        font-size: 17px;
        font-weight: 500;
      }
      .zone-label {
        fill: #475569;
        font-size: 28px;
        font-weight: 750;
      }
      .anchor-card {
        fill: #fbfbf8;
        stroke: #c6d0db;
        stroke-width: 3;
      }
      .anchor-badge {
        fill: #eef4f2;
        stroke: #9eb8b0;
        stroke-width: 2;
      }
      .temporary-card {
        fill: #f8fafc;
        stroke: #c2ceda;
      }
      .seating {
        fill: #f6f1e8;
        stroke: #d1bfa5;
      }
      .path-line {
        fill: none;
        stroke: #a8b3c0;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 12 14;
      }
    </style>
    <marker id="flow-arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a8b3c0" />
    </marker>
