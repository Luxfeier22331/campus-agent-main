name = "edge-router"
main = "src/index.ts"
compatibility_date = "2026-03-17"
workers_dev = false
preview_urls = false
upload_source_maps = true

[env.local.vars]
DEFAULT_LANE = "staging"

[[env.local.services]]
binding = "CAMPUS_WEB_STAGING"
service = "campus-web-local"

[[env.staging.services]]
binding = "CAMPUS_WEB_STAGING"
service = "campus-web-staging"
