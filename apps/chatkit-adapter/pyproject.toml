[project]
name = "campus-chatkit-adapter"
version = "0.1.0"
description = "ChatKit protocol adapter for campus-agent Q&A."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.124.0",
  "httpx>=0.28.1",
  "openai-chatkit>=1.6.0,<1.7.0",
  "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
  "pytest-asyncio>=1.3.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/campus_chatkit_adapter"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_chatkit_adapter", "pyproject.toml", "README.md"]

[project.scripts]
campus-chatkit-adapter = "campus_chatkit_adapter.server:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
