name = "protected-panel-web"
main = "src/index.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[secrets]
required = ["PANEL_APP_API_SHARED_SECRET"]

[[services]]
binding = "APP_API"
service = "app-api"

[env.local.vars]
PANEL_PROTECTION_ENVELOPE = "cloudflare-access"
PANEL_RUNTIME_API_BASE_URL = "https://app-api.internal"
ACCESS_TEAM_DOMAIN = "http://127.0.0.1:9798"
ACCESS_POLICY_AUD = "panel-local-smoke"

[env.local.secrets]
required = ["PANEL_APP_API_SHARED_SECRET"]

[[env.local.services]]
binding = "APP_API"
service = "app-api"
environment = "local"

[env.staging.vars]
PANEL_PROTECTION_ENVELOPE = "cloudflare-access"
PANEL_RUNTIME_API_BASE_URL = "https://campus-api-staging.ayafeed.com"
SENTRY_ENVIRONMENT = "staging"

[env.staging.secrets]
required = ["PANEL_APP_API_SHARED_SECRET", "SENTRY_DSN"]

[[env.staging.routes]]
pattern = "campus-panel-staging.ayafeed.com"
custom_domain = true

[[env.staging.services]]
binding = "APP_API"
service = "app-api-staging"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/*", "!/assets/*" ]
