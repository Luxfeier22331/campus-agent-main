name = "protected-panel-web"
main = "src/index.ts"
compatibility_date = "2026-03-17"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "panel.example.com/*", zone_name = "example.com" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/*", "!/assets/*" ]
