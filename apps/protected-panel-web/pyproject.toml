[project]
name = "campus-protected-panel-web"
version = "0.1.0"
description = "Protected panel web runtime shell for campus-agent v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "campus-shared",
]

[tool.uv]
package = true

[tool.uv.sources]
campus-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_protected_panel_web"]

[tool.hatch.build.targets.sdist]
include = ["src/campus_protected_panel_web", "pyproject.toml", "README.md"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
