name: pr-checks

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.surfaces.outputs.base_sha }}
      contracts: ${{ steps.surfaces.outputs.contracts }}
      go: ${{ steps.surfaces.outputs.go }}
      ingestion: ${{ steps.surfaces.outputs.ingestion }}
      langfuse: ${{ steps.surfaces.outputs.langfuse }}
      web_graph: ${{ steps.surfaces.outputs.web_graph }}
      worker_runtime: ${{ steps.surfaces.outputs.worker_runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect changed surfaces
        id: surfaces
        shell: bash
        run: |
          set -euo pipefail

          head_sha="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base_sha"
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

          python scripts/detect_ci_changed_surfaces.py \
            --base "$base_sha" \
            --head "$head_sha" \
            --github-output "$GITHUB_OUTPUT"

  repo-checks:
    needs: changes
    runs-on: ubuntu-latest
    env:
      CI_BASE_REF: ${{ needs.changes.outputs.base_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: apps/execution-control/go.mod

      - name: Install conftest
        run: |
          go install github.com/open-policy-agent/conftest@v0.65.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run repo guard lane
        run: pnpm ci:repo-guard

      - name: Run repo static lane
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm ci:repo-static:affected
          else
            pnpm ci:repo-static
          fi

      - name: Validate workflow configuration
        run: pnpm ci:config:lint

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: apps/execution-control/go.mod

      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run secret scan
        run: pnpm ci:secrets

  web-graph:
    needs: changes
    if: needs.changes.outputs.web_graph == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base_sha }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run affected web graph lane
        run: pnpm ci:web-graph:affected

  worker-runtime:
    needs: changes
    if: needs.changes.outputs.worker_runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Worker runtime lane
        run: pnpm ci:worker-runtime

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Run contracts lane
        run: pnpm ci:contracts

  execution-control-go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: apps/execution-control/go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      - name: Run Go static checks and tests
        run: pnpm ci:go

  langfuse-integration:
    needs: changes
    if: needs.changes.outputs.langfuse == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Langfuse integration checks
        run: pnpm ci:langfuse

  ingestion:
    needs: changes
    if: needs.changes.outputs.ingestion == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Run ingestion lane
        run: pnpm ci:ingestion

  required-checks:
    needs:
      - changes
      - repo-checks
      - secret-scan
      - web-graph
      - worker-runtime
      - contracts
      - execution-control-go
      - langfuse-integration
      - ingestion
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful PR checks
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.repo-checks.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.web-graph.result }}" \
            "${{ needs.worker-runtime.result }}" \
            "${{ needs.contracts.result }}" \
            "${{ needs.execution-control-go.result }}" \
            "${{ needs.langfuse-integration.result }}" \
            "${{ needs.ingestion.result }}"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                failed=1
                ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more required PR check lanes failed."
            exit 1
          fi
