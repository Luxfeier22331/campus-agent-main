name: repo-guard

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: uv sync --all-packages --dev

      - name: Repo structure guard
        run: uv run --all-packages python -m unittest tests.test_repo_collaboration tests.test_docs_structure tests.test_environment_layout
