name: verify

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Select the affected verification profile
        required: true
        default: docker
        type: choice
        options:
          - docker
          - database
          - browser
      base_ref:
        description: Git revision used as the comparison base
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.revisions.outputs.base_sha }}
      head_sha: ${{ steps.revisions.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve revisions
        id: revisions
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse "$BASE_REF" 2>/dev/null || git rev-parse "origin/$BASE_REF")"
          head_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$base_sha" "$head_sha"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

  docker:
    if: inputs.profile == 'docker'
    needs: plan
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 90
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify Docker
        run: docker info >/dev/null

      - name: Setup resource-bounded Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          name: campus-agent-verify-${{ github.run_id }}
          keep-state: false
          cleanup: true
          cache-binary: false
          driver-opts: |
            cgroup-parent=ci.slice
            cpu-period=100000
            cpu-quota=200000
            memory=2g
            memory-swap=2g
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              reservedSpace = "2GB"
              maxUsedSpace = "8GB"
              minFreeSpace = "40GB"

      - name: Build affected Docker targets
        run: pnpm ci:affected:docker "${{ needs.plan.outputs.base_sha }}" "${{ needs.plan.outputs.head_sha }}"

  database:
    if: inputs.profile == 'database'
    needs: plan
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 90
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify database tools
        run: |
          test "$(go version | awk '{print $3}')" = "go1.26.5"
          docker info >/dev/null

      - name: Run affected database suites
        run: pnpm ci:affected:database "${{ needs.plan.outputs.base_sha }}" "${{ needs.plan.outputs.head_sha }}"

  browser:
    if: inputs.profile == 'browser'
    needs: plan
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 45
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup browser workspace
        uses: ./.github/actions/setup-node-pnpm
        with:
          workspace-filters: campus-web...

      - name: Ensure Chromium headless shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
        run: pnpm --dir apps/campus-web exec playwright install --only-shell chromium

      - name: Run affected browser smoke
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
        run: pnpm ci:affected:browser "${{ needs.plan.outputs.base_sha }}" "${{ needs.plan.outputs.head_sha }}"

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          if-no-files-found: ignore
          name: verify-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/campus-web/playwright-report/e2e
            apps/campus-web/playwright-report/e2e-worker
            apps/campus-web/test-results/e2e
            apps/campus-web/test-results/e2e-worker
          retention-days: 7
