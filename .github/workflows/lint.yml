name: lint

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  python-ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Run Ruff lint
        run: uv run --all-packages ruff check .

      - name: Run Ruff format check
        run: uv run --all-packages ruff format . --check

  intent-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Run deterministic intent release gate
        run: uv run --all-packages python -m scripts.intent_gate

      - name: Upload intent gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-release-gate
          path: .tmp/evals/intent-release-gate.json
          if-no-files-found: warn

  supervisor-api-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache-dependency-path: apps/supervisor-api/go.mod

      - name: Check Go formatting
        run: test -z "$(gofmt -l apps/supervisor-api)"

      - name: Run Go vet
        run: cd apps/supervisor-api && go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: apps/supervisor-api

      - name: Run Go tests
        run: cd apps/supervisor-api && go test ./...

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Run YAML lint
        run: uv run --all-packages python -m scripts.check_yaml_tracked

  toml-structure:
