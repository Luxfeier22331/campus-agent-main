name: lint

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      intent: ${{ steps.filter.outputs.intent }}
      langfuse: ${{ steps.filter.outputs.langfuse }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed surfaces
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          head_sha="${{ github.sha }}"
          base_sha=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_sha="${{ github.event.before }}"
          fi

          if [ -n "$base_sha" ] && ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base_sha" || base_sha=""
          fi

          if [ -n "$base_sha" ]; then
            git diff --name-only "$base_sha" "$head_sha" > changed-files.txt
          else
            git ls-files > changed-files.txt
          fi

          matches_any() {
            local group="$1"
            local path
            while IFS= read -r path; do
              case "$group:$path" in
                go:apps/execution-control/*|\
                go:apps/execution-control/**/*|\
                go:configs/runtime/*|\
                go:configs/runtime/**/*|\
                go:packages/contracts/schemas/runtime-*|\
                go:.github/workflows/lint.yml|\
                go:package.json|\
                go:pnpm-lock.yaml)
                  return 0
                  ;;
                intent:apps/execution-control/*|\
                intent:apps/execution-control/**/*|\
                intent:configs/runtime/tool-catalog.v1.json|\
                intent:configs/runtime/workflow-artifacts.v2.json|\
                intent:packages/contracts/schemas/runtime-*|\
                intent:packages/evals/*|\
                intent:packages/evals/**/*|\
                intent:scripts/intent_gate.py|\
                intent:scripts/intent_release_gate.py|\
                intent:tests/evals/*intent*.py|\
                intent:.github/workflows/lint.yml|\
                intent:package.json|\
                intent:pyproject.toml|\
                intent:uv.lock)
                  return 0
                  ;;
                langfuse:packages/eval-langfuse/*|\
                langfuse:packages/eval-langfuse/**/*|\
                langfuse:apps/app-api/scripts/check-langfuse-trace-id-vectors.ts|\
                langfuse:apps/app-api/src/modules/telemetry/*|\
                langfuse:apps/app-api/src/modules/telemetry/**/*|\
                langfuse:tests/fixtures/langfuse_trace_id_vectors.json|\
                langfuse:docs/product/langfuse-evals.md|\
                langfuse:docs/architecture/system/langfuse.md|\
                langfuse:docs/contracts/langfuse-runtime.md|\
                langfuse:.github/workflows/lint.yml|\
                langfuse:package.json|\
                langfuse:pnpm-lock.yaml)
                  return 0
                  ;;
              esac
            done < changed-files.txt
            return 1
          }

          for group in go intent langfuse; do
            if matches_any "$group"; then
              echo "$group=true" >> "$GITHUB_OUTPUT"
            else
              echo "$group=false" >> "$GITHUB_OUTPUT"
            fi
          done

  repo-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Run repo static lane
        run: pnpm ci:repo-static

  intent-release-gate:
    needs: changes
    if: needs.changes.outputs.intent == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Run deterministic intent release gate
        run: pnpm ci:intent

      - name: Upload intent gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-release-gate
          path: .tmp/evals/intent-release-gate.json
          if-no-files-found: warn

  langfuse-integration:
    needs: changes
    if: needs.changes.outputs.langfuse == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Langfuse integration checks
        run: pnpm ci:langfuse

  execution-control-go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache-dependency-path: apps/execution-control/go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      - name: Run Go static checks and tests
        run: pnpm ci:go
