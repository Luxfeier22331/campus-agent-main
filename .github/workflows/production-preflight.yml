name: production-preflight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref on main history to validate for production
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: production-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Verify ref is on main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Build Worker apps
        run: pnpm ci:worker

      - name: Write production preflight summary
        shell: bash
        env:
          PREFLIGHT_REF: ${{ inputs.ref }}
        run: |
          {
            echo "## Production preflight"
            echo ""
            echo "- Ref: \`$PREFLIGHT_REF\`"
            echo "- Production environment approval: passed"
            echo "- Worker build preflight: passed"
            echo ""
            echo "Production deployment is intentionally not wired in this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
