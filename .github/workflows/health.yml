name: manual-health

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Select one explicit health-check profile
        required: true
        default: node
        type: choice
        options:
          - node
          - go
          - rust
          - database
          - browser
          - dependencies

permissions:
  contents: read

concurrency:
  group: manual-health
  cancel-in-progress: false

jobs:
  node:
    if: inputs.profile == 'node'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 75
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Python
        uses: ./.github/actions/setup-python-uv

      - name: Run repository and contract checks
        run: |
          pnpm ci:repo
          pnpm ci:contracts

      - name: Run full TypeScript checks
        run: pnpm ci:typescript:full

      - name: Run ingestion checks
        run: pnpm ci:ingest

      - name: Run evaluation checks
        run: pnpm ci:eval

  browser:
    if: inputs.profile == 'browser'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 30
    env:
      CAMPUS_WEB_E2E_DOCS_PREBUILT: "1"
      CAMPUS_WEB_E2E_PREBUILT: "1"
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup browser workspaces
        uses: ./.github/actions/setup-node-pnpm
        with:
          workspace-filters: campus-agent-web-workspace
          workspace-filters-json: '["campus-web...", "ops-web..."]'

      - name: Build browser fixtures
        run: >-
          pnpm turbo run build:docs:fixture test:worker build:app
          --filter=campus-web --concurrency=1 --summarize

      - name: Ensure Chromium headless shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
        run: pnpm --dir apps/campus-web exec playwright install --only-shell chromium

      - name: Run browser regressions
        env:
          OPS_WEB_BROWSER_TEST_PORT: "4278"
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
        run: |
          pnpm --dir apps/campus-web run test:e2e:full
          pnpm --dir apps/ops-web test:browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          if-no-files-found: ignore
          name: manual-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/campus-web/playwright-report/e2e
            apps/campus-web/playwright-report/e2e-worker
            apps/campus-web/test-results/e2e
            apps/campus-web/test-results/e2e-worker
            apps/ops-web/test-results
            apps/ops-web/playwright-report
          retention-days: 7

  go:
    if: inputs.profile == 'go'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Verify Go tools
        run: |
          test "$(go version | awk '{print $3}')" = "go1.26.5"
          test "$(golangci-lint version --short)" = "2.11.4"

      - name: Run full Go checks
        run: scripts/ci/go-check.sh

  rust:
    if: inputs.profile == 'rust'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Verify Rust tools
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.91.0"
          test "$(cargo --version | awk '{print $2}')" = "1.91.0"
          rustup component list --toolchain 1.91.0 --installed | rg -q '^clippy-'
          rustup component list --toolchain 1.91.0 --installed | rg -q '^rustfmt-'

      - name: Run full Rust checks
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/cargo-target/campus-agent
        run: scripts/ci/rust-check.sh

  database:
    if: inputs.profile == 'database'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup database workspaces
        uses: ./.github/actions/setup-node-pnpm
        with:
          workspace-filters: campus-agent-web-workspace
          workspace-filters-json: '["app-api...", "ops-web...", "transport-publisher..."]'

      - name: Verify database tools
        run: |
          test "$(go version | awk '{print $3}')" = "go1.26.5"
          docker info >/dev/null

      - name: Run PostgreSQL integration suites
        run: pnpm ci:postgres

  dependencies:
    if: inputs.profile == 'dependencies'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Scan dependency ecosystems
        uses: ./.github/actions/run-osv-scan
