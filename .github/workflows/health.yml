name: manual-health

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Select one explicit health-check profile
        required: true
        default: node
        type: choice
        options:
          - node
          - go
          - rust
          - database
          - browser
          - dependencies
          - docker
      docker_target:
        description: Docker Bake target used by the docker profile
        required: true
        default: agent-runtime
        type: choice
        options:
          - agent-runtime
          - app-api-schema
          - docs-publish
          - dining-sync
          - execution-control
          - ingestion-control
          - ingestion-control-worker
          - ops-web
          - source-collector
          - transport-publisher

permissions:
  contents: read

concurrency:
  group: manual-health
  cancel-in-progress: false

env:
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  node:
    if: inputs.profile == 'node'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6
        with:
          version: "10.34.5"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1  # v8.3.1
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12"

      - name: Install workspaces
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install evaluation dependencies
        run: uv sync --package campus-ragas-runner

      - name: Run Node and Python checks
        run: |
          pnpm ci:repo
          pnpm ci:contracts
          pnpm ci:typescript:full
          pnpm ci:ingest
          pnpm ci:eval

  browser:
    if: inputs.profile == 'browser'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 30
    env:
      CAMPUS_WEB_E2E_DOCS_PREBUILT: "1"
      CAMPUS_WEB_E2E_PREBUILT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6
        with:
          version: "10.34.5"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install browser workspaces
        run: >-
          pnpm install --frozen-lockfile --prefer-offline
          --filter campus-agent-web-workspace
          --filter 'campus-web...'
          --filter 'ops-web...'

      - name: Build browser fixtures
        run: >-
          pnpm turbo run build:docs:fixture test:worker build:app
          --filter=campus-web --concurrency=1 --summarize

      - name: Ensure Chromium headless shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
        run: pnpm --dir apps/campus-web exec playwright install --only-shell chromium

      - name: Run browser regressions
        env:
          OPS_WEB_BROWSER_TEST_PORT: "4278"
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
        run: |
          pnpm --dir apps/campus-web run test:e2e:full
          pnpm --dir apps/ops-web test:browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          if-no-files-found: ignore
          name: manual-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/campus-web/playwright-report/e2e
            apps/campus-web/playwright-report/e2e-worker
            apps/campus-web/test-results/e2e
            apps/campus-web/test-results/e2e-worker
            apps/ops-web/test-results
            apps/ops-web/playwright-report
          retention-days: 7

  go:
    if: inputs.profile == 'go'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6
        with:
          version: "10.34.5"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go lint tools
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e  # v4.0.5
        env:
          AQUA_ROOT_DIR: ${{ runner.tool_cache }}/aqua
        with:
          aqua_version: v2.62.1

      - name: Install task runner
        run: >-
          pnpm install --frozen-lockfile --prefer-offline
          --filter campus-agent-web-workspace
          --filter execution-control

      - name: Verify Go toolchain
        run: test "$(go version | awk '{print $3}')" = "go1.26.5"

      - name: Run Go checks
        run: pnpm ci:go

  rust:
    if: inputs.profile == 'rust'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6
        with:
          version: "10.34.5"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install task runner
        run: >-
          pnpm install --frozen-lockfile --prefer-offline
          --filter campus-agent-web-workspace
          --filter ingestion-kernels-rs

      - name: Run Rust checks
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/cargo-target/campus-agent
        run: pnpm ci:rust

  database:
    if: inputs.profile == 'database'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6
        with:
          version: "10.34.5"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install database workspaces
        run: >-
          pnpm install --frozen-lockfile --prefer-offline
          --filter campus-agent-web-workspace
          --filter 'app-api...'
          --filter 'dining-sync...'
          --filter execution-control
          --filter 'ingestion-control...'
          --filter 'ops-web...'
          --filter 'transport-publisher...'

      - name: Verify database tools
        run: |
          test "$(go version | awk '{print $3}')" = "go1.26.5"
          docker info >/dev/null

      - name: Run PostgreSQL integration suites
        run: pnpm ci:postgres

  dependencies:
    if: inputs.profile == 'dependencies'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup dependency scanner
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e  # v4.0.5
        env:
          AQUA_ROOT_DIR: ${{ runner.tool_cache }}/aqua
        with:
          aqua_version: v2.62.1

      - name: Scan dependency ecosystems
        run: osv-scanner scan source --config osv-scanner.toml --format=vertical --verbosity=error

  docker:
    if: inputs.profile == 'docker'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup resource-bounded Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          name: campus-agent-manual-${{ github.run_id }}
          keep-state: false
          cleanup: true
          cache-binary: false
          driver-opts: |
            cgroup-parent=ci.slice
            cpu-period=100000
            cpu-quota=200000
            memory=2g
            memory-swap=2g
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              reservedSpace = "2GB"
              maxUsedSpace = "8GB"
              minFreeSpace = "40GB"

      - name: Build selected Docker target
        env:
          TARGET: ${{ inputs.docker_target }}
        run: >-
          docker buildx bake --file docker-bake.hcl --pull
          --set "${TARGET}.output=type=cacheonly" "${TARGET}"
