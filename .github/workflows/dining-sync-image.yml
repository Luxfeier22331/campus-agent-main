name: dining-sync-image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Push dining-sync image to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: dining-sync-image-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: ghcr.io/${{ github.repository }}/dining-sync

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dining-sync image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: jobs/dining-sync/Dockerfile
          load: ${{ !inputs.push_image }}
          push: ${{ inputs.push_image }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:staging
