name: dining-sync-image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Push dining-sync image to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: dining-sync-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/dining-sync

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build dining-sync image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: jobs/dining-sync/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan dining-sync image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate dining-sync image SBOM
        if: ${{ inputs.push_image }}
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          artifact-name: dining-sync-sbom.spdx.json
          format: spdx-json
          dependency-snapshot: false
          upload-artifact: true
          upload-release-assets: false

      - name: Login to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push dining-sync image
        if: ${{ inputs.push_image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: jobs/dining-sync/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
