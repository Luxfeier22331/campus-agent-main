name: formal-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 正式版本号
        required: true
        type: string
      gitops_deployment_id:
        description: 已成功的 GitOps staging Deployment ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: gitops-token
        with:
          client-id: ${{ vars.GITOPS_PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PROMOTER_PRIVATE_KEY }}
          owner: MUC-WIKI
          repositories: campus-agent-gitops
          permission-actions: write
      - name: Request GitOps formal publication
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          DEPLOYMENT_ID: ${{ inputs.gitops_deployment_id }}
        run: >-
          gh workflow run publish-formal-release.yml --repo MUC-WIKI/campus-agent-gitops
          --ref main -f version="$RELEASE_VERSION" -f gitops_deployment_id="$DEPLOYMENT_ID"
