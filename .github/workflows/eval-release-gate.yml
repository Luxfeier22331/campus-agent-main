name: eval-release-gate

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Eval profile to run
        required: true
        type: choice
        options:
          - handbook
          - curriculum
          - official-web-stable-reference
          - official-web-fresh-news
          - service-guide-lookup
      reruns:
        description: Optional rerun count override
        required: false
        default: ""
        type: string
      qdrant_collection_name:
        description: Required for official-web profiles
        required: false
        default: ""
        type: string
      publish_dry_run:
        description: Also build operator publish dry-run artifact
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  eval-release-gate:
    runs-on: ubuntu-latest
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      EVAL_RAGAS_MODEL: ${{ vars.EVAL_RAGAS_MODEL }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
      APP_API_BASE_URL: ${{ vars.APP_API_BASE_URL }}
      APP_API_INTERNAL_SHARED_SECRET: ${{ secrets.APP_API_INTERNAL_SHARED_SECRET }}
      APP_API_EVAL_USER_EMAIL: ${{ vars.APP_API_EVAL_USER_EMAIL }}
      APP_API_EVAL_USER_ID: ${{ vars.APP_API_EVAL_USER_ID }}
      APP_API_EVAL_USER_NAME: ${{ vars.APP_API_EVAL_USER_NAME }}
      APP_API_EVAL_PRINCIPAL_TYPE: ${{ vars.APP_API_EVAL_PRINCIPAL_TYPE }}
      APP_API_EVAL_TRACE_LINK_TEMPLATE: ${{ vars.APP_API_EVAL_TRACE_LINK_TEMPLATE }}
      APP_API_EVAL_ISSUE_LINK_TEMPLATE: ${{ vars.APP_API_EVAL_ISSUE_LINK_TEMPLATE }}
      APP_API_EVAL_ISSUE_FINGERPRINT_TEMPLATE: ${{ vars.APP_API_EVAL_ISSUE_FINGERPRINT_TEMPLATE }}
      EVAL_GATE_PUBLISH_GRADE_SOURCE: ${{ vars.EVAL_GATE_PUBLISH_GRADE_SOURCE }}
      EVAL_GATE_PUBLISH_GRADER_VERSION: ${{ vars.EVAL_GATE_PUBLISH_GRADER_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Materialize eval gate env file
        shell: bash
        run: |
          cat > .env <<EOF
          LLM_BASE_URL=${LLM_BASE_URL}
          LLM_API_KEY=${LLM_API_KEY}
          EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
          EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
          EMBEDDING_MODEL=${EMBEDDING_MODEL}
          EVAL_RAGAS_MODEL=${EVAL_RAGAS_MODEL}
          EVAL_JUDGE_MODEL=${EVAL_JUDGE_MODEL}
          APP_API_BASE_URL=${APP_API_BASE_URL}
          APP_API_INTERNAL_SHARED_SECRET=${APP_API_INTERNAL_SHARED_SECRET}
          APP_API_EVAL_USER_EMAIL=${APP_API_EVAL_USER_EMAIL}
          APP_API_EVAL_USER_ID=${APP_API_EVAL_USER_ID}
          APP_API_EVAL_USER_NAME=${APP_API_EVAL_USER_NAME}
          APP_API_EVAL_PRINCIPAL_TYPE=${APP_API_EVAL_PRINCIPAL_TYPE}
          APP_API_EVAL_TRACE_LINK_TEMPLATE=${APP_API_EVAL_TRACE_LINK_TEMPLATE}
          APP_API_EVAL_ISSUE_LINK_TEMPLATE=${APP_API_EVAL_ISSUE_LINK_TEMPLATE}
          APP_API_EVAL_ISSUE_FINGERPRINT_TEMPLATE=${APP_API_EVAL_ISSUE_FINGERPRINT_TEMPLATE}
          EOF

      - name: Eval doctor
        run: |
          env UV_CACHE_DIR=/tmp/uv-cache uv run --all-packages python -m scripts.eval_gate doctor --json | tee eval-gate-doctor.json

      - name: Eval accept
        id: accept
        shell: bash
        run: |
          args=(
            env UV_CACHE_DIR=/tmp/uv-cache
            uv run --all-packages python -m scripts.eval_gate accept
            --profile "${{ inputs.profile }}"
            --json
          )
          if [ -n "${{ inputs.reruns }}" ]; then
            args+=(--reruns "${{ inputs.reruns }}")
          fi
          if [ -n "${{ inputs.qdrant_collection_name }}" ]; then
            args+=(--qdrant-collection-name "${{ inputs.qdrant_collection_name }}")
          fi
          if [ "${{ inputs.publish_dry_run }}" = "true" ] && [ "${{ inputs.profile }}" != "service-guide-lookup" ]; then
            args+=(--publish-dry-run)
            args+=(--publish-grade-source "${EVAL_GATE_PUBLISH_GRADE_SOURCE}")
            args+=(--publish-grader-version "${EVAL_GATE_PUBLISH_GRADER_VERSION}")
          fi
          "${args[@]}" | tee eval-gate-accept.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("eval-gate-accept.json").read_text(encoding="utf-8"))
          with Path(Path.cwd() / Path(".github-output")).open("a", encoding="utf-8") as handle:
              handle.write(f"artifact_dir={payload['output_dir']}\n")
          PY
          cat .github-output >> "$GITHUB_OUTPUT"

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-release-gate-${{ inputs.profile }}
          path: |
            eval-gate-doctor.json
            eval-gate-accept.json
            ${{ steps.accept.outputs.artifact_dir }}
