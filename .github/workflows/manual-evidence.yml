name: manual-validation-profile

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Run exactly one explicitly selected validation profile
        required: true
        type: choice
        options:
          - go
          - ragas
          - app-api-product-db
          - agent-control-postgres
          - agent-runtime-temporal
          - memory-postgres
          - model-config-postgres
          - ops-web-postgres
          - infra

permissions:
  contents: read

concurrency:
  group: manual-validation-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    max-jobs = 1
    cores = 2

jobs:
  evidence:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'self-hosted' && '["self-hosted","Linux","campus-ci"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 90
    defaults:
      run:
        shell: nix develop .#ci-core --command bash -e {0}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          enable_kvm: false

      - name: Resolve profile requirements
        id: profile
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          metadata="$(node --experimental-strip-types scripts/ci/validation.mts \
            --describe-profile "$PROFILE")"
          test "$(jq -r '.lane' <<< "$metadata")" = manual
          echo "requires_docker=$(jq -r '.requiresDocker' <<< "$metadata")" >> "$GITHUB_OUTPUT"
          echo "requires_uv=$(jq -r '.requiresUv' <<< "$metadata")" >> "$GITHUB_OUTPUT"
          echo "shell=$(jq -r '.shell' <<< "$metadata")" >> "$GITHUB_OUTPUT"
          echo "packages=$(jq -c '.installPackages' <<< "$metadata")" >> "$GITHUB_OUTPUT"

      - name: Install selected workspaces
        env:
          PACKAGES: ${{ steps.profile.outputs.packages }}
        run: |
          filters=(--filter campus-agent-web-workspace)
          while IFS= read -r package; do
            filters+=(--filter "$package")
          done < <(jq -r '.[]' <<< "$PACKAGES")
          pnpm install --frozen-lockfile "${filters[@]}"

      - name: Install evaluation dependencies
        if: steps.profile.outputs.requires_uv == 'true'
        shell: nix develop .#ci-light --command bash -e {0}
        run: uv sync --locked --package campus-ragas-runner

      - name: Verify Docker evidence dependency
        if: steps.profile.outputs.requires_docker == 'true'
        shell: nix develop .#ci-release --command bash -e {0}
        run: docker info >/dev/null

      - name: Run selected profile
        shell: bash -e {0}
        env:
          VALIDATION_SHELL: ${{ steps.profile.outputs.shell }}
          TURBO_CACHE: "local:rw,remote:rw"
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VALIDATION_PROFILES: '["${{ inputs.profile }}"]'
        run: |
          set -euo pipefail
          nix develop ".#$VALIDATION_SHELL" --command node --experimental-strip-types scripts/ci/evidence.mts \
            --profiles "$VALIDATION_PROFILES"
