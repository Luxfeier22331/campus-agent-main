name: manual-validation-profile

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Run exactly one explicitly selected validation profile
        required: true
        type: choice
        options:
          - go
          - rust
          - ragas
          - app-api-migration
          - app-api-product-db
          - execution-control-postgres
          - ingestion-control-postgres
          - ops-web-postgres
          - infra
          - otel

permissions:
  contents: read

concurrency:
  group: manual-validation-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    max-jobs = 1
    cores = 2

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: nix develop .#ci-full --command bash -e {0}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          enable_kvm: false

      - name: Install workspaces
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Install evaluation dependencies
        if: inputs.profile == 'ragas'
        run: uv sync --package campus-ragas-runner

      - name: Verify Docker evidence dependency
        if: >-
          inputs.profile == 'app-api-migration' ||
          inputs.profile == 'app-api-product-db' ||
          inputs.profile == 'execution-control-postgres' ||
          inputs.profile == 'ingestion-control-postgres' ||
          inputs.profile == 'ops-web-postgres' ||
          inputs.profile == 'otel'
        run: docker info >/dev/null

      - name: Run selected profile
        env:
          BASE_SHA: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
          TURBO_CACHE: "local:rw,remote:rw"
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VALIDATION_PROFILES: '["${{ inputs.profile }}"]'
        run: |
          set -euo pipefail
          base_sha="$(git merge-base HEAD "origin/${BASE_SHA}")"
          test -n "$base_sha"
          node --experimental-strip-types scripts/ci/evidence.mts \
            --base "$base_sha" \
            --head "$HEAD_SHA" \
            --profiles "$VALIDATION_PROFILES"
