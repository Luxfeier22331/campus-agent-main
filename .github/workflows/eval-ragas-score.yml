name: eval-ragas-score

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Eval profile to run
        required: true
        type: choice
        options:
          - ragas-trace
          - ragas-dataset
      dataset_name:
        description: Required Langfuse dataset name for ragas-dataset
        required: false
        default: ""
        type: string
      dataset_version:
        description: Optional Langfuse dataset version for ragas-dataset
        required: false
        default: ""
        type: string
      trace_name:
        description: Optional Langfuse trace name filter for ragas-trace
        required: false
        default: ""
        type: string
      trace_tag:
        description: Optional Langfuse trace tag filter for ragas-trace
        required: false
        default: ""
        type: string
      trace_release:
        description: Optional Langfuse trace release filter for ragas-trace
        required: false
        default: ""
        type: string
      limit:
        description: Optional positive integer sample limit for Ragas lanes
        required: false
        default: ""
        type: string
      runtime_config_path:
        description: Optional Ragas runner runtime config path
        required: false
        default: ""
        type: string
      publish_langfuse_scores:
        description: Publish Ragas scores to Langfuse
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  eval-ragas-score:
    runs-on: ubuntu-latest
    environment: eval-internal
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_ENVIRONMENT: ${{ vars.LANGFUSE_ENVIRONMENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Install Node workspace
        run: pnpm install --frozen-lockfile

      - name: Install Python workspace
        run: uv sync --all-packages --dev

      - name: Score Langfuse traces with Ragas
        id: ragas_trace
        if: ${{ inputs.profile == 'ragas-trace' }}
        shell: bash
        run: |
          artifact_dir=".tmp/eval-ragas-score/ragas-trace"
          mkdir -p "${artifact_dir}"
          args=()
          if [ -n "${{ inputs.trace_name }}" ]; then
            args+=(--trace-name "${{ inputs.trace_name }}")
          fi
          if [ -n "${{ inputs.trace_tag }}" ]; then
            args+=(--tag "${{ inputs.trace_tag }}")
          fi
          if [ -n "${{ inputs.trace_release }}" ]; then
            args+=(--release "${{ inputs.trace_release }}")
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            args+=(--limit "${{ inputs.limit }}")
          fi
          if [ -n "${{ inputs.runtime_config_path }}" ]; then
            args+=(--runtime-config "${{ inputs.runtime_config_path }}")
          fi
          if [ "${{ inputs.publish_langfuse_scores }}" != "true" ]; then
            args+=(--validate-only)
          fi
          pnpm --dir packages/eval-langfuse langfuse ragas-score-traces \
            "${args[@]}" \
            --json | tee "${artifact_dir}/ragas-trace-score.json"
          {
            echo "artifact_dir=${artifact_dir}"
          } >> "$GITHUB_OUTPUT"

      - name: Score Langfuse dataset with Ragas
        id: ragas_dataset
        if: ${{ inputs.profile == 'ragas-dataset' }}
        shell: bash
        run: |
          if [ -z "${{ inputs.dataset_name }}" ]; then
            echo "dataset_name is required for ragas-dataset" >&2
            exit 1
          fi
          artifact_dir=".tmp/eval-ragas-score/ragas-dataset"
          mkdir -p "${artifact_dir}"
          args=(--dataset "${{ inputs.dataset_name }}")
          if [ -n "${{ inputs.dataset_version }}" ]; then
            args+=(--dataset-version "${{ inputs.dataset_version }}")
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            args+=(--limit "${{ inputs.limit }}")
          fi
          if [ -n "${{ inputs.runtime_config_path }}" ]; then
            args+=(--runtime-config "${{ inputs.runtime_config_path }}")
          fi
          if [ "${{ inputs.publish_langfuse_scores }}" != "true" ]; then
            args+=(--validate-only)
          fi
          pnpm --dir packages/eval-langfuse langfuse ragas-score-dataset \
            "${args[@]}" \
            --json | tee "${artifact_dir}/ragas-dataset-score.json"
          {
            echo "artifact_dir=${artifact_dir}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v7
        with:
          name: eval-ragas-score-${{ inputs.profile }}
          path: |
            ${{ steps.ragas_trace.outputs.artifact_dir }}
            ${{ steps.ragas_dataset.outputs.artifact_dir }}
