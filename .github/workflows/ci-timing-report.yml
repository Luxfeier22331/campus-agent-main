name: ci-timing-report

on:
  # Read-only token, default-branch code, no execution of PR code or artifacts.
  workflow_run:  # zizmor: ignore[dangerous-triggers] Required to observe completed/cancelled runs.
    workflows: [pr]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed pr workflow run ID to inspect
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Never check out or execute code/artifacts from the pull request.
      - name: Checkout trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup reporting Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Report timings and recent runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: node --experimental-strip-types scripts/ci/timing-report.mts

      - name: Preserve unsuccessful-run report
        if: always() && (failure() || github.event.workflow_run.conclusion != 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ci-timing-${{ github.event.workflow_run.id || inputs.run_id }}
          path: ci-timing-report.json
          if-no-files-found: ignore
          retention-days: 7
