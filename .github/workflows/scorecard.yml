name: scorecard

on:
  workflow_dispatch:
  schedule:
    - cron: "35 2 * * 1"

permissions: read-all

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Run OpenSSF Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/scorecard"
          rm -rf "$output_dir"
          mkdir -p "$output_dir"
          # scorecard-action is amd64-only; use the official multi-arch CLI on this ARM64 runner.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env GITHUB_AUTH_TOKEN \
            --volume "$output_dir:/output" \
            ghcr.io/ossf/scorecard:v5.5.0@sha256:3f24714e9366917adb7a05635382c97dfecb14b21eaef3dfa2ea48c8e23e0795 \
            --repo="github.com/${GITHUB_REPOSITORY}" \
            --format=json \
            --output=/output/scorecard.json

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: scorecard-results
          path: ${{ runner.temp }}/scorecard/scorecard.json
          retention-days: 14
