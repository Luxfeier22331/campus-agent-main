name: scheduled-health

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 60
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Python
        uses: ./.github/actions/setup-python-uv

      - name: Run full repository lane
        run: pnpm ci:repo

      - name: Run contracts lane
        run: pnpm ci:contracts

      - name: Run full TypeScript lane
        run: |
          rm -rf .turbo/runs
          pnpm ci:typescript:full

      - name: Summarize TypeScript lane
        if: always()
        run: scripts/ci/turbo-summary.sh

      - name: Run eval lane
        run: pnpm ci:eval

  go:
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup Go
        if: runner.environment == 'github-hosted'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: apps/execution-control/go.mod

      - name: Verify Go
        if: runner.environment == 'self-hosted'
        run: test "$(go version | awk '{print $3}')" = "go1.26.5"

      - name: Install golangci-lint
        if: runner.environment == 'github-hosted'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.11.4
          install-only: true

      - name: Verify golangci-lint
        if: runner.environment == 'self-hosted'
        run: test "$(golangci-lint version --short)" = "2.11.4"

      - name: Run full Go lane
        run: scripts/ci/go-check.sh

  rust:
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup Rust
        if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@ad7910d95e317a4b12a9a3dfad520f4b409b3ec0  # 1.91.0
        with:
          components: clippy, rustfmt

      - name: Verify Rust
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.91.0"
          test "$(cargo --version | awk '{print $2}')" = "1.91.0"
          rustup component list --toolchain 1.91.0 --installed | grep -q '^clippy-'
          rustup component list --toolchain 1.91.0 --installed | grep -q '^rustfmt-'

      - name: Cache Rust
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Run full Rust lane with persistent target
        if: runner.environment == 'self-hosted'
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/cargo-target/campus-agent
        run: scripts/ci/rust-check.sh

      - name: Run full Rust lane
        if: runner.environment == 'github-hosted'
        run: scripts/ci/rust-check.sh

  deps:
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Scan dependencies
        uses: ./.github/actions/run-osv-scan
