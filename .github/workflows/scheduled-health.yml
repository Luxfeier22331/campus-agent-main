name: scheduled-health

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Run full repository lane
        run: pnpm ci:repo

  web:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Run full web lane
        run: pnpm ci:web:full

  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python-uv

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Run contracts lane
        run: pnpm ci:contracts

  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python-uv

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Run ingest lane
        run: pnpm ci:ingest

  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python-uv

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Run eval lane
        run: pnpm ci:eval

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: apps/execution-control/go.mod

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "false"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      - name: Run full Go lane
        run: pnpm ci:go

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "false"

      - name: Run full Rust lane
        run: pnpm ci:rust

  deps:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      upload-sarif: false
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=pnpm-lock.yaml
        --lockfile=uv.lock
        --lockfile=Cargo.lock
        --lockfile=apps/execution-control/go.mod
