name: pr

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    max-jobs = 1
    cores = 2

jobs:
  repo-checks:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux, campus-ci]
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop .#ci-core --command bash -e {0}
    steps:
      - name: Checkout pull request merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          enable_kvm: false

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile \
            --filter campus-agent-web-workspace \
            --filter 'campus-contracts...'

      - name: Generate pull request validation plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          plan="$(node --experimental-strip-types scripts/ci/validation.mts \
            --base "$BASE_SHA" \
            --head "$MERGE_SHA" \
            --mode pull-request)"
          jq -e . <<< "$plan" >/dev/null
          base="$(jq -r '.base' <<< "$plan")"
          head="$(jq -r '.head' <<< "$plan")"
          affected_packages="$(jq -c '.affectedPackages' <<< "$plan")"
          light_surfaces="$(jq -c '.lightSurfaces' <<< "$plan")"
          validation_profiles="$(jq -c '.validationProfiles' <<< "$plan")"
          has_evidence="$(jq -r '.validationProfiles | length > 0' <<< "$plan")"
          has_affected_node="$(jq -r --arg profile affected-node \
            '.validationProfiles | index($profile) != null' <<< "$plan")"
          has_toolchain="$(jq -r --arg profile toolchain \
            '.validationProfiles | index($profile) != null' <<< "$plan")"
          {
            echo "base=$base"
            echo "head=$head"
            echo "affected_packages=$affected_packages"
            echo "light_surfaces=$light_surfaces"
            echo "validation_profiles=$validation_profiles"
            echo "has_evidence=$has_evidence"
            echo "has_affected_node=$has_affected_node"
            echo "has_toolchain=$has_toolchain"
          } >> "$GITHUB_OUTPUT"
          jq . <<< "$plan"

      - name: Install static-check dependencies
        id: install_static_dependencies
        if: always()
        continue-on-error: true
        shell: nix develop .#ci-light --command bash -e {0}
        run: uv sync --only-dev --no-install-workspace

      - name: Check repository
        id: repository_check
        if: always()
        continue-on-error: true
        run: pnpm check

      - name: Check executable contracts
        id: contracts
        if: always() && contains(fromJSON(steps.plan.outputs.light_surfaces), 'contracts')
        continue-on-error: true
        run: pnpm --dir packages/contracts check

      - name: Lint GitHub Actions
        id: github_actions
        if: always() && contains(fromJSON(steps.plan.outputs.light_surfaces), 'config')
        continue-on-error: true
        shell: nix develop .#ci-light --command bash -e {0}
        run: actionlint && zizmor --min-severity=medium .github

      - name: Scan authored commits for secrets
        id: secrets
        if: always()
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          gitleaks git \
            --redact \
            --exit-code=1 \
            --log-opts="--no-merges ${merge_base}..${HEAD_SHA}"

      - name: Install affected workspaces
        id: install_affected
        if: always() && contains(fromJSON(steps.plan.outputs.validation_profiles), 'affected-node')
        continue-on-error: true
        env:
          AFFECTED_PACKAGES: ${{ steps.plan.outputs.affected_packages }}
        run: |
          set -euo pipefail
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' \
            <<< "$AFFECTED_PACKAGES" >/dev/null
          filters=()
          while IFS= read -r package; do
            filters+=(--filter "${package}...")
          done < <(jq -r '.[]' <<< "$AFFECTED_PACKAGES")
          pnpm install --frozen-lockfile "${filters[@]}"

      - name: Run affected Node evidence
        id: affected_node
        if: >-
          always() &&
          steps.plan.outputs.has_affected_node == 'true' &&
          steps.install_affected.outcome == 'success'
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.plan.outputs.base }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          TURBO_CACHE: "local:rw,remote:rw"
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VALIDATION_PROFILES: '["affected-node"]'
        run: >-
          node --experimental-strip-types scripts/ci/evidence.mts
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --profiles "$VALIDATION_PROFILES"

      - name: Run toolchain evidence
        id: toolchain
        if: always() && steps.plan.outputs.has_toolchain == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.plan.outputs.base }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          VALIDATION_PROFILES: '["toolchain"]'
        shell: nix develop .#ci-release --command bash -e {0}
        run: >-
          node --experimental-strip-types scripts/ci/evidence.mts
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --profiles "$VALIDATION_PROFILES"

      - name: Summarize repository evidence
        if: always()
        shell: bash -e {0}
        env:
          RESULTS: >-
            {
              "affected-node":"${{ steps.affected_node.outcome }}",
              "contracts":"${{ steps.contracts.outcome }}",
              "github-actions":"${{ steps.github_actions.outcome }}",
              "install-affected":"${{ steps.install_affected.outcome }}",
              "install-static-dependencies":"${{ steps.install_static_dependencies.outcome }}",
              "repository-check":"${{ steps.repository_check.outcome }}",
              "secrets":"${{ steps.secrets.outcome }}",
              "toolchain":"${{ steps.toolchain.outcome }}"
            }
        run: |
          jq . <<< "$RESULTS"
          if ! jq -e 'all(.[]; . != "failure" and . != "cancelled")' <<< "$RESULTS" >/dev/null; then
            echo "One or more repository evidence surfaces failed." >&2
            exit 1
          fi
