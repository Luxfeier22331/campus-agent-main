name: pr

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    max-jobs = 1
    cores = 2

jobs:
  repo-checks:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
      packages: read
    # Image evidence executes linux/arm64 runtime stages, matching publication.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'self-hosted' && '["self-hosted","Linux","campus-ci"]' || '"ubuntu-24.04-arm"') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop .#ci-core --command bash -e {0}
    steps:
      - name: Checkout pull request merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          enable_kvm: false

      - name: Configure hosted pnpm store
        id: pnpm_cache
        if: runner.environment != 'self-hosted'
        run: |
          echo CI_BODY_STARTED
          echo "PNPM_CONFIG_STORE_DIR=${RUNNER_TEMP}/pnpm-store" >> "$GITHUB_ENV"
          echo "path=${RUNNER_TEMP}/pnpm-store" >> "$GITHUB_OUTPUT"
          echo "prefix=pnpm-v2-${RUNNER_OS}-${RUNNER_ARCH}-$(node --version)-$(pnpm --version)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        id: restore_pnpm
        if: runner.environment != 'self-hosted'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pnpm_cache.outputs.path }}
          # The installation scope is known only after the validation plan is generated.
          key: ${{ steps.pnpm_cache.outputs.prefix }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-scope-
          restore-keys: |
            ${{ steps.pnpm_cache.outputs.prefix }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-scope-
            ${{ steps.pnpm_cache.outputs.prefix }}-

      - name: Install validation dependencies
        id: install_validation
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          set -euo pipefail
          pnpm install --frozen-lockfile \
            --filter campus-agent-web-workspace \
            --filter 'campus-contracts...'

      - name: Generate pull request validation plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
          PNPM_CACHE_BASE: ${{ steps.pnpm_cache.outputs.prefix }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          set -euo pipefail
          plan="$(node --experimental-strip-types scripts/ci/validation.mts \
            --base "$BASE_SHA" \
            --head "$MERGE_SHA" \
            --mode pull-request)"
          jq -e . <<< "$plan" >/dev/null
          base="$(jq -r '.base' <<< "$plan")"
          head="$(jq -r '.head' <<< "$plan")"
          affected_packages="$(jq -c '.affectedPackages' <<< "$plan")"
          light_surfaces="$(jq -c '.lightSurfaces' <<< "$plan")"
          validation_profiles="$(jq -c '.validationProfiles' <<< "$plan")"
          node_evidence_profiles="$(jq -c '[.validationProfiles[] | select(. == "affected-node" or . == "image-build")]' <<< "$plan")"
          has_container_build="$(jq -r --arg profile container-build \
            '.validationProfiles | index($profile) != null' <<< "$plan")"
          has_image_build="$(jq -r --arg profile image-build \
            '.validationProfiles | index($profile) != null' <<< "$plan")"
          pnpm_install_scope="$(jq -c '
            ["campus-agent-web-workspace", "campus-contracts..."] +
            (if (.validationProfiles | index("affected-node")) != null
             then [.affectedPackages[] + "..."] else [] end) | unique
          ' <<< "$plan")"
          pnpm_scope_hash="$(printf '%s' "$pnpm_install_scope" | sha256sum | cut -d ' ' -f1)"
          {
            echo "base=$base"
            echo "head=$head"
            echo "affected_packages=$affected_packages"
            echo "light_surfaces=$light_surfaces"
            echo "validation_profiles=$validation_profiles"
            echo "node_evidence_profiles=$node_evidence_profiles"
            echo "has_container_build=$has_container_build"
            echo "has_image_build=$has_image_build"
            echo "pnpm_cache_key=${PNPM_CACHE_BASE}-scope-${pnpm_scope_hash}"
          } >> "$GITHUB_OUTPUT"
          jq . <<< "$plan"
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          jq . <<< "$plan" > "$RUNNER_TEMP/ci-evidence/plan.json"
          printf 'CI_PLAN %s\n' "$(jq -c . <<< "$plan")"
          {
            echo '### Validation selection'
            echo
            echo '| Profile | Selected | Reason |'
            echo '| --- | --- | --- |'
            jq -r '.profileDecisions[] | "| \(.profile) | \(.selected) | \(.reason) |"' <<< "$plan"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install static-check dependencies
        id: install_static_dependencies
        if: always()
        continue-on-error: true
        shell: bash -e {0}
        run: |
          echo CI_BODY_STARTED
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          # Evaluate each environment once before prek starts concurrent hooks.
          nix print-dev-env .#ci-light > "$RUNNER_TEMP/ci-nix-light.sh"
          nix print-dev-env .#ci-format > "$RUNNER_TEMP/ci-nix-format.sh"
          bash -ec '. "$1"; uv sync --only-dev --no-install-workspace' -- "$RUNNER_TEMP/ci-nix-light.sh"
          {
            echo "CI_NIX_LIGHT_ENV=$RUNNER_TEMP/ci-nix-light.sh"
            echo "CI_NIX_FORMAT_ENV=$RUNNER_TEMP/ci-nix-format.sh"
          } >> "$GITHUB_ENV"

      - name: Lint repository
        id: repository_lint
        if: ${{ !cancelled() && steps.install_static_dependencies.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUST_LOG: prek=trace
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          started=$SECONDS
          parent_pid=$BASHPID
          (
            while kill -0 "$parent_pid" 2>/dev/null; do
              sleep 20
              echo "[lint] still running; elapsed $((SECONDS - started))s; hook progress is in the prek trace below"
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true; wait "$heartbeat_pid" 2>/dev/null || true' EXIT
          # prek owns file selection, hook concurrency, results and timing.
          pnpm lint --verbose --log-file "$RUNNER_TEMP/ci-evidence/prek.log"

      - name: Check repository documentation
        id: repository_docs
        if: ${{ !cancelled() && steps.repository_lint.outcome == 'success' }}
        continue-on-error: true
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          pnpm docs:check

      - name: Test repository scripts
        id: repository_test
        if: ${{ !cancelled() && steps.repository_docs.outcome == 'success' }}
        continue-on-error: true
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          pnpm test

      - name: Check executable contracts
        id: contracts
        if: always() && contains(fromJSON(steps.plan.outputs.light_surfaces), 'contracts')
        continue-on-error: true
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          pnpm --dir packages/contracts check

      - name: Lint GitHub Actions
        id: github_actions
        if: always() && contains(fromJSON(steps.plan.outputs.light_surfaces), 'config')
        continue-on-error: true
        shell: nix develop .#ci-light --command bash -e {0}
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          actionlint && zizmor --min-severity=medium .github

      - name: Scan authored commits for secrets
        id: secrets
        if: always()
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          gitleaks git \
            --redact \
            --exit-code=1 \
            --log-opts="--no-merges ${merge_base}..${HEAD_SHA}"

      - name: Install affected workspaces
        id: install_affected
        if: always() && contains(fromJSON(steps.plan.outputs.validation_profiles), 'affected-node')
        continue-on-error: true
        env:
          AFFECTED_PACKAGES: ${{ steps.plan.outputs.affected_packages }}
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          set -euo pipefail
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' \
            <<< "$AFFECTED_PACKAGES" >/dev/null
          filters=()
          while IFS= read -r package; do
            filters+=(--filter "${package}...")
          done < <(jq -r '.[]' <<< "$AFFECTED_PACKAGES")
          pnpm install --frozen-lockfile "${filters[@]}"

      - name: Save pnpm store
        if: >-
          !cancelled() && runner.environment != 'self-hosted' &&
          steps.restore_pnpm.outputs.cache-matched-key != steps.plan.outputs.pnpm_cache_key &&
          steps.install_validation.outcome == 'success' && steps.plan.outcome == 'success' &&
          (
            !contains(fromJSON(steps.plan.outputs.validation_profiles), 'affected-node') ||
            steps.install_affected.outcome == 'success'
          )
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pnpm_cache.outputs.path }}
          key: ${{ steps.plan.outputs.pnpm_cache_key }}

      - name: Login for image cache reads
        id: login_image_cache
        if: >-
          !cancelled() && steps.plan.outputs.has_image_build == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run affected Node and image evidence
        id: node_image
        if: >-
          always() &&
          steps.plan.outputs.node_evidence_profiles != '[]' &&
          (
            steps.plan.outputs.has_image_build == 'true' ||
            steps.install_affected.outcome == 'success'
          )
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.plan.outputs.base }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          CI_EVIDENCE_FILE: ${{ runner.temp }}/ci-evidence/node-image.jsonl
          TURBO_CACHE: "local:rw,remote:rw"
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VALIDATION_PROFILES: ${{ steps.plan.outputs.node_evidence_profiles }}
          CI_IMAGE_CACHE_REGISTRY: ${{ steps.login_image_cache.outcome == 'success' && format('ghcr.io/{0}', github.repository) || '' }}
        shell: nix develop .#ci-release --command bash -e {0}
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          if [[ -n "$CI_IMAGE_CACHE_REGISTRY" ]]; then
            echo "Image cache: read-only import from $CI_IMAGE_CACHE_REGISTRY"
          else
            echo "Image cache: no authenticated import selected (no image target, external PR, Dependabot, or login failure)"
          fi
          node --experimental-strip-types scripts/ci/evidence.mts --base "$BASE_SHA" --head "$HEAD_SHA" --profiles "$VALIDATION_PROFILES" --repository "$GITHUB_REPOSITORY" --summary "$GITHUB_STEP_SUMMARY"
      - name: Run container build contract evidence
        id: container_build
        if: always() && steps.plan.outputs.has_container_build == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.plan.outputs.base }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          CI_EVIDENCE_FILE: ${{ runner.temp }}/ci-evidence/container.jsonl
          VALIDATION_PROFILES: '["container-build"]'
        shell: nix develop .#ci-release --command bash -e {0}
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          node --experimental-strip-types scripts/ci/evidence.mts --base "$BASE_SHA" --head "$HEAD_SHA" --profiles "$VALIDATION_PROFILES"
      - name: Check execution-control native code
        id: execution_control_native
        if: always() && contains(fromJSON(steps.plan.outputs.validation_profiles), 'execution-control-native')
        continue-on-error: true
        shell: nix develop .#ci-go --command bash -e {0}
        env:
          CI_EVIDENCE_FILE: ${{ runner.temp }}/ci-evidence/native.jsonl
          BASE_SHA: ${{ steps.plan.outputs.base }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          node --experimental-strip-types scripts/ci/evidence.mts --base "$BASE_SHA" --head "$HEAD_SHA" --profiles '["execution-control-native"]'
      - name: Summarize repository evidence
        if: always()
        shell: bash -e {0}
        env:
          RESULTS: >-
            {
              "plan":"${{ steps.plan.outcome }}",
              "affected-node-and-images":"${{ steps.node_image.outcome }}",
              "container-build":"${{ steps.container_build.outcome }}",
              "contracts":"${{ steps.contracts.outcome }}",
              "execution-control-native":"${{ steps.execution_control_native.outcome }}",
              "github-actions":"${{ steps.github_actions.outcome }}",
              "install-affected":"${{ steps.install_affected.outcome }}",
              "image-cache-login":"${{ steps.login_image_cache.outcome }}",
              "install-static-dependencies":"${{ steps.install_static_dependencies.outcome }}",
              "repository-lint":"${{ steps.repository_lint.outcome }}",
              "repository-docs":"${{ steps.repository_docs.outcome }}",
              "repository-test":"${{ steps.repository_test.outcome }}",
              "secrets":"${{ steps.secrets.outcome }}"
            }
        run: |
          echo CI_BODY_STARTED
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          jq . <<< "$RESULTS" | tee "$RUNNER_TEMP/ci-evidence/outcomes.json"
          printf 'CI_OUTCOMES %s\n' "$(jq -c . <<< "$RESULTS")"
          {
            echo '### Check outcomes'
            echo
            echo '| Check | Outcome |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| \(.key) | \(.value) |"' <<< "$RESULTS"
            echo
            echo 'Skipped repository stages follow pnpm check short-circuit order; other skips follow the validation selection or a failed prerequisite.'
            echo 'Final timings, cancellation status and recent-run comparison are published by the CI timing report workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e 'all(.[]; . != "failure" and . != "cancelled")' <<< "$RESULTS" >/dev/null; then
            echo "One or more repository evidence surfaces failed." >&2
            exit 1
          fi

      - name: Preserve failed check diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence/
          if-no-files-found: ignore
          retention-days: 7
