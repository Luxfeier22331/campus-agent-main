name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ github.event.pull_request.base.sha }}
      plan_head_sha: ${{ github.sha }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup planning tools
        uses: ./.github/actions/setup-node-pnpm
        with:
          workspace-filters: campus-agent-web-workspace

      - name: Build change plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          scripts/ci/write-change-plan.sh "$BASE_SHA" "$HEAD_SHA" change-plan.json
          echo "plan=$(jq -c . change-plan.json)" >> "$GITHUB_OUTPUT"
          {
            echo '### PR change plan'
            echo
            echo '```json'
            jq . change-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test change planning
        run: >-
          node --test
          scripts/ci/change-plan.test.mjs
          scripts/ci/check-docker-affected.test.mjs
          scripts/ci/workflow-contract.test.mjs

      - name: Test Git and Turbo change planning
        if: contains(fromJSON(steps.plan.outputs.plan).preflightChecks, 'planner')
        run: node --test scripts/ci/change-plan.integration.test.mjs

      - name: Scan changed commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/gitleaks.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Check changed repository files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: scripts/ci/check-static-affected.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Setup Python lint tools
        if: >-
          contains(fromJSON(steps.plan.outputs.plan).preflightChecks, 'actions') ||
          contains(fromJSON(steps.plan.outputs.plan).lanes, 'python') ||
          contains(fromJSON(steps.plan.outputs.plan).lanes, 'sql') ||
          contains(fromJSON(steps.plan.outputs.plan).lanes, 'yaml')
        uses: ./.github/actions/setup-python-uv
        with:
          sync: ${{ (contains(fromJSON(steps.plan.outputs.plan).lanes, 'python') || contains(fromJSON(steps.plan.outputs.plan).lanes, 'sql') || contains(fromJSON(steps.plan.outputs.plan).lanes, 'yaml')) && 'true' || 'false' }}
          sync-mode: tools

      - name: Check changed Python, SQL and YAML files
        if: >-
          contains(fromJSON(steps.plan.outputs.plan).lanes, 'python') ||
          contains(fromJSON(steps.plan.outputs.plan).lanes, 'sql') ||
          contains(fromJSON(steps.plan.outputs.plan).lanes, 'yaml')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: scripts/ci/check-python-tools-affected.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Validate Actions syntax
        if: contains(fromJSON(steps.plan.outputs.plan).preflightChecks, 'actions')
        uses: ./.github/actions/run-actionlint

      - name: Audit Actions security
        if: contains(fromJSON(steps.plan.outputs.plan).preflightChecks, 'actions')
        run: uvx zizmor==1.27.0 --min-severity=medium .github

      - name: Validate OTel Collector configs
        if: contains(fromJSON(steps.plan.outputs.plan).lanes, 'otel')
        run: pnpm ci:otel

      - name: Lint changed shell scripts
        if: contains(fromJSON(steps.plan.outputs.plan).lanes, 'shell')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" -- '*.sh'
          )
          if (( ${#files[@]} > 0 )); then
            docker run --rm \
              -v "$PWD:/work" -w /work \
              koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
              -x -s bash "${files[@]}"
          fi

      - name: Lint changed Dockerfiles
        if: fromJSON(steps.plan.outputs.plan).dockerChecks[0] != null
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" -- \
              '**/Dockerfile' '**/Dockerfile.*' '**/*.dockerfile'
          )
          if (( ${#files[@]} > 0 )); then
            docker run --rm \
              -v "$PWD:/work" -w /work \
              hadolint/hadolint:v2.14.0-debian@sha256:158cd0184dcaa18bd8ec20b61f4c1cabdf8b32a592d062f57bdcb8e4c1d312e2 \
              hadolint -c /work/.hadolint.yaml "${files[@]}"
          fi

      - name: Check changed dependency ecosystems
        if: fromJSON(steps.plan.outputs.plan).dependencyEcosystems[0] != null
        uses: ./.github/actions/run-osv-scan
        with:
          ecosystems: ${{ join(fromJSON(steps.plan.outputs.plan).dependencyEcosystems, ' ') }}

      - name: Check changed Docker contexts
        if: fromJSON(steps.plan.outputs.plan).dockerChecks[0] != null
        env:
          IMAGES: ${{ toJSON(fromJSON(steps.plan.outputs.plan).dockerChecks) }}
        run: node scripts/ci/check-docker-affected.mjs "$IMAGES"

  code:
    needs: preflight
    if: >-
      contains(fromJSON(needs.preflight.outputs.plan).lanes, 'contracts') ||
      contains(fromJSON(needs.preflight.outputs.plan).lanes, 'eval') ||
      contains(fromJSON(needs.preflight.outputs.plan).lanes, 'ingest') ||
      contains(fromJSON(needs.preflight.outputs.plan).lanes, 'node')
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 20
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_SCM_BASE: ${{ needs.preflight.outputs.base_sha }}
      TURBO_SCM_HEAD: ${{ needs.preflight.outputs.plan_head_sha }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup affected Node workspaces
        uses: ./.github/actions/setup-node-pnpm
        with:
          workspace-filters: campus-agent-web-workspace
          workspace-filters-json: ${{ toJSON(fromJSON(needs.preflight.outputs.plan).nodeFilters) }}

      - name: Setup Python evaluation package
        if: fromJSON(needs.preflight.outputs.plan).pythonEval
        uses: ./.github/actions/setup-python-uv
        with:
          sync-mode: eval

      - name: Run contract checks
        if: contains(fromJSON(needs.preflight.outputs.plan).lanes, 'contracts')
        run: pnpm ci:contracts

      - name: Run affected TypeScript checks
        if: contains(fromJSON(needs.preflight.outputs.plan).lanes, 'node')
        run: pnpm ci:typescript

      - name: Run affected Worker checks
        if: contains(fromJSON(needs.preflight.outputs.plan).lanes, 'node')
        run: pnpm ci:worker:affected

      - name: Run affected ingestion checks
        if: contains(fromJSON(needs.preflight.outputs.plan).lanes, 'ingest')
        run: pnpm ci:ingest:affected

      - name: Run affected evaluation checks
        if: contains(fromJSON(needs.preflight.outputs.plan).lanes, 'eval')
        run: pnpm ci:eval:affected

      - name: Summarize Turbo work
        if: always()
        run: scripts/ci/turbo-summary.sh

  native:
    needs: preflight
    if: >-
      contains(fromJSON(needs.preflight.outputs.plan).lanes, 'go') ||
      contains(fromJSON(needs.preflight.outputs.plan).lanes, 'infra') ||
      contains(fromJSON(needs.preflight.outputs.plan).lanes, 'rust')
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup Go
        if: runner.environment == 'github-hosted' && (contains(fromJSON(needs.preflight.outputs.plan).lanes, 'go') || contains(fromJSON(needs.preflight.outputs.plan).lanes, 'infra'))
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: apps/execution-control/go.mod

      - name: Verify Go
        if: runner.environment == 'self-hosted' && (contains(fromJSON(needs.preflight.outputs.plan).lanes, 'go') || contains(fromJSON(needs.preflight.outputs.plan).lanes, 'infra'))
        run: test "$(go version | awk '{print $3}')" = "go1.26.5"

      - name: Setup Rust
        if: runner.environment == 'github-hosted' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'rust')
        uses: dtolnay/rust-toolchain@ad7910d95e317a4b12a9a3dfad520f4b409b3ec0  # 1.91.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        if: runner.environment == 'github-hosted' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'rust')
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Verify Rust
        if: runner.environment == 'self-hosted' && contains(fromJSON(needs.preflight.outputs.plan).lanes, 'rust')
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.91.0"
          test "$(cargo --version | awk '{print $2}')" = "1.91.0"

      - name: Install infrastructure tools
        if: contains(fromJSON(needs.preflight.outputs.plan).lanes, 'infra')
        run: |
          if ! command -v kustomize >/dev/null; then
            go install sigs.k8s.io/kustomize/kustomize/v5@v5.7.1
          fi
          if ! command -v conftest >/dev/null; then
            go install github.com/open-policy-agent/conftest@v0.65.0
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Go checks
        if: contains(fromJSON(needs.preflight.outputs.plan).lanes, 'go')
        run: scripts/ci/go-check.sh

      - name: Run Rust checks
        if: contains(fromJSON(needs.preflight.outputs.plan).lanes, 'rust')
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/cargo-target/campus-agent
        run: scripts/ci/rust-check.sh

      - name: Validate Kubernetes resources
        if: contains(fromJSON(needs.preflight.outputs.plan).lanes, 'infra')
        run: scripts/ci/infra-check.sh

  docker-check:
    needs: preflight
    if: fromJSON(needs.preflight.outputs.plan).dockerChecks[0] != null
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image: ${{ fromJSON(needs.preflight.outputs.plan).dockerChecks }}
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "false"

      - name: Resolve Docker check target
        id: target
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          definition="$(node scripts/ci/check-docker-affected.mjs --describe "$IMAGE")"
          echo "dockerfile=$(jq -er .dockerfile <<< "$definition")" >> "$GITHUB_OUTPUT"
          echo "target=$(jq -er .target <<< "$definition")" >> "$GITHUB_OUTPUT"

      - name: Setup persistent Docker Buildx
        if: runner.environment == 'self-hosted'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          name: campus-agent-pr
          keep-state: true
          cleanup: false
          cache-binary: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
              gc = true
              reservedSpace = "2GB"
              maxUsedSpace = "10GB"
              minFreeSpace = "20GB"

      - name: Setup temporary Docker Buildx
        if: runner.environment == 'github-hosted'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Build Docker check target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: ${{ steps.target.outputs.dockerfile }}
          target: ${{ steps.target.outputs.target }}
          push: false
          load: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=pr-docker-${{ matrix.image }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=pr-docker-${{ matrix.image }}

  integration:
    needs: preflight
    if: fromJSON(needs.preflight.outputs.plan).databaseSuites[0] != null
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 25
    env:
      PLAN: ${{ needs.preflight.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup database Node workspaces
        if: fromJSON(needs.preflight.outputs.plan).databaseNodeFilters[0] != null
        uses: ./.github/actions/setup-node-pnpm
        with:
          workspace-filters: campus-agent-web-workspace
          workspace-filters-json: ${{ toJSON(fromJSON(needs.preflight.outputs.plan).databaseNodeFilters) }}

      - name: Setup Go
        if: >-
          runner.environment == 'github-hosted' &&
          (contains(fromJSON(needs.preflight.outputs.plan).databaseSuites, 'execution-control') ||
          contains(fromJSON(needs.preflight.outputs.plan).databaseSuites, 'ops-web'))
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: apps/execution-control/go.mod

      - name: Verify Go
        if: >-
          runner.environment == 'self-hosted' &&
          (contains(fromJSON(needs.preflight.outputs.plan).databaseSuites, 'execution-control') ||
          contains(fromJSON(needs.preflight.outputs.plan).databaseSuites, 'ops-web'))
        run: test "$(go version | awk '{print $3}')" = "go1.26.5"

      - name: Verify Docker
        run: docker info >/dev/null

      - name: Run selected PostgreSQL suites
        run: |
          set -euo pipefail
          has_suite() { jq -e --arg suite "$1" '.databaseSuites | index($suite) != null' <<< "$PLAN" >/dev/null; }
          has_suite app-api-migration && pnpm ci:app-api-migration
          has_suite app-api-product && pnpm ci:app-api-product-db
          has_suite execution-control && scripts/ci/go-postgres-integration.sh
          has_suite ops-web && pnpm ci:ops-web-postgres

  required:
    needs: [preflight, code, native, docker-check, integration]
    if: always()
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 5
    steps:
      - name: Require successful PR checks
        env:
          CODE_RESULT: ${{ needs.code.result }}
          DOCKER_RESULT: ${{ needs.docker-check.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        run: |
          for result in \
            "$PREFLIGHT_RESULT" \
            "$CODE_RESULT" \
            "$DOCKER_RESULT" \
            "$NATIVE_RESULT" \
            "$INTEGRATION_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
