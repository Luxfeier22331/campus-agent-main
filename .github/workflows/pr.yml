name: pr

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.base.outputs.base_sha }}
      config: ${{ steps.filter.outputs.config }}
      contracts: ${{ steps.filter.outputs.contracts }}
      deps: ${{ steps.filter.outputs.deps }}
      docker: ${{ steps.filter.outputs.docker }}
      eval: ${{ steps.filter.outputs.eval }}
      go: ${{ steps.filter.outputs.go }}
      go_deps: ${{ steps.filter.outputs.go_deps }}
      ingest: ${{ steps.filter.outputs.ingest }}
      infra: ${{ steps.filter.outputs.infra }}
      node_deps: ${{ steps.filter.outputs.node_deps }}
      python: ${{ steps.filter.outputs.python }}
      python_deps: ${{ steps.filter.outputs.python_deps }}
      rust: ${{ steps.filter.outputs.rust }}
      shell: ${{ steps.filter.outputs.shell }}
      sql: ${{ steps.filter.outputs.sql }}
      web: ${{ steps.filter.outputs.web }}
      worker: ${{ steps.filter.outputs.worker }}
      yaml: ${{ steps.filter.outputs.yaml }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base_sha"
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Detect changed surfaces
        id: filter
        uses: dorny/paths-filter@v4.0.2
        with:
          base: ${{ steps.base.outputs.base_sha }}
          ref: ${{ github.sha }}
          filters: |
            config:
              - '.github/**'
            contracts:
              - 'packages/contracts/**'
              - 'configs/runtime/**'
            deps:
              - 'pnpm-lock.yaml'
              - 'uv.lock'
              - 'pyproject.toml'
              - '**/package.json'
              - '**/pyproject.toml'
              - '**/go.mod'
              - '**/go.sum'
              - 'Cargo.lock'
              - '**/Cargo.toml'
            docker:
              - '.dockerignore'
              - '.hadolint.yaml'
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - '**/*.dockerfile'
            node_deps:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            python_deps:
              - 'pyproject.toml'
              - 'uv.lock'
            go_deps:
              - '**/go.mod'
              - '**/go.sum'
            rust:
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - 'packages/ingestion-kernels-rs/**'
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '**/pyproject.toml'
            yaml:
              - '.yamllint.yml'
              - '**/*.yaml'
              - '**/*.yml'
            sql:
              - '.sqlfluff'
              - '.sqlfluffignore'
              - '**/*.sql'
            shell:
              - '.shellcheckrc'
              - '**/*.sh'
            infra:
              - 'infra/gitops/**'
              - 'infra/k8s/**'
              - 'infra/policies/**'
            eval:
              - 'packages/eval-langfuse/**'
              - 'packages/ragas-runner/**'
              - 'apps/app-api/src/modules/telemetry/**'
              - 'apps/app-api/scripts/check-langfuse-trace-id-vectors.ts'
              - 'docs/architecture/system/langfuse.md'
              - 'docs/contracts/langfuse-runtime.md'
              - 'docs/decisions/adr-0061-eval-runtime.md'
              - 'docs/decisions/adr-0062-ragas-langfuse.md'
              - 'docs/product/langfuse-evals.md'
              - 'docs/reference/eval.md'
              - 'docs/reference/eval-map.md'
              - 'docs/runbooks/eval-ragas.md'
              - 'tests/fixtures/langfuse_trace_id_vectors.json'
            go:
              - 'apps/execution-control/**'
              - 'configs/runtime/**'
            ingest:
              - 'apps/ingestion-control/**'
              - 'apps/source-collector/**'
              - 'configs/ingestion/**'
              - 'packages/ingest-core/**'
              - 'packages/ingestion-contracts/**'
            web:
              - 'apps/**/.dev.vars.example'
              - 'apps/**/wrangler*.toml'
              - 'apps/**/*.ts'
              - 'apps/**/*.tsx'
              - 'apps/**/*.js'
              - 'apps/**/*.jsx'
              - 'apps/**/*.mjs'
              - 'apps/**/*.cjs'
              - 'apps/**/*.json'
              - 'apps/**/*.mts'
              - 'apps/**/*.cts'
              - 'jobs/**/*.ts'
              - 'jobs/**/*.tsx'
              - 'jobs/**/*.js'
              - 'jobs/**/*.jsx'
              - 'jobs/**/*.mjs'
              - 'jobs/**/*.cjs'
              - 'jobs/**/*.json'
              - 'jobs/**/*.mts'
              - 'jobs/**/*.cts'
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'packages/**/*.js'
              - 'packages/**/*.jsx'
              - 'packages/**/*.mjs'
              - 'packages/**/*.cjs'
              - 'packages/**/*.json'
              - 'packages/**/*.mts'
              - 'packages/**/*.cts'
            worker:
              - 'apps/app-api/**'
              - 'apps/campus-web/**'
              - 'apps/operator-console-web/**'
              - 'configs/runtime/**'

  repo:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Run repository lane
        run: pnpm ci:repo

  config:
    needs: changes
    if: needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          sync: "false"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: apps/execution-control/go.mod

      - name: Validate workflow configuration
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Audit workflow security
        run: uvx zizmor --min-severity=medium .github

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.python_deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python-uv

      - name: Check Python
        run: |
          uv run --all-packages ruff check .
          uv run --all-packages ruff format . --check
          uv lock --check --offline

  yaml:
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python-uv

      - name: Lint YAML
        run: >-
          uv run yamllint -c .yamllint.yml
          .github configs infra
          docs/contracts/schemas/tool-execution.openapi.yaml
          apps/execution-control/.golangci.yml

  sql:
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python-uv

      - name: Lint SQL
        run: uv run sqlfluff lint --config .sqlfluff

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfiles
        run: |
          mapfile -d '' files < <(git ls-files -z '**/Dockerfile' '**/Dockerfile.*' '**/*.dockerfile')
          docker run --rm \
            -v "$PWD:/work" -w /work \
            hadolint/hadolint:v2.14.0-debian \
            hadolint -c /work/.hadolint.yaml "${files[@]}"

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint shell scripts
        run: |
          mapfile -d '' files < <(git ls-files -z '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          docker run --rm \
            -v "$PWD:/work" -w /work \
            koalaman/shellcheck:v0.11.0 \
            -x -s bash "${files[@]}"

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: apps/execution-control/go.mod

      - name: Install Kustomize and Conftest
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.7.1
          go install github.com/open-policy-agent/conftest@v0.65.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate Kubernetes resources
        run: |
          set -euo pipefail
          while IFS= read -r kustomization; do
            directory="${kustomization%/kustomization.yaml}"
            kustomize build "$directory" | conftest test --policy infra/policies --parser yaml -
          done < <(find infra/k8s -name kustomization.yaml -print | sort)

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.node_deps == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base_sha }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Run web lane
        run: pnpm ci:web

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true' || needs.changes.outputs.node_deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Run Worker lane
        run: pnpm ci:worker

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.node_deps == 'true' || needs.changes.outputs.python_deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python-uv

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Run contracts lane
        run: pnpm ci:contracts

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.go_deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: apps/execution-control/go.mod

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "false"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      - name: Run Go lane
        run: pnpm ci:go

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "false"

      - name: Run Rust lane
        run: pnpm ci:rust

  eval:
    needs: changes
    if: needs.changes.outputs.eval == 'true' || needs.changes.outputs.node_deps == 'true' || needs.changes.outputs.python_deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python-uv

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Run eval lane
        run: pnpm ci:eval

  ingest:
    needs: changes
    if: needs.changes.outputs.ingest == 'true' || needs.changes.outputs.node_deps == 'true' || needs.changes.outputs.python_deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python-uv

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Rust
        run: rustup default stable

      - name: Run ingest lane
        run: pnpm ci:ingest

  deps-pr:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    with:
      upload-sarif: false
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=pnpm-lock.yaml
        --lockfile=uv.lock
        --lockfile=Cargo.lock
        --lockfile=apps/execution-control/go.mod

  deps-full:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.deps == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      upload-sarif: false
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=pnpm-lock.yaml
        --lockfile=uv.lock
        --lockfile=Cargo.lock
        --lockfile=apps/execution-control/go.mod

  required:
    needs:
      - changes
      - repo
      - config
      - python
      - yaml
      - sql
      - docker
      - shell
      - infra
      - secrets
      - web
      - worker
      - contracts
      - go
      - rust
      - eval
      - ingest
      - deps-pr
      - deps-full
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful PR checks
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.repo.result }}" \
            "${{ needs.config.result }}" \
            "${{ needs.python.result }}" \
            "${{ needs.yaml.result }}" \
            "${{ needs.sql.result }}" \
            "${{ needs.docker.result }}" \
            "${{ needs.shell.result }}" \
            "${{ needs.infra.result }}" \
            "${{ needs.secrets.result }}" \
            "${{ needs.web.result }}" \
            "${{ needs.worker.result }}" \
            "${{ needs.contracts.result }}" \
            "${{ needs.go.result }}" \
            "${{ needs.rust.result }}" \
            "${{ needs.eval.result }}" \
            "${{ needs.ingest.result }}" \
            "${{ needs.deps-pr.result }}" \
            "${{ needs.deps-full.result }}"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                failed=1
                ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more required PR check lanes failed."
            exit 1
          fi
