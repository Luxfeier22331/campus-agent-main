name: pr

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    max-jobs = 1
    cores = 2

jobs:
  repo-checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop .#ci-core --command bash -e {0}
    steps:
      - name: Checkout pull request merge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          enable_kvm: false

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile \
            --filter campus-agent-web-workspace \
            --filter 'campus-contracts...'

      - name: Generate pull request validation plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          plan="$(node --experimental-strip-types scripts/ci/validation.mts \
            --base "$BASE_SHA" \
            --head "$MERGE_SHA" \
            --mode pull-request)"
          jq -e . <<< "$plan" >/dev/null
          base="$(jq -r '.base' <<< "$plan")"
          head="$(jq -r '.head' <<< "$plan")"
          light_surfaces="$(jq -c '.lightSurfaces' <<< "$plan")"
          validation_profiles="$(jq -c '.validationProfiles' <<< "$plan")"
          has_evidence="$(jq -r '.validationProfiles | length > 0' <<< "$plan")"
          has_affected_node="$(jq -r --arg profile affected-node \
            '.validationProfiles | index($profile) != null' <<< "$plan")"
          has_dependencies="$(jq -r --arg profile dependencies \
            '.validationProfiles | index($profile) != null' <<< "$plan")"
          has_toolchain="$(jq -r --arg profile toolchain \
            '.validationProfiles | index($profile) != null' <<< "$plan")"
          {
            echo "base=$base"
            echo "head=$head"
            echo "light_surfaces=$light_surfaces"
            echo "validation_profiles=$validation_profiles"
            echo "has_evidence=$has_evidence"
            echo "has_affected_node=$has_affected_node"
            echo "has_dependencies=$has_dependencies"
            echo "has_toolchain=$has_toolchain"
          } >> "$GITHUB_OUTPUT"
          jq . <<< "$plan"

      - name: Install Python lint dependencies
        if: >-
          contains(fromJSON(steps.plan.outputs.light_surfaces), 'python') ||
          contains(fromJSON(steps.plan.outputs.light_surfaces), 'sql') ||
          contains(fromJSON(steps.plan.outputs.light_surfaces), 'yaml')
        shell: nix develop .#ci-light --command bash -e {0}
        run: uv sync --only-dev --no-install-workspace

      - name: Run repository checks
        run: pnpm check

      - name: Check executable contracts
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'contracts')
        run: pnpm --dir packages/contracts check

      - name: Lint GitHub Actions
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'config')
        shell: nix develop .#ci-light --command bash -e {0}
        run: actionlint && zizmor --min-severity=medium .github

      - name: Lint Python
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'python')
        shell: nix develop .#ci-light --command bash -e {0}
        run: |
          git ls-files -z -- '*.py' \
            | xargs -0 --no-run-if-empty uv run --no-sync ruff check
          git ls-files -z -- '*.py' \
            | xargs -0 --no-run-if-empty uv run --no-sync ruff format --check

      - name: Lint YAML
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'yaml')
        shell: nix develop .#ci-light --command bash -e {0}
        run: |
          git ls-files -z -- '*.yaml' '*.yml' ':(exclude)pnpm-lock.yaml' \
            | xargs -0 --no-run-if-empty uv run --no-sync yamllint -c .yamllint.yml

      - name: Lint SQL
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'sql')
        shell: nix develop .#ci-light --command bash -e {0}
        run: |
          git ls-files -z -- '*.sql' \
            | xargs -0 --no-run-if-empty uv run --no-sync sqlfluff lint --config .sqlfluff

      - name: Lint Shell
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'shell')
        shell: nix develop .#ci-light --command bash -e {0}
        run: |
          git ls-files -z -- '*.sh' \
            | xargs -0 --no-run-if-empty shellcheck -x -s bash

      - name: Scan authored commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          gitleaks git \
            --redact \
            --exit-code=1 \
            --config=.gitleaks.toml \
            --log-opts="--no-merges ${merge_base}..${HEAD_SHA}"

      - name: Install affected workspaces
        if: contains(fromJSON(steps.plan.outputs.validation_profiles), 'affected-node')
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Run affected Node evidence
        if: steps.plan.outputs.has_affected_node == 'true'
        env:
          BASE_SHA: ${{ steps.plan.outputs.base }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          TURBO_CACHE: "local:rw,remote:rw"
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VALIDATION_PROFILES: '["affected-node"]'
        run: >-
          node --experimental-strip-types scripts/ci/evidence.mts
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --profiles "$VALIDATION_PROFILES"

      - name: Run dependency evidence
        if: steps.plan.outputs.has_dependencies == 'true'
        env:
          BASE_SHA: ${{ steps.plan.outputs.base }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          VALIDATION_PROFILES: '["dependencies"]'
        shell: nix develop .#ci-light --command bash -e {0}
        run: >-
          node --experimental-strip-types scripts/ci/evidence.mts
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --profiles "$VALIDATION_PROFILES"

      - name: Run toolchain evidence
        if: steps.plan.outputs.has_toolchain == 'true'
        env:
          BASE_SHA: ${{ steps.plan.outputs.base }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          VALIDATION_PROFILES: '["toolchain"]'
        shell: nix develop .#ci-release --command bash -e {0}
        run: >-
          node --experimental-strip-types scripts/ci/evidence.mts
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --profiles "$VALIDATION_PROFILES"

      - name: Complete stable check without affected evidence
        if: steps.plan.outputs.has_evidence != 'true'
        shell: /bin/bash -e {0}
        run: echo "No affected evidence is required for this pull request."
