name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-fast:
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup lightweight repository tools
        uses: ./.github/actions/setup-node-pnpm
        with:
          workspace-filters: |
            campus-agent-web-workspace
            campus-contracts...

      - name: Run lightweight PR checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: pnpm ci:pr "$BASE_SHA" "$HEAD_SHA"
