name: pr

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    max-jobs = 1
    cores = 2

jobs:
  light:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: nix develop .#ci-light --command bash -e {0}
    outputs:
      base: ${{ steps.plan.outputs.base }}
      has_heavy: ${{ steps.plan.outputs.has_heavy }}
      head: ${{ steps.plan.outputs.head }}
      validation_profiles: ${{ steps.plan.outputs.validation_profiles }}
    steps:
      - name: Checkout pull request merge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          enable_kvm: false

      - name: Restore pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ${{ runner.tool_cache }}/pnpm-store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure pnpm store
        run: echo "npm_config_store_dir=${RUNNER_TOOL_CACHE}/pnpm-store" >> "$GITHUB_ENV"

      - name: Install light validation dependencies
        run: |
          set -euo pipefail
          mkdir -p "$npm_config_store_dir"
          pnpm install --frozen-lockfile --prefer-offline \
            --filter campus-agent-web-workspace \
            --filter 'campus-contracts...'

      - name: Generate pull request validation plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          plan="$(node --experimental-strip-types scripts/ci/validation.mts \
            --base "$BASE_SHA" \
            --head "$MERGE_SHA" \
            --mode pull-request)"
          jq -e . <<< "$plan" >/dev/null
          {
            echo "base=$(jq -r '.base' <<< "$plan")"
            echo "head=$(jq -r '.head' <<< "$plan")"
            echo "light_surfaces=$(jq -c '.lightSurfaces' <<< "$plan")"
            echo "validation_profiles=$(jq -c '.validationProfiles' <<< "$plan")"
            echo "has_heavy=$(jq -r '.validationProfiles | length > 0' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          jq . <<< "$plan"

      - name: Install Python lint dependencies
        if: >-
          contains(fromJSON(steps.plan.outputs.light_surfaces), 'python') ||
          contains(fromJSON(steps.plan.outputs.light_surfaces), 'sql') ||
          contains(fromJSON(steps.plan.outputs.light_surfaces), 'yaml')
        run: uv sync --only-dev --no-install-workspace

      - name: Run repository checks
        run: pnpm ci:repo

      - name: Check CI and release orchestration
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'release')
        run: pnpm ci:release

      - name: Check executable contracts
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'contracts')
        run: pnpm ci:contracts

      - name: Lint GitHub Actions
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'config')
        run: pnpm ci:config

      - name: Lint Python
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'python')
        run: |
          git ls-files -z -- '*.py' \
            | xargs -0 --no-run-if-empty uv run --no-sync ruff check
          git ls-files -z -- '*.py' \
            | xargs -0 --no-run-if-empty uv run --no-sync ruff format --check

      - name: Lint YAML
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'yaml')
        run: |
          git ls-files -z -- '*.yaml' '*.yml' ':(exclude)pnpm-lock.yaml' \
            | xargs -0 --no-run-if-empty uv run --no-sync yamllint -c .yamllint.yml

      - name: Lint SQL
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'sql')
        run: |
          git ls-files -z -- '*.sql' \
            | xargs -0 --no-run-if-empty uv run --no-sync sqlfluff lint --config .sqlfluff

      - name: Lint Shell
        if: contains(fromJSON(steps.plan.outputs.light_surfaces), 'shell')
        run: |
          git ls-files -z -- '*.sh' \
            | xargs -0 --no-run-if-empty shellcheck -x -s bash

      - name: Scan authored commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          gitleaks git \
            --redact \
            --exit-code=1 \
            --config=.gitleaks.toml \
            --log-opts="--no-merges ${merge_base}..${HEAD_SHA}"

  repo-checks:
    needs: light
    if: always()
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 90
    steps:
      - name: Require hosted evidence
        if: needs.light.result != 'success'
        env:
          LIGHT_RESULT: ${{ needs.light.result }}
        run: |
          echo "Hosted pull request evidence finished with ${LIGHT_RESULT}." >&2
          exit 1

      - name: Checkout pull request merge
        if: needs.light.result == 'success' && needs.light.outputs.has_heavy == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - name: Install affected workspaces
        if: needs.light.result == 'success' && needs.light.outputs.has_heavy == 'true'
        env:
          npm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
        run: |
          set -euo pipefail
          mkdir -p "$npm_config_store_dir"
          pnpm install --frozen-lockfile --prefer-offline

      - name: Install evaluation dependencies
        if: >-
          needs.light.result == 'success' &&
          needs.light.outputs.has_heavy == 'true' &&
          contains(fromJSON(needs.light.outputs.validation_profiles), 'ragas')
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
        run: uv sync --package campus-ragas-runner

      - name: Verify Docker evidence dependency
        if: >-
          needs.light.result == 'success' &&
          needs.light.outputs.has_heavy == 'true' &&
          (
            contains(fromJSON(needs.light.outputs.validation_profiles), 'app-api-migration') ||
            contains(fromJSON(needs.light.outputs.validation_profiles), 'app-api-product-db') ||
            contains(fromJSON(needs.light.outputs.validation_profiles), 'execution-control-postgres') ||
            contains(fromJSON(needs.light.outputs.validation_profiles), 'ingestion-control-postgres') ||
            contains(fromJSON(needs.light.outputs.validation_profiles), 'ops-web-postgres') ||
            contains(fromJSON(needs.light.outputs.validation_profiles), 'otel')
          )
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
        run: docker info >/dev/null

      - name: Install Chromium headless shell
        if: >-
          needs.light.result == 'success' &&
          needs.light.outputs.has_heavy == 'true' &&
          (
            contains(fromJSON(needs.light.outputs.validation_profiles), 'campus-browser-smoke') ||
            contains(fromJSON(needs.light.outputs.validation_profiles), 'campus-browser-full') ||
            contains(fromJSON(needs.light.outputs.validation_profiles), 'ops-web-browser')
          )
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
        run: pnpm --dir apps/campus-web exec playwright install --only-shell chromium

      - name: Run selected pull request evidence
        if: needs.light.result == 'success' && needs.light.outputs.has_heavy == 'true'
        env:
          BASE_SHA: ${{ needs.light.outputs.base }}
          CAMPUS_WEB_E2E_PREBUILT: "1"
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/cargo-target/campus-agent
          CI_DOCKER_CGROUP_PARENT: ci.slice
          HEAD_SHA: ${{ needs.light.outputs.head }}
          OPS_WEB_BROWSER_TEST_PORT: "4278"
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VALIDATION_PROFILES: ${{ needs.light.outputs.validation_profiles }}
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
        run: >-
          node --experimental-strip-types scripts/ci/evidence.mts
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --profiles "$VALIDATION_PROFILES"

      - name: Upload browser failure evidence
        if: >-
          failure() &&
          needs.light.result == 'success' &&
          needs.light.outputs.has_heavy == 'true' &&
          (
            contains(fromJSON(needs.light.outputs.validation_profiles), 'campus-browser-smoke') ||
            contains(fromJSON(needs.light.outputs.validation_profiles), 'campus-browser-full') ||
            contains(fromJSON(needs.light.outputs.validation_profiles), 'ops-web-browser')
          )
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          if-no-files-found: ignore
          name: pr-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/campus-web/playwright-report/e2e
            apps/campus-web/playwright-report/e2e-worker
            apps/campus-web/test-results/e2e
            apps/campus-web/test-results/e2e-worker
            apps/ops-web/test-results
            apps/ops-web/playwright-report
          retention-days: 7

      - name: Complete stable check without heavy evidence
        if: needs.light.result == 'success' && needs.light.outputs.has_heavy != 'true'
        run: echo "No self-hosted evidence is required for this pull request."
