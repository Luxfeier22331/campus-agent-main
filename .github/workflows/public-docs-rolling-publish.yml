name: public-docs-rolling-publish

on:
  schedule:
    - cron: "7 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Target public-docs environment
        required: true
        default: prod
        type: choice
        options:
          - prod
          - staging
      dry_run:
        description: Plan without uploading release ledger or deploying
        required: true
        default: true
        type: boolean
      force:
        description: Run outside the accepted schedule window
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-docs-rolling-publish-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prod' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OBJECT_STORE_ACCESS_KEY: ${{ secrets.OBJECT_STORE_ACCESS_KEY }}
      OBJECT_STORE_ENDPOINT: ${{ vars.OBJECT_STORE_ENDPOINT }}
      OBJECT_STORE_REGION: ${{ vars.OBJECT_STORE_REGION }}
      OBJECT_STORE_SECRET_KEY: ${{ secrets.OBJECT_STORE_SECRET_KEY }}
      PUBLIC_DOCS_RELEASE_LEDGER_KEY: ${{ vars.PUBLIC_DOCS_RELEASE_LEDGER_KEY }}
      PUBLIC_DOCS_ROLLING_PUBLISH_DRY_RUN: ${{ vars.PUBLIC_DOCS_ROLLING_PUBLISH_DRY_RUN }}
      PUBLIC_DOCS_ROLLING_PUBLISH_ENABLED: ${{ vars.PUBLIC_DOCS_ROLLING_PUBLISH_ENABLED }}
      PUBLIC_DOCS_SYNC_MANIFEST_KEY: ${{ vars.PUBLIC_DOCS_SYNC_MANIFEST_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production acceptance harness
        run: |
          pnpm --filter public-docs acceptance:published-reader-production -- \
            --output public-docs-production-acceptance.json

      - name: Run rolling publish pipeline
        shell: bash
        run: |
          args=(
            --env "${{ inputs.environment || 'prod' }}"
            --output public-docs-publish-result.json
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              args+=(--force)
            fi
            if [ "${{ inputs.dry_run }}" = "false" ]; then
              args+=(--no-dry-run)
            else
              args+=(--dry-run)
            fi
          fi
          pnpm --filter public-docs publish:rolling -- "${args[@]}"

      - name: Upload rolling publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-docs-rolling-publish-${{ inputs.environment || 'prod' }}-${{ github.run_id }}
          path: |
            public-docs-publish-result.json
            public-docs-production-acceptance.json
          if-no-files-found: warn
