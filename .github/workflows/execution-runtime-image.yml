name: execution-runtime-image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Push execution runtime images to GHCR
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - apps/execution-control/**
      - apps/agent-runtime/**
      - configs/runtime/**
      - configs/ingestion/**
      - packages/contracts/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/execution-runtime-image.yml
  push:
    branches:
      - main
    paths:
      - apps/execution-control/**
      - apps/agent-runtime/**
      - configs/runtime/**
      - configs/ingestion/**
      - packages/contracts/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/execution-runtime-image.yml

permissions:
  contents: read

concurrency:
  group: execution-runtime-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: execution-control
            dockerfile: apps/execution-control/Dockerfile
            sbom: execution-control-sbom.spdx.json
          - image: agent-runtime
            dockerfile: apps/agent-runtime/Dockerfile
            sbom: agent-runtime-sbom.spdx.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image name
        id: image
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}/${{ matrix.image }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:staging

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  push:
    needs: scan
    if: ${{ github.event_name == 'push' || inputs.push_image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: execution-control
            dockerfile: apps/execution-control/Dockerfile
            sbom: execution-control-sbom.spdx.json
          - image: agent-runtime
            dockerfile: apps/agent-runtime/Dockerfile
            sbom: agent-runtime-sbom.spdx.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image name
        id: image
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}/${{ matrix.image }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build image for SBOM
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:staging

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.image.outputs.name }}:${{ github.sha }}
          artifact-name: ${{ matrix.sbom }}
          format: spdx-json
          dependency-snapshot: false
          upload-artifact: true
          upload-release-assets: false

      - name: Login to GHCR
        uses: docker/login-action@v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:staging
