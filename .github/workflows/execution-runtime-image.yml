name: execution-runtime-image

on:
  pull_request:
    paths:
      - apps/execution-control/**
      - apps/agent-runtime/**
      - configs/runtime/**
      - configs/ingestion/**
      - infra/k8s/data-postgres/base/**
      - infra/k8s/data-qdrant/base/**
      - infra/k8s/execution-runtime/base/**
      - infra/k8s/memory-hindsight/base/**
      - infra/k8s/observability-otel-collector/base/**
      - infra/k8s/platform-temporal/base/**
      - packages/contracts/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/execution-runtime-image.yml

permissions:
  contents: read

concurrency:
  group: execution-runtime-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: execution-control
            dockerfile: apps/execution-control/Dockerfile
          - image: agent-runtime
            dockerfile: apps/agent-runtime/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image name
        id: image
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}/${{ matrix.image }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
