name: staging-candidate-publish

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate staging Worker configuration without publishing candidates
        required: true
        default: true
        type: boolean
      promote:
        description: Open or update the staging GitOps promotion pull request
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: staging-candidate-publish
  cancel-in-progress: false

jobs:
  release-plan:
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 3
    environment: staging
    outputs:
      base: ${{ steps.plan.outputs.base }}
      images: ${{ steps.plan.outputs.images }}
      kubernetes: ${{ steps.plan.outputs.kubernetes }}
      validate_only: ${{ steps.plan.outputs.validate_only }}
      workers: ${{ steps.plan.outputs.workers }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Create GitOps read token
        id: gitops-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ vars.GITOPS_PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PROMOTER_PRIVATE_KEY }}
          owner: MUC-WIKI
          repositories: campus-agent-gitops
          permission-contents: read

      - name: Checkout GitOps release selection
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
          repository: MUC-WIKI/campus-agent-gitops
          token: ${{ steps.gitops-read-token.outputs.token }}
          path: gitops-selection
          sparse-checkout: releases

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6
        with:
          version: "10.34.5"

      - name: Select release candidates
        id: plan
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only == false }}
          PROMOTE: ${{ github.event_name == 'workflow_dispatch' && inputs.promote || false }}
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only || false }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Staging validation and publication are allowed only from main." >&2
            exit 1
          fi
          if [[ "$PROMOTE" == "true" && "$VALIDATE_ONLY" == "true" ]]; then
            echo "Validation-only runs cannot promote candidates." >&2
            exit 1
          fi
          plan="$(node --experimental-strip-types scripts/release/candidates.mts \
            --full "$FULL" \
            --head "$GITHUB_SHA" \
            --selection "$GITHUB_WORKSPACE/gitops-selection/releases/staging.json" \
            --validate-only "$VALIDATE_ONLY")"
          jq -e . <<< "$plan" >/dev/null
          {
            echo "base=$(jq -r '.base' <<< "$plan")"
            echo "images=$(jq -c '.images' <<< "$plan")"
            echo "kubernetes=$(jq -r '.kubernetes' <<< "$plan")"
            echo "validate_only=$(jq -r '.validateOnly' <<< "$plan")"
            echo "workers=$(jq -c '.workers' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          jq . <<< "$plan"

  publish-images:
    needs: release-plan
    if: >-
      needs.release-plan.result == 'success' &&
      needs.release-plan.outputs.validate_only != 'true' &&
      fromJSON(needs.release-plan.outputs.images)[0] != null
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup image scanner
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e  # v4.0.5
        env:
          AQUA_ROOT_DIR: ${{ runner.tool_cache }}/aqua
        with:
          aqua_version: v2.62.1

      - name: Setup persistent Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          name: campus-agent-release
          keep-state: true
          cleanup: false
          cache-binary: false
          driver-opts: |
            cgroup-parent=ci.slice
            cpu-period=100000
            cpu-quota=200000
            memory=2g
            memory-swap=2g
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              reservedSpace = "2GB"
              maxUsedSpace = "12GB"
              minFreeSpace = "25GB"

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, publish and scan images
        env:
          IMAGES: ${{ needs.release-plan.outputs.images }}
        run: >-
          node --experimental-strip-types scripts/release/images.mts
          --images "$IMAGES"
          --output image-digests.json
          --repository "$GITHUB_REPOSITORY"
          --source-sha "$GITHUB_SHA"
          --trivy-cache "${RUNNER_TOOL_CACHE}/trivy"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload image digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-image-digests
          path: image-digests.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish-app-api:
    needs: release-plan
    if: contains(fromJSON(needs.release-plan.outputs.workers), 'app-api')
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 5
    environment: staging
    env:
      APP_API_DB_FRESH_HYPERDRIVE_ID: ${{ vars.APP_API_DB_FRESH_HYPERDRIVE_ID }}
      APP_API_DB_HYPERDRIVE_ID: ${{ vars.APP_API_DB_HYPERDRIVE_ID }}
      AUTH_RESET_EMAIL_FROM: ${{ vars.AUTH_RESET_EMAIL_FROM }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AUTOMATION_TOKEN: ${{ secrets.CLOUDFLARE_AUTOMATION_TOKEN }}
      EXECUTION_CONTROL_VPC_SERVICE_ID: ${{ vars.EXECUTION_CONTROL_VPC_SERVICE_ID }}
      OBJECT_STORE_VPC_SERVICE_ID: ${{ vars.OBJECT_STORE_VPC_SERVICE_ID }}
      SENTRY_APP_API_DSN: ${{ vars.SENTRY_APP_API_DSN }}
      STAGING_APP_API_EXECUTION_SHARED_SECRET: ${{ secrets.STAGING_APP_API_EXECUTION_SHARED_SECRET }}
      STAGING_OPS_WEB_INTERNAL_TOKEN: ${{ secrets.STAGING_OPS_WEB_INTERNAL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6
        with:
          version: "10.34.5"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install App API workspace
        run: >-
          pnpm install --frozen-lockfile --prefer-offline
          --filter campus-agent-web-workspace
          --filter 'campus-contracts...'
          --filter 'app-api...'

      - name: Validate app-api staging configuration
        if: needs.release-plan.outputs.validate_only == 'true'
        run: pnpm --dir apps/app-api exec tsx ./scripts/preflight-staging.ts

      - name: Upload app-api candidate
        if: needs.release-plan.outputs.validate_only != 'true'
        env:
          SENTRY_APP_API_PROJECT_SLUG: ${{ vars.SENTRY_APP_API_PROJECT_SLUG }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
          WORKER_VERSION_OUTPUT: ${{ github.workspace }}/worker-candidates/app-api-staging.json
        run: |
          mkdir -p worker-candidates
          pnpm --dir apps/app-api upload:staging

      - name: Upload Worker candidates
        if: needs.release-plan.outputs.validate_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-worker-candidates
          path: worker-candidates/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  promote:
    needs: [release-plan, publish-images, publish-app-api]
    if: >-
      always() &&
      needs.release-plan.result == 'success' &&
      needs.release-plan.outputs.validate_only != 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.promote) &&
      contains(fromJSON('["success","skipped"]'), needs.publish-images.result) &&
      contains(fromJSON('["success","skipped"]'), needs.publish-app-api.result) &&
      (
        needs.publish-images.result == 'success' ||
        needs.publish-app-api.result == 'success' ||
        needs.release-plan.outputs.kubernetes == 'true'
      )
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Prepare release inputs
        run: |
          node -e 'require("node:fs").writeFileSync("image-digests.json", "{}\n")'
          mkdir -p worker-candidates

      - name: Download image digests
        if: needs.publish-images.result == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-image-digests

      - name: Download Worker candidates
        if: needs.publish-app-api.result == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-worker-candidates
          path: worker-candidates

      - name: Create GitOps promotion token
        id: gitops-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ vars.GITOPS_PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PROMOTER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            campus-agent
            campus-agent-gitops
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Checkout GitOps repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
          repository: MUC-WIKI/campus-agent-gitops
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6
        with:
          version: "10.34.5"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: gitops/.node-version
          cache: pnpm
          cache-dependency-path: gitops/pnpm-lock.yaml

      - name: Install GitOps tooling
        run: pnpm --dir gitops install --frozen-lockfile --prefer-offline

      - name: Update GitOps desired state
        env:
          KUBERNETES_CHANGED: ${{ needs.release-plan.outputs.kubernetes }}
        run: >-
          pnpm --dir gitops gitops promote-source
          --image-digests "$GITHUB_WORKSPACE/image-digests.json"
          --kubernetes "$KUBERNETES_CHANGED"
          --root "$GITHUB_WORKSPACE/gitops"
          --source-repository "$GITHUB_REPOSITORY"
          --source-sha "$GITHUB_SHA"
          --worker-candidates "$GITHUB_WORKSPACE/worker-candidates"

      - name: Detect GitOps changes
        id: promotion
        run: |
          if git -C gitops diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open GitOps deployment pull request
        id: deployment-pr
        if: steps.promotion.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops
          base: main
          branch: deploy/staging
          delete-branch: true
          commit-message: "chore: 部署 staging 候选版本 ${{ github.sha }}"
          title: "chore: 部署 staging 候选版本 ${{ github.sha }}"
          body: |
            ## 变更内容

            - 更新 `campus-agent@${{ github.sha }}` 产生的活跃镜像（如有）
            - 更新 App API Worker 的不可变版本（如有）
            - Kubernetes 基座变化时同步活跃 Application 的源码引用

            ## 验证结果

            - [x] 发布镜像（如有）均为单一 `linux/arm64` 索引并通过 Trivy 扫描
            - [x] Worker 候选版本上传未改变当前流量版本
            - [x] `promote-source` 已校验候选身份和活跃消费者
            - [ ] GitOps PR 的渲染、schema 与策略检查

      - name: Mark staging promotion pending
        if: steps.promotion.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          TARGET_URL: ${{ steps.deployment-pr.outputs.pull-request-url }}
        run: >-
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=pending
          -f context=staging/promotion
          -f description='GitOps is validating the staging promotion'
          -f target_url="$TARGET_URL"
