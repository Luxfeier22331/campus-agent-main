name: staging-candidate-publish

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate staging Worker configuration without publishing candidates
        required: true
        default: true
        type: boolean
      promote:
        description: Open or update the staging GitOps promotion pull request
        required: true
        default: false
        type: boolean
      docs_release_id:
        description: Content-addressed Campus Docs release for the campus-web candidate
        required: false
        type: string
      replay_base_sha:
        description: Rebuild the affected release plan from this failed main release base
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: staging-candidate-publish
  cancel-in-progress: false
  queue: max

jobs:
  release-plan:
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 15
    outputs:
      images: ${{ steps.plan.outputs.images }}
      kubernetes: ${{ steps.plan.outputs.kubernetes }}
      validate_only: ${{ steps.plan.outputs.validate_only }}
      worker_filters: ${{ steps.plan.outputs.worker_filters }}
      workers: ${{ steps.plan.outputs.workers }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup planning tools
        uses: ./.github/actions/setup-node-pnpm
        with:
          workspace-filters: |
            campus-agent-web-workspace
            campus-contracts...

      - name: Restrict manual staging work to main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Staging validation and publication are allowed only from main." >&2
          exit 1

      - name: Revalidate lightweight source policy
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: pnpm ci:fast "$BASE_SHA" "$HEAD_SHA"

      - name: Build release plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PROMOTE: ${{ inputs.promote || false }}
          REPLAY_BASE_SHA: ${{ inputs.replay_base_sha || '' }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
        run: |
          set -euo pipefail
          if [ "$PROMOTE" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Manual promotion is allowed only from main." >&2
            exit 1
          fi
          if [ "$PROMOTE" = true ] && [ "$VALIDATE_ONLY" = true ]; then
            echo "Validation-only runs cannot promote candidates." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "$REPLAY_BASE_SHA" ]; then
              if [ "$VALIDATE_ONLY" = true ]; then
                echo "Release replay cannot run in validation-only mode." >&2
                exit 1
              fi
              if ! [[ "$REPLAY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$REPLAY_BASE_SHA" =~ ^0{40}$ ]]; then
                echo "Replay base must be a non-zero 40-character lowercase commit SHA." >&2
                exit 1
              fi
              if ! git cat-file -e "${REPLAY_BASE_SHA}^{commit}"; then
                echo "Replay base commit does not exist: ${REPLAY_BASE_SHA}." >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor "$REPLAY_BASE_SHA" "$HEAD_SHA"; then
                echo "Replay base must be an ancestor of ${HEAD_SHA}." >&2
                exit 1
              fi
              scripts/ci/write-change-plan.sh "$REPLAY_BASE_SHA" "$HEAD_SHA" change-plan.json
              jq -e '.unresolved | length == 0' change-plan.json >/dev/null
              release="$(jq -c .release change-plan.json)"
            elif [ "$VALIDATE_ONLY" = true ]; then
              release='{"images":[],"kubernetes":false,"workers":["app-api","campus-web"]}'
            else
              images="$(node --input-type=module -e \
                'import { ALL_IMAGES } from "./scripts/ci/ci-surfaces.mjs"; process.stdout.write(JSON.stringify(ALL_IMAGES))')"
              release="$(jq -cn --argjson images "$images" \
                '{images: $images, kubernetes: true, workers: ["app-api", "campus-web"]}')"
            fi
          else
            scripts/ci/write-change-plan.sh "$BASE_SHA" "$HEAD_SHA" change-plan.json
            jq -e '.unresolved | length == 0' change-plan.json >/dev/null
            release="$(jq -c .release change-plan.json)"
          fi
          worker_filters="$(jq -c '[.workers[] | if . == "app-api" then "app-api..." else "campus-web..." end]' <<< "$release")"
          {
            echo "images=$(jq -c .images <<< "$release")"
            echo "kubernetes=$(jq -r .kubernetes <<< "$release")"
            echo "validate_only=$VALIDATE_ONLY"
            echo "worker_filters=$worker_filters"
            echo "workers=$(jq -c .workers <<< "$release")"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Release plan'
            echo
            echo '```json'
            jq . <<< "$release"
            echo '```'
            if [ -n "$REPLAY_BASE_SHA" ]; then
              echo
              echo "Replay range: \`${REPLAY_BASE_SHA}..${HEAD_SHA}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release-config:
    needs: release-plan
    if: fromJSON(needs.release-plan.outputs.workers)[0] != null
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 15
    environment: staging
    outputs:
      docs_release_id: ${{ steps.docs-release.outputs.release_id }}
      object_store_endpoint: ${{ steps.object-store.outputs.endpoint }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AUTOMATION_TOKEN: ${{ secrets.CLOUDFLARE_AUTOMATION_TOKEN }}
      OBJECT_STORE_BUCKET_DERIVED: ${{ vars.OBJECT_STORE_BUCKET_DERIVED }}
      OBJECT_STORE_DERIVED_ACCESS_KEY: ${{ secrets.OBJECT_STORE_DERIVED_ACCESS_KEY }}
      OBJECT_STORE_DERIVED_SECRET_KEY: ${{ secrets.OBJECT_STORE_DERIVED_SECRET_KEY }}
      OBJECT_STORE_REGION: ${{ vars.OBJECT_STORE_REGION }}
      SENTRY_APP_API_PROJECT_SLUG: ${{ vars.SENTRY_APP_API_PROJECT_SLUG }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_CAMPUS_WEB_PROJECT_SLUG: ${{ vars.SENTRY_CAMPUS_WEB_PROJECT_SLUG }}
      SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
      APP_API_DB_FRESH_HYPERDRIVE_ID: ${{ vars.APP_API_DB_FRESH_HYPERDRIVE_ID }}
      APP_API_DB_HYPERDRIVE_ID: ${{ vars.APP_API_DB_HYPERDRIVE_ID }}
      AUTH_RESET_EMAIL_FROM: ${{ vars.AUTH_RESET_EMAIL_FROM }}
      AUTH_RESET_EMAIL_REPLY_TO: ${{ vars.AUTH_RESET_EMAIL_REPLY_TO }}
      CAMPUS_AUTH_TURNSTILE_SITE_KEY: ${{ vars.CAMPUS_AUTH_TURNSTILE_SITE_KEY }}
      EXECUTION_CONTROL_VPC_SERVICE_ID: ${{ vars.EXECUTION_CONTROL_VPC_SERVICE_ID }}
      MAP_DATA_BUCKET_NAME: ${{ vars.MAP_DATA_BUCKET_NAME }}
      SENTRY_APP_API_DSN: ${{ vars.SENTRY_APP_API_DSN }}
      SENTRY_CAMPUS_WEB_DSN: ${{ vars.SENTRY_CAMPUS_WEB_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup selected Worker workspaces
        uses: ./.github/actions/setup-node-pnpm
        with:
          workspace-filters: |
            campus-agent-web-workspace
            campus-contracts...
          workspace-filters-json: ${{ needs.release-plan.outputs.worker_filters }}

      - name: Validate Cloudflare staging credentials
        env:
          RELEASE_WORKERS: ${{ needs.release-plan.outputs.workers }}
        run: |
          set -euo pipefail
          if jq -e 'index("app-api") != null' <<< "$RELEASE_WORKERS" >/dev/null; then
            worker_app="apps/app-api"
          elif jq -e 'index("campus-web") != null' <<< "$RELEASE_WORKERS" >/dev/null; then
            worker_app="apps/campus-web"
          else
            echo "Release plan does not select a supported Cloudflare Worker." >&2
            exit 1
          fi
          pnpm --dir "$worker_app" exec tsx \
            ../../scripts/deploy/run-wrangler-command.ts \
            whoami --account "$CLOUDFLARE_ACCOUNT_ID" --json

      - name: Validate app-api staging configuration
        if: contains(fromJSON(needs.release-plan.outputs.workers), 'app-api')
        run: pnpm exec tsx scripts/deploy/doctor-env.ts worker-staging-app-api --json

      - name: Create GitOps read token
        if: contains(fromJSON(needs.release-plan.outputs.workers), 'campus-web') && (inputs.docs_release_id || '') == ''
        id: gitops-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ vars.GITOPS_PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PROMOTER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: campus-agent-gitops
          permission-contents: read

      - name: Checkout GitOps release selection
        if: steps.gitops-read-token.outcome == 'success'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
          repository: MUC-WIKI/campus-agent-gitops
          token: ${{ steps.gitops-read-token.outputs.token }}
          path: gitops-selection

      - name: Resolve Campus Docs release
        if: contains(fromJSON(needs.release-plan.outputs.workers), 'campus-web')
        id: docs-release
        env:
          REQUESTED_DOCS_RELEASE_ID: ${{ inputs.docs_release_id || '' }}
        run: |
          set -euo pipefail
          release_id="$REQUESTED_DOCS_RELEASE_ID"
          if [ -z "$release_id" ]; then
            selection=gitops-selection/cloudflare/staging/worker-versions.json
            version_id="$(jq -er '.workers["campus-web-staging"].versionId' "$selection")"
            release_id="$(pnpm exec tsx scripts/deploy/worker-version.ts \
              read-variable apps/campus-web campus-web-staging "$version_id" DOCS_RELEASE_ID)"
          fi
          if ! [[ "$release_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid Campus Docs release id: ${release_id}." >&2
            exit 1
          fi
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify the object store
        if: contains(fromJSON(needs.release-plan.outputs.workers), 'campus-web')
        id: object-store
        env:
          DOCS_RELEASE_ID: ${{ steps.docs-release.outputs.release_id }}
        run: |
          set -euo pipefail
          service_ip="$(kubectl -n campus-agent-staging get service object-store -o jsonpath='{.spec.clusterIP}')"
          test -n "$service_ip"
          endpoint="http://${service_ip}:9000"
          curl --noproxy '*' --fail --silent --show-error --max-time 5 \
            "${endpoint}/minio/health/live" >/dev/null
          echo "OBJECT_STORE_ENDPOINT=${endpoint}" >> "$GITHUB_ENV"
          echo "endpoint=${endpoint}" >> "$GITHUB_OUTPUT"
          OBJECT_STORE_ENDPOINT="$endpoint" \
            pnpm --dir apps/campus-web exec tsx \
              ./scripts/verify-published-reader-release.ts "$DOCS_RELEASE_ID"

      - name: Validate campus-web staging configuration
        if: contains(fromJSON(needs.release-plan.outputs.workers), 'campus-web')
        run: pnpm exec tsx scripts/deploy/doctor-env.ts worker-staging-campus-web --json

  publish-images:
    needs: release-plan
    if: >-
      needs.release-plan.result == 'success' &&
      needs.release-plan.outputs.validate_only != 'true' &&
      fromJSON(needs.release-plan.outputs.images)[0] != null
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "false"

      - name: Setup isolated Docker Buildx
        if: runner.environment == 'self-hosted'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          name: campus-agent-release-${{ github.run_id }}
          keep-state: false
          cleanup: true
          cache-binary: false
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              reservedSpace = "2GB"
              maxUsedSpace = "12GB"
              minFreeSpace = "25GB"

      - name: Setup temporary Docker Buildx
        if: runner.environment == 'github-hosted'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Verify Trivy
        if: runner.environment == 'self-hosted'
        run: test "$(trivy --version | awk 'NR == 1 {print $2}')" = "0.72.0"

      - name: Setup Trivy
        if: runner.environment == 'github-hosted'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.72.0
          cache: true

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, publish and scan images
        env:
          IMAGES: ${{ needs.release-plan.outputs.images }}
        run: scripts/ci/publish-images.sh "$IMAGES" image-digests.json

      - name: Summarize published image digests
        run: |
          {
            echo "### Published image digests"
            echo
            echo '| Image | Digest |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| `\(.key)` | `\(.value)` |"' image-digests.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-image-digests
          path: image-digests.json
          retention-days: 1

  publish-workers:
    needs: [release-plan, release-config]
    if: >-
      needs.release-config.result == 'success' &&
      needs.release-plan.outputs.validate_only != 'true' &&
      fromJSON(needs.release-plan.outputs.workers)[0] != null
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 45
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AUTOMATION_TOKEN: ${{ secrets.CLOUDFLARE_AUTOMATION_TOKEN }}
      APP_API_DB_FRESH_HYPERDRIVE_ID: ${{ vars.APP_API_DB_FRESH_HYPERDRIVE_ID }}
      APP_API_DB_HYPERDRIVE_ID: ${{ vars.APP_API_DB_HYPERDRIVE_ID }}
      AUTH_RESET_EMAIL_FROM: ${{ vars.AUTH_RESET_EMAIL_FROM }}
      AUTH_RESET_EMAIL_REPLY_TO: ${{ vars.AUTH_RESET_EMAIL_REPLY_TO }}
      CAMPUS_AUTH_TURNSTILE_SITE_KEY: ${{ vars.CAMPUS_AUTH_TURNSTILE_SITE_KEY }}
      EXECUTION_CONTROL_VPC_SERVICE_ID: ${{ vars.EXECUTION_CONTROL_VPC_SERVICE_ID }}
      MAP_DATA_BUCKET_NAME: ${{ vars.MAP_DATA_BUCKET_NAME }}
      SENTRY_APP_API_DSN: ${{ vars.SENTRY_APP_API_DSN }}
      SENTRY_CAMPUS_WEB_DSN: ${{ vars.SENTRY_CAMPUS_WEB_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node-pnpm
        with:
          workspace-filters: |
            campus-agent-web-workspace
            campus-contracts...
          workspace-filters-json: ${{ needs.release-plan.outputs.worker_filters }}

      - name: Upload app-api candidate
        if: contains(fromJSON(needs.release-plan.outputs.workers), 'app-api')
        env:
          SENTRY_APP_API_PROJECT_SLUG: ${{ vars.SENTRY_APP_API_PROJECT_SLUG }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
          WORKER_VERSION_OUTPUT: ${{ github.workspace }}/worker-candidates/app-api-staging.json
        run: |
          mkdir -p worker-candidates
          pnpm --dir apps/app-api upload:staging

      - name: Build and upload campus-web candidate
        if: contains(fromJSON(needs.release-plan.outputs.workers), 'campus-web')
        env:
          CAMPUS_WEB_SENTRY_SOURCE_MAP_UPLOAD: required
          DOCS_RELEASE_ID: ${{ needs.release-config.outputs.docs_release_id }}
          OBJECT_STORE_BUCKET_DERIVED: ${{ vars.OBJECT_STORE_BUCKET_DERIVED }}
          OBJECT_STORE_DERIVED_ACCESS_KEY: ${{ secrets.OBJECT_STORE_DERIVED_ACCESS_KEY }}
          OBJECT_STORE_DERIVED_SECRET_KEY: ${{ secrets.OBJECT_STORE_DERIVED_SECRET_KEY }}
          OBJECT_STORE_ENDPOINT: ${{ needs.release-config.outputs.object_store_endpoint }}
          OBJECT_STORE_REGION: ${{ vars.OBJECT_STORE_REGION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_CAMPUS_WEB_PROJECT_SLUG: ${{ vars.SENTRY_CAMPUS_WEB_PROJECT_SLUG }}
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
          WORKER_VERSION_OUTPUT: ${{ github.workspace }}/worker-candidates/campus-web-staging.json
        run: |
          mkdir -p worker-candidates
          pnpm --dir apps/campus-web run build:staging --release-id "${DOCS_RELEASE_ID}"
          pnpm --dir apps/campus-web upload:staging

      - name: Upload Worker candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-worker-candidates
          path: worker-candidates/*.json
          retention-days: 1

  promote:
    needs: [release-plan, release-config, publish-images, publish-workers]
    if: >-
      always() &&
      needs.release-plan.result == 'success' &&
      (
        fromJSON(needs.release-plan.outputs.images)[0] == null ||
        needs.publish-images.result == 'success'
      ) &&
      needs.release-plan.outputs.validate_only != 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.promote) &&
      (
        needs.publish-images.result == 'success' ||
        needs.publish-workers.result == 'success' ||
        needs.release-plan.outputs.kubernetes == 'true'
      )
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Prepare release inputs
        run: |
          echo '{}' > image-digests.json
          mkdir -p worker-candidates

      - name: Download image digests
        if: needs.publish-images.result == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-image-digests

      - name: Download Worker candidates
        if: needs.publish-workers.result == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-worker-candidates
          path: worker-candidates

      - name: Create GitOps promotion token
        id: gitops-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ vars.GITOPS_PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PROMOTER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: campus-agent-gitops
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout GitOps repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
          repository: MUC-WIKI/campus-agent-gitops
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops

      - name: Update GitOps desired state
        id: source
        env:
          K8S_CHANGED: ${{ needs.release-plan.outputs.kubernetes }}
          REQUIRE_ALL_IMAGE_CONSUMERS: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
        run: >-
          scripts/deploy/update-staging-candidate.sh
          image-digests.json worker-candidates gitops

      - name: Detect GitOps changes
        id: promotion
        run: |
          if git -C gitops diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup kubectl
        if: steps.promotion.outputs.changed == 'true'
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5
        with:
          version: v1.36.2

      - name: Validate promoted manifests
        if: steps.promotion.outputs.changed == 'true'
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git_config="$(mktemp)"
          trap 'rm -f "$git_config"' EXIT
          export GIT_CONFIG_GLOBAL="$git_config"
          git config --global \
            url."https://x-access-token:${SOURCE_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          for overlay in gitops/clusters/staging/overlays/*; do
            kubectl kustomize "$overlay" >/dev/null
          done
          kubectl kustomize gitops/clusters/staging/applications >/dev/null
          kubectl kustomize gitops/clusters/staging/secrets >/dev/null

      - name: Open GitOps deployment pull request
        if: steps.promotion.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops
          base: main
          branch: deploy/staging-${{ github.sha }}
          delete-branch: true
          commit-message: "chore: 部署 staging 候选版本 ${{ steps.source.outputs.short_sha }}"
          title: "chore: 部署 staging 候选版本 ${{ steps.source.outputs.short_sha }}"
          body: |
            ## 变更内容

            - 更新 `campus-agent@${{ github.sha }}` 产生的受影响镜像（如有）
            - 更新受影响 Cloudflare Worker 的不可变版本（如有）
            - 仅更新环境仓已经声明的镜像 digest
            - Kubernetes 基座变化时同步源码引用

            ## 验证结果

            - [x] 本次产生的镜像（如有）均在 arm64 上通过 HIGH / CRITICAL 漏洞扫描
            - [x] Worker 候选版本上传未改变当前流量版本
            - [x] 所有 staging Kustomize overlay 可完整渲染
            - [x] Application 与 SealedSecret 清单可完整渲染
