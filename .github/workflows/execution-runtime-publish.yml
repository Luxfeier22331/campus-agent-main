name: staging-candidate-publish

on:
  workflow_dispatch:
    inputs:
      candidate_scope:
        description: Select the accumulated diff or republish Campus Web with current docs
        required: true
        default: affected
        type: choice
        options:
          - affected
          - campus-web-docs
      validate_only:
        description: Validate staging Worker configuration without publishing candidates
        required: true
        default: true
        type: boolean
      promote:
        description: Open or update the staging GitOps promotion pull request
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    max-jobs = 1
    cores = 2

concurrency:
  group: staging-candidate-publish
  cancel-in-progress: false

jobs:
  release-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      statuses: write
    defaults:
      run:
        shell: nix develop .#ci-light --command bash -e {0}
    outputs:
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
      images: ${{ steps.plan.outputs.images }}
      kubernetes: ${{ steps.plan.outputs.kubernetes }}
      validate_only: ${{ steps.plan.outputs.validate_only }}
      validation_profiles: ${{ steps.plan.outputs.validation_profiles }}
      workers: ${{ steps.plan.outputs.workers }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          enable_kvm: false

      - name: Restore pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ${{ runner.tool_cache }}/pnpm-store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure pnpm store
        run: echo "npm_config_store_dir=${RUNNER_TOOL_CACHE}/pnpm-store" >> "$GITHUB_ENV"

      - name: Create GitOps read token
        id: gitops-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ vars.GITOPS_PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PROMOTER_PRIVATE_KEY }}
          owner: MUC-WIKI
          repositories: campus-agent-gitops
          permission-contents: read

      - name: Checkout GitOps release selection
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
          repository: MUC-WIKI/campus-agent-gitops
          token: ${{ steps.gitops-read-token.outputs.token }}
          path: gitops-selection
          sparse-checkout: |
            /releases/staging.json
            /cloudflare/staging/worker-versions.json
          sparse-checkout-cone-mode: false

      - name: Install release planner dependencies
        run: |
          set -euo pipefail
          mkdir -p "$npm_config_store_dir"
          pnpm install --frozen-lockfile --prefer-offline \
            --filter campus-agent-web-workspace

      - name: Select release candidates
        id: plan
        env:
          PROMOTE: ${{ github.event_name == 'workflow_dispatch' && inputs.promote || false }}
          REFRESH_CAMPUS_WEB_DOCS: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_scope == 'campus-web-docs' || false }}
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only || false }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Staging validation and publication are allowed only from main." >&2
            exit 1
          fi
          if [[ "$PROMOTE" == "true" && "$VALIDATE_ONLY" == "true" ]]; then
            echo "Validation-only runs cannot promote candidates." >&2
            exit 1
          fi
          if [[ "$REFRESH_CAMPUS_WEB_DOCS" == "true" && "$VALIDATE_ONLY" == "true" ]]; then
            echo "Campus Web docs refresh cannot run in validation-only mode." >&2
            exit 1
          fi
          plan="$(node --experimental-strip-types scripts/release/candidates.mts \
            --head "$GITHUB_SHA" \
            --refresh-campus-web-docs "$REFRESH_CAMPUS_WEB_DOCS" \
            --selection "$GITHUB_WORKSPACE/gitops-selection/releases/staging.json" \
            --validate-only "$VALIDATE_ONLY" \
            --worker-selection "$GITHUB_WORKSPACE/gitops-selection/cloudflare/staging/worker-versions.json")"
          jq -e . <<< "$plan" >/dev/null
          {
            echo "base=$(jq -r '.base' <<< "$plan")"
            echo "head=$(jq -r '.head' <<< "$plan")"
            echo "images=$(jq -c '.images' <<< "$plan")"
            echo "kubernetes=$(jq -r '.kubernetes' <<< "$plan")"
            echo "validate_only=$(jq -r '.validateOnly' <<< "$plan")"
            echo "validation_profiles=$(jq -c '.validationProfiles' <<< "$plan")"
            echo "workers=$(jq -c '.workers' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          jq . <<< "$plan"

      - name: Mark staging candidate pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=pending
          -f context=staging/candidate
          -f description='Validating this Source revision as a staging candidate'
          -f target_url="$TARGET_URL"

  candidate-evidence:
    needs: release-plan
    if: needs.release-plan.result == 'success'
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 90
    steps:
      - name: Checkout
        if: fromJSON(needs.release-plan.outputs.validation_profiles)[0] != null
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - name: Install candidate workspaces
        if: fromJSON(needs.release-plan.outputs.validation_profiles)[0] != null
        env:
          npm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
        run: |
          set -euo pipefail
          mkdir -p "$npm_config_store_dir"
          pnpm install --frozen-lockfile --prefer-offline

      - name: Install evaluation dependencies
        if: contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'ragas')
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
        run: uv sync --package campus-ragas-runner

      - name: Verify Docker evidence dependency
        if: >-
          contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'app-api-migration') ||
          contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'app-api-product-db') ||
          contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'execution-control-postgres') ||
          contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'ingestion-control-postgres') ||
          contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'ops-web-postgres') ||
          contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'otel')
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
        run: docker info >/dev/null

      - name: Install Chromium headless shell
        if: >-
          contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'campus-browser-smoke') ||
          contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'campus-browser-full') ||
          contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'ops-web-browser')
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
        run: pnpm --dir apps/campus-web exec playwright install --only-shell chromium

      - name: Run selected candidate evidence
        if: fromJSON(needs.release-plan.outputs.validation_profiles)[0] != null
        env:
          BASE_SHA: ${{ needs.release-plan.outputs.base }}
          CAMPUS_WEB_E2E_PREBUILT: "1"
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/cargo-target/campus-agent
          CI_DOCKER_CGROUP_PARENT: ci.slice
          HEAD_SHA: ${{ needs.release-plan.outputs.head }}
          OPS_WEB_BROWSER_TEST_PORT: "4278"
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/ms-playwright
          TURBO_CACHE: "local:rw,remote:rw"
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VALIDATION_PROFILES: ${{ needs.release-plan.outputs.validation_profiles }}
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
        run: >-
          node --experimental-strip-types scripts/ci/evidence.mts
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --profiles "$VALIDATION_PROFILES"

      - name: Complete candidate without affected evidence
        if: fromJSON(needs.release-plan.outputs.validation_profiles)[0] == null
        run: echo "No candidate evidence is required for this Source revision."

      - name: Upload browser failure evidence
        if: >-
          failure() &&
          (
            contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'campus-browser-smoke') ||
            contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'campus-browser-full') ||
            contains(fromJSON(needs.release-plan.outputs.validation_profiles), 'ops-web-browser')
          )
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          if-no-files-found: ignore
          name: candidate-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/campus-web/playwright-report/e2e
            apps/campus-web/playwright-report/e2e-worker
            apps/campus-web/test-results/e2e
            apps/campus-web/test-results/e2e-worker
            apps/ops-web/test-results
            apps/ops-web/playwright-report
          retention-days: 7

  candidate-status:
    needs: [release-plan, candidate-evidence]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    outputs:
      approved: ${{ steps.status.outputs.approved }}
    steps:
      - name: Finalize staging candidate status
        id: status
        env:
          EVIDENCE_RESULT: ${{ needs.candidate-evidence.result }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_RESULT: ${{ needs.release-plan.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          approved=false
          description='This Source revision is not a valid staging candidate'
          if [ "$PLAN_RESULT" = success ] && [ "$EVIDENCE_RESULT" = success ]; then
            state=success
            approved=true
            description='Affected Source and deployment contracts passed'
          fi
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context=staging/candidate \
            -f description="$description" \
            -f target_url="$TARGET_URL"

  publish-images:
    needs: [release-plan, candidate-evidence, candidate-status]
    if: >-
      needs.release-plan.result == 'success' &&
      needs.candidate-evidence.result == 'success' &&
      needs.candidate-status.outputs.approved == 'true' &&
      needs.release-plan.outputs.validate_only != 'true' &&
      fromJSON(needs.release-plan.outputs.images)[0] != null
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup persistent Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          name: campus-agent-release
          keep-state: true
          cleanup: false
          cache-binary: false
          driver-opts: |
            cgroup-parent=ci.slice
            cpu-period=100000
            cpu-quota=200000
            memory=2g
            memory-swap=2g
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              reservedSpace = "2GB"
              maxUsedSpace = "12GB"
              minFreeSpace = "25GB"

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, publish and scan images
        env:
          IMAGES: ${{ needs.release-plan.outputs.images }}
        run: >-
          node --experimental-strip-types scripts/release/images.mts
          --images "$IMAGES"
          --output image-digests.json
          --repository "$GITHUB_REPOSITORY"
          --source-sha "$GITHUB_SHA"
          --trivy-cache "${RUNNER_TOOL_CACHE}/trivy"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload image digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-image-digests
          path: image-digests.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish-app-api:
    needs: [release-plan, candidate-evidence, candidate-status]
    if: >-
      needs.candidate-evidence.result == 'success' &&
      needs.candidate-status.outputs.approved == 'true' &&
      contains(fromJSON(needs.release-plan.outputs.workers), 'app-api-staging')
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 5
    environment: staging
    env:
      APP_API_DB_HYPERDRIVE_ID: ${{ vars.APP_API_DB_HYPERDRIVE_ID }}
      AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
      AUTH_EMAIL_REPLY_TO: ${{ vars.AUTH_EMAIL_REPLY_TO }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXECUTION_CONTROL_VPC_SERVICE_ID: ${{ vars.EXECUTION_CONTROL_VPC_SERVICE_ID }}
      OBJECT_STORE_VPC_SERVICE_ID: ${{ vars.OBJECT_STORE_VPC_SERVICE_ID }}
      SENTRY_APP_API_DSN: ${{ vars.SENTRY_APP_API_DSN }}
      APP_API_EXECUTION_SHARED_SECRET: ${{ secrets.APP_API_EXECUTION_SHARED_SECRET }}
      OPS_WEB_INTERNAL_TOKEN: ${{ secrets.OPS_WEB_INTERNAL_TOKEN }}
    defaults:
      run:
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Install App API workspace
        env:
          npm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
        run: >-
          pnpm install --frozen-lockfile --prefer-offline
          --filter campus-agent-web-workspace
          --filter 'campus-contracts...'
          --filter 'app-api...'

      - name: Validate app-api staging configuration
        if: needs.release-plan.outputs.validate_only == 'true'
        run: pnpm --dir apps/app-api exec tsx ./scripts/preflight-staging.ts

      - name: Upload app-api candidate
        if: needs.release-plan.outputs.validate_only != 'true'
        env:
          SENTRY_APP_API_PROJECT_SLUG: ${{ vars.SENTRY_APP_API_PROJECT_SLUG }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
          WORKER_VERSION_OUTPUT: ${{ github.workspace }}/worker-candidates/app-api-staging.json
        run: |
          mkdir -p worker-candidates
          pnpm --dir apps/app-api upload:staging

      - name: Upload Worker candidates
        if: needs.release-plan.outputs.validate_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-worker-candidate-app-api
          path: worker-candidates/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish-campus-web:
    needs: [release-plan, candidate-evidence, candidate-status]
    if: >-
      needs.candidate-evidence.result == 'success' &&
      needs.candidate-status.outputs.approved == 'true' &&
      contains(fromJSON(needs.release-plan.outputs.workers), 'campus-web-staging')
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Install Campus Web workspace
        env:
          npm_config_store_dir: ${{ runner.tool_cache }}/pnpm-store
        run: >-
          pnpm install --frozen-lockfile --prefer-offline
          --filter campus-agent-web-workspace
          --filter 'campus-web...'

      - name: Resolve object store endpoint
        id: object-store
        run: |
          set -euo pipefail
          address="$(kubectl --context default --namespace campus-agent-staging \
            get service object-store --output=jsonpath='{.spec.clusterIP}')"
          port="$(kubectl --context default --namespace campus-agent-staging \
            get service object-store --output=jsonpath='{.spec.ports[?(@.name=="s3")].port}')"
          test -n "$address"
          [[ "$port" =~ ^[0-9]+$ ]]
          echo "endpoint=http://${address}:${port}" >> "$GITHUB_OUTPUT"

      - name: Build Campus Web staging configuration
        if: needs.release-plan.outputs.validate_only == 'true'
        env:
          OBJECT_STORE_DERIVED_ACCESS_KEY: ${{ secrets.OBJECT_STORE_DERIVED_ACCESS_KEY }}
          OBJECT_STORE_DERIVED_SECRET_KEY: ${{ secrets.OBJECT_STORE_DERIVED_SECRET_KEY }}
          OBJECT_STORE_ENDPOINT: ${{ steps.object-store.outputs.endpoint }}
        run: pnpm --dir apps/campus-web build:staging

      - name: Build Campus Web staging candidate
        if: needs.release-plan.outputs.validate_only != 'true'
        env:
          CAMPUS_WEB_SENTRY_SOURCE_MAP_UPLOAD: required
          OBJECT_STORE_DERIVED_ACCESS_KEY: ${{ secrets.OBJECT_STORE_DERIVED_ACCESS_KEY }}
          OBJECT_STORE_DERIVED_SECRET_KEY: ${{ secrets.OBJECT_STORE_DERIVED_SECRET_KEY }}
          OBJECT_STORE_ENDPOINT: ${{ steps.object-store.outputs.endpoint }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_CAMPUS_WEB_PROJECT_SLUG: ${{ vars.SENTRY_CAMPUS_WEB_PROJECT_SLUG }}
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
        run: pnpm --dir apps/campus-web build:staging

      - name: Validate Campus Web staging configuration
        env:
          CAMPUS_AUTH_TURNSTILE_SITE_KEY: ${{ vars.CAMPUS_AUTH_TURNSTILE_SITE_KEY }}
        run: pnpm --dir apps/campus-web exec tsx ./scripts/preflight-staging.ts

      - name: Upload Campus Web candidate
        if: needs.release-plan.outputs.validate_only != 'true'
        env:
          CAMPUS_AUTH_TURNSTILE_SITE_KEY: ${{ vars.CAMPUS_AUTH_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_CAMPUS_WEB_DSN: ${{ vars.SENTRY_CAMPUS_WEB_DSN }}
          SENTRY_CAMPUS_WEB_PROJECT_SLUG: ${{ vars.SENTRY_CAMPUS_WEB_PROJECT_SLUG }}
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
          WORKER_VERSION_OUTPUT: ${{ github.workspace }}/worker-candidates/campus-web-staging.json
        run: |
          mkdir -p worker-candidates
          pnpm --dir apps/campus-web upload:staging

      - name: Upload Worker candidate
        if: needs.release-plan.outputs.validate_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-worker-candidate-campus-web
          path: worker-candidates/campus-web-staging.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  promote:
    needs: [release-plan, candidate-evidence, candidate-status, publish-images, publish-app-api, publish-campus-web]
    if: >-
      always() &&
      needs.release-plan.result == 'success' &&
      needs.candidate-evidence.result == 'success' &&
      needs.candidate-status.outputs.approved == 'true' &&
      needs.release-plan.outputs.validate_only != 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.promote) &&
      contains(fromJSON('["success","skipped"]'), needs.publish-images.result) &&
      contains(fromJSON('["success","skipped"]'), needs.publish-app-api.result) &&
      contains(fromJSON('["success","skipped"]'), needs.publish-campus-web.result) &&
      (
        needs.publish-images.result == 'success' ||
        needs.publish-app-api.result == 'success' ||
        needs.publish-campus-web.result == 'success' ||
        needs.release-plan.outputs.kubernetes == 'true'
      )
    runs-on: [self-hosted, Linux, ARM64, campus-agent-release]
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Prepare release inputs
        shell: /nix/var/nix/profiles/default/bin/nix develop .#ci-full --command bash -e {0}
        run: |
          node -e 'require("node:fs").writeFileSync("image-digests.json", "{}\n")'
          mkdir -p worker-candidates

      - name: Download image digests
        if: needs.publish-images.result == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-image-digests

      - name: Download Worker candidates
        if: needs.publish-app-api.result == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-worker-candidate-app-api
          path: worker-candidates

      - name: Download Campus Web Worker candidate
        if: needs.publish-campus-web.result == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-worker-candidate-campus-web
          path: worker-candidates

      - name: Create GitOps promotion token
        id: gitops-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ vars.GITOPS_PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PROMOTER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            campus-agent
            campus-agent-gitops
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Checkout GitOps repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
          repository: MUC-WIKI/campus-agent-gitops
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops

      - name: Install GitOps tooling
        shell: /nix/var/nix/profiles/default/bin/nix develop ./gitops#ci-infra --command bash -e {0}
        run: pnpm --dir gitops install --frozen-lockfile --prefer-offline

      - name: Update GitOps desired state
        env:
          EXPECTED_WORKERS: ${{ needs.release-plan.outputs.workers }}
          KUBERNETES_CHANGED: ${{ needs.release-plan.outputs.kubernetes }}
        shell: /nix/var/nix/profiles/default/bin/nix develop ./gitops#ci-infra --command bash -e {0}
        run: >-
          pnpm --dir gitops gitops promote-source
          --expected-source-sha "${{ needs.release-plan.outputs.base }}"
          --expected-workers "$EXPECTED_WORKERS"
          --image-digests "$GITHUB_WORKSPACE/image-digests.json"
          --kubernetes "$KUBERNETES_CHANGED"
          --root "$GITHUB_WORKSPACE/gitops"
          --source-repository "$GITHUB_REPOSITORY"
          --source-sha "$GITHUB_SHA"
          --worker-candidates "$GITHUB_WORKSPACE/worker-candidates"

      - name: Render promoted GitOps state
        env:
          SOURCE_TOKEN: ${{ steps.gitops-token.outputs.token }}
        shell: /nix/var/nix/profiles/default/bin/nix develop ./gitops#ci-infra --command bash -e {0}
        run: |
          set -euo pipefail
          pnpm --dir gitops exec tsx tools/gitops.ts \
            validate-source --root "$GITHUB_WORKSPACE/gitops"
          scope="${RUNNER_TEMP}/promotion-scope.json"
          pnpm --dir gitops exec tsx tools/gitops.ts scope-worktree \
            --root "$GITHUB_WORKSPACE/gitops" \
            > "$scope"
          jq -e . "$scope" >/dev/null
          if jq -e '.kustomizeRoots | length > 0' "$scope" >/dev/null; then
            rendered="${RUNNER_TEMP}/promotion-kustomize"
            mkdir -p "$rendered"
            gitops/scripts/validate-kubernetes.sh "$scope" "$rendered"
          fi

      - name: Detect GitOps changes
        id: promotion
        shell: /nix/var/nix/profiles/default/bin/nix develop ./gitops#ci-infra --command bash -e {0}
        run: |
          if git -C gitops diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open GitOps deployment pull request
        id: deployment-pr
        if: steps.promotion.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops
          base: main
          branch: deploy/staging
          delete-branch: true
          commit-message: "chore: 部署 staging 候选版本 ${{ github.sha }}"
          title: "chore: 部署 staging 候选版本 ${{ github.sha }}"
          body: |
            ## 变更内容

            - 更新 `campus-agent@${{ github.sha }}` 产生的活跃镜像（如有）
            - 更新 App API 与 Campus Web Worker 的不可变版本（如有）
            - Kubernetes 基座变化时同步活跃 Application 的源码引用

            ## 验证结果

            - [x] 发布镜像（如有）均为单一 `linux/arm64` 索引并通过 Trivy 扫描
            - [x] Worker 候选版本上传未改变当前流量版本
            - [x] `promote-source` 已校验候选身份和活跃消费者
            - [x] promotion 后的受影响 Kustomize、schema、策略与引用检查
            - [ ] GitOps PR 的完整仓库与受影响 Terraform/Helm 检查

      - name: Mark staging promotion pending
        if: steps.promotion.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          TARGET_URL: ${{ steps.deployment-pr.outputs.pull-request-url }}
        shell: /nix/var/nix/profiles/default/bin/nix develop ./gitops#ci-infra --command bash -e {0}
        run: >-
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=pending
          -f context=staging/promotion
          -f description='GitOps is validating the staging promotion'
          -f target_url="$TARGET_URL"
