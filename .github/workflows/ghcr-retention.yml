name: ghcr-retention

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Report the plan or apply it to GHCR
        required: true
        default: report
        type: choice
        options:
          - report
          - apply
      keep_releases:
        description: Number of latest SHA-tagged releases to keep per active package
        required: true
        default: "5"
        type: string
      untagged_grace_days:
        description: Days to retain untagged versions before they become candidates
        required: true
        default: "7"
        type: string
  schedule:
    - cron: "20 3 * * 0"

permissions:
  contents: read

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    max-jobs = 1
    cores = 2

concurrency:
  group: campus-agent-ghcr-mutation
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'self-hosted' && '["self-hosted","Linux","campus-ci"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      pull-requests: read
    defaults:
      run:
        shell: nix develop .#ci-release --command bash -e {0}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          enable_kvm: false

      - name: Create GitOps read token
        id: gitops-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ vars.GITOPS_PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PROMOTER_PRIVATE_KEY }}
          owner: MUC-WIKI
          repositories: campus-agent-gitops
          permission-contents: read
          permission-pull-requests: read

      - name: Checkout GitOps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true
          repository: MUC-WIKI/campus-agent-gitops
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops
          ref: main
          fetch-depth: 0

      - name: Setup Docker Buildx
        if: runner.environment != 'self-hosted'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          cache-binary: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch open GitOps pull request refs
        id: gitops-refs
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          set -euo pipefail
          refs_file="${RUNNER_TEMP}/ghcr-retention-gitops-refs"
          printf '%s\n' main > "$refs_file"
          while read -r pull_request; do
            git -C gitops fetch --no-tags origin \
              "pull/${pull_request}/head:refs/remotes/origin/ghcr-retention-pr-${pull_request}"
            printf '%s\n' "refs/remotes/origin/ghcr-retention-pr-${pull_request}" >> "$refs_file"
          done < <(
            gh api --paginate \
              'repos/MUC-WIKI/campus-agent-gitops/pulls?state=open&base=main&per_page=100' \
              --jq '.[] | select(.head.repo.full_name == "MUC-WIKI/campus-agent-gitops") | .number'
          )
          echo "refs_file=$refs_file" >> "$GITHUB_OUTPUT"

      - name: Generate and optionally apply GHCR retention plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITOPS_REFS_FILE: ${{ steps.gitops-refs.outputs.refs_file }}
          RETENTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'report' }}
          KEEP_RELEASES: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_releases || '5' }}
          UNTAGGED_GRACE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.untagged_grace_days || '7' }}
        run: |
          set -euo pipefail
          gitops_ref_args=()
          while read -r ref; do
            gitops_ref_args+=(--gitops-ref "$ref")
          done < "$GITOPS_REFS_FILE"
          node --experimental-strip-types scripts/release/ghcr-retention.mts \
            --mode "$RETENTION_MODE" \
            --keep-releases "$KEEP_RELEASES" \
            --untagged-grace-days "$UNTAGGED_GRACE_DAYS" \
            --gitops-root "$GITHUB_WORKSPACE/gitops" \
            --output ghcr-retention.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${gitops_ref_args[@]}"

      - name: Upload GHCR retention report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ghcr-retention-report-${{ github.run_id }}
          path: ghcr-retention.json
          if-no-files-found: error
          retention-days: 30
