name: ghcr-retention

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Report the plan or apply it to GHCR
        required: true
        default: report
        type: choice
        options:
          - report
          - apply
      pr_number:
        description: Closed same-repository PR whose caches should be cleaned
        required: true
        type: string
  # Trusted default-branch code only; PR code and artifacts are never executed.
  pull_request_target:  # zizmor: ignore[dangerous-triggers] Closed-PR cache cleanup only.
    types: [closed]

permissions:
  contents: read

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    max-jobs = 1
    cores = 2

concurrency:
  # Same concurrency group replaces pending runs on queue. PR-close scoped apply
  # only deletes pr-cache-<N>/* packages (disjoint from publish writes), so it
  # uses its own per-PR group and cannot replace pending publish/cleanup runs.
  group: ${{ format('campus-agent-ghcr-pr-cache-{0}', github.event.pull_request.number || inputs.pr_number) }}
  cancel-in-progress: false

jobs:
  retention:
    # Only same-repository, non-Dependabot PRs can write these caches.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'self-hosted' && '["self-hosted","Linux","campus-ci"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
      packages: write
      pull-requests: read
    defaults:
      run:
        shell: nix develop .#ci-release --command bash -e {0}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          enable_kvm: false

      - name: Generate and optionally apply GHCR retention plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_MODE: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.mode)
            || (github.event_name == 'pull_request_target' && 'apply')
            || 'report' }}
          RETENTION_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          args=(
            --mode "$RETENTION_MODE"
            --output ghcr-retention.json
            --summary "$GITHUB_STEP_SUMMARY"
          )
          args+=(--pr-cache-pr "$RETENTION_PR_NUMBER")
          node --experimental-strip-types scripts/release/ghcr-retention.mts "${args[@]}"

      - name: Upload GHCR retention report
        if: ${{ always() && hashFiles('ghcr-retention.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ghcr-retention-report-${{ github.run_id }}
          path: ghcr-retention.json
          if-no-files-found: error
          retention-days: 30
