name: staging-candidate-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campus-agent-ghcr-mutation
  cancel-in-progress: false
  queue: max

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    max-jobs = 1
    cores = 2

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'self-hosted' && '["self-hosted","Linux","campus-ci"]' || '"ubuntu-24.04-arm"') }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      statuses: write
    defaults:
      run:
        shell: nix develop .#ci-release --command bash -e {0}
    steps:
      - name: Require main publication
        shell: bash -e {0}
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          enable_kvm: false
      - name: Setup Docker Buildx
        if: runner.environment != 'self-hosted'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          driver: docker-container
          cache-binary: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Verify runner-owned builder
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci/runner-capability-probe.sh

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install release planner
        run: |
          pnpm install --frozen-lockfile --filter campus-agent-web-workspace
          echo "CANDIDATE_DIRECTORY=$RUNNER_TEMP/source-candidate" >> "$GITHUB_ENV"
      - name: Login OCI client
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Plan from the published Source candidate
        id: plan
        run: node --experimental-strip-types scripts/release/source-candidate.mts plan
      - name: Publish changed images
        if: steps.plan.outputs.images != '[]'
        env:
          IMAGES: ${{ steps.plan.outputs.images }}
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}
        run: >-
          node --experimental-strip-types scripts/release/images.mts
          --images "$IMAGES" --output "$CANDIDATE_DIRECTORY/image-digests.json"
          --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --trivy-cache "${RUNNER_TOOL_CACHE}/trivy" --summary "$GITHUB_STEP_SUMMARY"
      - name: Publish complete Source candidate
        id: candidate
        run: node --experimental-strip-types scripts/release/source-candidate.mts publish
      - name: Upload candidate output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-release
          path: ${{ runner.temp }}/source-candidate/source-release.json
          overwrite: true
          retention-days: 7
      - name: Create GitOps dispatch token
        id: gitops-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.GITOPS_PROMOTER_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PROMOTER_PRIVATE_KEY }}
          owner: MUC-WIKI
          repositories: campus-agent-gitops
          permission-actions: write
      - name: Dispatch GitOps candidate assembly
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          CANDIDATE_REF: ${{ steps.candidate.outputs.candidate_ref }}
        run: >-
          gh api --method POST repos/MUC-WIKI/campus-agent-gitops/actions/workflows/publish-source.yml/dispatches
          -f ref=main -f "inputs[candidate_ref]=$CANDIDATE_REF"
      - name: Report publication failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=failure -f context=staging/candidate
          -f description='Source candidate publication failed'
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
