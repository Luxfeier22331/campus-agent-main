name: run-osv-scan
description: Run OSV-Scanner with a checksum-verified release binary.
inputs:
  ecosystems:
    description: Space-separated dependency ecosystems to scan.
    required: false
    default: node python rust go
  version:
    description: OSV-Scanner release tag.
    required: false
    default: v2.3.8
runs:
  using: composite
  steps:
    - name: Scan dependencies
      shell: bash
      env:
        ECOSYSTEMS: ${{ inputs.ecosystems }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        read -r -a ecosystems <<< "$ECOSYSTEMS"
        OSV_SCANNER_VERSION="$VERSION" \
          "${GITHUB_WORKSPACE}/scripts/ci/osv-scan.sh" "${ecosystems[@]}"
