name: run-actionlint
description: Run a checksum-verified actionlint release binary.
inputs:
  version:
    description: actionlint release version without the v prefix.
    required: false
    default: 1.7.12
runs:
  using: composite
  steps:
    - name: Run actionlint
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ inputs.version }}
      run: scripts/ci/actionlint.sh
