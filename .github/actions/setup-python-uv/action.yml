name: setup-python-uv
description: Install Python and sync the uv workspace with the repository cache policy.
inputs:
  sync:
    description: Whether to run uv sync.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Setup uv
      if: runner.environment == 'github-hosted'
      uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1  # v8.3.1
      with:
        version: "0.11.28"
        enable-cache: true
        python-version: "3.12"

    - name: Verify uv installation
      shell: bash
      run: |
        set -euo pipefail
        test "$(uv --version | awk '{print $2}')" = "0.11.28"

    - name: Install Python
      shell: bash
      run: uv python install 3.12

    - name: Sync workspace
      if: inputs.sync == 'true'
      shell: bash
      run: uv sync --all-packages --dev
