name: setup-python-uv
description: Install Python and sync the uv workspace with the repository cache policy.
inputs:
  sync:
    description: Whether to run uv sync.
    required: false
    default: "true"
  sync-mode:
    description: Workspace, tools, or eval dependency scope.
    required: false
    default: workspace
runs:
  using: composite
  steps:
    - name: Setup uv
      if: runner.environment == 'github-hosted'
      uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1  # v8.3.1
      with:
        version: "0.11.28"
        enable-cache: true
        python-version: "3.12"

    - name: Verify uv installation
      shell: bash
      run: |
        set -euo pipefail
        test "$(uv --version | awk '{print $2}')" = "0.11.28"

    - name: Install Python
      shell: bash
      run: uv python install 3.12

    - name: Sync lint tools
      if: inputs.sync == 'true' && inputs.sync-mode == 'tools'
      shell: bash
      run: uv sync --only-dev --no-install-workspace

    - name: Sync evaluation package
      if: inputs.sync == 'true' && inputs.sync-mode == 'eval'
      shell: bash
      run: uv sync --package campus-ragas-runner

    - name: Sync workspace
      if: inputs.sync == 'true' && inputs.sync-mode == 'workspace'
      shell: bash
      run: uv sync --all-packages --dev

    - name: Reject unknown sync mode
      if: inputs.sync == 'true' && inputs.sync-mode != 'tools' && inputs.sync-mode != 'eval' && inputs.sync-mode != 'workspace'
      shell: bash
      env:
        SYNC_MODE: ${{ inputs.sync-mode }}
      run: |
        echo "Unsupported uv sync mode: ${SYNC_MODE}" >&2
        exit 1
