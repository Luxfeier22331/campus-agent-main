name: setup-node-pnpm
description: Install pnpm and Node dependencies with the repository cache policy.
inputs:
  install:
    description: Whether to run pnpm install.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10.26.1

    - name: Setup Node with pnpm cache
      if: inputs.install == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Setup Node without dependency cache
      if: inputs.install != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
