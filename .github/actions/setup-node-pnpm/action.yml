name: setup-node-pnpm
description: Install pnpm and Node dependencies with the repository cache policy.
inputs:
  install:
    description: Whether to run pnpm install.
    required: false
    default: "true"
  workspace-filters:
    description: Newline-separated pnpm workspace filters to install.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup pnpm
      if: runner.environment == 'github-hosted'
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6
      with:
        version: "10.34.5"

    - name: Setup Node with pnpm cache
      if: inputs.install == 'true' && runner.environment == 'github-hosted'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Setup Node without dependency cache
      if: inputs.install != 'true' && runner.environment == 'github-hosted'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
      with:
        node-version-file: .node-version
        package-manager-cache: false

    - name: Verify Node and pnpm installation
      shell: bash
      env:
        RUNNER_KIND: ${{ runner.environment }}
      run: |
        set -euo pipefail
        test "$(node --version)" = "v24.18.0"
        test "$(pnpm --version)" = "10.34.5"
        if [[ "$RUNNER_KIND" == "self-hosted" ]]; then
          store_dir="${RUNNER_TOOL_CACHE}/pnpm-store"
          mkdir -p "$store_dir"
          test -w "$store_dir"
          store_path="$(npm_config_store_dir="$store_dir" pnpm store path)"
        else
          store_path="$(pnpm store path)"
        fi
        echo "pnpm store: $store_path"
        if [[ "$RUNNER_KIND" == "self-hosted" ]]; then
          case "$store_path" in
            "${RUNNER_TOOL_CACHE}/pnpm-store"/*) ;;
            *) echo "Unexpected self-hosted pnpm store: $store_path" >&2; exit 1 ;;
          esac
        fi

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        RUNNER_KIND: ${{ runner.environment }}
        WORKSPACE_FILTERS: ${{ inputs.workspace-filters }}
      run: |
        set -euo pipefail
        filter_args=()
        while IFS= read -r filter; do
          if [[ -n "$filter" ]]; then
            filter_args+=(--filter "$filter")
          fi
        done <<< "$WORKSPACE_FILTERS"
        if [[ "$RUNNER_KIND" == "self-hosted" ]]; then
          npm_config_store_dir="${RUNNER_TOOL_CACHE}/pnpm-store" \
            pnpm install --frozen-lockfile --prefer-offline "${filter_args[@]}"
        else
          pnpm install --frozen-lockfile --prefer-offline "${filter_args[@]}"
        fi
