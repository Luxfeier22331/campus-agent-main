title = "campus-agent gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Repository policy and documentation references to secret words"
paths = [
  '''^SECURITY\.md$''',
  '''^CONTRIBUTING\.md$''',
  '''^docs/reference/verification\.md$''',
]

[[allowlists]]
description = "Tokenizer constant name includes token but value is not a credential"
paths = [
  '''^packages/ingestion-core/src/campus_ingestion_core/chunking_tokenizers\.py$''',
]
regexes = [
  '''DEFAULT_TOKENIZER_NAME = "regex_approximation_v1"''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Ops Web portal credential tests use an explicit non-secret fixture"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^apps/ops-web/test/ops-api\.test\.ts$''',
]
regexes = [
  '''^SSO_TGC=TGT-private-ticket$''',
]

[[rules.allowlists]]
description = "Bitnami SealedSecret encryptedData ciphertext"
condition = "AND"
regexTarget = "match"
paths = [
  '''^infra/gitops/secrets/.+\.sealedsecret\.yaml$''',
]
regexes = [
  '''^[A-Za-z0-9_.-]+:\s+Ag[A-Za-z0-9+/=]+$''',
]
